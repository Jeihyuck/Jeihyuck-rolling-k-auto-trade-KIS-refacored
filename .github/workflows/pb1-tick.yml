name: PB1 Tick

permissions:
  contents: write

concurrency:
  group: trade-bot-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # Weekdays (KST Mon-Fri): run during market hours, every 5 min
    # KST 08:50~08:55 => UTC 23:50~23:55 (prev day) [Sun~Thu UTC]
    - cron: "50-59/5 23 * * 0-4"
    # KST 09:00~14:55 => UTC 00:00~05:55 (same day) [Mon~Fri UTC]
    - cron: "*/5 0-5 * * 1-5"
    # KST 15:00~15:30 => UTC 06:00~06:30 (same day) [Mon~Fri UTC]
    - cron: "0-30/5 6 * * 1-5"

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run PB1 once
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          CANO: ${{ secrets.CANO }}
          ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          KIS_ENV: ${{ secrets.KIS_ENV }}
        run: |
          python -m trader.pb1_tick

name: KR244 Oct19 Practice Prebroker Claim One-Time Repair
"on":
  pull_request:
    types: [synchronize]
    branches: [dual-agent]
    paths:
      - "ops/kr244-20261019-prebroker-apply-once.trigger"
permissions:
  contents: read
concurrency:
  group: kr244-prebroker-claim-repair-one-time
  cancel-in-progress: false
jobs:
  exact-proven-prebroker-repair:
    if: ${{ github.event.pull_request.number == 244 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/kr-20261020-submit-latency-sell-reconcile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIS_ENV: practice
      STRATEGY_ENV: practice
      DRY_RUN: "1"
      DISABLE_REAL_TRADING: "1"
      LIVE_TRADING_ENABLED: "0"
      NO_TRADE: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: "."
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      # Canonical account identity uses these KIS account identifiers even
      # though this job never calls KIS HTTP.
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DB and offline regression dependencies
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pytest
      - name: Verify explicit pre-HTTP proof and EXPIRED fence regressions
        run: |
          python -m pytest -q tests/kr/test_kr_20261019_prebroker_claim_recovery.py
          python -m py_compile scripts/kr244_proven_prehttp_claim_recovery.py
      - name: Read-only original claim audit
        run: |
          python -m scripts.kr244_proven_prehttp_claim_recovery
      - name: Release ONLY evidence-proven 251970 practice attempt
        run: |
          python -m scripts.kr244_proven_prehttp_claim_recovery --apply

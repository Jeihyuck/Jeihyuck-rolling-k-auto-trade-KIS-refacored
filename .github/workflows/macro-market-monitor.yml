name: Macro Market Monitor

on:
  schedule:
    # UTC; KST = UTC+9. Run daily because geopolitical/oil headlines can move on weekends.
    - cron: "17 22 * * *" # 07:17 KST - daily summary
    - cron: "37 6 * * *"  # 15:37 KST - Asia check
    - cron: "17 12 * * *" # 21:17 KST - pre-US
    - cron: "37 14 * * *" # 23:37 KST - US early session
    - cron: "17 18 * * *" # 03:17 KST - US mid-session
  workflow_dispatch:
    inputs:
      force_mail:
        description: "Send a mail even when the regime is unchanged"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "macro_monitor/**"
      - "scripts/run_macro_market_monitor.py"
      - "tests/test_macro_market_monitor.py"
      - ".github/workflows/macro-market-monitor.yml"
      - "scripts/notify/send_mail_attachment.py"

permissions:
  contents: read

concurrency:
  group: macro-market-monitor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      # Map every alias already understood by the repo's Naver mail tooling.
      NAVER_MAIL_TO: ${{ secrets.NAVER_MAIL_TO }}
      NAVER_SMTP_USER: ${{ secrets.NAVER_SMTP_USER }}
      NAVER_SMTP_PASS: ${{ secrets.NAVER_SMTP_PASS }}
      REPORT_MAIL_TO: ${{ secrets.REPORT_MAIL_TO }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_HOST: smtp.naver.com
      SMTP_PORT: "587"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        run: python -m pip install --upgrade pip requests pytest

      - name: Run macro monitor unit tests
        run: pytest -q tests/test_macro_market_monitor.py

      - name: Restore previous monitor state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: runtime/macro_monitor/state.json
          key: macro-monitor-state-${{ github.run_id }}
          restore-keys: |
            macro-monitor-state-

      - name: Run monitor and conditionally send Naver mail
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          FORCE_MAIL: ${{ inputs.force_mail }}
        run: |
          set -euo pipefail
          args=(--state-file runtime/macro_monitor/state.json --report-dir reports/macro_monitor)

          # Normalize legacy aliases exactly as scripts/wsl/with-venv.sh does.
          export MAIL_TO="${MAIL_TO:-${EMAIL_TO:-${NAVER_MAIL_TO:-${REPORT_MAIL_TO:-}}}}"
          export MAIL_FROM="${MAIL_FROM:-${EMAIL_FROM:-${SMTP_FROM:-${EMAIL_USER:-${SMTP_USER:-${NAVER_SMTP_USER:-}}}}}}"
          export SMTP_USER="${SMTP_USER:-${EMAIL_USER:-${MAIL_USER:-${NAVER_SMTP_USER:-${MAIL_FROM:-}}}}}"
          export SMTP_PASS="${SMTP_PASS:-${EMAIL_PASS:-${EMAIL_PASSWORD:-${MAIL_PASS:-${NAVER_SMTP_PASS:-}}}}}"

          # 07:17 KST is the one guaranteed daily report. Other slots only alert on state/signal change.
          if [[ "${SCHEDULE_EXPR:-}" == "17 22 * * *" ]]; then
            args+=(--daily-summary)
          fi
          if [[ "${FORCE_MAIL:-false}" == "true" ]]; then
            args+=(--force-mail)
          fi

          # PR validation never sends mail. Scheduled/manual runs reuse the repo's existing Naver SMTP sender.
          if [[ "${EVENT_NAME:-}" != "pull_request" && -n "${SMTP_USER:-}" && -n "${SMTP_PASS:-}" && -n "${MAIL_TO:-}" ]]; then
            args+=(--send-mail)
          else
            echo "[MACRO_MONITOR][MAIL_SKIP] PR validation or Naver SMTP secrets/recipient unavailable."
          fi

          python scripts/run_macro_market_monitor.py "${args[@]}"

      - name: Save monitor state
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: runtime/macro_monitor/state.json
          key: macro-monitor-state-${{ github.run_id }}

      - name: Upload macro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-market-monitor-${{ github.run_id }}
          path: reports/macro_monitor/*.md
          if-no-files-found: warn
          retention-days: 30

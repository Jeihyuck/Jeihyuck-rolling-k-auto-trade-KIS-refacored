name: Macro Market Monitor

on:
  schedule:
    # UTC; KST = UTC+9. Run daily because geopolitical/oil headlines can move on weekends.
    - cron: "17 22 * * *" # 07:17 KST - daily summary
    - cron: "37 6 * * *"  # 15:37 KST - Asia check
    - cron: "17 12 * * *" # 21:17 KST - pre-US
    - cron: "37 14 * * *" # 23:37 KST - US early session
    - cron: "17 18 * * *" # 03:17 KST - US mid-session
  workflow_dispatch:
    inputs:
      force_mail:
        description: "Send a mail even when the regime is unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macro-market-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      NAVER_MAIL_TO: ${{ secrets.NAVER_MAIL_TO }}
      NAVER_SMTP_USER: ${{ secrets.NAVER_SMTP_USER }}
      NAVER_SMTP_PASS: ${{ secrets.NAVER_SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: smtp.naver.com
      SMTP_PORT: "587"

    steps:
      - name: Checkout dual-agent
        uses: actions/checkout@v4
        with:
          ref: dual-agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        run: python -m pip install --upgrade pip requests pytest

      - name: Run macro monitor unit tests
        run: pytest -q tests/test_macro_market_monitor.py

      - name: Restore previous monitor state
        uses: actions/cache/restore@v4
        with:
          path: runtime/macro_monitor/state.json
          key: macro-monitor-state-${{ github.run_id }}
          restore-keys: |
            macro-monitor-state-

      - name: Run monitor and conditionally send Naver mail
        shell: bash
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          FORCE_MAIL: ${{ inputs.force_mail }}
        run: |
          set -euo pipefail
          args=(--state-file runtime/macro_monitor/state.json --report-dir reports/macro_monitor)

          # 07:17 KST is the one guaranteed daily report. Other slots only alert on state/signal change.
          if [[ "${SCHEDULE_EXPR:-}" == "17 22 * * *" ]]; then
            args+=(--daily-summary)
          fi
          if [[ "${FORCE_MAIL:-false}" == "true" ]]; then
            args+=(--force-mail)
          fi

          # Reuse the repository's existing Naver SMTP sender only when credentials/recipient exist.
          effective_user="${SMTP_USER:-${NAVER_SMTP_USER:-}}"
          effective_pass="${SMTP_PASS:-${NAVER_SMTP_PASS:-}}"
          effective_to="${MAIL_TO:-${NAVER_MAIL_TO:-}}"
          if [[ -n "$effective_user" && -n "$effective_pass" && -n "$effective_to" ]]; then
            args+=(--send-mail)
          else
            echo "[MACRO_MONITOR][MAIL_SKIP] Naver SMTP secrets/recipient not available; report still generated."
          fi

          python scripts/run_macro_market_monitor.py "${args[@]}"

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: runtime/macro_monitor/state.json
          key: macro-monitor-state-${{ github.run_id }}

      - name: Upload macro report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-market-monitor-${{ github.run_id }}
          path: reports/macro_monitor/*.md
          if-no-files-found: warn
          retention-days: 30

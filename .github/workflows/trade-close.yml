name: Trade Close

"on":
  schedule:
    # Mon-Fri 15:15 KST = 06:15 UTC (close loop runs until market close)
    - cron: "15 6 * * 1-5"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice

concurrency:
  group: pb1-practice-close-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODE: trade
  PB1_SESSION_KIND: "close"
  PB1_CLOSE_SESSION_END: "15:30"
  PB1_TICK_HARD_TIMEOUT_SEC: "45"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  STRATEGY_MODE: "LIVE"
  STRATEGY_ENV: practice
  KIS_ENV: practice
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  FINAL30_SOURCE_MODE: "db_only"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"
  PB1_LOOP_ENABLED: "1"
  PB1_RUN_LOOP_MINUTES: "30"
  PB1_LOOP_INTERVAL_SEC: "60"
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"
  PB1_PHASE_DEFAULT: exit
  PB1_ENTRY_ENABLED: "0"
  FORCE_RUN: "1"
  FORCE_MARKET_WINDOW: "close"
  FORCE_PB1_PHASE: "exit"
  FORCE_STRATEGY_MODE: "LIVE"
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "0"
  LIVE_TRADING_ENABLED: "1"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  PB1_ALLOW_WAIT: "0"
  FAIL_IF_POOL_MISSING: "1"
  CANDIDATE_POOL_TTL_DAYS: "7"
  CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
  CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
  CANDIDATE_POOL_UNIVERSE_ENV: "practice"
  MINERVINI_USE_FEATURE_CACHE: "1"
  FEATURE_CACHE_WARMUP_ON_TICK: "0"
  DB_DISABLE_PREPARED_STATEMENTS: "1"
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  trade_close:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Guard Close phase window (all triggers)
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_kst="$(TZ=Asia/Seoul date +%H%M)"
          should_run=1
          skip_reason=""
          if [[ "$now_kst" -lt 1515 ]]; then
            should_run=0
            skip_reason="early_start"
          elif [[ "$now_kst" -ge 1525 ]]; then
            should_run=0
            skip_reason="stale_start"
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "[TRADE_CLOSE][PHASE_GUARD] now_kst=${now_kst} should_run=${should_run} skip_reason=${skip_reason:-none} valid=1515-1525"

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail

          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          echo "[ENV_CHECK] KIS_REST_URL=${KIS_REST_URL:-}"

          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }

          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }

          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }

          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Verify candidate pool exists in DB
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          python -m trader.verify_candidate_pool

      - name: Verify final30 readiness in DB
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          echo "[TRADE_CLOSE][PRECHECK][FINAL30][START]"
          if python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              as_of=ctx["as_of"],
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[TRADE_CLOSE][PRECHECK][FINAL30][OK] rows={len(df)} as_of={ctx['as_of']}")
          PY
          then
            :
          else
            echo "[TRADE_CLOSE][PRECHECK][FINAL30][FAIL] reason=missing_db_exact_scored_final30"
            exit 1
          fi

      - name: Emit Close skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }}"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-close.log

      - name: Run close trade tick
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "[TRADE_CLOSE][WINDOW] target=15:15-KST market close loop_minutes=${PB1_RUN_LOOP_MINUTES} interval_sec=${PB1_LOOP_INTERVAL_SEC}"
          echo "[PHASE][START] phase=close" | tee artifacts/trade-close.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-close.log
          echo "[PHASE][END] phase=close" | tee -a artifacts/trade-close.log

      - name: Verify close trade tick logs
        if: steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          missing=0
          if ! grep -E "\[PB1\]\[LOOP\]\[SESSION\] kind=close" artifacts/trade-close.log >/dev/null; then
            echo "::error::missing [PB1][LOOP][SESSION] kind=close"
            missing=1
          fi
          if ! grep -E "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" artifacts/trade-close.log >/dev/null; then
            echo "::error::missing [TRADE][FINAL30][DB_EXACT_LOAD]"
            missing=1
          fi
          if ! grep -E "\[TRADE\]\[READY\]\[OK\]" artifacts/trade-close.log >/dev/null; then
            echo "::error::missing [TRADE][READY][OK]"
            missing=1
          fi
          if ! grep -E "\[RUN_SUMMARY\]\[RESULT\]" artifacts/trade-close.log >/dev/null; then
            echo "::error::missing [RUN_SUMMARY][RESULT]"
            missing=1
          fi
          if grep -F "operator does not exist: text >= timestamp with time zone" artifacts/trade-close.log >/dev/null; then
            echo "::error::fills.list_today_fills schema mismatch still present"
            missing=1
          fi
          if ! grep -E "\[PB1\]\[LOOP\]\[SESSION_END_RELEASE\]|\[PB1\]\[LOOP\] session end reached -> exit|\[PB1\]\[EXIT\] reason=session_end" artifacts/trade-close.log >/dev/null; then
            echo "::error::missing clean close session release log"
            missing=1
          fi
          if grep -E "\[TRADE\]\[ORDER\]\[BUY\]" artifacts/trade-close.log >/dev/null; then
            echo "::error::Close workflow emitted BUY order logs despite PB1_ENTRY_ENABLED=0"
            exit 1
          fi
          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload debug close logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trade-close-logs
          path: repo/artifacts/
          if-no-files-found: ignore

name: "Trade Close"

"on":
  schedule:
    # Every day 15:15 KST = Every day 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice
      CLOSE_MANUAL_MODE:
        description: close manual execution mode
        required: false
        default: diag_replay
        type: choice
        options:
          - live_close
          - diag_replay
          - compute_only
      CONFIRM_MANUAL_CLOSE:
        description: "Type RUN_CLOSE_MANUAL to run live close manually"
        required: false
        default: ""

concurrency:
  group: trade-close-practice-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODE: trade
  PB1_SESSION_KIND: "close"
  PB1_FORCE_TRADE_SESSION: "close"

  FORCE_MARKET_WINDOW: "close"
  FORCE_PB1_PHASE: "exit"
  PB1_PHASE_DEFAULT: "exit"
  PB1_ENTRY_ENABLED: "0"

  PB1_LOOP_ENABLED: "1"
  PB1_RUN_LOOP_MINUTES: "15"
  PB1_LOOP_INTERVAL_SEC: "60"
  PB1_CLOSE_SESSION_END: "15:30"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  PB1_TICK_HARD_TIMEOUT_SEC: "45"

  STRATEGY_MODE: "LIVE"
  FORCE_STRATEGY_MODE: "LIVE"
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "0"
  LIVE_TRADING_ENABLED: "1"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"

  STRATEGY_ENV: practice
  KIS_ENV: practice
  FINAL30_SOURCE_MODE: "db_only"
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"

defaults:
  run:
    shell: bash

jobs:
  trade_close:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Resolve Close phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"
          manual_mode="${{ inputs.CLOSE_MANUAL_MODE || 'live_close' }}"

          should_run=1
          skip_reason=""
          execution_route="live_close"

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_hhmm" -lt 1515 ]]; then
              should_run=0
              skip_reason="close_early_start"
            elif [[ "$now_hhmm" -gt 1520 ]]; then
              should_run=0
              skip_reason="skip_close_stale_start"
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            if [[ "$manual_mode" == "live_close" ]]; then
              confirm="${{ inputs.CONFIRM_MANUAL_CLOSE || '' }}"
              if [[ "$confirm" != "RUN_CLOSE_MANUAL" ]]; then
                should_run=0
                skip_reason="manual_close_not_confirmed"
              elif [[ "$now_hhmm" -gt 1530 ]]; then
                should_run=0
                skip_reason="manual_close_after_1530_blocked"
              fi
            else
              execution_route="manual_replay"
            fi
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "valid_window=1515-1530" >> "$GITHUB_OUTPUT"
          echo "start_allow_window=1515-1520" >> "$GITHUB_OUTPUT"
          echo "session_end=1530" >> "$GITHUB_OUTPUT"
          echo "manual_mode=${manual_mode}" >> "$GITHUB_OUTPUT"
          echo "execution_route=${execution_route}" >> "$GITHUB_OUTPUT"

      - name: Emit Close skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_CLOSE][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_CLOSE][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=1515-1530 start_allow_window=1515-1520 session_end=1530"
            echo "[TRADE_CLOSE][PHASE_GUARD] should_run=0 skip_reason=${{ steps.phase_guard.outputs.skip_reason }}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=close"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-close.log

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          echo "[CHECKOUT][OK] repo path ready"

      - name: Initialize Close trigger log
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_CLOSE][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_CLOSE][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=1515-1530 start_allow_window=1515-1520 session_end=1530"
            echo "[TRADE_CLOSE][PHASE_GUARD] should_run=1 skip_reason= event=${{ steps.phase_guard.outputs.event_name }} valid_window=1515-1530"
          } | tee repo/artifacts/trade-close.log

      - name: Apply diag replay env overrides
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.execution_route == 'manual_replay'
        run: |
          echo "FORCE_BLOCK_LIVE=1" >> "$GITHUB_ENV"
          echo "DISABLE_LIVE_TRADING=1" >> "$GITHUB_ENV"
          echo "LIVE_TRADING_ENABLED=0" >> "$GITHUB_ENV"
          echo "DRY_RUN=1" >> "$GITHUB_ENV"
          echo "STRATEGY_MODE=DIAG" >> "$GITHUB_ENV"
          echo "FORCE_STRATEGY_MODE=DIAG" >> "$GITHUB_ENV"
          echo "PB1_ENTRY_ENABLED=0" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.db.migrate 2>&1 | tee -a artifacts/trade-close.log

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }
          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Verify exact scored final30 in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              as_of=ctx["as_of"],
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[TRADE][FINAL30][DB_EXACT_LOAD] rows={len(df)} as_of={ctx['as_of']} session=close")
          PY

      - name: Run close trade loop
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "[PHASE][START] phase=close session_window=1515-1530" | tee -a artifacts/trade-close.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-close.log
          echo "[PHASE][END] phase=close" | tee -a artifacts/trade-close.log

      - name: Verify close log contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          missing=0
          for pattern in \
            "\[TRADE_CLOSE\]\[TRIGGER\]" \
            "\[TRADE_CLOSE\]\[START_META\]" \
            "\[TRADE_CLOSE\]\[PHASE_GUARD\]" \
            "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" \
            "\[TRADE\]\[READY\]\[OK\]" \
            "\[RUN_SUMMARY\]\[RESULT\]"; do
            if ! grep -E "$pattern" artifacts/trade-close.log >/dev/null; then
              echo "::error::missing required log pattern: $pattern"
              missing=1
            fi
          done
          if ! grep -E "\[PB1\]\[EXIT\] reason=session_end|\[PB1\]\[LOOP\] session end reached -> exit" artifacts/trade-close.log >/dev/null; then
            echo "::error::missing clean session_end exit log"
            missing=1
          fi
          if grep -F "Traceback" artifacts/trade-close.log >/dev/null; then
            echo "::error::Traceback detected in close log"
            missing=1
          fi
          if grep -F "FATAL_RUNTIME" artifacts/trade-close.log >/dev/null; then
            echo "::error::FATAL_RUNTIME detected in close log"
            missing=1
          fi
          if grep -E "\[TRADE\]\[ORDER\]\[BUY\]|\[ORDER\]\[BUY\]" artifacts/trade-close.log >/dev/null; then
            echo "::error::BUY order detected in close session (forbidden)"
            missing=1
          fi
          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload debug close logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trade-close-logs
          path: repo/artifacts/
          if-no-files-found: ignore

name: US400-C focused data acceptance
on:
  pull_request:
    branches: [dual-agent, fix/us-20261126-hot-only-tp90-integrated, 'fix/us-rebuild-*']
    paths:
      - 'trader/us/market_state_overlay.py'
      - 'trader/us/data_provider.py'
      - 'trader/marketdata/feature_reuse.py'
      - 'trader/us/entry_timing/opportunity.py'
      - 'trader/us/pb1/swing_runner_exit_v3.py'
      - 'trader/us/runner/daily_feature_cache.py'
      - 'tests/us/test_us400_daily_feature_cache.py'
      - 'tests/us/test_us_price_aware_opening_entry_20261029.py'
      - 'trader/us/execution/shared_kis_limiter.py'
      - 'trader/us/execution/kis_us_client.py'
      - 'tests/us/test_us_20261022_shared_kis_limiter.py'
      - 'tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py'
      - '.github/workflows/us400-c-data.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      DRY_RUN: '1'
      US_ORDER_ARMED: '0'
      KIS_HTTP_BLOCK: '1'
      DATABASE_URL: ''
      PBCORE_DB_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: |
          python -m pytest -q --junitxml=/tmp/us400-c.xml tests/us/test_us_20261022_shared_kis_limiter.py tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_native_benchmark_recovery_preserves_freshness_and_isolates_symbol tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_intraday_quote_age_is_measured_after_each_delayed_read tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_live_intraday_risk_overrides_positive_completed_day tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_stale_or_missing_live_quotes_never_make_risk_look_normal tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_benchmark_previous_close_native_exact_day_and_one_attempt tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_recovered_previous_close_never_bypasses_live_quote_gate tests/us/test_us_price_aware_opening_entry_20261029.py::test_static_feature_reuse_preserves_decision_and_invalidates_correction tests/us/test_us_price_aware_opening_entry_20261029.py::test_cross_process_native_features_exact_scope_and_correction tests/us/test_us_price_aware_opening_entry_20261029.py::test_shared_feature_cache_failure_never_replaces_native_calculation tests/us/test_us_price_aware_opening_entry_20261029.py::test_shared_opening_and_rolling_feature_adapter_preserves_live_decision tests/us/test_us_price_aware_opening_entry_20261029.py::test_shared_v3_atr_matches_original_and_invalidates_bad_bar tests/us/test_us_price_aware_opening_entry_20261029.py::test_incremental_v3_atr_append_parity_and_correction tests/us/test_us400_daily_feature_cache.py tests/us/test_us_price_aware_opening_entry_20261029.py::test_incremental_opening_geometry_vwap_parity_and_invalidation tests/us/test_us_price_aware_opening_entry_20261029.py::test_rolling_native_feature_slide_exact_parity tests/us/test_us_price_aware_opening_entry_20261029.py::test_shared_feature_payload_modes_are_isolated
          python -c 'import xml.etree.ElementTree as E; c=list(E.parse("/tmp/us400-c.xml").iter("testcase")); assert len(c)==47 and all(x.find("skipped") is None for x in c)'

name: US243 One-Shot Verified KIS SELL Settlement

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - ".github/workflows/us243-verified-sell-repair-once.yml"

permissions:
  contents: read

concurrency:
  group: us243-historical-kis-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-proven-7-only-reconcile:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 243 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/us-20261020-execution-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: "."
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      TRADING_REGION: US
      KIS_ENV: practice
      OFFLINE_MODE: "0"
      US_OFFLINE_MODE: "0"
      KIS_HTTP_BLOCK: "0"
      US_PAPER_TRADING_ENABLED: "0"
      US_LIVE_TRADING_ENABLED: "0"
      US_KIS_ORDER_ALLOWED: "0"
      US_ORDER_ARMED: "0"
      LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      DISABLE_LIVE_TRADING: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Fail closed on nonpractice scope or unsafe order permissions
        run: |
          set -euo pipefail
          test -n "${PBCORE_DB_URL:-}"
          test -n "${KIS_APP_KEY:-}"
          test -n "${KIS_APP_SECRET:-}"
          test -n "${CANO:-}"
          test -n "${ACNT_PRDT_CD:-}"
          [[ "${KIS_REST_URL:-}" == "https://openapivts.koreainvestment.com:29443" ]] || exit 1
          [[ "${KIS_ENV}" == "practice" && "${DRY_RUN}" == "1" &&
             "${US_ORDER_ARMED}" == "0" && "${US_KIS_ORDER_ALLOWED}" == "0" &&
             "${DISABLE_REAL_TRADING}" == "1" ]] || exit 1
          echo "[US243] EXACT-7 KIS PROVEN DB RECONCILE; NO BROKER ORDER SUBMITS"
      - name: Enforce verified original account/date/owner/order/qty/price set then repair seven actual fills
        run: |
          set -euo pipefail
          python scripts/us243_verified_sell_recovery.py --apply > us243-applied-seven-recovery.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path("us243-applied-seven-recovery.jsonl").read_text(encoding="utf-8").splitlines()
          records=[json.loads(line) for line in lines]
          for doc in records:
              if doc["mode"]=="APPLIED_VERIFIED_BROKER_FILL":
                  print("[US243][APPLIED]",doc["date"],doc["symbol"],doc["qty"],doc["avg_price"])
              if doc["mode"]=="APPLY_DONE":
                  print("[US243][APPLIED][DURABLE]",doc["actual_fills_verified"])
          preflight=next(d for d in records if d.get("mode")=="PRE_APPLY_KIS_EVIDENCE")
          newly_applied=sum(d.get("mode")=="APPLIED_VERIFIED_BROKER_FILL" for d in records)
          assert preflight["verified_count"]==7
          assert newly_applied+preflight["already_settled_count"]==7
          print("[US243][RECOVERY] previously settled",preflight["already_settled_count"],
                "newly settled",newly_applied)
          assert records[-1]["mode"]=="APPLY_DONE"
          PY
      - name: Independent new-process restart verification, no writes
        run: |
          set -euo pipefail
          python scripts/us243_verified_sell_recovery.py --post-verify > us243-after-restart.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("us243-after-restart.json").read_text(encoding="utf-8"))
          print("[US243][RESTART_PROOF] independent DB read, all 13 actions present")
          proven=[x for x in data["verified_actions"] if x["actual_fills"]==1]
          pending=[x for x in data["verified_actions"] if x["actual_fills"]==0]
          print("[US243][RESTART_PROOF] 7 real fills", len(proven),
                "6 unfilled fenced",len(pending))
          assert len(proven)==7 and len(pending)==6
          PY
      - name: Preserve sanitized DB repair receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us243-proven-seven-db-repair-${{ github.run_id }}
          path: |
            us243-applied-seven-recovery.jsonl
            us243-after-restart.json
          retention-days: 3
          if-no-files-found: ignore

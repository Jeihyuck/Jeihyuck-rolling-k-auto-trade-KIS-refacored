name: "US Trade Watchdog"
# Monitor-only: prep/am/afternoon status checker. It never dispatches trade workflows.

"on":
  schedule:
    - cron: "*/5 12-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: us-trade-watchdog-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check US workflow status without dispatch
        uses: actions/github-script@v7
        env:
          WATCHDOG_REF: ${{ github.ref_name }}
        with:
          script: |
            const timeZone = 'America/New_York';
            const locale = 'en-CA';
            const workflows = {
              prep: {
                workflow_id: 'us-trade-prep.yml',
                workflow_name: 'US Trade Prep',
                checkWindow: [710, 810],  // 07:10~08:10 ET recovery window
                inputs: {
                  dry_run: 'true',
                  offline: 'false',
                  confirm: 'RUN_US_PREP_MANUAL',
                  manual_skip_phase_guard: 'false',
                },
              },
              am: {
                workflow_id: 'us-trade-am.yml',
                workflow_name: 'US Trade AM',
                checkWindow: [935, 1130],  // 09:35~11:30 ET recovery window
                inputs: {
                  dry_run: 'false',
                  offline: 'false',
                  confirm: 'RUN_US_AM_MANUAL',
                  confirm_trade: 'RUN_US_AM_TRADE_MANUAL',
                },
              },
              afternoon: {
                workflow_id: 'us-trade-afternoon.yml',
                workflow_name: 'US Trade Afternoon',
                checkWindow: [1235, 1520],  // 12:35~15:20 ET recovery window
                inputs: {
                  dry_run: 'false',
                  offline: 'false',
                  confirm: 'RUN_US_AFTERNOON_MANUAL',
                  confirm_trade: 'RUN_US_AFTERNOON_TRADE_MANUAL',
                },
              },
            };

            const now = new Date();
            const nowParts = new Intl.DateTimeFormat('en-GB', {
              timeZone,
              hour12: false,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
            }).formatToParts(now).reduce((acc, part) => {
              if (part.type !== 'literal') {
                acc[part.type] = part.value;
              }
              return acc;
            }, {});
            const nowEt = Number(`${nowParts.hour}${nowParts.minute}`);
            const todayEt = new Intl.DateTimeFormat(locale, {
              timeZone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).format(now);

            core.info(`[US_WATCHDOG][START] now_et=${nowEt} today=${todayEt}`);

            // Check if today is a US trading day
            function isUsWeekday() {
              const day = now.getDay();
              return day >= 1 && day <= 5;
            }

            if (!isUsWeekday()) {
              core.info(`[US_WATCHDOG][SKIP] reason=non_trading_day now_day=${now.getDay()}`);
              return;
            }

            async function getLatestRunToday(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                branch: process.env.WATCHDOG_REF,
                per_page: 30,
              });

              const todaysRuns = response.data.workflow_runs
                .filter((run) => {
                  if (!['queued', 'in_progress', 'completed'].includes(run.status)) {
                    return false;
                  }
                  const createdDateEt = new Intl.DateTimeFormat(locale, {
                    timeZone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                  }).format(new Date(run.created_at));
                  return createdDateEt === todayEt;
                })
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              return todaysRuns[0] || null;
            }

            function isHealthyRun(run) {
              if (!run) {
                return false;
              }

              // Actively running — healthy
              if (run.status === 'queued' || run.status === 'in_progress') {
                return true;
              }

              // Completed success — healthy
              if (run.status === 'completed' && run.conclusion === 'success') {
                return true;
              }

              // Completed failure — check if it could be report-only failure.
              // We cannot read artifacts from this script, but after report-validator
              // fix, report-only issues now conclude with 'success'.
              // Only re-dispatch if there's no healthy run AND we're in recovery window.
              // A completed failure with recent timestamp is treated as "ran today"
              // to avoid immediate re-dispatch loops (watchdog will check next cycle).
              if (run.status === 'completed' && run.conclusion === 'failure') {
                const runAge = (now - new Date(run.updated_at)) / 1000 / 60; // minutes
                // If failure is very recent (< 5 min), give it a grace period before re-dispatch
                if (runAge < 5) {
                  return true;  // treat as "still settling"
                }
                return false;  // allow re-dispatch after 5 min
              }

              return false;
            }

            function runStatus(run) {
              return run ? String(run.status || 'none') : 'none';
            }

            function runConclusion(run) {
              if (!run) {
                return 'none';
              }
              return run.conclusion == null ? 'null' : String(run.conclusion);
            }

            async function dispatchWorkflow(phase, config) {
              core.info(
                `[US_WATCHDOG][DISPATCH_DISABLED] phase=${phase} workflow=${config.workflow_name} reason=schedule_only_policy`
              );
            }

            // Check prep (07:10~08:10 ET) - standalone prep workflow
            // Primary prep execution is us-trade-prep.yml (runs at 07:00 ET)
            // AM workflow only verifies the prep result; it does NOT run prep
            let prepRun = null;
            let prepOk = false;
            const inPrepWindow = nowEt >= workflows.prep.checkWindow[0] && nowEt <= workflows.prep.checkWindow[1];
            const inAmWindow = nowEt >= workflows.am.checkWindow[0] && nowEt <= workflows.am.checkWindow[1];
            const inAfternoonWindow = nowEt >= workflows.afternoon.checkWindow[0] && nowEt <= workflows.afternoon.checkWindow[1];

            core.info(
              `[US_WATCHDOG][CHECK] now_et=${nowEt} in_prep_window=${inPrepWindow} in_am_window=${inAmWindow} in_afternoon_window=${inAfternoonWindow}`
            );

            if (inPrepWindow) {
              prepRun = await getLatestRunToday('us-trade-prep.yml');
              prepOk = isHealthyRun(prepRun);

              if (!prepOk) {
                core.info(
                  `[US_WATCHDOG][CHECK] phase=prep found=${prepRun ? 1 : 0} status=${runStatus(prepRun)} conclusion=${runConclusion(prepRun)}`
                );
                await dispatchWorkflow('prep', workflows.prep);
              } else {
                core.info(
                  `[US_WATCHDOG][SKIP] phase=prep reason=healthy_session_exists status=${runStatus(prepRun)} conclusion=${runConclusion(prepRun)}`
                );
              }
            } else {
              // Outside prep window: just fetch current status for AM gate
              prepRun = await getLatestRunToday('us-trade-prep.yml');
              prepOk = isHealthyRun(prepRun);
              if (!inAmWindow && !inAfternoonWindow) {
                core.info(
                  `[US_WATCHDOG][SKIP] phase=prep reason=outside_recovery_window now_et=${nowEt} window=${workflows.prep.checkWindow[0]}-${workflows.prep.checkWindow[1]}`
                );
              }
            }

            // Check AM (09:35~11:30 ET) - only dispatch if prep is healthy
            if (inAmWindow) {
              const amRun = await getLatestRunToday('us-trade-am.yml');
              const amHealthy = isHealthyRun(amRun);

              if (!amHealthy && prepOk) {
                core.info(
                  `[US_WATCHDOG][CHECK] phase=am found=${amRun ? 1 : 0} prep_ok=1 status=${runStatus(amRun)} conclusion=${runConclusion(amRun)}`
                );
                await dispatchWorkflow('am', workflows.am);
              } else if (!prepOk) {
                core.info(
                  `[US_WATCHDOG][SKIP] phase=am reason=prep_not_ok prep_status=${runStatus(prepRun)} prep_conclusion=${runConclusion(prepRun)}`
                );
              } else {
                core.info(
                  `[US_WATCHDOG][SKIP] phase=am reason=healthy_session_exists status=${runStatus(amRun)} conclusion=${runConclusion(amRun)}`
                );
              }
            } else if (!inPrepWindow && !inAfternoonWindow) {
              core.info(
                `[US_WATCHDOG][SKIP] phase=am reason=outside_recovery_window now_et=${nowEt} window=${workflows.am.checkWindow[0]}-${workflows.am.checkWindow[1]}`
              );
            }

            // Check Afternoon (12:35~15:20 ET)
            if (inAfternoonWindow) {
              const afternoonRun = await getLatestRunToday('us-trade-afternoon.yml');
              const afternoonHealthy = isHealthyRun(afternoonRun);

              const amRun = await getLatestRunToday('us-trade-am.yml');
              const amOk = isHealthyRun(amRun);

              if (!afternoonHealthy && amOk) {
                core.info(
                  `[US_WATCHDOG][CHECK] phase=afternoon found=${afternoonRun ? 1 : 0} am_ok=1 status=${runStatus(afternoonRun)} conclusion=${runConclusion(afternoonRun)}`
                );
                await dispatchWorkflow('afternoon', workflows.afternoon);
              } else if (!amOk) {
                core.info(
                  `[US_WATCHDOG][SKIP] phase=afternoon reason=am_not_ok am_status=${runStatus(amRun)} am_conclusion=${runConclusion(amRun)}`
                );
              } else {
                core.info(
                  `[US_WATCHDOG][SKIP] phase=afternoon reason=healthy_session_exists status=${runStatus(afternoonRun)} conclusion=${runConclusion(afternoonRun)}`
                );
              }
            } else if (!inPrepWindow && !inAmWindow) {
              core.info(
                `[US_WATCHDOG][SKIP] phase=afternoon reason=outside_recovery_window now_et=${nowEt} window=${workflows.afternoon.checkWindow[0]}-${workflows.afternoon.checkWindow[1]}`
              );
            }

            core.info('[US_WATCHDOG][DONE]');

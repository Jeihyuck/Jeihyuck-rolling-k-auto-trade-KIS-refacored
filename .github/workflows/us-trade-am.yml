name: "US Trade AM"
# session: am | prewarm: 08:15 ET | trade window: 09:30~12:30 ET
# AM consumes the completed 07:00 ET US prep result.
# AM must not run prep itself. If prep is missing or invalid, fail with FAILED_PREP_GUARD.

"on":
  schedule:
    # NY timezone-aware prewarm cron: 08:15 ET (EDT/EST 자동 적용)
    - cron: "15 8 * * 1-5"
      timezone: "America/New_York"
    # [US_SCHEDULE][CONFIG] schedule_mode=timezone_prewarm_wait crons=1 timezone=America/New_York
    # [US_SCHEDULE][CONFIG] schedule_mode=timezone_single_cron crons=1 timezone=America/New_York
    # Legacy fixed-cron references kept for contract tests:
    # legacy cron: am edt 15 12 * * 1-5
    # legacy cron: am edt 16 12 * * 1-5
    # legacy cron: am edt 17 12 * * 1-5
    # legacy cron: am edt 18 12 * * 1-5
    # legacy cron: am est 15 13 * * 1-5
    # legacy cron: am est 16 13 * * 1-5
    # legacy cron: am est 17 13 * * 1-5
    # legacy cron: am est 18 13 * * 1-5
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = no order submission)"
        required: false
        default: true
        type: boolean
      offline:
        description: "offline mode (blocks all KIS HTTP)"
        required: false
        default: false
        type: boolean
      offline_mode:
        description: "offline mode alias (blocks all KIS HTTP)"
        required: false
        default: false
        type: boolean
      confirm:
        description: "Type RUN_US_AM_MANUAL to run manually"
        required: false
        default: ""
      allow_outside_window:
        description: "Manual only. Allow manual trade window outside normal schedule window"
        required: false
        default: false
        type: boolean
      confirm_trade:
        description: "Required when dry_run=false. Type RUN_US_AM_TRADE_MANUAL"
        required: false
        default: ""
      force_now:
        description: "DRY_RUN/OFFLINE smoke only. 실제 모의투자 주문에서는 반드시 비워둘 것. Example: 2026-05-11T09:35:00-04:00"
        required: false
        default: ""
      force_ny_datetime:
        description: "Alias for force_now"
        required: false
        default: ""
      max_ticks:
        description: "Manual smoke max tick count. 0 means single tick when force_now is set."
        required: false
        default: "0"
      manual_max_minutes:
        description: "Manual max minutes override. Empty means default."
        required: false
        default: ""
      manual_interval_sec:
        description: "Manual interval seconds override. Empty means default."
        required: false
        default: ""
      manual_max_order_usd:
        description: "Manual dry-run only. Override US_MAX_ORDER_USD, e.g. 3500"
        required: false
        default: ""
      smoke_loop:
        description: "Quick smoke loop: force --offline, max_ticks=3, interval=1, max_minutes=10. Overrides other flags."
        default: false
        type: boolean
      signal_only:
        description: "Manual only. Force signal-only mode even if orders are otherwise allowed."
        required: false
        default: false
        type: boolean

concurrency:
  group: us-trade-am-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trade_us_am:
    runs-on: ubuntu-latest
    timeout-minutes: 220

    env:
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      TRADING_REGION: "US"
      US_AGENT_ENABLED: "1"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      US_LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"

      US_STRATEGY_ENGINE: "pb1"
      US_ENTRY_ENABLED: "1"
      US_EXIT_ENABLED: "1"

      # [Phase 17] entry book / exit routing / partial exit policy
      US_DEFAULT_ENTRY_BOOK: "SWING_BOOK"
      US_DEFAULT_ENTRY_HORIZON: "SWING_CARRY"
      US_DEFAULT_EXIT_POLICY: "US_SWING_DEFAULT"
      US_SWING_MIN_HOLD_MINUTES: "390"
      US_SWING_BLOCK_SAME_DAY_SOFT_EXIT: "1"
      US_SELL_PARTIAL_ALLOWED: "0"
      US_DAY_HARD_STOP_PCT: "0.03"
      US_DAY_PROFIT_TAKE_PCT: "0.025"
      US_DAY_TRAILING_STOP_PCT: "0.025"
      US_DAY_CLOSE_FLATTEN_AFTER_ET: "15:45"

      US_PAPER_MAX_CAPITAL_KRW: "50000000"
      US_EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
      US_BUDGET_FX_KRW_PER_USD: "1450"
      US_MAX_CAPITAL_USD_AUTO: "1"

      US_REQUIRE_FILL_CONFIRM: "1"
      US_ORDER_ACCEPTED_IS_NOT_FILLED: "1"
      US_BLOCK_REBUY_AFTER_SELL_SAME_DAY: "1"
      US_ALLOW_INTRADAY_REENTRY_AFTER_STOP: "0"
      US_BLOCK_NEW_ENTRY_AFTER_ET: "15:45"

      US_MAX_ORDER_USD: "2500"
      US_MAX_DAILY_NOTIONAL_USD: "10000"
      US_MAX_POSITIONS: "30"
      US_MAX_POSITION_WEIGHT: "0.10"
      US_MIN_CASH_BUFFER_USD: "200"

      US_SESSION_INTERVAL_SEC: "300"
      US_WATCHLIST_LOAD_TIMEOUT_SEC: "20"
      US_ENTRY_EVAL_TIMEOUT_SEC: "120"
      US_TICK_TIMEOUT_SEC: "150"

      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || vars.US_AGENT_SCHEDULE_DRY_RUN || '0' }}
      US_EVENT_NAME: ${{ github.event_name }}
      US_RUN_ID: ${{ github.run_id }}
      US_RUN_ATTEMPT: ${{ github.run_attempt }}
      US_ACTOR: ${{ github.actor }}
      US_SESSION: am
      US_TRADE_STATUS: "INIT"
      US_TRADE_RUNNER_STARTED: "0"
      US_TRADE_RUNNER_BLOCK_REASON: "not_started"
      US_EXPECTED_TO_TRADE: "0"
      US_ORDERS_SENT: "0"
      US_ORDER_ALLOWED: "0"
      US_KIS_ORDER_ALLOWED: "0"
      US_OFFLINE_MODE: ${{ (github.event_name == 'workflow_dispatch' && ((inputs.offline && 'true') || (inputs.offline_mode && 'true') || 'false')) || 'false' }}
      US_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || ((vars.US_AGENT_SCHEDULE_DRY_RUN || '0') == '1' && 'true' || 'false') }}

      US_LOG_FILE: "us-trade-am.log"
      US_ARTIFACT_NAME: "us-trade-am"

    steps:
      - name: Resolve US AM phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=America/New_York date +%H)"
          now_m="$(TZ=America/New_York date +%M)"
          now_s="$(TZ=America/New_York date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=America/New_York date +%H%M)"
          now_hhmmss="$(TZ=America/New_York date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          # 한국장 trade-am 패턴: workflow가 08:15 ET에 떠서 prep check/run 후 09:30까지 wait
          prewarm_start_min=$((8 * 60 + 15))    # 08:15 ET - prewarm/prep window start
          prep_prepare_until=$((9 * 60 + 20))   # 09:20 ET - prep should be done by this time
          target_min=$((9 * 60 + 30))           # 09:30 ET - market open
          start_allow_until=$((10 * 60 + 0))    # 10:00 ET - normal window end
          recovery_until=$((12 * 60 + 30))      # 12:30 ET - recovery window end (= session_end)
          session_end=$((12 * 60 + 30))         # 12:30 ET - hard session end
          schedule_expected_min=$((8 * 60 + 15))
          max_wait_seconds=5400  # 최대 90분 wait 허용 (08:00 시작 ~ 09:30 target)

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0
          run_window="scheduled_trade"
          recovery_run=0
          missed_trade_window=false
          delay_seconds=$(( (now_min - schedule_expected_min) * 60 + 10#$now_s ))

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -gt "$session_end" ]]; then
              # 12:30 이후는 skip (session_end 기준)
              should_run=0
              skip_reason="skip_stale_start_us_am"
              run_window="skip"
              missed_trade_window=true
            elif [[ "$now_min" -gt "$start_allow_until" ]]; then
              # 10:00~12:30: recovery window
              run_window="recovery"
              recovery_run=1
            elif [[ "$now_min" -lt "$target_min" ]]; then
              # 09:30 이전: wait until target (prep check/run은 wait 전에 수행)
              wait_until_target=1
              wait_seconds=$(( (target_min - now_min) * 60 - 10#$now_s ))
              if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
              if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
                should_run=0
                skip_reason="skip_too_early_us_am"
                run_window="skip"
              else
                run_window="scheduled_trade"
              fi
            else
              # 09:30~10:00: normal window
              run_window="scheduled_trade"
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.confirm || '' }}"
            confirm_trade="${{ inputs.confirm_trade || '' }}"
            dry_run_input="${{ inputs.dry_run && 'true' || 'false' }}"
            allow_outside_window="${{ inputs.allow_outside_window && 'true' || 'false' }}"
            signal_only_input="${{ inputs.signal_only && 'true' || 'false' }}"

            if [[ "$dry_run_input" == "false" ]]; then
              if [[ "$confirm" != "RUN_US_AM_MANUAL" || "$confirm_trade" != "RUN_US_AM_TRADE_MANUAL" ]]; then
                should_run=0
                skip_reason="manual_us_am_trade_not_confirmed"
                run_window="manual_blocked"
              else
                run_window="manual_trade"
              fi
            elif [[ "$confirm" != "RUN_US_AM_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_us_am_not_confirmed"
              run_window="manual_blocked"
            else
              run_window="manual_trade"
            fi

            # Manual fallback: schedule이 안 떴을 때 09:30 전 수동 실행도 wait 허용
            if [[ "$should_run" == "1" ]]; then
              force_now_input="${{ inputs.force_ny_datetime || inputs.force_now || '' }}"
              # force_now는 smoke 전용이므로 실제 시간 wait 판단에서 제외
              if [[ "$allow_outside_window" == "true" ]]; then
                run_window="manual_trade"
              elif [[ -z "$force_now_input" && "$now_min" -lt "$target_min" ]]; then
                wait_until_target=1
                wait_seconds=$(( (target_min - now_min) * 60 - 10#$now_s ))
                if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
                if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
                  should_run=0
                  skip_reason="manual_us_am_too_early"
                  run_window="manual_too_early"
                else
                  run_window="manual_trade"
                fi
              fi
            fi

            if [[ "$signal_only_input" == "true" && "$should_run" == "1" ]]; then
              echo "signal_only_input=1" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_et=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "run_window=${run_window}" >> "$GITHUB_OUTPUT"
          echo "recovery_run=${recovery_run}" >> "$GITHUB_OUTPUT"
          echo "delay_seconds=${delay_seconds}" >> "$GITHUB_OUTPUT"
          echo "missed_trade_window=${missed_trade_window}" >> "$GITHUB_OUTPUT"
          
          echo "[US_TRADE_AM][START_META] schedule_expected=0815 actual_start=${now_hhmmss} delay_seconds=${delay_seconds} event=${event_name}"
          echo "[US_TRADE_AM][PHASE_GUARD] should_run=${should_run} run_window=${run_window} recovery_run=${recovery_run} wait_seconds=${wait_seconds} missed_trade_window=${missed_trade_window} session_window=0930-1230"
          echo "[US_TRADE_AM][RUN_PLAN] prep=verify_only wait_until_0930=true trade_am=true"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Resolve US AM run mode
        id: run_mode
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from trader.us.market_calendar import now_ny, is_us_trading_day
          now = now_ny()
          is_td = is_us_trading_day(now.date())
          if is_td:
              print("run_mode=TRADE")
              print("signal_only=0")
              print("order_allowed=1")
              print("kis_order_allowed=1")
              print("kis_data_allowed=1")
              print("non_trading_day=0")
              print("reason=trading_day")
          else:
              print("run_mode=NON_TRADING_SIGNAL_ONLY")
              print("signal_only=1")
              print("order_allowed=0")
              print("kis_order_allowed=0")
              print("kis_data_allowed=0")
              print("non_trading_day=1")
              print("reason=non_trading_day_signal_only")
          PY

      - name: Verify checkout path and initialize log
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; exit 1; }
          
          # Clean stale reports and artifacts to prevent mixing with current run
          echo "[CLEANUP][START] removing stale reports and artifacts"
          rm -rf repo/reports/us_daily
          mkdir -p repo/artifacts repo/reports/us_daily
          rm -f repo/artifacts/us_last_stage.txt
          echo "[CLEANUP][DONE]"
          
          {
            echo "[US_TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[US_TRADE_AM][START_META] schedule_expected=0815 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[US_TRADE_AM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason }} now_et=${{ steps.phase_guard.outputs.now_hhmmss }} wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }} run_window=${{ steps.phase_guard.outputs.run_window }} recovery_run=${{ steps.phase_guard.outputs.recovery_run }} session_window=0930-1230"
            echo "[US_TRADE_AM][RUN_MODE] run_mode=${{ steps.run_mode.outputs.run_mode }} signal_only=${{ steps.run_mode.outputs.signal_only }} order_allowed=${{ steps.run_mode.outputs.order_allowed }} kis_order_allowed=${{ steps.run_mode.outputs.kis_order_allowed }}"
            echo "[US_TRADE_AM][CONCURRENCY_META] group=us-trade-am-${GITHUB_REF_NAME} cancel_in_progress=true schedule_mode=timezone_prewarm_wait crons=1"
            echo "[US_TRADE_AM][SCHEDULE_MODE] mode=timezone_prewarm_wait crons=1 timezone=America/New_York"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/${US_LOG_FILE}
          echo "[CHECKOUT][OK] repo path ready" | tee -a repo/artifacts/${US_LOG_FILE}

      - name: Persist AM trigger metadata
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "US_SCHEDULE_EXPECTED_ET=0815"
            echo "US_ACTUAL_START_ET=${{ steps.phase_guard.outputs.now_hhmmss }}"
            echo "US_DELAY_SECONDS=${{ steps.phase_guard.outputs.delay_seconds }}"
            echo "US_RUN_WINDOW=${{ steps.phase_guard.outputs.run_window }}"
            echo "US_RECOVERY_RUN=${{ steps.phase_guard.outputs.recovery_run }}"
            echo "US_EVENT_NAME=${{ steps.phase_guard.outputs.event_name }}"
            echo "US_OFFLINE_MODE=${{ (github.event_name == 'workflow_dispatch' && ((inputs.offline && 'true') || (inputs.offline_mode && 'true') || 'false')) || 'false' }}"
          } >> "$GITHUB_ENV"

      - name: Emit US AM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=SKIPPED" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=phase_guard_skip" >> "$GITHUB_ENV"
          trade_date=$(TZ=America/New_York date +%F)
          missed_window="${{ steps.phase_guard.outputs.missed_trade_window || 'false' }}"
          {
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=us-am missed_trade_window=${missed_window}"
            echo "[US_TRADE_AM][EXIT] reason=phase_guard_skip"
          } | tee -a artifacts/${US_LOG_FILE}
          export _US_AM_TRADE_DATE="${trade_date}"
          export _US_AM_MISSED_WINDOW="${missed_window}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = {
              "trade_date": os.environ.get("_US_AM_TRADE_DATE", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "session": "am",
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "env": "practice",
              "dry_run": os.environ.get("DRY_RUN", "0") == "1",
              "kis_order_allowed": int("${{ steps.run_mode.outputs.kis_order_allowed || '0' }}"),
              "prep_status": "SKIP_PHASE_WINDOW",
              "locked_watchlist_count": 0,
              "entry_eval_status": "SKIPPED",
              "entry_error_type": "",
              "entry_error_message": "",
              "entry_intents": 0,
              "orders_sent": 0,
              "fills": 0,
              "positions": 0,
              "last_stage": "phase_guard",
              "final_status": "SKIP_PHASE_WINDOW",
              "reason": "${{ steps.phase_guard.outputs.skip_reason }}",
              "temp_error_count": 0,
              "temp_recovered_count": 0,
              "missed_trade_window": os.environ.get("_US_AM_MISSED_WINDOW", "false") == "true",
          }
          base = Path("reports/us_daily")
          base.mkdir(parents=True, exist_ok=True)
          (base / "latest_us_daily_report.json").write_text(json.dumps(report, indent=2))
          md = "\n".join([
              f"# US Daily Report - {report['trade_date']}",
              "",
              "## Required Fields",
              "",
          ] + [f"- {k}: {v}" for k, v in report.items()]) + "\n"
          (base / "latest_us_daily_report.md").write_text(md)
          d = base / report["trade_date"] / "am"
          d.mkdir(parents=True, exist_ok=True)
          (d / "us_daily_report.json").write_text(json.dumps(report, indent=2))
          (d / "us_daily_report.md").write_text(md)
          PY

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: US Python syntax preflight
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_PREFLIGHT][START] py_compile"
            python -m py_compile trader/us/execution/kis_us_client.py
            python -m py_compile trader/us/execution/fills.py
            python -m py_compile trader/us/runner/trade_tick_runner.py
            python -m py_compile trader/us/runner/trade_session_runner.py
            python -m py_compile trader/us/pb1/us_entry_engine.py
            python -m py_compile trader/us/pb1/us_pb1_engine.py
            python -m compileall -q trader/us
            echo "[US_PREFLIGHT][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_DB_GUARD][START]"
            : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
            if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
              echo "::error::PBCORE_DB_URL must be postgres-only."
              exit 1
            fi
            echo "[US_DB_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Acquire AM session lock
        if: steps.phase_guard.outputs.should_run == '1'
        id: session_lock
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_ny_datetime || inputs.force_now || '' }}
          INPUT_CONFIRM: ${{ inputs.confirm || '' }}
        run: |
          set -euo pipefail
          if [ -n "${FORCE_NOW_INPUT}" ]; then
            TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
          else
            TRADE_DATE=$(TZ=America/New_York date +%F)
          fi
          export TRADE_DATE
          {
            echo "[US_SESSION_LOCK][START] trade_date=${TRADE_DATE} session=am env=${KIS_ENV} event=${GITHUB_EVENT_NAME}" | tee -a artifacts/${US_LOG_FILE}
            python - <<'PY' > us_session_lock_result.txt
            import os
            import sys
            from datetime import date

            sys.path.insert(0, ".")
            from trader.us.db.session_locks import claim_us_session_lock

            trade_date = os.environ["TRADE_DATE"]
            event_name = os.environ.get("GITHUB_EVENT_NAME", "")
            confirm = os.environ.get("INPUT_CONFIRM", "")
            claimed, existing = claim_us_session_lock(
                env=os.environ.get("KIS_ENV", "practice"),
                trade_date=date.fromisoformat(trade_date),
                session="am",
                github_run_id=os.environ.get("GITHUB_RUN_ID"),
                github_workflow=os.environ.get("GITHUB_WORKFLOW"),
                github_run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"),
                metadata={
                    "event_name": event_name,
                    "manual_confirm_ok": confirm == "RUN_US_AM_MANUAL",
                    "run_window": os.environ.get("US_RUN_WINDOW", ""),
                },
            )
            print(f"claimed={'1' if claimed else '0'}")
            print(f"existing_status={(existing or {}).get('status', '')}")
            PY
            cat us_session_lock_result.txt | tee -a artifacts/${US_LOG_FILE}
            CLAIMED=$(grep '^claimed=' us_session_lock_result.txt | cut -d= -f2 || true)
            EXISTING_STATUS=$(grep '^existing_status=' us_session_lock_result.txt | cut -d= -f2 || true)
            if [ -z "${CLAIMED}" ]; then
              echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=session_lock_output_missing" >> "$GITHUB_ENV"
              echo "::error::AM session lock output missing"
              exit 1
            fi
            echo "claimed=${CLAIMED}" >> "$GITHUB_OUTPUT"
            echo "existing_status=${EXISTING_STATUS}" >> "$GITHUB_OUTPUT"
            echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"
            if [ "${CLAIMED}" = "1" ]; then
              echo "[US_SESSION_LOCK][ACQUIRE] trade_date=${TRADE_DATE} session=am env=${KIS_ENV} claimed=${CLAIMED}" | tee -a artifacts/${US_LOG_FILE}
            else
              echo "[US_SESSION_LOCK][SKIP_DUPLICATE] trade_date=${TRADE_DATE} session=am env=${KIS_ENV} claimed=${CLAIMED} existing_status=${EXISTING_STATUS}" | tee -a artifacts/${US_LOG_FILE}
              echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
              echo "US_TRADE_STATUS=SKIPPED_DUPLICATE_SESSION" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=duplicate_session_lock" >> "$GITHUB_ENV"
            fi
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Resolve US AM trade expectation
        if: steps.phase_guard.outputs.should_run == '1'
        id: expectation
        working-directory: repo
        run: |
          set -euo pipefail
          event_name="${{ steps.phase_guard.outputs.event_name }}"
          phase_should_run="${{ steps.phase_guard.outputs.should_run }}"
          run_mode="${{ steps.run_mode.outputs.run_mode || 'SKIP' }}"
          signal_only="${{ steps.run_mode.outputs.signal_only || '0' }}"
          order_allowed="${{ steps.run_mode.outputs.order_allowed || '0' }}"
          kis_order_allowed="${{ steps.run_mode.outputs.kis_order_allowed || '0' }}"
          claimed="${{ steps.session_lock.outputs.claimed || '' }}"
          dry_run_flag="${{ inputs.dry_run && 'true' || 'false' }}"
          offline_flag="${{ (inputs.offline || inputs.offline_mode) && 'true' || 'false' }}"
          smoke_loop_flag="${{ inputs.smoke_loop && 'true' || 'false' }}"
          force_now_value="$(echo "${{ inputs.force_ny_datetime || inputs.force_now || '' }}" | xargs)"
          force_now_set=0
          if [ -n "${force_now_value}" ]; then
            force_now_set=1
          fi

          expected_to_trade=0
          reason="trade_pipeline_gate_failed"
          trade_status="SKIPPED"
          block_reason="trade_pipeline_gate_failed"

          if [ "${claimed}" != "1" ]; then
            reason="duplicate_session_lock"
            trade_status="SKIPPED_DUPLICATE_SESSION"
            block_reason="duplicate_session_lock"
          elif [ "${run_mode}" != "TRADE" ] || [ "${signal_only}" != "0" ]; then
            reason="signal_only"
            if [ "${order_allowed}" = "0" ] && [ "${kis_order_allowed}" = "0" ]; then
              reason="market_closed"
            fi
            block_reason="${reason}"
          elif [ "${dry_run_flag}" = "true" ]; then
            reason="dry_run"
            block_reason="dry_run"
          elif [ "${offline_flag}" = "true" ]; then
            reason="offline_mode"
            block_reason="offline_mode"
          elif [ "${smoke_loop_flag}" = "true" ]; then
            reason="smoke_loop"
            block_reason="smoke_loop"
          elif [ "${force_now_set}" = "1" ]; then
            reason="force_now_smoke"
            block_reason="force_now_smoke"
          elif [ "${phase_should_run}" = "1" ] && [ "${run_mode}" = "TRADE" ] && [ "${signal_only}" = "0" ] && [ "${order_allowed}" = "1" ] && [ "${kis_order_allowed}" = "1" ]; then
            expected_to_trade=1
            reason="trade_allowed"
            trade_status="READY"
            block_reason=""
          fi

          echo "expected_to_trade=${expected_to_trade}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "US_EXPECTED_TO_TRADE=${expected_to_trade}" >> "$GITHUB_ENV"
          echo "US_ORDER_ALLOWED=${order_allowed}" >> "$GITHUB_ENV"
          echo "US_KIS_ORDER_ALLOWED=${kis_order_allowed}" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=${trade_status}" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=${block_reason}" >> "$GITHUB_ENV"
          echo "[US_TRADE_AM][EXPECTATION] expected_to_trade=${expected_to_trade} event=${event_name} phase_should_run=${phase_should_run} run_mode=${run_mode} order_allowed=${order_allowed} kis_order_allowed=${kis_order_allowed} dry_run=${dry_run_flag} offline_mode=${offline_flag} signal_only=${signal_only} smoke_loop=${smoke_loop_flag} force_now_set=${force_now_set} reason=${reason}" | tee -a artifacts/${US_LOG_FILE}

      - name: Emit AM session lock skip summary
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[US_TRADE_AM][TRADE_RUNNER][SKIP] reason=duplicate_session_lock" | tee -a artifacts/${US_LOG_FILE}

      - name: DB migrate
        if: steps.expectation.outputs.expected_to_trade == '1'
        id: db_migrate
        continue-on-error: true
        working-directory: repo
        run: |
          set +e
          echo "[US_DB_MIGRATE][START]" | tee -a artifacts/${US_LOG_FILE}
          python -m trader.db.migrate 2>&1 | tee -a artifacts/${US_LOG_FILE}
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            echo "[US_TRADE_AM][MIGRATION][OK]" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_DB_MIGRATE][DONE]" | tee -a artifacts/${US_LOG_FILE}
            echo "US_TRADE_STATUS=READY" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_BLOCK_REASON=" >> "$GITHUB_ENV"
          else
            echo "[US_TRADE_AM][MIGRATION][FAIL] reason=db_migration_failed version=0043_us_fills_idempotency_and_order_reconcile_fix.sql" | tee -a artifacts/${US_LOG_FILE}
            echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_BLOCK_REASON=db_migration_failed" >> "$GITHUB_ENV"
          fi
          exit ${status}

      - name: Emit AM migration failure skip summary
        if: always() && steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome != 'success'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_TRADE_AM][TRADE_RUNNER][SKIP] reason=db_migration_failed"
            echo "[US_TRADE_AM][FINAL_STATUS] status=FAILED trade_runner_started=0 orders_sent=0 reason=db_migration_failed"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_ENV_CHECK] TRADING_REGION=${TRADING_REGION:-}"
            echo "[US_ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
            echo "[US_ENV_CHECK] DRY_RUN=${DRY_RUN:-}"
            echo "[US_ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
            test -n "${PBCORE_DB_URL:-}" || { echo "::error::PBCORE_DB_URL missing"; exit 1; }
            test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
            test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
            test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
            test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
            test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
            test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
            test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
            [[ "${TRADING_REGION}" == "US" ]] || { echo "::error::TRADING_REGION must be US"; exit 1; }
            [[ "${KIS_ENV}" == "practice" ]] || { echo "::error::KIS_ENV must be practice"; exit 1; }
            echo "[US_ENV_CHECK][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard manual force_now safety
        if: github.event_name == 'workflow_dispatch' && (inputs.force_now != '' || inputs.force_ny_datetime != '')
        working-directory: repo
        run: |
          set -euo pipefail
          {
            # Trim force_now input (앞뒤 공백 제거)
            FORCE_NOW_TRIMMED=$(echo "${{ inputs.force_now }}" | xargs)
            echo "[US_FORCE_NOW_GUARD][START] force_now=${FORCE_NOW_TRIMMED} dry_run=${{ inputs.dry_run }} offline=${{ inputs.offline }}"
            if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.offline }}" != "true" ]; then
              echo "::error::force_now manual smoke requires dry_run=true or offline=true"
              exit 1
            fi
            # force_now + dry_run=true인 경우 offline 강제
            if [ "${{ inputs.dry_run }}" = "true" ] && [ "${{ inputs.offline }}" != "true" ]; then
              echo "[US_FORCE_NOW_GUARD][OFFLINE_FORCED] reason=force_now_dry_run_smoke"
              echo "FORCE_OFFLINE_FOR_SMOKE=1" >> "$GITHUB_ENV"
            fi
            echo "[US_FORCE_NOW_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Verify completed US prep contract
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success'
        id: prep_exec
        timeout-minutes: 3
        working-directory: repo
        env:
          SESSION: am
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail

          echo "[US_TRADE_AM][PREP_VERIFY][START]" | tee -a artifacts/${US_LOG_FILE}

          if [ -n "${FORCE_NOW_INPUT}" ]; then
            TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
          else
            TRADE_DATE=$(TZ=America/New_York date +%F)
          fi
          export TRADE_DATE

          echo "[US_TRADE_AM][PREP_VERIFY] trade_date=${TRADE_DATE}" | tee -a artifacts/${US_LOG_FILE}

          TRADE_DATE="${TRADE_DATE}" python - <<'PY' > prep_verify_result.txt 2>&1
          import os
          import sys

          sys.path.insert(0, ".")

          from trader.us.db.repos import load_latest_us_prep_status, load_locked_us_watchlist

          trade_date = os.getenv("TRADE_DATE")
          if not trade_date:
              raise RuntimeError("[US_TRADE_AM][BUG] TRADE_DATE env missing")

          prep = load_latest_us_prep_status(trade_date, timeout_sec=10)
          prep_status = prep.get("status", "UNKNOWN") if prep else "UNKNOWN"
          prep_run_id = prep.get("run_id", "") if prep else ""

          try:
              locked = load_locked_us_watchlist(
                  trade_date,
                  min_count=10,
                  allow_degraded=False,
                  timeout_sec=10,
              )
              locked_count = len(locked) if locked else 0
          except Exception as e:
              print(f"[US_TRADE_AM][WATCHLIST_LOAD_ERROR] {e}", file=sys.stderr)
              locked_count = 0

          can_trade = prep_status in ("OK", "OK_WITH_WARNINGS") and locked_count >= 10

          print(f"prep_status={prep_status}")
          print(f"prep_run_id={prep_run_id}")
          print(f"locked_count={locked_count}")
          print(f"can_trade={'1' if can_trade else '0'}")

          if can_trade:
              print(
                  f"[US_TRADE_AM][PREP_VERIFY][OK] trade_date={trade_date} "
                  f"prep_status={prep_status} locked_count={locked_count} run_id={prep_run_id}",
                  file=sys.stderr,
              )
          else:
              print(
                  f"[US_TRADE_AM][PREP_VERIFY][FAIL] trade_date={trade_date} "
                  f"prep_status={prep_status} locked_count={locked_count} run_id={prep_run_id}",
                  file=sys.stderr,
              )
          PY

          cat prep_verify_result.txt | tee -a artifacts/${US_LOG_FILE}

          CAN_TRADE=$(grep "^can_trade=" prep_verify_result.txt | cut -d= -f2 || echo "0")
          PREP_STATUS=$(grep "^prep_status=" prep_verify_result.txt | cut -d= -f2 || echo "UNKNOWN")
          PREP_RUN_ID=$(grep "^prep_run_id=" prep_verify_result.txt | cut -d= -f2 || echo "")
          LOCKED_COUNT=$(grep "^locked_count=" prep_verify_result.txt | cut -d= -f2 || echo "0")

          echo "prep_status=${PREP_STATUS}" >> "$GITHUB_OUTPUT"
          echo "prep_run_id=${PREP_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "locked_count=${LOCKED_COUNT}" >> "$GITHUB_OUTPUT"
          echo "prep_mode=verified" >> "$GITHUB_OUTPUT"

          if [ "${CAN_TRADE}" != "1" ]; then
            echo "[US_TRADE_AM][PREP_CONTRACT][FAIL] reason=bad_or_missing_prep prep_status=${PREP_STATUS} locked_count=${LOCKED_COUNT}" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_TRADE_AM][WATCHLIST_LOAD][FAIL] reason=bad_or_missing_prep" | tee -a artifacts/${US_LOG_FILE}

            python scripts/write_us_guard_failure_report.py \
              --session am \
              --trade-date "${TRADE_DATE}" \
              --reason bad_or_missing_prep \
              --prep-status "${PREP_STATUS}" \
              --locked-count "${LOCKED_COUNT}" \
              --final-status FAILED_PREP_GUARD 2>&1 | tee -a artifacts/${US_LOG_FILE}

            echo "[RUN_SUMMARY][RESULT] status=FAILED_PREP_GUARD reason=bad_or_missing_prep session=us-am" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          fi

          echo "[US_TRADE_AM][PREP_CONTRACT][OK] trade_date=${TRADE_DATE} locked_count=${LOCKED_COUNT} score_nonzero=${LOCKED_COUNT} contract_ok=1 trade_can_proceed=1 prep_status=${PREP_STATUS} prep_run_id=${PREP_RUN_ID}" | tee -a artifacts/${US_LOG_FILE}
          echo "[US_TRADE_AM][WATCHLIST_LOAD][OK] rows=${LOCKED_COUNT}" | tee -a artifacts/${US_LOG_FILE}

      - name: Wait until US AM target start
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=5400
          if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds}"
            exit 1
          fi
          echo "[US_WAIT_UNTIL_TARGET][START] session=am target=09:30 wait_seconds=${wait_seconds}" | tee -a artifacts/${US_LOG_FILE}
          sleep "$wait_seconds"
          echo "[US_WAIT_UNTIL_TARGET][DONE] session=am now_et=$(TZ=America/New_York date +%H%M%S)" | tee -a artifacts/${US_LOG_FILE}

      - name: Verify target time reached
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success'
        working-directory: repo
        run: |
          set -euo pipefail
          now_h="$(TZ=America/New_York date +%H)"
          now_m="$(TZ=America/New_York date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          target_min=$((9 * 60 + 30))
          
          # 한국장 패턴: target time 이후에만 trade session 시작
          if [[ "$now_min" -lt "$target_min" ]]; then
            echo "::error::Target time not reached: now=${now_h}:${now_m}, target=09:30"
            exit 1
          fi
          echo "[US_TARGET_TIME_CHECK][OK] session=am now=$(TZ=America/New_York date +%H:%M:%S) target=09:30" | tee -a artifacts/${US_LOG_FILE}

      - name: Guard same-day US prep contract (disabled)
        if: false  # Replaced by "Verify completed US prep contract" step above
        timeout-minutes: 2
        working-directory: repo
        env:
          SESSION: am
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
          OFFLINE: ${{ inputs.offline || 'false' }}
          MAX_TICKS: ${{ inputs.max_ticks || '0' }}
        run: |
          set +e
          python scripts/guard_us_prep_contract.py 2>&1 | tee -a artifacts/${US_LOG_FILE}
          guard_status=${PIPESTATUS[0]}
          set -e
          
          if [ "${guard_status}" -ne 0 ]; then
            echo "[US_PREP_GUARD][REPORT_WRITE][START]" | tee -a artifacts/${US_LOG_FILE}
            python scripts/write_us_guard_failure_report.py \
              --session am \
              --guard-result artifacts/us_prep_guard_result.json 2>&1 | tee -a artifacts/${US_LOG_FILE}
            echo "[US_PREP_GUARD][REPORT_WRITE][DONE]" | tee -a artifacts/${US_LOG_FILE}
            echo "[RUN_SUMMARY][RESULT] status=FAILED_PREP_GUARD reason=bad_prep_status session=us-am" | tee -a artifacts/${US_LOG_FILE}
            exit "${guard_status}"
          fi

      - name: Final AM duplicate guard before trade
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success'
        id: final_duplicate_guard
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail
          echo "[US_TRADE_AM][FINAL_DUPLICATE_GUARD][START]" | tee -a artifacts/${US_LOG_FILE}

          if [ -n "${FORCE_NOW_INPUT}" ]; then
            TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
          else
            TRADE_DATE=$(TZ=America/New_York date +%F)
          fi
          export TRADE_DATE

          python - <<'PY' > final_duplicate_guard_result.txt 2>&1
          import os, sys
          sys.path.insert(0, ".")
          from trader.us.db.repos import check_us_am_already_ran

          trade_date = os.getenv("TRADE_DATE")
          # check_us_am_already_ran returns dict; FAILED_CLOSED on error
          result = check_us_am_already_ran(trade_date, timeout_sec=5)
          already_ran = bool(result.get("already_ran", True))
          guard_status = result.get("guard_status", "UNKNOWN")
          reason = result.get("reason", "")

          print(f"already_ran={'1' if already_ran else '0'}")
          print(
              f"[US_TRADE_AM][FINAL_DUPLICATE_GUARD][RESULT] trade_date={trade_date} already_ran={already_ran} guard_status={guard_status} reason={reason}",
              file=sys.stderr,
          )
          PY

          cat final_duplicate_guard_result.txt | tee -a artifacts/${US_LOG_FILE}
          ALREADY_RAN=$(grep "^already_ran=" final_duplicate_guard_result.txt | cut -d= -f2 || echo "0")
          echo "already_ran=${ALREADY_RAN}" >> "$GITHUB_OUTPUT"

      - name: Emit AM final duplicate skip summary
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success' && steps.final_duplicate_guard.outputs.already_ran == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=OK_ALREADY_RAN" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=already_ran_after_wait" >> "$GITHUB_ENV"
          trade_date=$(TZ=America/New_York date +%F)
          {
            echo "[US_TRADE_AM][FINISH] status=OK reason=already_ran_after_wait trade_date=${trade_date}"
            echo "[RUN_SUMMARY][RESULT] status=OK reason=already_ran_after_wait session=us-am trade_date=${trade_date}"
            echo "[US_TRADE_AM][EXIT] reason=already_ran_after_wait"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Check schedule DRY_RUN contract
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success' && github.event_name == 'schedule'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_TRADE_AM][DRY_RUN_CHECK] DRY_RUN=${DRY_RUN} event=${GITHUB_EVENT_NAME}"
            if [[ "${DRY_RUN}" == "1" ]]; then
              echo "::error::Schedule runs must have DRY_RUN=0. Current DRY_RUN=${DRY_RUN}"
              echo "[RUN_SUMMARY][RESULT] status=FAILED_DRY_RUN_CONTRACT reason=schedule_dry_run_enabled session=us-am"
              exit 1
            fi
            echo "[US_TRADE_AM][DRY_RUN_CHECK][OK] DRY_RUN=${DRY_RUN}"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Check AM already ran
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success'
        id: already_ran
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail
          {
            echo "[US_TRADE_AM][ALREADY_RAN_CHECK][START]"
            
            # Determine trade_date
            if [ -n "${FORCE_NOW_INPUT}" ]; then
              TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
            else
              TRADE_DATE=$(TZ=America/New_York date +%F)
            fi
            export TRADE_DATE
            
            # Check if AM already ran today
            python - <<'PY' >> already_ran_result.txt 2>&1
          import os
          import sys
          sys.path.insert(0, ".")
          from trader.us.db.repos import check_us_am_already_ran
          
          trade_date = os.getenv("TRADE_DATE")
          if not trade_date:
              raise RuntimeError("[US_TRADE_AM][BUG] TRADE_DATE env missing")
          
          # Check AM marker/report — returns dict (fail-closed)
          result = check_us_am_already_ran(trade_date, timeout_sec=5)
          already_ran = bool(result.get("already_ran", True))
          guard_status = result.get("guard_status", "UNKNOWN")
          reason = result.get("reason", "")
          print(f"already_ran={'1' if already_ran else '0'}")
          if already_ran:
              print(f"[US_TRADE_AM][ALREADY_RAN] trade_date={trade_date} guard_status={guard_status} reason={reason}", file=sys.stderr)
          else:
              print(f"[US_TRADE_AM][NOT_RAN_YET] trade_date={trade_date}", file=sys.stderr)
          PY
            
            cat already_ran_result.txt | tee -a artifacts/${US_LOG_FILE}
            ALREADY_RAN=$(grep "^already_ran=" already_ran_result.txt | cut -d= -f2 || echo "0")
            
            echo "already_ran=${ALREADY_RAN}" >> "$GITHUB_OUTPUT"
            echo "[US_TRADE_AM][ALREADY_RAN_CHECK][DONE] already_ran=${ALREADY_RAN}" | tee -a artifacts/${US_LOG_FILE}
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Emit AM already ran skip summary
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success' && steps.already_ran.outputs.already_ran == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=OK_ALREADY_RAN" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=already_ran" >> "$GITHUB_ENV"
          trade_date=$(TZ=America/New_York date +%F)
          {
            echo "[US_TRADE_AM][FINISH] status=OK reason=already_ran trade_date=${trade_date}"
            echo "[RUN_SUMMARY][RESULT] status=OK reason=already_ran session=us-am trade_date=${trade_date}"
            echo "[US_TRADE_AM][EXIT] reason=already_ran"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Run US AM trade session
        if: steps.expectation.outputs.expected_to_trade == '1' && steps.db_migrate.outcome == 'success' && steps.already_ran.outputs.already_ran != '1' && steps.final_duplicate_guard.outputs.already_ran != '1'
        id: trade_session
        continue-on-error: true
        timeout-minutes: 190
        working-directory: repo
        env:
          US_RUN_MODE: ${{ steps.run_mode.outputs.run_mode || 'TRADE' }}
          US_SIGNAL_ONLY: ${{ steps.run_mode.outputs.signal_only || '0' }}
          US_ORDER_ALLOWED: ${{ steps.run_mode.outputs.order_allowed || '1' }}
          US_KIS_ORDER_ALLOWED: ${{ steps.run_mode.outputs.kis_order_allowed || '1' }}
          US_KIS_DATA_ALLOWED: ${{ steps.run_mode.outputs.kis_data_allowed || '1' }}
          US_NON_TRADING_DAY: ${{ steps.run_mode.outputs.non_trading_day || '0' }}
        run: |
          set -euo pipefail
          {
            echo "[US_TRADE_AM][ENV] DRY_RUN=${DRY_RUN} OFFLINE_FLAG="
            
            OFFLINE_FLAG=""
            FORCE_NOW_FLAG=""
            MAX_TICKS_FLAG=""
            MAX_MINUTES="180"
            INTERVAL_SEC="${US_SESSION_INTERVAL_SEC:-300}"
            MANUAL_MAX_ORDER_USD=""

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # smoke_loop は他のフラグより優先
              if [ "${{ inputs.smoke_loop || 'false' }}" = "true" ]; then
                OFFLINE_FLAG="--offline"
                MAX_TICKS_FLAG="--max-ticks 3"
                MAX_MINUTES="10"
                INTERVAL_SEC="1"
                echo "[US_TRADE_AM][SMOKE_LOOP] mode activated: offline max_ticks=3 interval=1 max_minutes=10"
              else
                # force_now + dry_run 조합 시 offline 강제
                if [ "${FORCE_OFFLINE_FOR_SMOKE:-0}" = "1" ]; then
                  OFFLINE_FLAG="--offline"
                  echo "[US_TRADE_AM][OFFLINE_FORCED] reason=force_now_dry_run_smoke"
                elif [ "${{ inputs.offline_mode || 'false' }}" = "true" ] || [ "${{ inputs.offline || 'false' }}" = "true" ]; then
                  OFFLINE_FLAG="--offline"
                fi
                if [ -n "${{ inputs.force_ny_datetime || inputs.force_now }}" ]; then
                  # Trim force_now input
                  FORCE_NOW_TRIMMED=$(echo "${{ inputs.force_ny_datetime || inputs.force_now }}" | xargs)
                  FORCE_NOW_FLAG="--force-now ${FORCE_NOW_TRIMMED}"
                fi
                if [ -n "${{ inputs.max_ticks }}" ] && [ "${{ inputs.max_ticks }}" != "0" ]; then
                  MAX_TICKS_FLAG="--max-ticks ${{ inputs.max_ticks }}"
                fi
                if [ -n "${{ inputs.manual_max_minutes }}" ]; then
                  MAX_MINUTES="${{ inputs.manual_max_minutes }}"
                fi
                if [ -n "${{ inputs.manual_interval_sec }}" ]; then
                  INTERVAL_SEC="${{ inputs.manual_interval_sec }}"
                fi
                if [ -n "${{ inputs.manual_max_order_usd }}" ]; then
                  MANUAL_MAX_ORDER_USD="${{ inputs.manual_max_order_usd }}"
                fi
              fi
            fi

            # Apply manual_max_order_usd override only when dry_run=true
            if [ -n "${MANUAL_MAX_ORDER_USD}" ]; then
              if [ "${DRY_RUN}" = "1" ]; then
                if [[ "${MANUAL_MAX_ORDER_USD}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                  export US_MAX_ORDER_USD="${MANUAL_MAX_ORDER_USD}"
                  echo "[US_RISK_CONFIG][MANUAL_OVERRIDE] key=US_MAX_ORDER_USD value=${US_MAX_ORDER_USD} scope=dry_run_only"
                else
                  echo "::error::manual_max_order_usd must be numeric: ${MANUAL_MAX_ORDER_USD}"
                  exit 1
                fi
              else
                echo "::error::manual_max_order_usd is allowed only when dry_run=true"
                exit 1
              fi
            fi

            echo "[US_RISK_CONFIG] US_MAX_ORDER_USD=${US_MAX_ORDER_USD} US_MAX_DAILY_NOTIONAL_USD=${US_MAX_DAILY_NOTIONAL_USD} US_MAX_POSITIONS=${US_MAX_POSITIONS} US_MAX_POSITION_WEIGHT=${US_MAX_POSITION_WEIGHT} US_MIN_CASH_BUFFER_USD=${US_MIN_CASH_BUFFER_USD}"
            echo "[US_TRADE_AM][START]"
            echo "[US_TRADE_AM][TRADE_RUNNER][START] session=am"
            echo "[US_TRADE_AM][ENV] DRY_RUN=${DRY_RUN} OFFLINE_FLAG=${OFFLINE_FLAG}"
            echo "[US_TRADE_AM][RUN_MODE] US_RUN_MODE=${US_RUN_MODE} US_SIGNAL_ONLY=${US_SIGNAL_ONLY} US_KIS_ORDER_ALLOWED=${US_KIS_ORDER_ALLOWED}"
            echo "[US_TRADE_AM][MANUAL_FLAGS] FORCE_NOW_FLAG=${FORCE_NOW_FLAG} MAX_TICKS_FLAG=${MAX_TICKS_FLAG} MAX_MINUTES=${MAX_MINUTES} INTERVAL_SEC=${INTERVAL_SEC}"
            echo "US_TRADE_RUNNER_STARTED=1" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_BLOCK_REASON=" >> "$GITHUB_ENV"
            echo "US_ORDER_ALLOWED=${US_ORDER_ALLOWED}" >> "$GITHUB_ENV"
            echo "US_KIS_ORDER_ALLOWED=${US_KIS_ORDER_ALLOWED}" >> "$GITHUB_ENV"
            echo "US_OFFLINE_MODE=$([ -n "${OFFLINE_FLAG}" ] && echo true || echo false)" >> "$GITHUB_ENV"

            export US_SCHEDULE_EXPECTED_ET="0815"
            export US_ACTUAL_START_ET="${{ steps.phase_guard.outputs.now_hhmmss }}"
            export US_DELAY_SECONDS="${{ steps.phase_guard.outputs.delay_seconds }}"
            export US_RUN_WINDOW="${{ steps.phase_guard.outputs.run_window }}"
            export US_RECOVERY_RUN="${{ steps.phase_guard.outputs.recovery_run }}"
            export US_MISSED_TRADE_WINDOW="${{ steps.phase_guard.outputs.missed_trade_window }}"

            RUN_MODE_FLAG="--run-mode ${US_RUN_MODE}"
            SIGNAL_ONLY_FLAG=""
            if [ "${US_SIGNAL_ONLY}" = "1" ]; then
              SIGNAL_ONLY_FLAG="--signal-only"
            fi

            set +e
            python -m trader.us.runner.trade_session_runner \
              --session am \
              --env practice \
              --max-minutes "${MAX_MINUTES}" \
              --interval-sec "${INTERVAL_SEC}" \
              ${RUN_MODE_FLAG} \
              ${SIGNAL_ONLY_FLAG} \
              ${FORCE_NOW_FLAG} \
              ${MAX_TICKS_FLAG} \
              ${OFFLINE_FLAG} 2>&1 | tee -a artifacts/${US_LOG_FILE}
            status=${PIPESTATUS[0]}
            set -e
            orders_sent=$(python3 - <<'PY'
              import json
              from pathlib import Path
              path = Path('reports/us_daily/latest_us_daily_report.json')
              if not path.exists():
                print(0)
              else:
                payload = json.loads(path.read_text())
                print(int(payload.get('orders_sent_total', payload.get('orders_sent', 0)) or 0))
            PY
            )
            report_status=$(python3 - <<'PY'
              import json
              from pathlib import Path
              path = Path('reports/us_daily/latest_us_daily_report.json')
              if not path.exists():
                print('FAILED')
              else:
                payload = json.loads(path.read_text())
                print(payload.get('final_status', 'UNKNOWN'))
            PY
            )
            report_reason=$(python3 - <<'PY'
              import json
              from pathlib import Path
              path = Path('reports/us_daily/latest_us_daily_report.json')
              if not path.exists():
                print('trade_report_missing')
              else:
                payload = json.loads(path.read_text())
                print(payload.get('reason', ''))
            PY
            )
            echo "US_ORDERS_SENT=${orders_sent}" >> "$GITHUB_ENV"
            echo "[US_TRADE_AM][PYTHON_EXIT] status=${status}" | tee -a artifacts/${US_LOG_FILE}
            final_trade_status="FAILED"
            if [ "${status}" -eq 0 ]; then
              echo "US_TRADE_STATUS=OK" >> "$GITHUB_ENV"
              echo "[US_TRADE_AM][DONE]" | tee -a artifacts/${US_LOG_FILE}
              final_trade_status="OK"
            else
              echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=${report_reason}" >> "$GITHUB_ENV"
              echo "[US_TRADE_AM][FAILED] python_exit=${status}" | tee -a artifacts/${US_LOG_FILE}
            fi
            echo "[US_TRADE_AM][ORDERS][SUMMARY] sent=${orders_sent} skipped=0 blocked=0" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_TRADE_AM][FINAL_STATUS] status=${final_trade_status} trade_runner_started=1 orders_sent=${orders_sent} reason=${report_reason}" | tee -a artifacts/${US_LOG_FILE}
            exit ${status}
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Validate latest US AM report contract
        if: always()
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_ny_datetime || inputs.force_now || '' }}
        run: |
          set -euo pipefail

          # Trim force_now input
          FORCE_NOW_TRIMMED=$(echo "${FORCE_NOW_INPUT}" | xargs)

          # Determine expected trade_date
          if [ -n "${FORCE_NOW_TRIMMED}" ]; then
            trade_date=$(python3 -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_TRIMMED}').strftime('%Y-%m-%d'))")
            echo "[US_REPORT_VALIDATE][EXPECTED_DATE] source=force_now trade_date=${trade_date}"
          else
            trade_date=$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d'))")
            echo "[US_REPORT_VALIDATE][EXPECTED_DATE] source=now_ny trade_date=${trade_date}"
          fi

          # Ensure report file exists before calling validator
          if [ ! -f "reports/us_daily/latest_us_daily_report.json" ]; then
            if [ "${US_TRADE_RUNNER_STARTED:-0}" = "0" ]; then
              echo "[US_REPORT_VALIDATE][SKIP] session=am reason=trade_runner_not_started"
              exit 0
            fi
            echo "::error::missing latest US report json — report was never written"
            echo "[US_REPORT_VALIDATE][FAIL] session=am reason=report_file_missing"
            exit 1
          fi

          # Run standalone validator (exits 0 for warnings, 1 for fatal)
          python3 scripts/validate_us_daily_report.py \
            --report reports/us_daily/latest_us_daily_report.json \
            --expected-trade-date "${trade_date}" \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-dry-run "${DRY_RUN}" \
            --session am 2>&1 | tee -a artifacts/${US_LOG_FILE}
          validator_exit=${PIPESTATUS[0]}

          # Write last_stage artifact (best effort)
          python3 -c "import json; from pathlib import Path; payload = json.loads(Path('reports/us_daily/latest_us_daily_report.json').read_text()); Path('artifacts/us_last_stage.txt').write_text(str(payload.get('last_stage', 'unknown')) + '\n')" 2>/dev/null || true

          exit "${validator_exit}"

      - name: Verify US AM log contract
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          test -f artifacts/${US_LOG_FILE} || { echo "::warning::missing US log file"; exit 0; }

          # Success: phase guard intentionally skipped the AM run.
          if grep -E "\[RUN_SUMMARY\]\[RESULT\] status=SKIP_PHASE_WINDOW|\[US_TRADE_AM\]\[EXIT\] reason=phase_guard_skip" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][SKIP_OK] phase guard skipped AM intentionally"
            exit 0
          fi

          # Success: already_ran or already_ran_after_wait
          if grep -E "\[RUN_SUMMARY\]\[RESULT\] status=OK reason=(already_ran|already_ran_after_wait)|\[US_TRADE_AM\]\[FINISH\].*status=OK.*reason=(already_ran|already_ran_after_wait)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][OK] duplicate/already-ran marker accepted"
            exit 0
          fi

          # Clear failure: FAILED_PREP_GUARD — 실제 실패 원인 출력
          if grep -E "\[RUN_SUMMARY\]\[RESULT\] status=FAILED_PREP_GUARD|\[US_TRADE_AM\]\[PREP_CONTRACT\]\[FAIL\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::US AM failed due to missing/bad same-day prep"
            grep -n -E "\[US_TRADE_AM\]\[PREP_CONTRACT\]|\[RUN_SUMMARY\]\[RESULT\]" artifacts/${US_LOG_FILE} | tail -20
            exit 1
          fi

          # Success: prep guard failure was properly reported
          if grep -E "\[US_PREP_GUARD\]\[FAIL\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1 && \
             grep -E "\[US_PREP_GUARD\]\[REPORT_WRITE\]\[DONE\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1 && \
             grep -E "\[RUN_SUMMARY\]\[RESULT\] status=FAILED_PREP_GUARD" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][GUARD_FAIL_REPORTED] prep guard failure reported clearly"
            exit 0
          fi

          # ── Schedule Practice Trade Contract (한국장 패턴 적용) ────────────────
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${KIS_ENV}" == "practice" ]]; then
            # 1. DRY_RUN=1 금지 (schedule practice는 실제 모의투자 주문을 보내야 함)
            if grep -E "\[US_ENV_CHECK\] DRY_RUN=1|\[US_TRADE_.*\]\[ENV\] DRY_RUN=1" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::Scheduled US practice trade ran with DRY_RUN=1"
              exit 1
            fi

            # 2. [US_ORDER][DRY_RUN] 금지
            if grep -E "\[US_ORDER\]\[DRY_RUN\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::Scheduled US practice trade produced dry-run orders"
              exit 1
            fi

            # 3. Watchlist score contract fail 금지
            if grep -E "locked_watchlist_score_contract_fail|score_alias_resolution_failed|watchlist_score_zero_mass" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::US watchlist score contract failed"
              exit 1
            fi

            # 4. Score=0 intent 생성 금지
            if grep -E "\[US_ENTRY\]\[INTENT\].*score=0\.000000" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::US entry intent generated with zero score"
              exit 1
            fi
          fi

          # Fatal errors.
          if grep -E "Traceback|\[US_KIS\]\[HTTP_FAIL_FINAL\]|\[US_FILLS\]\[ERROR\]\[CONTRACT\]|\[US_SESSION\]\[TICK_LOOP\]\[ERROR\]|\[US_SESSION\]\[END\].*reason=fills_contract_error|\[US_TICK\]\[DONE\].*status=ERROR.*reason=locked_watchlist_score_contract_fail" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::Fatal AM trade error detected"
            grep -n -E "Traceback|\[US_KIS\]\[HTTP_FAIL_FINAL\]|\[US_FILLS\]\[ERROR\]\[CONTRACT\]|\[US_SESSION\]\[TICK_LOOP\]\[ERROR\]|\[US_SESSION\]\[END\].*reason=fills_contract_error|\[US_TICK\]\[DONE\].*status=ERROR" artifacts/${US_LOG_FILE} | head -20
            exit 1
          fi

          # Success session end.
          if grep -E "\[US_SESSION\]\[END\].*reason=(session_end|max_ticks|force_now_single_tick|market_skip)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][OK] session ended acceptably"
            exit 0
          fi

          if grep -E "\[US_TRADE_AM\]\[DONE\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][OK] workflow done marker accepted"
            exit 0
          fi

          echo "::error::US AM final success marker missing"
          exit 1

      - name: Generate US PnL report
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[US_PNL][START] session=am env=${KIS_ENV}" | tee -a artifacts/${US_LOG_FILE}
          
          # PnL report는 항상 생성 시도 (실패해도 FAILED_PNL_REPORT 상태로 파일 생성)
          python scripts/generate_us_portfolio_pnl_report.py \
            --session am \
            --env "${KIS_ENV}" \
            --output-dir reports/us_pnl \
            --latest-daily-report reports/us_daily/latest_us_daily_report.json \
            2>&1 | tee -a artifacts/${US_LOG_FILE} || {
              echo "::warning::US PnL report generation failed, but continuing"
            }
          
          echo "[US_PNL][DONE]" | tee -a artifacts/${US_LOG_FILE}

      - name: Validate US PnL report
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[US_PNL_REPORT][VALIDATE][START] session=am" | tee -a artifacts/${US_LOG_FILE}
          test -f reports/us_pnl/latest_us_pnl_report.json || {
            echo "::error::missing US PnL report JSON" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          test -f reports/us_pnl/latest_us_pnl_report.md || {
            echo "::error::missing US PnL report MD" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          test -f reports/us_pnl/latest_us_pnl_report.csv || {
            echo "::error::missing US PnL report CSV" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          test -s reports/us_pnl/latest_us_pnl_report.md || {
            echo "::error::empty US PnL report MD" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          
          # status가 FAILED_PNL_REPORT여도 파일은 있어야 한다
          pnl_status=$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('reports/us_pnl/latest_us_pnl_report.json').read_text()).get('status', 'UNKNOWN'))")
          pnl_source=$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('reports/us_pnl/latest_us_pnl_report.json').read_text()).get('pnl_position_source', 'unknown'))")
          echo "US_PNL_STATUS=${pnl_status}" >> "$GITHUB_ENV"
          echo "[US_PNL_REPORT][STATUS] ${pnl_status}" | tee -a artifacts/${US_LOG_FILE}
          echo "[US_PNL][FINAL_STATUS] status=${pnl_status} source=${pnl_source}" | tee -a artifacts/${US_LOG_FILE}
          
          if [[ "${pnl_status}" == "FAILED_PNL_REPORT" ]]; then
            echo "::warning::US PnL report status is FAILED_PNL_REPORT, but files exist" | tee -a artifacts/${US_LOG_FILE}
          elif [[ "${pnl_status}" == "PARTIAL" ]]; then
            echo "::warning::US PnL report status is PARTIAL (incomplete data)" | tee -a artifacts/${US_LOG_FILE}
          else
            echo "[US_PNL_REPORT][OK] status=${pnl_status}" | tee -a artifacts/${US_LOG_FILE}
          fi
          echo "[US_PNL_REPORT][VALIDATE][DONE] session=am" | tee -a artifacts/${US_LOG_FILE}

      - name: Finalize AM workflow status
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          trade_status="${US_TRADE_STATUS:-INIT}"
          expected_to_trade="${US_EXPECTED_TO_TRADE:-0}"
          trade_runner_started="${US_TRADE_RUNNER_STARTED:-0}"
          block_reason="${US_TRADE_RUNNER_BLOCK_REASON:-trade_pipeline_gate_failed}"
          pnl_status="${US_PNL_STATUS:-UNKNOWN}"
          workflow_status="OK"

          if [ "${expected_to_trade}" = "1" ] && [ "${trade_runner_started}" != "1" ]; then
            workflow_status="FAILED_TRADE_NOT_STARTED"
            echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
            echo "[US_WORKFLOW][FINAL_REASON] reason=${block_reason}" | tee -a artifacts/${US_LOG_FILE}
          elif [ "${trade_status}" = "FAILED" ] && [[ "${pnl_status}" == OK* ]]; then
            workflow_status="FAILED_AM_TRADE_PNL_ONLY"
          elif [ "${trade_status}" = "FAILED" ]; then
            workflow_status="FAILED_FINAL"
          elif [ "${trade_status}" = "SKIPPED" ]; then
            workflow_status="SKIPPED"
          elif [ "${trade_status}" = "SKIPPED_DUPLICATE_SESSION" ]; then
            workflow_status="SKIPPED_DUPLICATE_SESSION"
          elif [ "${trade_status}" = "OK_ALREADY_RAN" ]; then
            workflow_status="OK_ALREADY_RAN"
          fi

          echo "[US_WORKFLOW][FINAL_STATUS] status=${workflow_status}" | tee -a artifacts/${US_LOG_FILE}

          if [ "${workflow_status}" = "FAILED_AM_TRADE_PNL_ONLY" ] || [ "${workflow_status}" = "FAILED_FINAL" ] || [ "${workflow_status}" = "FAILED_TRADE_NOT_STARTED" ]; then
            exit 1
          fi

      - name: Finish AM session lock
        if: always() && steps.session_lock.outputs.claimed == '1'
        working-directory: repo
        env:
          TRADE_DATE: ${{ steps.session_lock.outputs.trade_date }}
          FINAL_TRADE_STATUS: ${{ env.US_TRADE_STATUS }}
          FINAL_BLOCK_REASON: ${{ env.US_TRADE_RUNNER_BLOCK_REASON }}
          TRADE_RUNNER_STARTED: ${{ env.US_TRADE_RUNNER_STARTED }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from datetime import date
          sys.path.insert(0, ".")
          from trader.us.db.session_locks import finish_us_session_lock

          trade_date = os.environ.get("TRADE_DATE") or ""
          trade_status = os.environ.get("FINAL_TRADE_STATUS", "FAILED")
          reason = os.environ.get("FINAL_BLOCK_REASON", "")
          runner_started = os.environ.get("TRADE_RUNNER_STARTED", "0")

          if not trade_date:
              print("[US_SESSION_LOCK][FINISH_SKIP] reason=missing_trade_date")
              raise SystemExit(0)

          if trade_status == "OK":
              lock_status = "DONE"
          elif trade_status in {"SKIPPED_DUPLICATE_SESSION", "OK_ALREADY_RAN"}:
              lock_status = "DONE_WITH_WARNINGS"
          elif reason in {"db_migration_failed", "bad_or_missing_prep", "prep_contract_failed", "trade_pipeline_gate_failed"}:
              lock_status = "FAILED_RETRYABLE"
          else:
              lock_status = "FAILED_RETRYABLE"

          finish_us_session_lock(
              env=os.environ.get("KIS_ENV", "practice"),
              trade_date=date.fromisoformat(trade_date),
              session="am",
              github_run_id=os.environ.get("GITHUB_RUN_ID"),
              status=lock_status,
              reason=reason or trade_status,
              metadata={
                  "trade_status": trade_status,
                  "trade_runner_started": runner_started,
                  "reason": reason,
              },
          )
          print(f"[US_SESSION_LOCK][FINISH] session=am trade_date={trade_date} status={lock_status} reason={reason or trade_status}")
          PY

      - name: Print US PnL report to console and summary
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail

          PNL_MD="reports/us_pnl/latest_us_pnl_report.md"
          PNL_JSON="reports/us_pnl/latest_us_pnl_report.json"
          PNL_CSV="reports/us_pnl/latest_us_pnl_report.csv"

          {
            echo ""
            echo "============================================================"
            echo "[US_PNL_REPORT_MD][BEGIN]"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
            echo "file=${PNL_MD}"
            echo "============================================================"
          } | tee -a "artifacts/${US_LOG_FILE}"

          if [ -f "${PNL_MD}" ]; then
            cat reports/us_pnl/latest_us_pnl_report.md | tee -a "artifacts/${US_LOG_FILE}"
            {
              echo ""
              echo "## US PnL Report"
              echo ""
              echo "- workflow: ${GITHUB_WORKFLOW}"
              echo "- run_id: ${GITHUB_RUN_ID}"
              echo "- attempt: ${GITHUB_RUN_ATTEMPT}"
              echo ""
              cat "${PNL_MD}"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::US PnL markdown not found: ${PNL_MD}" | tee -a "artifacts/${US_LOG_FILE}"
            {
              echo ""
              echo "## US PnL Report"
              echo ""
              echo "PNL markdown missing: ${PNL_MD}"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo "============================================================"
            echo "[US_PNL_REPORT_MD][END]"
            echo "json_exists=$([ -f "${PNL_JSON}" ] && echo 1 || echo 0)"
            echo "csv_exists=$([ -f "${PNL_CSV}" ] && echo 1 || echo 0)"
            echo "============================================================"
            echo ""
          } | tee -a "artifacts/${US_LOG_FILE}"

      - name: Upload US artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.US_ARTIFACT_NAME }}-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/reports/us_daily/
            repo/reports/us_pnl/
          if-no-files-found: warn
          retention-days: 7

name: "US Trade AM"
# session: am | window: 09:30~12:30 ET | schedule: 13:25 / 14:25 UTC Mon-Fri

"on":
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = no order submission)"
        required: false
        default: true
        type: boolean
      offline:
        description: "offline mode (blocks all KIS HTTP)"
        required: false
        default: false
        type: boolean
      confirm:
        description: "Type RUN_US_AM_MANUAL to run manually"
        required: false
        default: ""
      confirm_trade:
        description: "Required when dry_run=false. Type RUN_US_AM_TRADE_MANUAL"
        required: false
        default: ""
      force_now:
        description: "Manual smoke only. Forced NY datetime, e.g. 2026-05-01T09:35:00-04:00"
        required: false
        default: ""
      max_ticks:
        description: "Manual smoke max tick count. 0 means single tick when force_now is set."
        required: false
        default: "0"
      manual_max_minutes:
        description: "Manual max minutes override. Empty means default."
        required: false
        default: ""
      manual_interval_sec:
        description: "Manual interval seconds override. Empty means default."
        required: false
        default: ""
      manual_max_order_usd:
        description: "Manual dry-run only. Override US_MAX_ORDER_USD, e.g. 3500"
        required: false
        default: ""
      smoke_loop:
        description: "Quick smoke loop: force --offline, max_ticks=3, interval=1, max_minutes=10. Overrides other flags."
        required: false
        default: false
        type: boolean

concurrency:
  group: us-trade-am-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trade_us_am:
    runs-on: ubuntu-latest
    timeout-minutes: 220

    env:
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      TRADING_REGION: "US"
      US_AGENT_ENABLED: "1"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      US_LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"

      US_STRATEGY_ENGINE: "pb1"
      US_ENTRY_ENABLED: "1"
      US_EXIT_ENABLED: "1"

      US_PAPER_MAX_CAPITAL_KRW: "50000000"
      US_EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
      US_BUDGET_FX_KRW_PER_USD: "1450"
      US_MAX_CAPITAL_USD_AUTO: "1"

      US_REQUIRE_FILL_CONFIRM: "1"
      US_ORDER_ACCEPTED_IS_NOT_FILLED: "1"
      US_BLOCK_REBUY_AFTER_SELL_SAME_DAY: "1"
      US_ALLOW_INTRADAY_REENTRY_AFTER_STOP: "0"
      US_BLOCK_NEW_ENTRY_AFTER_ET: "15:45"

      US_MAX_ORDER_USD: "2500"
      US_MAX_DAILY_NOTIONAL_USD: "10000"
      US_MAX_POSITION_WEIGHT: "0.10"
      US_MIN_CASH_BUFFER_USD: "200"

      US_SESSION_INTERVAL_SEC: "300"

      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || vars.US_AGENT_SCHEDULE_DRY_RUN || '1' }}

      US_LOG_FILE: "us-trade-am.log"
      US_ARTIFACT_NAME: "us-trade-am"

    steps:
      - name: Resolve US AM phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=America/New_York date +%H)"
          now_m="$(TZ=America/New_York date +%M)"
          now_s="$(TZ=America/New_York date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=America/New_York date +%H%M)"
          now_hhmmss="$(TZ=America/New_York date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          target_min=$((9 * 60 + 30))
          stale_min=$((10 * 60 + 30))
          max_wait_seconds=900
          max_wait_min=$((max_wait_seconds / 60))

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -gt "$stale_min" ]]; then
              should_run=0
              skip_reason="skip_stale_start_us_am"
            elif [[ "$now_min" -lt $((target_min - max_wait_min)) ]]; then
              should_run=0
              skip_reason="skip_too_early_us_am_duplicate_cron"
            elif [[ "$now_min" -lt "$target_min" ]]; then
              wait_until_target=1
              wait_seconds=$(( (target_min - now_min) * 60 ))
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.confirm || '' }}"
            confirm_trade="${{ inputs.confirm_trade || '' }}"
            dry_run_input="${{ inputs.dry_run && 'true' || 'false' }}"

            if [[ "$dry_run_input" == "false" ]]; then
              if [[ "$confirm_trade" != "RUN_US_AM_TRADE_MANUAL" ]]; then
                should_run=0
                skip_reason="manual_us_am_trade_not_confirmed"
              fi
            elif [[ "$confirm" != "RUN_US_AM_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_us_am_not_confirmed"
            fi
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_et=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Resolve US AM run mode
        id: run_mode
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from trader.us.market_calendar import now_ny, is_us_trading_day
          now = now_ny()
          is_td = is_us_trading_day(now.date())
          if is_td:
              print("run_mode=TRADE")
              print("signal_only=0")
              print("order_allowed=1")
              print("kis_order_allowed=1")
              print("kis_data_allowed=1")
              print("non_trading_day=0")
              print("reason=trading_day")
          else:
              print("run_mode=NON_TRADING_SIGNAL_ONLY")
              print("signal_only=1")
              print("order_allowed=0")
              print("kis_order_allowed=0")
              print("kis_data_allowed=0")
              print("non_trading_day=1")
              print("reason=non_trading_day_signal_only")
          PY

      - name: Verify checkout path
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; exit 1; }
          mkdir -p repo/artifacts repo/reports/us_daily
          {
            echo "[US_TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[US_TRADE_AM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason }} now_et=${{ steps.phase_guard.outputs.now_hhmmss }} wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }} session_window=0930-1230"
            echo "[US_TRADE_AM][RUN_MODE] run_mode=${{ steps.run_mode.outputs.run_mode }} signal_only=${{ steps.run_mode.outputs.signal_only }} order_allowed=${{ steps.run_mode.outputs.order_allowed }} kis_order_allowed=${{ steps.run_mode.outputs.kis_order_allowed }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/${US_LOG_FILE}
          echo "[CHECKOUT][OK] repo path ready" | tee -a repo/artifacts/${US_LOG_FILE}

      - name: Emit US AM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=us-am"
            echo "[US_TRADE_AM][EXIT] reason=phase_guard_skip"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: US Python syntax preflight
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_PREFLIGHT][START] py_compile"
            python -m py_compile trader/us/execution/kis_us_client.py
            python -m py_compile trader/us/execution/fills.py
            python -m py_compile trader/us/runner/trade_tick_runner.py
            python -m py_compile trader/us/runner/trade_session_runner.py
            python -m py_compile trader/us/pb1/us_entry_engine.py
            python -m py_compile trader/us/pb1/us_pb1_engine.py
            python -m compileall -q trader/us
            echo "[US_PREFLIGHT][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Wait until US AM target start
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=900
          if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds}"
            exit 1
          fi
          echo "[US_WAIT_UNTIL_TARGET][START] session=am wait_seconds=${wait_seconds}" | tee -a artifacts/${US_LOG_FILE}
          sleep "$wait_seconds"
          echo "[US_WAIT_UNTIL_TARGET][DONE] session=am now_et=$(TZ=America/New_York date +%H%M%S)" | tee -a artifacts/${US_LOG_FILE}

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_DB_GUARD][START]"
            : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
            if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
              echo "::error::PBCORE_DB_URL must be postgres-only."
              exit 1
            fi
            echo "[US_DB_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_DB_MIGRATE][START]"
            python -m trader.db.migrate
            echo "[US_DB_MIGRATE][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_ENV_CHECK] TRADING_REGION=${TRADING_REGION:-}"
            echo "[US_ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
            echo "[US_ENV_CHECK] DRY_RUN=${DRY_RUN:-}"
            echo "[US_ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
            test -n "${PBCORE_DB_URL:-}" || { echo "::error::PBCORE_DB_URL missing"; exit 1; }
            test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
            test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
            test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
            test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
            test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
            test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
            test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
            [[ "${TRADING_REGION}" == "US" ]] || { echo "::error::TRADING_REGION must be US"; exit 1; }
            [[ "${KIS_ENV}" == "practice" ]] || { echo "::error::KIS_ENV must be practice"; exit 1; }
            echo "[US_ENV_CHECK][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard manual force_now safety
        if: github.event_name == 'workflow_dispatch' && inputs.force_now != ''
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_FORCE_NOW_GUARD][START] force_now=${{ inputs.force_now }} dry_run=${{ inputs.dry_run }} offline=${{ inputs.offline }}"
            if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.offline }}" != "true" ]; then
              echo "::error::force_now manual smoke requires dry_run=true or offline=true"
              exit 1
            fi
            echo "[US_FORCE_NOW_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard same-day US prep contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
          SESSION: "am"
        run: |
          set -euo pipefail
          {
            echo "[US_PREP_GUARD][START] session=am"
            python scripts/guard_us_prep_contract.py
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Run US AM trade session
        if: steps.phase_guard.outputs.should_run == '1'
        timeout-minutes: 190
        working-directory: repo
        env:
          US_RUN_MODE: ${{ steps.run_mode.outputs.run_mode || 'TRADE' }}
          US_SIGNAL_ONLY: ${{ steps.run_mode.outputs.signal_only || '0' }}
          US_ORDER_ALLOWED: ${{ steps.run_mode.outputs.order_allowed || '1' }}
          US_KIS_ORDER_ALLOWED: ${{ steps.run_mode.outputs.kis_order_allowed || '1' }}
          US_KIS_DATA_ALLOWED: ${{ steps.run_mode.outputs.kis_data_allowed || '1' }}
          US_NON_TRADING_DAY: ${{ steps.run_mode.outputs.non_trading_day || '0' }}
        run: |
          set -euo pipefail
          {
            OFFLINE_FLAG=""
            FORCE_NOW_FLAG=""
            MAX_TICKS_FLAG=""
            MAX_MINUTES="180"
            INTERVAL_SEC="${US_SESSION_INTERVAL_SEC:-300}"
            MANUAL_MAX_ORDER_USD=""

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # smoke_loop は他のフラグより優先
              if [ "${{ inputs.smoke_loop || 'false' }}" = "true" ]; then
                OFFLINE_FLAG="--offline"
                MAX_TICKS_FLAG="--max-ticks 3"
                MAX_MINUTES="10"
                INTERVAL_SEC="1"
                echo "[US_TRADE_AM][SMOKE_LOOP] mode activated: offline max_ticks=3 interval=1 max_minutes=10"
              else
                if [ "${{ inputs.offline || 'false' }}" = "true" ]; then
                  OFFLINE_FLAG="--offline"
                fi
                if [ -n "${{ inputs.force_now }}" ]; then
                  FORCE_NOW_FLAG="--force-now ${{ inputs.force_now }}"
                fi
                if [ -n "${{ inputs.max_ticks }}" ] && [ "${{ inputs.max_ticks }}" != "0" ]; then
                  MAX_TICKS_FLAG="--max-ticks ${{ inputs.max_ticks }}"
                fi
                if [ -n "${{ inputs.manual_max_minutes }}" ]; then
                  MAX_MINUTES="${{ inputs.manual_max_minutes }}"
                fi
                if [ -n "${{ inputs.manual_interval_sec }}" ]; then
                  INTERVAL_SEC="${{ inputs.manual_interval_sec }}"
                fi
                if [ -n "${{ inputs.manual_max_order_usd }}" ]; then
                  MANUAL_MAX_ORDER_USD="${{ inputs.manual_max_order_usd }}"
                fi
              fi
            fi

            # Apply manual_max_order_usd override only when dry_run=true
            if [ -n "${MANUAL_MAX_ORDER_USD}" ]; then
              if [ "${DRY_RUN}" = "1" ]; then
                if [[ "${MANUAL_MAX_ORDER_USD}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                  export US_MAX_ORDER_USD="${MANUAL_MAX_ORDER_USD}"
                  echo "[US_RISK_CONFIG][MANUAL_OVERRIDE] key=US_MAX_ORDER_USD value=${US_MAX_ORDER_USD} scope=dry_run_only"
                else
                  echo "::error::manual_max_order_usd must be numeric: ${MANUAL_MAX_ORDER_USD}"
                  exit 1
                fi
              else
                echo "::error::manual_max_order_usd is allowed only when dry_run=true"
                exit 1
              fi
            fi

            echo "[US_RISK_CONFIG] US_MAX_ORDER_USD=${US_MAX_ORDER_USD} US_MAX_DAILY_NOTIONAL_USD=${US_MAX_DAILY_NOTIONAL_USD} US_MAX_POSITION_WEIGHT=${US_MAX_POSITION_WEIGHT} US_MIN_CASH_BUFFER_USD=${US_MIN_CASH_BUFFER_USD}"
            echo "[US_TRADE_AM][START]"
            echo "[US_TRADE_AM][ENV] DRY_RUN=${DRY_RUN} OFFLINE_FLAG=${OFFLINE_FLAG}"
            echo "[US_TRADE_AM][RUN_MODE] US_RUN_MODE=${US_RUN_MODE} US_SIGNAL_ONLY=${US_SIGNAL_ONLY} US_KIS_ORDER_ALLOWED=${US_KIS_ORDER_ALLOWED}"
            echo "[US_TRADE_AM][MANUAL_FLAGS] FORCE_NOW_FLAG=${FORCE_NOW_FLAG} MAX_TICKS_FLAG=${MAX_TICKS_FLAG} MAX_MINUTES=${MAX_MINUTES} INTERVAL_SEC=${INTERVAL_SEC}"

            RUN_MODE_FLAG="--run-mode ${US_RUN_MODE}"
            SIGNAL_ONLY_FLAG=""
            if [ "${US_SIGNAL_ONLY}" = "1" ]; then
              SIGNAL_ONLY_FLAG="--signal-only"
            fi

            python -m trader.us.runner.trade_session_runner \
              --session am \
              --env practice \
              --max-minutes "${MAX_MINUTES}" \
              --interval-sec "${INTERVAL_SEC}" \
              ${RUN_MODE_FLAG} \
              ${SIGNAL_ONLY_FLAG} \
              ${FORCE_NOW_FLAG} \
              ${MAX_TICKS_FLAG} \
              ${OFFLINE_FLAG}

            echo "[US_TRADE_AM][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Verify US AM log contract
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          test -f artifacts/${US_LOG_FILE} || { echo "::warning::missing US log file"; exit 0; }

          # Success: phase guard intentionally skipped the AM run.
          if grep -E "\\[RUN_SUMMARY\\]\\[RESULT\\] status=SKIP_PHASE_WINDOW|\\[US_TRADE_AM\\]\\[EXIT\\] reason=phase_guard_skip" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][SKIP_OK] phase guard skipped AM intentionally"
            exit 0
          fi

          # Fatal errors.
          if grep -E "Traceback|\\[US_KIS\\]\\[HTTP_FAIL_FINAL\\]|\\[US_FILLS\\]\\[ERROR\\]\\[CONTRACT\\]|\\[US_SESSION\\]\\[TICK_LOOP\\]\\[ERROR\\]|\\[US_SESSION\\]\\[END\\].*reason=fills_contract_error|\\[US_SESSION\\]\\[END\\].*reason=locked_watchlist_missing|\\[US_ENTRY\\]\\[BLOCK\\] reason=locked_watchlist_missing|\\[US_PREP_GUARD\\]\\[FAIL\\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::Fatal AM trade error detected"
            grep -n -E "Traceback|\\[US_KIS\\]\\[HTTP_FAIL_FINAL\\]|\\[US_FILLS\\]\\[ERROR\\]\\[CONTRACT\\]|\\[US_SESSION\\]\\[TICK_LOOP\\]\\[ERROR\\]|\\[US_SESSION\\]\\[END\\].*reason=fills_contract_error|\\[US_SESSION\\]\\[END\\].*reason=locked_watchlist_missing|\\[US_ENTRY\\]\\[BLOCK\\] reason=locked_watchlist_missing|\\[US_PREP_GUARD\\]\\[FAIL\\]" artifacts/${US_LOG_FILE} | head -20
            exit 1
          fi

          # Success session end.
          if grep -E "\\[US_SESSION\\]\\[END\\].*reason=(session_end|max_ticks|force_now_single_tick|market_skip)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][OK] session ended acceptably"
            exit 0
          fi

          if grep -E "\\[US_TRADE_AM\\]\\[DONE\\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AM_VERIFY][OK] workflow done marker accepted"
            exit 0
          fi

          echo "::error::US AM final success marker missing"
          exit 1

      - name: Upload US artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.US_ARTIFACT_NAME }}-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/reports/us_daily/
          if-no-files-found: warn
          retention-days: 7

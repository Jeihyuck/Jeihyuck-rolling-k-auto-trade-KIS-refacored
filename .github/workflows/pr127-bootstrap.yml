name: PR127 Bootstrap

on:
  push:
    branches:
      - fix/pr127-residual-runtime-integrity-20260912

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR127 branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr127-residual-runtime-integrity-20260912
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary

      - name: Apply PR127 fixes
        run: |
          python scripts/pr127_apply.py
          python scripts/pr127_fixup.py

      - name: Byte compile changed production modules
        run: |
          python -m py_compile \
            trader/us/execution/kis_us_client.py \
            trader/us/data_provider.py \
            trader/us/pb1/us_exit_engine.py \
            trader/us/runner/trade_tick_runner.py \
            trader/us/runner/trade_session_runner.py \
            trader/us/infinite/integration.py \
            trader/us/infinite/repository.py \
            trader/us/execution/order_router.py \
            trader/us/execution/tick_context.py \
            trader/kr/runner/trade_session_runner.py

      - name: Targeted regression tests
        run: |
          python -m pytest -q \
            tests/us/test_us_pr127_residual_integrity.py \
            tests/us/test_us_20260910_20260911_incident_fixes.py \
            tests/us/test_us_tqqq_open_buy_ttl_lifecycle.py \
            tests/us/test_us_exit_first_routing.py \
            tests/us/test_us_tick_io_budget_regression.py \
            tests/kr/test_kr_pr127_close_contract.py \
            tests/test_kr_close_phase_forced.py \
            tests/test_workflow_trade_close_contract.py

      - name: Remove one-shot bootstrap files and commit final patch
        run: |
          git rm -f scripts/pr127_apply.py scripts/pr127_fixup.py .github/workflows/pr127-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No PR127 changes to commit"
            exit 0
          fi
          git commit -m "fix: harden residual KR/US runtime integrity after PR126"
          git push origin HEAD:fix/pr127-residual-runtime-integrity-20260912

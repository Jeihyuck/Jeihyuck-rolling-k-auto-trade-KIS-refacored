name: KR-US Four Family Integrated Acceptance

on:
  push:
    branches:
      - test/kr-us-20261011-four-family-combined-acceptance
  pull_request:
    branches:
      - fix/us-20261011-four-family-fair-arbitration
      - dual-agent
    paths:
      - 'trader/**'
      - 'tests/integration/**'
      - 'tests/us/**'
      - 'tests/kr/**'
      - '.github/workflows/kr-us-four-family-integrated-ci.yml'

jobs:
  real-bar-buy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: safe_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safe_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KIS_ENV: practice
      STRATEGY_ENV: practice
      DRY_RUN: '1'
      ALLOW_REAL_ORDER: '0'
      US_KIS_ORDER_ALLOWED: '0'
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/safe_acceptance
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary
      - name: Byte compile both market code paths
        run: |
          python -m compileall -q trader
      - name: Replay real stored OHLCV through candidate, strategy, BUY and frozen contracts
        run: |
          python -m pytest -q \
            tests/integration/test_kr_us_four_family_real_ohlcv_20261011.py \
            tests/kr/test_kr_four_family_candidate_admission_20261011.py \
            tests/kr/test_kr_supabase_real_ohlcv_replay_20261011.py \
            tests/us/test_us_four_family_fair_arbitration_20261011.py \
            tests/us/test_us_supabase_real_ohlcv_replay_20261011.py \
            tests/us/test_us_four_family_buy_contract_chain_20261010.py \
            tests/us/test_us_independent_live_proof_gate_20261010.py
      - name: KR locked entry, exit and no-duplicate-order contracts
        run: |
          python -m pytest -q \
            tests/test_kr_final30_contract.py \
            tests/test_entry_guard_final30.py \
            tests/test_pb1_entry_plan_persistence.py \
            tests/test_reconcile_entry_exit_plan_restore.py \
            tests/test_position_cycle_lifecycle.py
      - name: US offline broker scenarios
        run: |
          python -m trader.us.harness.runner --scenario all --offline

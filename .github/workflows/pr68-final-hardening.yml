name: PR68 Final Hardening

on:
  push:
    branches:
      - codex/fix-all-us-dual-agent-execution-failures
    paths:
      - ".github/workflows/pr68-final-hardening.yml"
      - "scripts/pr68_patch_*.py"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr68_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr68_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      TRADING_REGION: US
      KIS_ENV: practice
      US_PAPER_TRADING_ENABLED: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/pr68_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-all-us-dual-agent-execution-failures
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary
      - name: Apply hardening patches
        run: |
          python scripts/pr68_patch_1.py
          python scripts/pr68_patch_2.py
          python scripts/pr68_patch_3.py
          python scripts/pr68_patch_4.py
      - name: Compile modified modules
        run: |
          python -m py_compile \
            trader/us/execution/kis_us_client.py \
            trader/us/execution/fills.py \
            trader/us/execution/order_router.py \
            trader/us/execution/order_journal.py \
            trader/us/execution/reconcile.py \
            trader/us/db/repos.py \
            trader/us/runner/trade_tick_runner.py \
            trader/us/runner/trade_close_runner.py \
            scripts/repair_us_trade_integrity.py
      - name: Run focused hardening tests
        run: python -m pytest tests/us/test_us_final_operational_hardening.py tests/us/test_us_postgres_integration_real.py -q
      - name: Run full US suite
        run: python -m pytest tests/us -q
      - name: Run offline harness
        run: python -m trader.us.harness.runner --scenario all --offline
      - name: Commit verified patch and remove temporary tooling
        run: |
          rm -f scripts/pr68_patch_1.py scripts/pr68_patch_2.py scripts/pr68_patch_3.py scripts/pr68_patch_4.py
          rm -f .github/workflows/pr68-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining US practice accounting and trade-date failures"
          git push origin HEAD:codex/fix-all-us-dual-agent-execution-failures

name: KR Historical Recovery Once and Balance Freshness CI

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/pb1_runner.py"
      - "trader/reconcile_kis.py"
      - "trader/kr/historical_recovery_journal.py"
      - "trader/kr/close_historical_reconcile.py"
      - "tests/kr/test_kr_historical_recovery*.py"
      - "tests/kr/test_kr_balance_freshness_provenance_20261106.py"
      - "scripts/kr_20261027_293490_readonly_proof.py"
      - "tests/kr/test_kr_20261027_broker_readonly_proof.py"
      - ".github/workflows/kr-historical-recovery-once-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-historical-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: "."
      KIS_ENV: practice
      STRATEGY_ENV: practice
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      DISABLE_LIVE_TRADING: "1"
      KR_HISTORICAL_RECOVERY_ONCE_ENABLED: "0"
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
      PBCORE_DB_URL: ""
      DATABASE_URL: ""
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kr_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline dependencies
        run: python -m pip install -r requirements.txt pytest psycopg2-binary
      - name: Verify new source compiles
        run: |
          python -m py_compile trader/pb1_runner.py trader/reconcile_kis.py trader/kr/historical_recovery_journal.py trader/kr/close_historical_reconcile.py scripts/kr_20261027_293490_readonly_proof.py
      - name: Strict journal, KIS freshness, and sell-first integration tests
        run: |
          python -m pytest -q \
            tests/kr/test_kr_historical_recovery_journal_20261106.py \
            tests/kr/test_kr_historical_recovery_postgres_20261106.py \
            tests/kr/test_kr_close_historical_reconcile_20261106.py \
            tests/kr/test_kr_balance_freshness_provenance_20261106.py \
            tests/kr/test_kr257_sell_first_runner_integration.py \
            tests/kr/test_kr_20261027_broker_readonly_proof.py
      - name: After PR327 merge verify exact Final30 parity still holds
        run: |
          python -m pytest -q tests/kr/test_kr_final30_db_file_parity_p0_20261106.py

name: Trade PM

"on":
  schedule:
    # Mon-Fri 13:05 KST = 04:05 UTC (PM loop runs through 15:10 KST)
    - cron: "5 4 * * 1-5"
    - cron: "10 4 * * 1-5"
    - cron: "15 4 * * 1-5"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice
      FORCE_TRADE_SESSION:
        description: "Override trade session classification"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - am
          - pm
      FORCE_TRADE_PM_LATE_START:
        description: "1=allow PM start after normal cutoff"
        required: false
        default: "0"
        type: string
      FORCE_TRADE_PM_AFTER_1340:
        description: "1=allow manual PM start after 13:40 KST"
        required: false
        default: "0"
        type: string

concurrency:
  group: pb1-practice-pm-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODE: trade
  PB1_SESSION_KIND: "pm"
  PB1_FORCE_TRADE_SESSION: "auto"
  PB1_PM_START_ALLOW_UNTIL: "1325"
  PB1_PM_RECOVERY_ALLOW_UNTIL: "1340"
  PB1_PM_EXPECTED_START_FROM: "1305"
  PB1_PM_EXPECTED_START_TO: "1315"
  PB1_ENABLE_LATE_PM_RECOVERY: "1"
  PB1_FORCE_TRADE_PM_LATE_START: "0"
  PB1_FORCE_TRADE_PM_AFTER_1340: "0"
  PB1_PM_SESSION_END: "15:10"
  PB1_TICK_HARD_TIMEOUT_SEC: "90"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  PB1_POSTPROCESS_TIMEOUT_SEC: "45"
  PB1_POST_CAPITAL_TIMEOUT_SEC: "45"
  PB1_EXIT_PASS_TIMEOUT_SEC: "90"
  STRATEGY_MODE: "LIVE"
  STRATEGY_ENV: practice
  KIS_ENV: practice
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  FINAL30_SOURCE_MODE: "db_only"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"
  PB1_LOOP_ENABLED: "1"
  PB1_RUN_LOOP_MINUTES: "130"
  PB1_LOOP_INTERVAL_SEC: "60"
  PB1_SESSION_GUARD_STALE_SEC: "600"
  PB1_MANUAL_SESSION_GUARD_STALE_SEC: "60"
  PB1_ALLOW_MANUAL_SESSION_TAKEOVER: "1"
  PB1_ALLOW_WAIT: "0"
  FORCE_RUN: "1"
  FORCE_MARKET_WINDOW: "day"
  FORCE_PB1_PHASE: "entry"
  FORCE_STRATEGY_MODE: "LIVE"
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "0"
  LIVE_TRADING_ENABLED: "1"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  KIS_HTTP_ENABLED: "1"
  PAPER_MAX_CAPITAL_KRW: "100000000"
  EXPECTED_PRACTICE_CAPITAL_KRW: "0"
  ACCOUNT_SANITY_CHECK: "1"
  ACCOUNT_SANITY_FAIL_IF_MISMATCH: "0"
  ACCOUNT_SANITY_RECONCILE_FROM_KIS: "1"
  ACCOUNT_SANITY_WARN_IF_MISMATCH: "1"
  EXPECTED_INITIAL_HOLDINGS: "-1"
  KIS_PRICE_MIN_INTERVAL_MS: "400"
  KIS_PRICE_CACHE_TTL_SEC: "15"
  KIS_RATE_LIMIT_COOLDOWN_SEC: "20"
  NO_TRADE: "0"
  FAIL_IF_POOL_MISSING: "1"
  CANDIDATE_POOL_TTL_DAYS: "7"
  CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
  CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
  CANDIDATE_POOL_UNIVERSE_ENV: "practice"
  MINERVINI_USE_FEATURE_CACHE: "1"
  FEATURE_CACHE_WARMUP_ON_TICK: "0"
  DB_DISABLE_PREPARED_STATEMENTS: "1"
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"

defaults:
  run:
    shell: bash

jobs:
  trade_pm:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      PB1_FORCE_TRADE_SESSION: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_TRADE_SESSION || 'auto' }}
      PB1_FORCE_TRADE_PM_LATE_START: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_TRADE_PM_LATE_START || '0' }}
      PB1_FORCE_TRADE_PM_AFTER_1340: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_TRADE_PM_AFTER_1340 || '0' }}

    steps:
      - name: Resolve PM session context
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          valid_window="1300-1510"
          expected_start_window="1305-1315"
          new_start_allow_window="1305-1325"
          echo "should_run=1" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "trigger_classification=${event_name}" >> "$GITHUB_OUTPUT"
          echo "valid_window=${valid_window}" >> "$GITHUB_OUTPUT"
          echo "expected_start_window=${expected_start_window}" >> "$GITHUB_OUTPUT"
          echo "new_start_allow_window=${new_start_allow_window}" >> "$GITHUB_OUTPUT"
          echo "recovery_allow_window=1326-1340" >> "$GITHUB_OUTPUT"
          echo "late_level=NONE" >> "$GITHUB_OUTPUT"
          echo "degraded_session=0" >> "$GITHUB_OUTPUT"
          echo "recovery_mode=0" >> "$GITHUB_OUTPUT"
          echo "start_classification=WORKFLOW_DEFER_TO_RUNNER" >> "$GITHUB_OUTPUT"
          echo "[RESOLVE] event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} mode=${MODE}"
          echo "[RESOLVE] force_trade_session=${PB1_FORCE_TRADE_SESSION:-auto}"
          echo "[RESOLVE] am_recovery=${PB1_ENABLE_LATE_AM_RECOVERY:-0} am_recovery_until=${PB1_AM_RECOVERY_ALLOW_UNTIL:-unset}"
          echo "[RESOLVE] pm_recovery=${PB1_ENABLE_LATE_PM_RECOVERY:-0} pm_recovery_until=${PB1_PM_RECOVERY_ALLOW_UNTIL:-unset}"
          echo "[RESOLVE] force_am_late=${PB1_FORCE_TRADE_AM_LATE_START:-0} force_am_after_1030=${PB1_FORCE_TRADE_AM_AFTER_1030:-0}"
          echo "[RESOLVE] force_pm_late=${PB1_FORCE_TRADE_PM_LATE_START:-0} force_pm_after_1340=${PB1_FORCE_TRADE_PM_AFTER_1340:-0}"

      - name: Write PM trigger metadata
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          manual_restart=0
          if [[ "${{ steps.phase_guard.outputs.event_name }}" == "workflow_dispatch" || "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]]; then
            manual_restart=1
          fi
          {
            echo "[TRADE_PM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} trigger_classification=${{ steps.phase_guard.outputs.trigger_classification }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_PM][RESTART_HINT] workflow_run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} manual_restart=${manual_restart}"
            echo "[TRADE_PM][QUEUE_VISIBLE] expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }} now_kst=${{ steps.phase_guard.outputs.now_kst }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[TRADE_PM][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=${{ steps.phase_guard.outputs.valid_window }} expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }}"
          } | tee -a repo/artifacts/trade-pm.log

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          mkdir -p repo/artifacts
          manual_restart=0
          if [[ "${{ steps.phase_guard.outputs.event_name }}" == "workflow_dispatch" || "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]]; then
            manual_restart=1
          fi
          {
            echo "[TRADE_PM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} trigger_classification=${{ steps.phase_guard.outputs.trigger_classification }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_PM][RESTART_HINT] workflow_run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} manual_restart=${manual_restart}"
            echo "[TRADE_PM][QUEUE_VISIBLE] expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }} now_kst=${{ steps.phase_guard.outputs.now_kst }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[TRADE_PM][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=${{ steps.phase_guard.outputs.valid_window }} expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }}"
            echo "[TRADE_PM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason || 'none' }} event=${{ steps.phase_guard.outputs.event_name }} valid_window=${{ steps.phase_guard.outputs.valid_window }} recovery_mode=${{ steps.phase_guard.outputs.recovery_mode }} recovery_allow_window=${{ steps.phase_guard.outputs.recovery_allow_window }}"
            echo "[TRADE_PM][START_CLASSIFICATION] value=${{ steps.phase_guard.outputs.start_classification }} late_level=${{ steps.phase_guard.outputs.late_level }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }} recovery_mode=${{ steps.phase_guard.outputs.recovery_mode }}"
          } | tee repo/artifacts/trade-pm.log >/dev/null
          echo "[CHECKOUT][OK] repo path ready"

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[STEP][START] name=db_migrate session=pm" | tee -a artifacts/trade-pm.log
          if python -m trader.db.migrate 2>&1 | tee -a artifacts/trade-pm.log; then
            echo "[STEP][OK] name=db_migrate session=pm" | tee -a artifacts/trade-pm.log
          else
            echo "[STEP][FAIL] name=db_migrate session=pm" | tee -a artifacts/trade-pm.log
            exit 1
          fi

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          trap 'echo "[STEP][FAIL] name=verify_kis_env_contract session=pm" | tee -a artifacts/trade-pm.log' ERR

          echo "[STEP][START] name=verify_kis_env_contract session=pm" | tee -a artifacts/trade-pm.log

          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          echo "[ENV_CHECK] KIS_REST_URL=${KIS_REST_URL:-}"

          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }

          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }

          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }

          echo "[ENV_CHECK][OK] KIS env contract satisfied"
          trap - ERR
          echo "[STEP][OK] name=verify_kis_env_contract session=pm" | tee -a artifacts/trade-pm.log

      - name: Verify candidate pool exists in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[STEP][START] name=verify_candidate_pool session=pm" | tee -a artifacts/trade-pm.log
          echo "[TRADE_PM][PRECHECK][CANDIDATE_POOL][START]"
          if python -m trader.verify_candidate_pool; then
            echo "[TRADE_PM][PRECHECK][CANDIDATE_POOL][OK]"
            echo "[STEP][OK] name=verify_candidate_pool session=pm" | tee -a artifacts/trade-pm.log
          else
            echo "[TRADE_PM][PRECHECK][CANDIDATE_POOL][FAIL] reason=verify_candidate_pool_failed"
            echo "[STEP][FAIL] name=verify_candidate_pool session=pm" | tee -a artifacts/trade-pm.log
            exit 1
          fi

      - name: Verify final30 readiness in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[STEP][START] name=verify_final30_readiness session=pm" | tee -a artifacts/trade-pm.log
          echo "[TRADE_PM][PRECHECK][FINAL30][START]"
          if python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              as_of=ctx["as_of"],
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[TRADE_PM][PRECHECK][FINAL30][OK] rows={len(df)} as_of={ctx['as_of']}")
          PY
          then
            echo "[STEP][OK] name=verify_final30_readiness session=pm" | tee -a artifacts/trade-pm.log
          else
            echo "[TRADE_PM][PRECHECK][FINAL30][FAIL] reason=missing_db_exact_scored_final30"
            echo "[STEP][FAIL] name=verify_final30_readiness session=pm" | tee -a artifacts/trade-pm.log
            exit 1
          fi

      - name: Emit PM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_PM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} trigger_classification=${{ steps.phase_guard.outputs.trigger_classification }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_PM][QUEUE_VISIBLE] expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }} now_kst=${{ steps.phase_guard.outputs.now_kst }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[TRADE_PM][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=${{ steps.phase_guard.outputs.valid_window }} expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }}"
            echo "[TRADE_PM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason || 'none' }} event=${{ steps.phase_guard.outputs.event_name }} valid_window=${{ steps.phase_guard.outputs.valid_window }}"
            echo "[TRADE_PM][START_CLASSIFICATION] value=${{ steps.phase_guard.outputs.start_classification }} late_level=${{ steps.phase_guard.outputs.late_level }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=pm event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-pm.log

      - name: Run PM trade tick
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "[STEP][START] name=run_pm_trade_tick session=pm" | tee -a artifacts/trade-pm.log
          echo "[TRADE_PM][WINDOW] target=13:00-15:10 KST loop_minutes=${PB1_RUN_LOOP_MINUTES} interval_sec=${PB1_LOOP_INTERVAL_SEC}"
          echo "[TRADE_PM][CONFIG] MODE=trade STRATEGY_ENV=${STRATEGY_ENV} KIS_ENV=${KIS_ENV} FAIL_IF_POOL_MISSING=${FAIL_IF_POOL_MISSING} CANDIDATE_POOL_STRATEGY_KEY=${CANDIDATE_POOL_STRATEGY_KEY} PB1_PHASE_DEFAULT=${PB1_PHASE_DEFAULT:-}"
          echo "[PHASE][START] phase=pm" | tee artifacts/trade-pm.log
          if python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-pm.log; then
            echo "[STEP][OK] name=run_pm_trade_tick session=pm" | tee -a artifacts/trade-pm.log
          else
            echo "[STEP][FAIL] name=run_pm_trade_tick session=pm" | tee -a artifacts/trade-pm.log
            exit 1
          fi
          echo "[PHASE][END] phase=pm" | tee -a artifacts/trade-pm.log

      - name: Verify PM trade tick logs
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          trap 'echo "[STEP][FAIL] name=verify_pm_logs session=pm" | tee -a artifacts/trade-pm.log' ERR
          echo "[STEP][START] name=verify_pm_logs session=pm" | tee -a artifacts/trade-pm.log
          missing=0
          for pattern in "\[TRADE_PM\]\[TRIGGER\]" "\[TRADE_PM\]\[QUEUE_VISIBLE\]" "\[TRADE_PM\]\[START_META\]" "\[TRADE_PM\]\[PHASE_GUARD\]" "\[TRADE_PM\]\[START_CLASSIFICATION\]"; do
            if ! grep -E "$pattern" artifacts/trade-pm.log >/dev/null; then
              echo "::error::missing metadata pattern: $pattern"
              missing=1
            fi
          done
          if ! grep -E "\[RUN_SUMMARY\]\[RESULT\]" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing [RUN_SUMMARY][RESULT]"
            grep -E "\[RUN_SUMMARY\]\[(FAIL|GENERATE_FAIL)\]|\[TRADE\]\[BOOT\]\[START\]" artifacts/trade-pm.log || true
            exit 1
          fi
          result_status="$(grep -Eo '\[RUN_SUMMARY\]\[RESULT\] status=[A-Z_]+' artifacts/trade-pm.log | tail -n 1 | sed 's/.*status=//')"
          if [[ "$result_status" == "SKIP_PHASE_WINDOW" ]]; then
            echo "::notice::PM phase window skip recorded"
            exit 0
          fi
          if grep -F "operator does not exist: text >= timestamp with time zone" artifacts/trade-pm.log >/dev/null; then
            echo "::error::runs.started_at text/timestamptz schema mismatch still present"
            exit 1
          fi
          if [[ "$result_status" == "FATAL_RUNTIME" || "$result_status" == "FATAL_POSTPROCESS" ]]; then
            echo "::error::PM fatal runtime/postprocess recorded"
            grep -E "\[RUN_SUMMARY\]\[RESULT\] status=(FATAL_RUNTIME|FATAL_POSTPROCESS)|\[PB1\]\[EXIT\] reason=fatal_runtime|\[PB1\]\[FATAL_GUARD\]" artifacts/trade-pm.log || true
            exit 1
          fi
          fatal_count="$(grep -Ec '\[RUN_SUMMARY\]\[RESULT\] status=(FATAL_RUNTIME|FATAL_POSTPROCESS)' artifacts/trade-pm.log || true)"
          timeout_count="$(grep -Ec 'TickTimeoutError|tick_hard_timeout' artifacts/trade-pm.log || true)"
          db_autocommit_count="$(grep -Ec "can't change 'autocommit' now|connection in transaction status ACTIVE" artifacts/trade-pm.log || true)"
          degraded_count="$(grep -Ec 'DEGRADED_POSTPROCESS|\[PB1\]\[POSTPROCESS\]\[DEGRADED\]' artifacts/trade-pm.log || true)"
          echo "[TRADE_PM][VERIFY][COUNTS] fatal_count=${fatal_count} timeout_count=${timeout_count} db_autocommit_count=${db_autocommit_count} degraded_count=${degraded_count}"
          if [[ "$db_autocommit_count" -gt 0 ]]; then
            echo "::error::DB autocommit transaction ACTIVE error detected"
            exit 1
          fi
          if [[ "$fatal_count" -gt 0 ]]; then
            echo "::error::PM internal fatal result detected"
            exit 1
          fi
          if ! grep -E "\[PB1\]\[RUN_ONCE\]\[FAIL_OPEN_FLAG\]" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing [PB1][RUN_ONCE][FAIL_OPEN_FLAG]"
            missing=1
          fi
          if ! grep -E "\[PB1\]\[LOOP\]\[SESSION\] kind=pm" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing [PB1][LOOP][SESSION] kind=pm"
            missing=1
          fi
          if ! grep -E "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing [TRADE][FINAL30][DB_EXACT_LOAD]"
            grep -E "\[TRADE\]\[FINAL30\]\[(DB_FALLBACK_LOAD|FAIL|LOAD_FAIL)\]" artifacts/trade-pm.log || true
            missing=1
          fi
          if ! grep -E "\[TRADE\]\[READY\]\[OK\]" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing [TRADE][READY][OK]"
            grep -E "\[TRADE\]\[READY\]\[FAIL\]|\[TRADE\]\[PRECHECK\]\[(CANDIDATE_POOL|FINAL30|BALANCE)\]" artifacts/trade-pm.log || true
            missing=1
          fi
          if ! grep -E "\[PB1\]\[POST_CAPITAL\]\[START\]" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing [PB1][POST_CAPITAL][START]"
            missing=1
          fi
          if ! grep -E "\[PB1\]\[TICK\]\[DONE\]|\[PB1\]\[TICK_TIMEOUT\]|\[RUN_SUMMARY\]\[RESULT\]" artifacts/trade-pm.log >/dev/null; then
            echo "::error::PM tick appears stuck before terminal tick result"
            missing=1
          fi
          if grep -E "\[PB1\]\[STAGE_TIMEOUT\] stage=post_capital\.exit_pass" artifacts/trade-pm.log >/dev/null; then
            echo "::notice::PM exit pass timeout observed"
            if ! grep -E "\[PB1\]\[POST_CAPITAL\]\[EXIT_PASS\]\[(TIMEOUT|DEGRADED)\]" artifacts/trade-pm.log >/dev/null; then
              echo "::error::exit pass timeout missing degraded diagnostics"
              missing=1
            fi
          fi
          if grep -E "\[PB1\]\[STAGE_TIMEOUT\] stage=post_capital\.exit_holdings_prep" artifacts/trade-pm.log >/dev/null; then
            echo "::error::PM hang detected in exit_holdings_prep"
            missing=1
          fi
          if ! grep -E "\[PB1\]\[LOOP\]\[SESSION_END_RELEASE\]|\[PB1\]\[LOOP\] session end reached -> exit|\[PB1\]\[EXIT\] reason=session_end" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing clean PM session release log"
            missing=1
          fi
          test "$missing" -eq 0
          trap - ERR
          echo "[STEP][OK] name=verify_pm_logs session=pm" | tee -a artifacts/trade-pm.log

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload debug PM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trade-pm-logs
          path: repo/artifacts/
          if-no-files-found: ignore

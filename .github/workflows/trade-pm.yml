# DISABLED: trade-pm은 trade-afternoon으로 통합되었습니다.
# PM + Close 실행은 trade-afternoon.yml에서 처리합니다.
# 이 워크플로우는 legacy 호환성만을 위해 보관되며 실행되지 않아야 합니다.
# session_kind=pm은 내부에서 afternoon으로 normalize됩니다.
# Do not dispatch this workflow from trade-watchdog.yml or any automation.
name: "Trade PM (DISABLED - use trade-afternoon)"

"on":
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice
      CONFIRM_MANUAL_PM:
        description: "Type RUN_PM_MANUAL to run PM manually"
        required: false
        default: ""

concurrency:
  group: trade-pm-practice-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODE: trade
  PB1_SESSION_KIND: "afternoon"  # legacy pm -> afternoon normalize
  PB1_FORCE_TRADE_SESSION: "afternoon"

  FORCE_MARKET_WINDOW: "afternoon"
  FORCE_PB1_PHASE: "entry"
  PB1_PHASE_DEFAULT: "entry"

  PB1_PREWARM_ENABLED: "1"
  PB1_TARGET_START_TIME: "13:00"
  PB1_START_ALLOW_UNTIL: "13:10"
  PB1_LOOP_ENABLED: "1"
  PB1_RUN_LOOP_MINUTES: "130"
  PB1_LOOP_INTERVAL_SEC: "60"
  PB1_PM_SESSION_END: "15:10"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  PB1_TICK_HARD_TIMEOUT_SEC: "90"

  STRATEGY_MODE: "LIVE"
  FORCE_STRATEGY_MODE: "LIVE"
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "0"
  LIVE_TRADING_ENABLED: "1"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"

  STRATEGY_ENV: practice
  KIS_ENV: practice
  FINAL30_SOURCE_MODE: "db_only"
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"

  PB1_REQUIRE_ENTRY_EXIT_PLAN: "1"
  PB1_ALLOW_STYLE_MAPPED_ENTRY_EXIT_PLAN: "1"
  PB1_EXIT_ROUTER_ENABLED: "1"
  PB1_PLAN_DEFAULT_ATR_STOP_PCT: "3.0"
  PB1_MOMENTUM_TP1_R: "1.5"
  PB1_MOMENTUM_TP2_R: "2.5"
  PB1_MOMENTUM_PROFIT_ACTIVATE_PCT: "5.0"
  PB1_MOMENTUM_PROFIT_GIVEBACK_PCT: "2.0"
  PB1_SWING_TP1_R: "2.0"
  PB1_SWING_TP2_R: "3.0"
  PB1_SWING_TP1_PROFIT_PCT: "12.0"
  PB1_SWING_TP2_PROFIT_PCT: "18.0"
  PB1_SWING_TP1_SELL_PCT: "0.33"
  PB1_SWING_TP2_SELL_PCT: "0.33"
  PB1_SWING_PROFIT_ACTIVATE_PCT: "8.0"
  PB1_SWING_PROFIT_GIVEBACK_PCT: "3.0"
  PB1_SWING_PROFIT_FLOOR_PCT: "5.0"
  PB1_SWING_TIME_STOP_DAYS: "10"
  PB1_CORE_TP1_PROFIT_PCT: "20.0"
  PB1_CORE_TP2_PROFIT_PCT: "30.0"
  PB1_CORE_TP1_SELL_PCT: "0.25"
  PB1_CORE_TP2_SELL_PCT: "0.25"
  PB1_CORE_TIME_STOP_DAYS: "20"

  PB1_ENABLE_LATE_PM_RECOVERY: "0"
  PB1_FORCE_TRADE_PM_LATE_START: "0"
  PB1_FORCE_TRADE_PM_AFTER_1340: "0"

  # [2026-05-18] DB 타임아웃 — TickTimeoutError 방지
  PB1_MARKET_SCOPE: "KRX"
  MARKET: "KR"
  EXCHANGE: "KRX"

  DB_CONNECT_TIMEOUT: "15"
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  DB_READ_LOCK_TIMEOUT_MS: "5000"
  DB_READ_STATEMENT_TIMEOUT_MS: "12000"

  KRX_DB_READ_FAIL_OPEN: "1"
  KRX_RECONCILE_FAIL_OPEN: "1"

  PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"
  PB1_FAIL_OPEN_ON_POSITION_LOOKUP_TIMEOUT: "1"
  PB1_FAIL_OPEN_ON_FILL_LOOKUP_TIMEOUT: "1"
  PB1_FAIL_OPEN_ON_LEDGER_LOOKUP_TIMEOUT: "1"

  # [2026-05-18] PB1 KR-only adaptive entry filter
  PB1_KR_ADAPTIVE_ENTRY_FILTER: "1"
  PB1_KR_PULLBACK_VOL_HARD_FAIL: "0"
  PB1_KR_PULLBACK_VOLU_HARD_FAIL: "0"
  PB1_KR_PULLBACK_VOL_PENALTY: "8"
  PB1_KR_PULLBACK_VOLU_PENALTY: "5"
  PB1_KR_MOMENTUM_ALLOW_VOL_EXPANSION: "1"
  PB1_KR_BREAKOUT_ALLOW_VOL_EXPANSION: "1"
  PB1_KR_SCORE_MODE: "ADAPTIVE_RANK"
  PB1_KR_ADAPTIVE_RANK_TOPN: "5"
  PB1_KR_ADAPTIVE_SCORE_MIN_FLOOR: "38"
  PB1_KR_ENABLE_RESCUE_CANDIDATES: "1"
  PB1_KR_RESCUE_TOPN: "3"
  PB1_KR_RESCUE_SOURCE: "SCANNER_OR_MINERVINI"
  PB1_KR_MARKET_STRESS_GUARD: "1"
  PB1_KR_STRESS_VOL_FAIL_RATIO: "0.70"
  PB1_KR_STRESS_MA20_FAIL_RATIO: "0.40"
  PB1_KR_STRESS_MAX_NEW_POSITIONS: "1"
  PB1_KR_STRESS_TICK_BUDGET_PCT: "0.15"
  PB1_KR_STRESS_REQUIRE_STRONG_RS: "1"
  PB1_KR_STRESS_MIN_RS_PCTILE: "0.85"
  PB1_KR_LOG_FILTER_MATRIX: "1"
  PB1_KR_LOG_RESCUE_DECISION: "1"

defaults:
  run:
    shell: bash

jobs:
  trade_pm:
    runs-on: ubuntu-latest
    timeout-minutes: 175

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Branch guard
        run: |
          set -euo pipefail
          EXPECTED_BRANCH="dual-agent"
          echo "[BRANCH_GUARD] event=${GITHUB_EVENT_NAME:-} actor=${GITHUB_ACTOR:-} ref_name=${GITHUB_REF_NAME:-} expected=${EXPECTED_BRANCH}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "::error::Wrong branch. expected=${EXPECTED_BRANCH}, actual=${GITHUB_REF_NAME}"
            echo "[BRANCH_GUARD][FAIL] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "[BRANCH_GUARD][OK] branch=${GITHUB_REF_NAME}"

      - name: Resolve PM phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          prewarm_min=$((12 * 60 + 45))
          target_start_min=$((13 * 60))
          allow_until_min=$((13 * 60 + 10))
          session_end_min=$((15 * 60 + 10))

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -gt "$allow_until_min" ]]; then
              should_run=0
              skip_reason="skip_stale_start_pm"
            elif [[ "$now_min" -lt "$target_start_min" ]]; then
              wait_until_target=1
              wait_seconds=$(( (target_start_min - now_min) * 60 ))
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.CONFIRM_MANUAL_PM || '' }}"
            if [[ "$confirm" != "RUN_PM_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_pm_not_confirmed"
            elif [[ "$now_min" -gt $((13 * 60 + 40)) ]]; then
              should_run=0
              skip_reason="manual_pm_after_1340_blocked"
            fi
          fi

          echo "[TRADE_PM][PHASE_GUARD_DEBUG] now_min=${now_min} target_start_min=${target_start_min} allow_until_min=${allow_until_min} wait_seconds=${wait_seconds}"

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_min=${now_min}" >> "$GITHUB_OUTPUT"
          echo "target_start_min=${target_start_min}" >> "$GITHUB_OUTPUT"
          echo "allow_until_min=${allow_until_min}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "valid_window=1300-1510" >> "$GITHUB_OUTPUT"
          echo "start_allow_window=1300-1310" >> "$GITHUB_OUTPUT"
          echo "session_end=1510" >> "$GITHUB_OUTPUT"

      - name: Emit PM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_PM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_PM][START_META] prewarm_start=1245 target_start=1300 actual_start=${{ steps.phase_guard.outputs.now_kst }} start_allow_until=1310 session_end=1510 wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }}"
            echo "[TRADE_PM][PHASE_GUARD] should_run=0 skip_reason=${{ steps.phase_guard.outputs.skip_reason }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=pm"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-pm.log

      - name: Resolve trading-day guard
        id: trading_day_guard
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          dow="$(TZ=Asia/Seoul date +%u)"  # 1=Mon ... 7=Sun
          is_trading_day=1
          reason=""

          if [[ "$dow" -ge 6 ]]; then
            is_trading_day=0
            reason="weekend"
          fi

          echo "is_trading_day=${is_trading_day}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

          echo "[TRADING_DAY_GUARD] is_trading_day=${is_trading_day} reason=${reason}"

      - name: Resolve order mode guard
        id: order_mode_guard
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          is_trading_day="${{ steps.trading_day_guard.outputs.is_trading_day }}"
          if [[ "$is_trading_day" == "1" ]]; then
            order_allowed=1
            reason=""
          else
            order_allowed=0
            reason="non_trading_day"
          fi
          echo "order_allowed=${order_allowed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "[TRADE_PM][ORDER_MODE] order_allowed=${order_allowed} reason=${reason}"

      - name: Wait until target start
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: .
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=1800

          if [[ "$wait_seconds" -lt 0 ]]; then
            wait_seconds=0
          fi

          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds}"
            exit 1
          fi

          echo "[WAIT_UNTIL_TARGET][START] session=pm wait_seconds=${wait_seconds}"
          sleep "$wait_seconds"
          echo "[WAIT_UNTIL_TARGET][DONE] session=pm now_kst=$(TZ=Asia/Seoul date +%H%M%S)"

      - name: Verify target time reached
        id: target_time_check
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          target_min="${{ steps.phase_guard.outputs.target_start_min }}"

          if [[ "$now_min" -lt "$target_min" ]]; then
            echo "::error::target start time not reached after wait now_min=${now_min} target_min=${target_min}"
            exit 1
          fi

          echo "[TARGET_TIME_CHECK][OK] session=pm now_min=${now_min} target_min=${target_min}"

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          echo "[CHECKOUT][OK] repo path ready"

      - name: Initialize PM trigger log
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_PM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_PM][START_META] prewarm_start=1245 target_start=1300 actual_start=${{ steps.phase_guard.outputs.now_kst }} start_allow_until=1310 session_end=1510 wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }}"
            echo "[TRADE_PM][PHASE_GUARD] should_run=1 skip_reason= event=${{ steps.phase_guard.outputs.event_name }} valid_window=1300-1510"
            echo "[TRADE_PM][TRADING_DAY_GUARD] is_trading_day=${{ steps.trading_day_guard.outputs.is_trading_day }} reason=${{ steps.trading_day_guard.outputs.reason }}"
            echo "[TRADE_PM][ORDER_MODE] order_allowed=${{ steps.order_mode_guard.outputs.order_allowed }} reason=${{ steps.order_mode_guard.outputs.reason }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/trade-pm.log

      - name: Emit non trading day summary
        if: steps.phase_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day != '1'
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "[RUN_SUMMARY][RESULT] status=OK_COMPUTE_ONLY reason=NON_TRADING_DAY session=pm"
            echo "[PB1][EXIT] reason=non_trading_day_compute_only"
          } | tee -a repo/artifacts/trade-pm.log

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.db.migrate 2>&1 | tee -a artifacts/trade-pm.log

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }
          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Verify exact scored final30 in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              as_of=ctx["as_of"],
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[TRADE][FINAL30][DB_EXACT_LOAD] rows={len(df)} as_of={ctx['as_of']} session=pm")
          PY

      - name: Run PM trade loop
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        env:
          ORDER_ALLOWED: ${{ steps.order_mode_guard.outputs.order_allowed }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          PB1_ORDER_BLOCK_REASON: ${{ steps.order_mode_guard.outputs.reason }}
          NO_TRADE: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          DISABLE_LIVE_TRADING: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          LIVE_TRADING_ENABLED: ${{ steps.trading_day_guard.outputs.is_trading_day }}
          KIS_HTTP_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "[PHASE][START] phase=pm session_window=1300-1510" | tee -a artifacts/trade-pm.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-pm.log
          echo "[PHASE][END] phase=pm" | tee -a artifacts/trade-pm.log

      - name: Verify PM log contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          missing=0
          for pattern in \
            "\[TRADE_PM\]\[TRIGGER\]" \
            "\[TRADE_PM\]\[START_META\]" \
            "\[TRADE_PM\]\[PHASE_GUARD\]" \
            "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" \
            "\[TRADE\]\[READY\]\[OK\]" \
            "\[RUN_SUMMARY\]\[RESULT\]"; do
            if ! grep -E "$pattern" artifacts/trade-pm.log >/dev/null; then
              echo "::error::missing required log pattern: $pattern"
              missing=1
            fi
          done
          if ! grep -E "\[PB1\]\[EXIT\] reason=session_end|\[PB1\]\[LOOP\] session end reached -> exit" artifacts/trade-pm.log >/dev/null; then
            echo "::error::missing clean session_end exit log"
            missing=1
          fi
          if grep -F "Traceback" artifacts/trade-pm.log >/dev/null; then
            echo "::error::Traceback detected in PM log"
            missing=1
          fi
          if grep -F "FATAL_RUNTIME" artifacts/trade-pm.log >/dev/null; then
            echo "::error::FATAL_RUNTIME detected in PM log"
            missing=1
          fi
          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload debug PM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trade-pm-logs
          path: repo/artifacts/
          if-no-files-found: ignore

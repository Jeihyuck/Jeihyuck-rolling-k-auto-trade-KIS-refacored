name: KR-US Settlement Contract CI

on:
  pull_request:
    branches:
      - dual-agent
      - fix/kr-20261006-execution-convergence
      - stabilize/06-shared-settlement-ledger-20261006
      - stabilize/07-kr-us-settlement-shadow-20261006
  push:
    branches:
      - stabilize/06-shared-settlement-ledger-20261006
      - stabilize/07-kr-us-settlement-shadow-20261006
      - stabilize/08-kr-us-settlement-release-gates-20261006
  workflow_dispatch:

jobs:
  settlement-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: settlement_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d settlement_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: "."
      KIS_ENV: "practice"
      STRATEGY_ENV: "practice"
      KIS_HTTP_ENABLED: "0"
      NO_TRADE: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      NULLIM_SETTLEMENT_SHADOW_ENABLED: "0"
      NULLIM_SETTLEMENT_WRITER_ENABLED: "0"
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/settlement_ci

    steps:
      - name: Checkout under test
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile settlement and adapters
        run: |
          python -m compileall -q trader/settlement
          python -m py_compile trader/reconcile_kis.py trader/us/execution/reconcile.py
      - name: Settlement SQLite and PostgreSQL tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_shared_settlement_ledger.py tests/test_shared_settlement_postgres.py
          if [ -f tests/test_kr_us_settlement_shadow.py ]; then python -m pytest -q tests/test_kr_us_settlement_shadow.py; fi
          if [ -f tests/test_settlement_release_gates.py ]; then python -m pytest -q tests/test_settlement_release_gates.py; fi

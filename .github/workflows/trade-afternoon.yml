defaults:
  run:
    shell: bash

jobs:
  trade_afternoon:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Branch guard
        run: |
          set -euo pipefail
          echo "[BRANCH_GUARD] event=${GITHUB_EVENT_NAME:-} actor=${GITHUB_ACTOR:-} ref=${GITHUB_REF:-} ref_name=${GITHUB_REF_NAME:-} sha=${GITHUB_SHA:-}"
          echo "[BRANCH_GUARD] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "::error::Wrong branch execution blocked. expected=${EXPECTED_BRANCH}, actual=${GITHUB_REF_NAME}"
            echo "[BRANCH_GUARD][FAIL] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "[BRANCH_GUARD][OK] branch=${GITHUB_REF_NAME} sha=${GITHUB_SHA:-}"

      - name: Resolve afternoon boot guard
        id: boot_guard
        working-directory: .
        run: |
          set -euo pipefail

          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_s="$(TZ=Asia/Seoul date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          now_hhmmss="$(TZ=Asia/Seoul date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          schedule_expected_min=$((12 * 60 + 15))
          pm_target_min=$((13 * 60))
          pm_allow_until_min=$((13 * 60 + 30))
          pm_end_min=$((15 * 60 + 10))
          close_target_min=$((15 * 60 + 15))
          close_allow_until_min=$((15 * 60 + 30))
          close_end_min=$((15 * 60 + 30))

          delay_seconds=$(( (now_min - schedule_expected_min) * 60 + 10#$now_s ))
          if [[ "$delay_seconds" -lt 0 ]]; then
            delay_seconds=0
          fi

          should_run=1
          skip_reason=""
          route="normal"

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.CONFIRM_MANUAL_AFTERNOON || '' }}"
            manual_mode="${{ inputs.AFTERNOON_MANUAL_MODE || 'compute_only' }}"
            if [[ "$confirm" != "RUN_AFTERNOON_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_afternoon_not_confirmed"
            fi
            route="$manual_mode"
          fi

          # 전체 close 종료 이후에 시작한 경우만 전체 skip.
          # PM target보다 늦게 시작했다고 전체 skip하지 말 것.
          # 늦게 시작해도 Close라도 살리는 것이 목적이다.
          if [[ "$event_name" == "schedule" && "$now_min" -gt "$close_end_min" ]]; then
            should_run=0
            skip_reason="skip_afternoon_after_close_end"
          fi

          echo "[TRADE_AFTERNOON][BOOT_GUARD] event=${event_name} should_run=${should_run} skip_reason=${skip_reason} now_kst=${now_hhmmss} schedule_expected=1215 delay_seconds=${delay_seconds} route=${route}"
          echo "[TRADE_AFTERNOON][QUEUE_META] event=${GITHUB_EVENT_NAME} run_id=${GITHUB_RUN_ID} run_attempt=${GITHUB_RUN_ATTEMPT} actor=${GITHUB_ACTOR} workflow=${GITHUB_WORKFLOW} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          echo "[TRADE_AFTERNOON][CONCURRENCY_META] group=trade-afternoon-practice-${GITHUB_REF_NAME} cancel_in_progress=false"
          echo "[TRADE_AFTERNOON][START_META] schedule_expected=1215 actual_start=${now_hhmmss} delay_seconds=${delay_seconds} event=${event_name}"
          if [[ "$event_name" == "workflow_dispatch" ]]; then
            echo "[TRADE_AFTERNOON][MANUAL_RUN] actor=${GITHUB_ACTOR} route=${route} confirm=${confirm:-}"
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "now_min=${now_min}" >> "$GITHUB_OUTPUT"
          echo "delay_seconds=${delay_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "route=${route}" >> "$GITHUB_OUTPUT"
          echo "pm_target_min=${pm_target_min}" >> "$GITHUB_OUTPUT"
          echo "pm_allow_until_min=${pm_allow_until_min}" >> "$GITHUB_OUTPUT"
          echo "pm_end_min=${pm_end_min}" >> "$GITHUB_OUTPUT"
          echo "close_target_min=${close_target_min}" >> "$GITHUB_OUTPUT"
          echo "close_allow_until_min=${close_allow_until_min}" >> "$GITHUB_OUTPUT"
          echo "close_end_min=${close_end_min}" >> "$GITHUB_OUTPUT"

      - name: Emit afternoon skip summary
        if: steps.boot_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AFTERNOON][TRIGGER] event=${{ steps.boot_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AFTERNOON][START_META] schedule_expected=1215 actual_start=${{ steps.boot_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.boot_guard.outputs.delay_seconds }}"
            echo "[TRADE_AFTERNOON][BOOT_GUARD] should_run=0 skip_reason=${{ steps.boot_guard.outputs.skip_reason }}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_AFTERNOON_WINDOW reason=${{ steps.boot_guard.outputs.skip_reason }}"
            echo "[PB1][EXIT] reason=afternoon_boot_guard_skip"
          } | tee repo/artifacts/trade-afternoon.log

      - name: Checkout
        if: steps.boot_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          ref: dual-agent
          path: repo
          fetch-depth: 1

      - name: Verify checkout path and initialize log
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; ls -la repo || true; exit 1; }
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AFTERNOON][TRIGGER] event=${{ steps.boot_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AFTERNOON][START_META] schedule_expected=1215 actual_start=${{ steps.boot_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.boot_guard.outputs.delay_seconds }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/trade-afternoon.log

      - name: Resolve trading-day guard
        id: trading_day_guard
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          dow="$(TZ=Asia/Seoul date +%u)"
          today_kst="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          is_trading_day=1
          reason=""

          if [[ "$dow" -ge 6 ]]; then
            is_trading_day=0
            reason="weekend"
          fi

          # KRX 휴장일 체크 (inline 목록)
          if [[ "$is_trading_day" == "1" ]]; then
            KRX_HOLIDAYS_2025="2025-01-01 2025-01-27 2025-01-28 2025-01-29 2025-01-30 2025-03-03 2025-05-05 2025-05-06 2025-06-06 2025-08-15 2025-10-03 2025-10-06 2025-10-07 2025-10-08 2025-10-09 2025-12-25 2025-12-31"
            KRX_HOLIDAYS_2026="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-05 2026-05-25 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
            KRX_HOLIDAYS_2027="2027-01-01 2027-02-08 2027-02-09 2027-02-10 2027-03-01 2027-05-05 2027-05-13 2027-06-07 2027-08-16 2027-09-20 2027-09-21 2027-09-22 2027-10-04 2027-12-27 2027-12-31"
            ALL_HOLIDAYS="${KRX_HOLIDAYS_2025} ${KRX_HOLIDAYS_2026} ${KRX_HOLIDAYS_2027}"
            for h in $ALL_HOLIDAYS; do
              if [[ "$today_kst" == "$h" ]]; then
                is_trading_day=0
                reason="krx_holiday"
                echo "[TIME][KRX][HOLIDAY] date=${today_kst} reason=KRX_HOLIDAY source=workflow_inline" | tee -a repo/artifacts/trade-afternoon.log
                break
              fi
            done
          fi

          echo "is_trading_day=${is_trading_day}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "today_kst=${today_kst}" >> "$GITHUB_OUTPUT"
          echo "[TRADING_DAY_GUARD] is_trading_day=${is_trading_day} reason=${reason} date=${today_kst}" | tee -a repo/artifacts/trade-afternoon.log

      - name: Set up Python
        if: steps.boot_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.db.migrate 2>&1 | tee -a artifacts/trade-afternoon.log

      - name: Verify KIS env contract
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }
          echo "[ENV_CHECK][OK] KIS env contract satisfied" | tee -a artifacts/trade-afternoon.log

      - name: Verify exact scored final30 in DB with provenance check
        id: verify_final30
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set +e
          python - <<'PY' 2>&1 | tee -a artifacts/trade-afternoon.log
          import os, sys
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, is_krx_trading_day, resolve_prev_krx_trading_day

          env = os.getenv("STRATEGY_ENV", "practice")
          expected_branch = os.getenv("EXPECTED_BRANCH", "dual-agent")
          today = now_kst().date()
          as_of_override = (os.getenv("AS_OF_OVERRIDE") or "").strip()

          if as_of_override:
              from datetime import date
              expected_as_of = date.fromisoformat(as_of_override)
          else:
              expected_as_of = resolve_prev_krx_trading_day(today)

          expected_as_of_str = expected_as_of.isoformat()
          output_path = os.getenv("GITHUB_OUTPUT", "")

          def _write_output(name, value):
              if output_path:
                  with open(output_path, "a") as f:
                      f.write(f"{name}={value}\n")

          if not is_krx_trading_day(today):
              print(f"[TRADE_AFTERNOON][PREP_VERIFY][NON_TRADING] today={today} is_krx_trading_day=0")
              _write_output("prep_ready", "0")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", "0")
              _write_output("skip_reason", "NON_TRADING_DAY")
              _write_output("late_start_no_buy", "0")
              sys.exit(0)

          try:
              df = load_final30_scored_db_only(
                  get_engine(),
                  env=env,
                  strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
                  as_of=expected_as_of_str,
                  require_exact_rows=30,
                  fail_if_missing=False,
              )
              rows = len(df) if df is not None and not df.empty else 0
          except Exception as exc:
              print(f"[TRADE_AFTERNOON][PREP_VERIFY][FAIL] expected_as_of={expected_as_of_str} err={exc}")
              _write_output("prep_ready", "0")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", "0")
              _write_output("skip_reason", f"DB_ERROR:{type(exc).__name__}")
              _write_output("late_start_no_buy", "0")
              sys.exit(0)

          # Provenance check
          prep_branch = ""
          prep_done = 0
          try:
              from trader.db.repos import LedgerEventsRepo
              repo = LedgerEventsRepo(get_engine())
              ev = repo.get_prep_done_event(env=env, as_of=expected_as_of_str)
              if ev:
                  prep_done = 1
                  prep_branch = str((ev.get("payload_json") or {}).get("producer_branch", ""))
          except Exception as exc:
              print(f"[TRADE_AFTERNOON][PREP_DONE_CHECK][FAIL] err={exc}")

          print(f"[TRADE_AFTERNOON][PREP_PROVENANCE][CHECK] expected_branch={expected_branch} final30_branch={prep_branch} prep_done={prep_done}")

          provenance_ok = True
          if rows == 30 and prep_done == 1 and prep_branch and prep_branch != expected_branch:
              print(f"[TRADE_AFTERNOON][PREP_PROVENANCE][FAIL] reason=PREP_PROVENANCE_MISMATCH expected={expected_branch} actual={prep_branch}")
              print(f"[TRADE_AFTERNOON][ORDER_BLOCKED] reason=PREP_PROVENANCE_MISMATCH")
              provenance_ok = False

          # Late start check (warn-only): late starts must never disable PM entry before close window.
          from datetime import datetime
          from zoneinfo import ZoneInfo
          KST = ZoneInfo("Asia/Seoul")
          now_dt = datetime.now(KST)
          now_hhmm = now_dt.strftime("%H:%M")
          entry_allow_until = os.getenv("PM_ENTRY_ALLOW_UNTIL", "13:30")
          schedule_expected = os.getenv("AFTERNOON_PREWARM_START_TIME", "12:15")
          now_min = now_dt.hour * 60 + now_dt.minute
          exp_h, exp_m = map(int, schedule_expected.split(":"))
          expected_min = exp_h * 60 + exp_m
          delay_seconds = max(0, (now_min - expected_min) * 60)
          allow_h, allow_m = map(int, entry_allow_until.split(":"))
          allow_min = allow_h * 60 + allow_m
          late_start = now_min > allow_min
          close_window = now_hhmm >= "15:10"
          late_start_no_buy = 0
          late_start_reason = "TIME_WINDOW_OK"
          if late_start:
              late_start_reason = "LATE_START_WARN_ONLY"
              print(f"[TRADE_AFTERNOON][LATE_START_ALLOWED] schedule_expected={schedule_expected} actual_start={now_hhmm} delay_seconds={delay_seconds} action=warn_only entry_enabled={0 if close_window else 1}")
              print(f"[TRADE_AFTERNOON][ENTRY_ALLOW_UNTIL_PASSED][WARN_ONLY] now={now_hhmm} allow_until={entry_allow_until} entry_still_enabled={0 if close_window else 1}")
          else:
              print(f"[TRADE_AFTERNOON][LATE_START_CHECK] now={now_hhmm} allow_until={entry_allow_until} late=0 action=entry_allowed")
          if close_window:
              late_start_no_buy = 1
              late_start_reason = "close_window"

          if not provenance_ok:
              if env == "practice":
                  print(f"[TRADE_AFTERNOON][PREP_NOT_READY][POLICY] env=practice action=PNL_ONLY_EXIT_0")
              _write_output("prep_ready", "0")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", str(rows))
              _write_output("skip_reason", "PREP_PROVENANCE_MISMATCH")
              _write_output("late_start_no_buy", str(late_start_no_buy))
              if env != "practice":
                  sys.exit(1)
              sys.exit(0)

          if rows == 30:
              print(f"[TRADE_AFTERNOON][PREP_VERIFY][OK] expected_as_of={expected_as_of_str} rows={rows}")
              print(f"[TRADE_AFTERNOON][PREP_PROVENANCE][OK] branch={expected_branch} as_of={expected_as_of_str}")
              _write_output("prep_ready", "1")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", str(rows))
              _write_output("skip_reason", "OK")
          else:
              print(f"[TRADE_AFTERNOON][PREP_VERIFY][FAIL] expected_as_of={expected_as_of_str} rows={rows} (expected 30)")
              _write_output("prep_ready", "0")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", str(rows))
              _write_output("skip_reason", f"FINAL30_NOT_FOUND:rows={rows}")
          _write_output("late_start_no_buy", str(late_start_no_buy))
          _write_output("late_start_reason", late_start_reason)
          PY

      - name: Wait until PM target start
        if: steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          pm_target_min=$((13 * 60))
          max_wait_seconds=3600

          if [[ "$now_min" -lt "$pm_target_min" ]]; then
            wait_seconds=$(( (pm_target_min - now_min) * 60 ))

            if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
              echo "::error::pm wait_seconds too large: ${wait_seconds} max_wait_seconds=${max_wait_seconds}" | tee -a artifacts/trade-afternoon.log
              exit 1
            fi

            echo "[WAIT_UNTIL_PM][START] wait_seconds=${wait_seconds} max_wait_seconds=${max_wait_seconds}" | tee -a artifacts/trade-afternoon.log
            sleep "$wait_seconds"
            echo "[WAIT_UNTIL_PM][DONE] now_kst=$(TZ=Asia/Seoul date +%H%M%S)" | tee -a artifacts/trade-afternoon.log
          else
            echo "[WAIT_UNTIL_PM][SKIP] already_after_pm_target now_min=${now_min}" | tee -a artifacts/trade-afternoon.log
          fi

      - name: Run PM entry loop
        id: pm_loop
        if: ${{ always() && steps.boot_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1' && (steps.verify_final30.outputs.prep_ready == '1' || steps.verify_final30.outputs.final30_rows == '30') }}
        continue-on-error: true
        timeout-minutes: 135
        working-directory: repo
        env:
          PB1_SESSION_KIND: "afternoon"
          PB1_FORCE_TRADE_SESSION: "afternoon"
          FORCE_MARKET_WINDOW: "afternoon"
          FORCE_PB1_PHASE: "pm_entry"
          PB1_PHASE_DEFAULT: "pm_entry"
          PB1_ENTRY_ENABLED: "1"
          PB1_TARGET_START_TIME: "13:00"
          PB1_START_ALLOW_UNTIL: "13:30"
          PB1_PM_SESSION_END: "15:10"
          PB1_RUN_LOOP_MINUTES: "130"
          PB1_TICK_HARD_TIMEOUT_SEC: "90"
          ORDER_ALLOWED: ${{ steps.trading_day_guard.outputs.is_trading_day }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          PB1_ORDER_BLOCK_REASON: ${{ steps.trading_day_guard.outputs.reason }}
          NO_TRADE: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          DISABLE_LIVE_TRADING: "1"
          LIVE_TRADING_ENABLED: "0"
          KIS_HTTP_ENABLED: "1"
          # [2026-06-09] Late start is warn-only before close window.
          PB1_LATE_START_NO_NEW_BUY: "0"
          PB1_PM_LATE_START_NO_BUY_ENABLED: "0"
          PM_ENTRY_ALLOW_UNTIL_WARN_ONLY: "1"
        run: |
          set -euo pipefail
          late_no_buy="${{ steps.verify_final30.outputs.late_start_no_buy || '0' }}"
          late_reason="${{ steps.verify_final30.outputs.late_start_reason || 'TIME_WINDOW_OK' }}"
          if [[ "$late_reason" == "LATE_START_WARN_ONLY" ]]; then
            echo "[TRADE_AFTERNOON][LATE_START_ACTION] action=RUN_WITH_WARNING entry_enabled=1 exit_enabled=1 reason=${late_reason}" | tee -a artifacts/trade-afternoon.log
            echo "[ENTRY][ALLOWED] reason=${late_reason}" | tee -a artifacts/trade-afternoon.log
          fi
          echo "[TRADE_AFTERNOON][ENGINE_START] cmd=python -m trader.trade_tick phase=pm as_of=${{ steps.verify_final30.outputs.expected_as_of }} prep_ready=${{ steps.verify_final30.outputs.prep_ready }}" | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][START] phase=pm session_window=1300-1510 entry_enabled=1" | tee -a artifacts/trade-afternoon.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][END] phase=pm" | tee -a artifacts/trade-afternoon.log
          echo "[TRADE_AFTERNOON][ENGINE_DONE] exit_code=0 phase=pm" | tee -a artifacts/trade-afternoon.log

      - name: Run PM exit-only loop (PREP not ready - manage existing holdings)
        id: exit_only_pm
        if: ${{ always() && steps.boot_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1' && steps.verify_final30.outputs.prep_ready != '1' && steps.verify_final30.outputs.final30_rows != '30' }}
        continue-on-error: true
        timeout-minutes: 135
        working-directory: repo
        env:
          PB1_SESSION_KIND: "afternoon"
          PB1_FORCE_TRADE_SESSION: "afternoon"
          FORCE_MARKET_WINDOW: "afternoon"
          FORCE_PB1_PHASE: "exit"
          PB1_PHASE_DEFAULT: "exit"
          PB1_EXIT_ONLY_MODE: "1"
          PB1_ENTRY_ENABLED: "0"
          TRADE_REQUIRE_PREP_FINAL30_SCORED: "0"
          PB1_TARGET_START_TIME: "13:00"
          PB1_START_ALLOW_UNTIL: "13:30"
          PB1_PM_SESSION_END: "15:10"
          PB1_RUN_LOOP_MINUTES: "130"
          PB1_TICK_HARD_TIMEOUT_SEC: "90"
          ORDER_ALLOWED: ${{ steps.trading_day_guard.outputs.is_trading_day }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          KIS_HTTP_ENABLED: "1"
        run: |
          set -euo pipefail
          echo "[TRADE_AFTERNOON][EXIT_ONLY_PM_DB_MISSING][START] prep_ready=0 final30_rows=0 phase=pm entry_enabled=0 exit_only=1" | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][START] phase=pm_exit_only session_window=1300-1510 entry_enabled=0" | tee -a artifacts/trade-afternoon.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][END] phase=pm_exit_only" | tee -a artifacts/trade-afternoon.log
          echo "[TRADE_AFTERNOON][EXIT_ONLY_PM_DB_MISSING][DONE] exit_code=0" | tee -a artifacts/trade-afternoon.log

      - name: Wait until Close target start
        if: always() && steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          close_target_min=$((15 * 60 + 15))
          close_max_wait_seconds="${CLOSE_MAX_WAIT_SECONDS:-9000}"

          if [[ "$now_min" -lt "$close_target_min" ]]; then
            wait_seconds=$(( (close_target_min - now_min) * 60 ))

            if [[ "$wait_seconds" -gt "$close_max_wait_seconds" ]]; then
              echo "::error::close wait_seconds too large: ${wait_seconds} max_wait_seconds=${close_max_wait_seconds}" | tee -a artifacts/trade-afternoon.log
              exit 1
            fi

            echo "[WAIT_UNTIL_CLOSE][START] wait_seconds=${wait_seconds} max_wait_seconds=${close_max_wait_seconds}" | tee -a artifacts/trade-afternoon.log
            sleep "$wait_seconds"
            echo "[WAIT_UNTIL_CLOSE][DONE] now_kst=$(TZ=Asia/Seoul date +%H%M%S)" | tee -a artifacts/trade-afternoon.log
          else
            echo "[WAIT_UNTIL_CLOSE][SKIP] already_after_close_target now_min=${now_min}" | tee -a artifacts/trade-afternoon.log
          fi

      - name: Run Close exit loop
        id: close_loop
        if: ${{ always() && steps.boot_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1' && (steps.verify_final30.outputs.prep_ready == '1' || steps.verify_final30.outputs.final30_rows == '30') }}
        continue-on-error: true
        timeout-minutes: 20
        working-directory: repo
        env:
          PB1_SESSION_KIND: "close"
          PB1_FORCE_TRADE_SESSION: "close"
          FORCE_MARKET_WINDOW: "close"
          FORCE_PB1_PHASE: "exit"
          PB1_PHASE_DEFAULT: "exit"
          PB1_ENTRY_ENABLED: "0"
          PB1_CLOSE_ONE_SHOT: "1"
          PB1_CLOSE_SESSION_START: "15:15"
          PB1_TARGET_START_TIME: "15:15"
          PB1_START_ALLOW_UNTIL: "15:35"
          PB1_CLOSE_SESSION_END: "15:30"
          PB1_RUN_LOOP_MINUTES: "20"
          PB1_TICK_HARD_TIMEOUT_SEC: "45"
          PB1_MIN_TICK_BUDGET_SEC: "30"
          ORDER_ALLOWED: ${{ steps.trading_day_guard.outputs.is_trading_day }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          PB1_ORDER_BLOCK_REASON: ${{ steps.trading_day_guard.outputs.reason }}
          NO_TRADE: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          DISABLE_LIVE_TRADING: "1"
          LIVE_TRADING_ENABLED: "0"
          KIS_HTTP_ENABLED: "1"
        run: |
          set -euo pipefail
          echo "[PHASE][START] phase=close session_window=1515-1530 entry_enabled=0" | tee -a artifacts/trade-afternoon.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][END] phase=close" | tee -a artifacts/trade-afternoon.log
          echo "[TRADE_CLOSE][DONE] close_done=1 now_kst=$(TZ=Asia/Seoul date +%H%M%S)" | tee -a artifacts/trade-afternoon.log
          echo "[TRADE_AFTERNOON][ENGINE_DONE] exit_code=0 phase=close" | tee -a artifacts/trade-afternoon.log

      - name: Run Close exit-only loop (PREP not ready - manage existing holdings)
        id: exit_only_close
        if: ${{ always() && steps.boot_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1' && steps.verify_final30.outputs.prep_ready != '1' && steps.verify_final30.outputs.final30_rows != '30' }}
        continue-on-error: true
        timeout-minutes: 20
        working-directory: repo
        env:
          PB1_SESSION_KIND: "close"
          PB1_FORCE_TRADE_SESSION: "close"
          FORCE_MARKET_WINDOW: "close"
          FORCE_PB1_PHASE: "exit"
          PB1_PHASE_DEFAULT: "exit"
          PB1_EXIT_ONLY_MODE: "1"
          PB1_ENTRY_ENABLED: "0"
          TRADE_REQUIRE_PREP_FINAL30_SCORED: "0"
          PB1_CLOSE_ONE_SHOT: "1"
          PB1_CLOSE_SESSION_START: "15:15"
          PB1_TARGET_START_TIME: "15:15"
          PB1_START_ALLOW_UNTIL: "15:35"
          PB1_CLOSE_SESSION_END: "15:30"
          PB1_RUN_LOOP_MINUTES: "20"
          PB1_TICK_HARD_TIMEOUT_SEC: "45"
          PB1_MIN_TICK_BUDGET_SEC: "30"
          ORDER_ALLOWED: ${{ steps.trading_day_guard.outputs.is_trading_day }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          KIS_HTTP_ENABLED: "1"
        run: |
          set -euo pipefail
          echo "[TRADE_AFTERNOON][EXIT_ONLY_CLOSE][START] prep_ready=0 phase=close entry_enabled=0 exit_only=1" | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][START] phase=close_exit_only session_window=1515-1530 entry_enabled=0" | tee -a artifacts/trade-afternoon.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-afternoon.log
          echo "[PHASE][END] phase=close_exit_only" | tee -a artifacts/trade-afternoon.log
          echo "[TRADE_AFTERNOON][EXIT_ONLY_CLOSE][DONE] exit_code=0" | tee -a artifacts/trade-afternoon.log

      - name: Generate Portfolio PNL report
        if: always() && steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        env:
          PB1_PNL_REPORT_ENABLED: "1"
          PB1_PNL_REPORT_SESSION: "afternoon"
          PB1_PNL_PRICE_FALLBACK_LIMIT: "3"
        run: |
          set -euo pipefail
          mkdir -p reports/portfolio_pnl
          pm_outcome="${{ steps.pm_loop.outcome }}"
          close_outcome="${{ steps.close_loop.outcome }}"
          prep_ready="${{ steps.verify_final30.outputs.prep_ready }}"
          skip_reason="${{ steps.verify_final30.outputs.skip_reason }}"
          expected_as_of="${{ steps.verify_final30.outputs.expected_as_of }}"
          final30_rows="${{ steps.verify_final30.outputs.final30_rows }}"
          is_trading_day="${{ steps.trading_day_guard.outputs.is_trading_day }}"
          # engine_outcome: pm이 success면 success, 아니면 close 결과
          engine_outcome="skipped"
          if [[ "${pm_outcome}" == "success" ]]; then engine_outcome="success"; fi
          if [[ "${pm_outcome}" != "success" && "${close_outcome}" == "success" ]]; then engine_outcome="close_only"; fi
          echo "[TRADE_AFTERNOON][PNL_ONLY_CHECK] engine_outcome=${engine_outcome} pm_outcome=${pm_outcome} close_outcome=${close_outcome} prep_ready=${prep_ready} skip_reason=${skip_reason} expected_as_of=${expected_as_of} final30_rows=${final30_rows} is_trading_day=${is_trading_day} lock_acquired=N/A lock_owner=N/A" | tee -a artifacts/trade-afternoon.log
          python scripts/generate_portfolio_pnl_report.py 2>&1 | tee -a artifacts/trade-afternoon.log || true
          if [ -f reports/portfolio_pnl/latest_portfolio_pnl.md ]; then
            cat reports/portfolio_pnl/latest_portfolio_pnl.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify afternoon log contract
        if: always() && steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          missing=0

          # Required log patterns
          for pattern in \
            "\[TRADE_AFTERNOON\]\[TRIGGER\]" \
            "\[TRADE_AFTERNOON\]\[START_META\]" \
            "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" \
            "\[PHASE\]\[START\] phase=pm" \
            "\[PHASE\]\[START\] phase=close" \
            "\[TRADE_CLOSE\]\[DONE\]" \
            "\[ORDERS\]\[STALE_REPAIR\]\[DONE\]" \
            "\[PNL_REPORT\]\[DB_ORDERS\]\[OK\]" \
            "\[PNL_REPORT\]\[DB_FILLS\]\[OK\]" \
            "\[PNL_REPORT\]\[REALIZED\]\[SUMMARY\]"; do
            if ! grep -E "$pattern" artifacts/trade-afternoon.log >/dev/null; then
              echo "::error::missing required log pattern: $pattern"
              missing=1
            fi
          done

          # Forbidden patterns (existing checks)
          if grep -E "\[PHASE\]\[START\] phase=close.*entry_enabled=1" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::close phase has entry_enabled=1, forbidden"
            missing=1
          fi

          if grep -E "\[TRADE\]\[ORDER\]\[BUY\]|\[ORDER\]\[BUY\]" artifacts/trade-afternoon.log | grep -E "phase=close|session=close" >/dev/null; then
            echo "::error::BUY order detected in close session, forbidden"
            missing=1
          fi

          if grep -E "\[TRADE_AM\]\[HEARTBEAT\]" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::TRADE_AM heartbeat label detected in trade-afternoon log (should be TRADE_AFTERNOON or TRADE_CLOSE)"
            missing=1
          fi

          if grep -F "connection in transaction status ACTIVE" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::poisoned DB connection detected: 'connection in transaction status ACTIVE'"
            missing=1
          fi

          if grep -F "can't change 'autocommit'" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::autocommit active transaction error detected"
            missing=1
          fi

          # New forbidden patterns (2026-05-07)
          if grep -F "[ORDERS][STALE_REPAIR][FAIL]" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::stale repair failure detected"
            missing=1
          fi
          if grep -F "Unconsumed column names: repair_reason" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::repair_reason column error detected"
            missing=1
          fi
          if grep -F "got an unexpected keyword argument 'start_at'" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::PNL report start_at argument error detected"
            missing=1
          fi
          if grep -F "got an unexpected keyword argument 'event_type_filter'" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::PNL report event_type_filter argument error detected"
            missing=1
          fi
          if grep -E "tick_hard_timeout.*timeout_sec=90.*last_stage=entry.buyable_gate.finalize" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::tick_hard_timeout at entry.buyable_gate.finalize detected"
            missing=1
          fi

          if grep -F "Traceback" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::Traceback detected in trade-afternoon log"
            missing=1
          fi
          if grep -F "FATAL_RUNTIME" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::FATAL_RUNTIME detected in trade-afternoon log"
            missing=1
          fi
          if grep -F "[PNL_REPORT][DB_ORDERS_FAIL]" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::PNL report DB orders failed"
            missing=1
          fi
          if grep -F "No module named 'trader.utils.time_utils'" artifacts/trade-afternoon.log >/dev/null; then
            echo "::error::removed time_utils import path detected"
            missing=1
          fi

          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.boot_guard.outputs.should_run == '1'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected forbidden:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload trade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-diagnostics-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/reports/**
            repo/runtime/**
            repo/logs/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Assert Afternoon engine execution
        if: always() && steps.boot_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          prep_ready="${{ steps.verify_final30.outputs.prep_ready }}"
          pm_outcome="${{ steps.pm_loop.outcome }}"
          close_outcome="${{ steps.close_loop.outcome }}"
          exit_only_pm_outcome="${{ steps.exit_only_pm.outcome }}"
          exit_only_close_outcome="${{ steps.exit_only_close.outcome }}"
          expected_as_of="${{ steps.verify_final30.outputs.expected_as_of }}"
          final30_rows="${{ steps.verify_final30.outputs.final30_rows }}"
          skip_reason="${{ steps.verify_final30.outputs.skip_reason }}"

          echo "[TRADE_AFTERNOON][ASSERT] is_trading_day=1 prep_ready=${prep_ready} pm_outcome=${pm_outcome} close_outcome=${close_outcome} exit_only_pm=${exit_only_pm_outcome} exit_only_close=${exit_only_close_outcome} expected_as_of=${expected_as_of} final30_rows=${final30_rows} skip_reason=${skip_reason}" | tee -a artifacts/trade-afternoon.log

          if [[ "${prep_ready}" == "1" ]]; then
            # Normal path: PREP ready, pm_loop or close_loop must have run
            if [[ "${pm_outcome}" != "success" && "${close_outcome}" != "success" ]]; then
              echo "[TRADE_AFTERNOON][ASSERT_FAIL] reason=ENGINE_NOT_RUN pm_outcome=${pm_outcome} close_outcome=${close_outcome} prep_ready=${prep_ready}" | tee -a artifacts/trade-afternoon.log
              echo "::error::TRADE_AFTERNOON ASSERT FAIL: prep_ready=1 but both pm_loop=${pm_outcome} and close_loop=${close_outcome}. PNL/report-only execution is NOT acceptable."
              exit 1
            fi
          else
            # EXIT_ONLY path: PREP not ready, exit_only loops must have run or skipped gracefully
            if [[ "${exit_only_pm_outcome}" == "failure" || "${exit_only_close_outcome}" == "failure" ]]; then
              echo "[TRADE_AFTERNOON][ASSERT_FAIL] reason=EXIT_ONLY_FAILED exit_only_pm=${exit_only_pm_outcome} exit_only_close=${exit_only_close_outcome}" | tee -a artifacts/trade-afternoon.log
              echo "::error::TRADE_AFTERNOON ASSERT FAIL: EXIT_ONLY mode but exit_only loops failed. exit_only_pm=${exit_only_pm_outcome} exit_only_close=${exit_only_close_outcome}."
              exit 1
            fi
            echo "[TRADE_AFTERNOON][EXIT_ONLY][ASSERT_OK] prep_ready=0 exit_only_pm=${exit_only_pm_outcome} exit_only_close=${exit_only_close_outcome}" | tee -a artifacts/trade-afternoon.log
          fi

          echo "[TRADE_AFTERNOON][ASSERT_OK] engine_ran=1 pm_outcome=${pm_outcome} close_outcome=${close_outcome} prep_ready=${prep_ready} expected_as_of=${expected_as_of}" | tee -a artifacts/trade-afternoon.log

      - name: Fail if PM or Close failed
        if: always() && steps.boot_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          prep_ready="${{ steps.verify_final30.outputs.prep_ready }}"
          pm_result="${{ steps.pm_loop.outcome }}"
          close_result="${{ steps.close_loop.outcome }}"
          exit_only_pm_result="${{ steps.exit_only_pm.outcome }}"
          exit_only_close_result="${{ steps.exit_only_close.outcome }}"
          echo "[TRADE_AFTERNOON][STEP_OUTCOME] prep_ready=${prep_ready} pm=${pm_result} close=${close_result} exit_only_pm=${exit_only_pm_result} exit_only_close=${exit_only_close_result}" | tee -a artifacts/trade-afternoon.log

          if [[ "${prep_ready}" == "1" ]]; then
            # Normal path: check pm/close loops
            if [[ "$close_result" == "failure" ]]; then
              echo "::error::Close loop failed. This is critical."
              exit 1
            fi
            if [[ "$pm_result" == "failure" ]]; then
              echo "::error::PM loop failed."
              exit 1
            fi
          else
            # EXIT_ONLY path: check exit_only loops
            if [[ "$exit_only_close_result" == "failure" ]]; then
              echo "::error::EXIT_ONLY Close loop failed. This is critical."
              exit 1
            fi
            if [[ "$exit_only_pm_result" == "failure" ]]; then
              echo "::error::EXIT_ONLY PM loop failed."
              exit 1
            fi
          fi

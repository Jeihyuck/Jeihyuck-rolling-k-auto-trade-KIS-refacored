name: "Trade Afternoon"

"on":
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice
      CONFIRM_MANUAL_AFTERNOON:
        description: "Type RUN_AFTERNOON_MANUAL to run afternoon manually"
        required: false
        default: ""
      AFTERNOON_MANUAL_MODE:
        description: afternoon manual execution mode
        required: false
        default: compute_only
        type: choice
        options:
          - live_afternoon
          - compute_only
          - diag_replay

concurrency:
  group: trade-afternoon-practice-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KR_INDEX_KOSPI_SYMBOL: "KOSPI"
  KR_INDEX_KOSDAQ_SYMBOL: "KOSDAQ"
  KR_INDEX_KOSPI200_PROXY: "KOSPI200"
  KR_INDEX_KOSDAQ150_PROXY: "229200"
  KR_INDEX_KOSPI_FALLBACK_PROXY: "069500"
  KR_INDEX_KOSDAQ_FALLBACK_PROXY: "229200"
  KR_INDEX_KOSPI200_FALLBACK_PROXY: "069500"
  KR_INDEX_KOSDAQ150_FALLBACK_PROXY: "229200"
  MODE: trade
  EXPECTED_BRANCH: "dual-agent"
  PM_ENTRY_ALLOW_UNTIL: "13:30"
  PM_LATE_START_ACTION: "RUN_WITH_WARNING"
  PM_ALLOW_LATE_NEW_BUY_OVERRIDE: "0"
  ENTRY_CUTOFF_TIME: "15:15"
  MARKET_CLOSE_TIME: "15:30"
  PB1_LATE_START_POLICY: "ALLOW_BEFORE_CUTOFF"
  PB1_BLOCK_ENTRY_AFTER_CUTOFF: "1"

  PB1_MAX_POSITIONS: "30"
  PB1_TARGET_NEW_POSITIONS: "30"

  PB1_EXIT_PASS_TIMEOUT_SEC: "300"

  PB1_PREWARM_ENABLED: "1"
  PB1_EXIT_PREWARM_ENABLED: "1"
  AFTERNOON_PREWARM_START_TIME: "12:15"
  PM_TARGET_START_TIME: "13:00"
  PM_START_ALLOW_UNTIL: "13:30"
  PM_SESSION_END: "15:10"
  CLOSE_TARGET_START_TIME: "15:15"
  CLOSE_START_ALLOW_UNTIL: "15:30"
  CLOSE_SESSION_END: "15:30"

  PB1_LOOP_ENABLED: "1"
  PB1_LOOP_INTERVAL_SEC: "60"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  CLOSE_MAX_WAIT_SECONDS: "9000"

  STRATEGY_MODE: "INTENT_ONLY"
  FORCE_STRATEGY_MODE: "INTENT_ONLY"
  DRY_RUN: "1"
  DISABLE_LIVE_TRADING: "1"
  LIVE_TRADING_ENABLED: "0"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"

  STRATEGY_ENV: practice
  KIS_ENV: practice
  FINAL30_SOURCE_MODE: "db_only"
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final_scored"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"

  PB1_MARKET_SCOPE: "KRX"
  MARKET: "KR"
  EXCHANGE: "KRX"

  DB_CONNECT_TIMEOUT: "15"
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  DB_CONNECT_TIMEOUT_SEC: "5"
  PB1_CURRENT_PRICE_CACHE_TTL_SEC: "30"
  PB1_CURRENT_PRICE_MAX_AGE_SEC: "180"
  PB1_FETCH_CURRENT_PRICE_MAX_PER_TICK: "30"

name: US Portfolio Guard Dedicated Native Acceptance

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/us/portfolio_profit_guard.py"
      - "trader/us/portfolio_profit_guard_store.py"
      - "trader/us/execution/order_router.py"
      - "trader/us/runner/trade_tick_runner.py"
      - "trader/us/runner/trade_close_runner.py"
      - "migrations/0064_us_portfolio_guard_policy_state_actions.sql"
      - "tests/us/test_us_20261123_portfolio_guard*.py"
      - ".github/workflows/us-portfolio-guard-acceptance.yml"
  workflow_dispatch:


# Only superseded PR validation runs are cancellable; manual/push runs stay isolated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard-native:
    name: PORT-01..15 signed policy native PG safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: us_portfolio_guard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d us_portfolio_guard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KIS_ENV: practice
      PYTHONPATH: "."
      ALLOW_REAL_ORDER: "0"
      US_PORTFOLIO_GUARD_ACTIVE: "0"
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/us_portfolio_guard_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary
      - name: Compile portfolio guard + canonical SELL and Close
        run: |
          python -m py_compile \
            trader/us/portfolio_profit_guard.py \
            trader/us/portfolio_profit_guard_store.py \
            trader/us/execution/order_router.py \
            trader/us/runner/trade_tick_runner.py \
            trader/us/runner/trade_close_runner.py
      - name: Signed policy + owner + stage + no-reentry unit tests
        run: |
          python -m pytest -q \
            tests/us/test_us_20261123_portfolio_profit_guard_policy_math.py \
            tests/us/test_us_20261123_portfolio_guard_native_fence.py \
            tests/us/test_us_20261123_portfolio_guard_priority_reentry.py
      - name: Genuine PostgreSQL HWM, ACK/fill and UNKNOWN stage tests
        run: |
          python -m pytest -q \
            tests/us/test_us_20261123_portfolio_guard_pg_lifecycle.py

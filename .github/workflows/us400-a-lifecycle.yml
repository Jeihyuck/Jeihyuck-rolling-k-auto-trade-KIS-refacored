name: US400-A focused lifecycle acceptance
on:
  pull_request:
    branches: [dual-agent, fix/us-20261126-hot-only-tp90-integrated]
    paths:
      - 'trader/us/db/repos.py'
      - 'trader/us/runner/trade_tick_runner.py'
      - 'tests/us/test_us_reconcile_only_after_failed_orders.py'
      - 'trader/us/execution/**'
      - 'tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py'
      - 'tests/us/test_us_residual_flow_20261119.py'
      - '.github/workflows/us400-a-lifecycle.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: us_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d us_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      DRY_RUN: '1'
      US_KIS_ORDER_ALLOWED: '0'
      US_ORDER_ARMED: '0'
      ALLOW_REAL_ORDER: '0'
      KIS_HTTP_BLOCK: '1'
      PBCORE_DB_URL: ''
      DATABASE_URL: ''
      KIS_APP_KEY: ''
      KIS_APP_SECRET: ''
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/us_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt psycopg2-binary pytest
      - run: |
          python -m pytest -q --junitxml=/tmp/us400-a.xml tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_pg_us353_native_tp_claim_reserve_http_gate_and_exact_abort tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_pg_tp_claim_reservation_rearms_only_unsent_intent tests/us/test_us_residual_flow_20261119.py::test_postgres_boundary_release_requires_exact_certificate_and_no_broker_evidence tests/us/test_us_residual_flow_20261119.py::test_postgres_preclaim_certificate_rejects_contradictory_durable_fields tests/us/test_us_residual_flow_20261119.py::test_postgres_repair_rolls_back_intent_and_continues_unrelated_symbol tests/us/test_us_residual_flow_20261119.py::test_postgres_certificate_cannot_change_foreign_intent_scope tests/us/test_us_residual_flow_20261119.py::test_tp_boundary_budget_retains_every_unexamined_candidate tests/us/test_us_reconcile_only_after_failed_orders.py::test_buy_ack_fence_requires_exact_attempt_and_broker_identity tests/us/test_us_reconcile_only_after_failed_orders.py::test_pg_buy_ack_payload_cannot_replace_durable_symbol_or_attempt tests/us/test_us_residual_flow_20261119.py::test_preclaim_abort_cannot_retag_foreign_declared_scope
          python -c 'import xml.etree.ElementTree as E; c=list(E.parse("/tmp/us400-a.xml").iter("testcase")); assert len(c)==49 and all(x.find("skipped") is None for x in c)'

name: Weekday Trade Tick (DB pool only)

on:
  schedule:
    # Mon-Fri 09:00-15:15 KST = Mon-Fri 00:00-06:15 UTC, every 5 min
    - cron: "*/5 0-6 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: trade-tick
  cancel-in-progress: false

env:
  STRATEGY_ENV: practice
  KIS_ENV: practice
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"
  FAIL_IF_POOL_MISSING: "1"
  CANDIDATE_POOL_TTL_DAYS: "7"
  CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
  CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
  CANDIDATE_POOL_UNIVERSE_ENV: "practice"
  MINERVINI_USE_FEATURE_CACHE: "1"
  FEATURE_CACHE_WARMUP_ON_TICK: "0"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  trade_tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
          ref: "nullim"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Verify candidate pool exists (fallback within TTL)
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Trade Tick - Pool Verification"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "Strategy: ${CANDIDATE_POOL_STRATEGY_KEY}"
          echo "TTL: ${CANDIDATE_POOL_TTL_DAYS} days"
          echo "======================================"
          python -m trader.verify_candidate_pool

      - name: "Guard: No candidate rebuild on weekdays"
        run: |
          set -euo pipefail
          echo "[POOL][PRECHECK] ✅ trade-tick will load from DB (no rebuild)"
          echo "[POOL][PRECHECK] FAIL_IF_POOL_MISSING=${FAIL_IF_POOL_MISSING}"
          echo "[POOL][PRECHECK] FORCE_CANDIDATE is NOT set (weekday safety)"

      - name: Run trade tick (LIVE)
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Trade Tick - LIVE Execution"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "Mode: LIVE"
          echo "NO_TRADE: ${NO_TRADE}"
          echo "KIS_HTTP_ENABLED: ${KIS_HTTP_ENABLED}"
          echo "======================================"
          python -m trader.pb1_runner

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

name: verify-new-practice-database-cutover

on:
  workflow_dispatch:
    inputs:
      new_database_name:
        description: "Fresh PostgreSQL database name prepared by the previous workflow"
        required: true
        default: "pbcore_practice_20260921"

permissions:
  contents: read

env:
  STRATEGY_ENV: "practice"
  KIS_ENV: "practice"
  KIS_HTTP_ENABLED: "1"
  VERIFY_PRACTICE_DB_CUTOVER: "1"
  DB_CUTOVER_CONFIRM: "YES"
  NEW_PRACTICE_DB_NAME: ${{ inputs.new_database_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      PBCORE_NEW_DB_URL: ${{ secrets.PBCORE_NEW_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify fresh DB and flat KR US broker account
        run: |
          set -euo pipefail
          python scripts/verify_new_practice_database_cutover.py

name: prepare-new-practice-database

on:
  workflow_dispatch:
    inputs:
      new_database_name:
        description: "Fresh PostgreSQL database name, e.g. pbcore_practice_20260921"
        required: true
        default: "pbcore_practice_20260921"

permissions:
  contents: read

env:
  STRATEGY_ENV: "practice"
  KIS_ENV: "practice"
  CREATE_NEW_PRACTICE_DB: "1"
  DB_GENERATION_CONFIRM: "YES"
  NEW_PRACTICE_DB_NAME: ${{ inputs.new_database_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      PBCORE_NEW_DB_URL: ${{ secrets.PBCORE_NEW_DB_URL }}
      PRACTICE_DB_GENERATION_MANIFEST_DIR: runtime/private/practice_db_generations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare fresh practice database
        run: |
          set -euo pipefail
          python scripts/prepare_new_practice_database.py

      - name: Upload non-secret generation manifest
        uses: actions/upload-artifact@v4
        with:
          name: practice-db-generation-${{ inputs.new_database_name }}
          path: runtime/private/practice_db_generations/*.json
          if-no-files-found: error
          retention-days: 30

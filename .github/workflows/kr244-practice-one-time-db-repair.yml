name: KR244 Oct20 Practice Exact SELL One-Time Recovery
"on":
  pull_request:
    types: [synchronize]
    branches: [dual-agent]
    paths:
      - "ops/kr244-20261020-apply-once.trigger"
permissions:
  contents: read
concurrency:
  group: kr244-practice-exact-sell-recovery-only
  cancel-in-progress: false
jobs:
  evidence-backed-db-repair:
    if: ${{ github.event.pull_request.number == 244 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/kr-20261020-submit-latency-sell-reconcile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      KIS_ENV: practice
      STRATEGY_ENV: practice
      STRATEGY_MODE: LIVE
      KIS_HTTP_ENABLED: "1"
      KIS_CCLD_FAIL_OPEN: "0"
      KIS_CCLD_RETRY_MAX: "4"
      KIS_CCLD_READ_TIMEOUT_SEC: "8"
      DRY_RUN: "1"
      DISABLE_REAL_TRADING: "1"
      LIVE_TRADING_ENABLED: "0"
      ALLOW_REAL_ORDER: "0"
      NO_TRADE: "1"
      PYTHONPATH: "."
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated repair runtime
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pytest
      - name: Fail-closed 11-order specific source and regression gates
        run: |
          python -m py_compile trader/reconcile_kis.py scripts/kr244_reconcile_day.py
          python -m pytest -q tests/kr/test_kr_20261020_bulk_dedupe_postsubmit_reconcile.py
      - name: Repair exactly 11 historic KIS-proven practice SELLs (NO BROKER ORDERS)
        run: |
          python -m scripts.kr244_reconcile_day --env practice --trade-date 2026-10-20 --apply-verified

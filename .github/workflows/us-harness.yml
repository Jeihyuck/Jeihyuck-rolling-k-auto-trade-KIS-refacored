name: US Harness (Offline QA)

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/us/**"
      - "tests/us/**"
      - "config/us_*.yaml"
  schedule:
    # 매일 KST 08:00 (UTC 23:00 전일)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  harness:
    name: "US Offline Harness QA"
    runs-on: ubuntu-latest

    env:
      TRADING_REGION: "US"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      OFFLINE_MODE: "1"
      US_OFFLINE_MODE: "true"
      KIS_HTTP_BLOCK: "1"
      KIS_HTTP_AUDIT_FILE: "/tmp/us_harness_kis_http_calls.log"
      # KIS credentials NOT provided — all HTTP must be blocked offline
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (tests/us)
        run: pytest -q tests/us

      - name: Run harness runner (offline, all scenarios)
        run: python -m trader.us.harness.runner --scenario all --offline 2>&1 | tee /tmp/us_harness_offline.log

      - name: Verify KIS HTTP not called
        run: |
          # offline 모드에서는 KIS API 호출이 절대 발생하면 안 된다.
          python - << 'EOF'
          from pathlib import Path
          from trader.us.harness.log_parser import any_forbidden_marker_present

          log_text = Path("/tmp/us_harness_offline.log").read_text(encoding="utf-8", errors="ignore") if Path("/tmp/us_harness_offline.log").exists() else ""
          audit_path = Path("/tmp/us_harness_kis_http_calls.log")
          audit_text = audit_path.read_text(encoding="utf-8", errors="ignore") if audit_path.exists() else ""
          combined = log_text + "\n" + audit_text
          found, markers = any_forbidden_marker_present(combined, ["[KIS_HTTP_CALL]"])
          if found:
              raise SystemExit(f"[VERIFY][FAIL] KIS HTTP marker found: {markers}\n{audit_text}")
          print("[VERIFY][PASS] KIS HTTP call count=0 in offline run")
          EOF

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-harness-results-${{ github.run_id }}
          path: |
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 3

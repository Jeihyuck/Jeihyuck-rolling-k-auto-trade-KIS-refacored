name: US Harness (Offline QA)

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/us/**"
      - "tests/us/**"
      - "config/us_*.yaml"
      - ".github/workflows/us-harness.yml"
  workflow_dispatch:

jobs:
  harness:
    name: "US Offline Harness QA"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: us_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d us_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TRADING_REGION: "US"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: "."
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/us_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary

      - name: Byte compile critical US modules
        run: |
          python -m py_compile \
            trader/us/execution/kis_us_client.py \
            trader/us/execution/fills.py \
            trader/us/execution/order_router.py \
            trader/us/execution/order_journal.py \
            trader/us/execution/reconcile.py \
            trader/us/db/repos.py \
            trader/us/runner/trade_tick_runner.py \
            trader/us/runner/trade_close_runner.py \
            scripts/repair_us_trade_integrity.py

      - name: Run pytest (tests/us, including real PostgreSQL integration)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/us -q 2>&1 | tee /tmp/us-pytest.log

      - name: Run harness runner (offline, all scenarios)
        run: python -m trader.us.harness.runner --scenario all --offline

      - name: Verify KIS HTTP not called
        run: |
          python -c 'from trader.us.harness.log_parser import any_forbidden_marker_present; found, markers = any_forbidden_marker_present("", ["[KIS_HTTP_CALL]"]); assert not found, markers; print("[VERIFY][PASS] KIS HTTP marker absent in offline run")'

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-harness-results-${{ github.run_id }}
          path: |
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 3

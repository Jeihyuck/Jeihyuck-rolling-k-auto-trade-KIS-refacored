name: US Harness (Offline QA)

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/us/**"
      - "tests/us/**"
      - "config/us_*.yaml"
      - "scripts/pr68_patch_*.py"
      - ".github/workflows/us-harness.yml"
  workflow_dispatch:

jobs:
  harness:
    name: "US Offline Harness QA"
    runs-on: ubuntu-latest

    env:
      TRADING_REGION: "US"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply staged PR68 patches
        shell: bash
        run: |
          if [[ -f scripts/pr68_patch_1.py ]]; then
            python scripts/pr68_patch_1.py
            python scripts/pr68_patch_2.py
            python scripts/pr68_patch_3.py
            python scripts/pr68_patch_4.py
          fi

      - name: Run pytest (tests/us)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/us -q 2>&1 | tee /tmp/us-pytest.log

      - name: Run harness runner (offline, all scenarios)
        run: python -m trader.us.harness.runner --scenario all --offline

      - name: Verify KIS HTTP not called
        run: |
          python -c 'from trader.us.harness.log_parser import any_forbidden_marker_present; found, markers = any_forbidden_marker_present("", ["[KIS_HTTP_CALL]"]); assert not found, markers; print("[VERIFY][PASS] KIS HTTP marker absent in offline run")'

      - name: Upload harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-harness-results-${{ github.run_id }}
          path: |
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 3

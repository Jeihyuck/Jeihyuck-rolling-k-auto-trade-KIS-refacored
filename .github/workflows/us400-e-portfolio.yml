name: US400-E focused portfolio guard acceptance
on:
  pull_request:
    branches: [dual-agent, fix/us-20261126-hot-only-tp90-integrated, 'fix/us-rebuild-*']
    paths:
      - 'trader/us/portfolio_profit_guard_store.py'
      - 'tests/us/test_us_20261123_portfolio_guard_pg_lifecycle.py'
      - 'tests/us/test_us_20261123_portfolio_profit_guard_policy_math.py'
      - '.github/workflows/us400-e-portfolio.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: us_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d us_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      DRY_RUN: '1'
      US_KIS_ORDER_ALLOWED: '0'
      US_ORDER_ARMED: '0'
      ALLOW_REAL_ORDER: '0'
      KIS_HTTP_BLOCK: '1'
      PBCORE_DB_URL: ''
      DATABASE_URL: ''
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/us_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt psycopg2-binary pytest
      - run: |
          python -m pytest -q --junitxml=/tmp/us400-e.xml tests/us/test_us_20261123_portfolio_guard_pg_lifecycle.py tests/us/test_us_20261123_portfolio_profit_guard_policy_math.py
          python -c 'import xml.etree.ElementTree as E; c=list(E.parse("/tmp/us400-e.xml").iter("testcase")); assert len(c)>=8 and all(x.find("skipped") is None for x in c)'

name: PR127 Final Review Follow-up

on:
  push:
    branches:
      - fix/pr127-residual-runtime-integrity-20260912

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr127-residual-runtime-integrity-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Apply patch helper
        run: python .github/pr127_final_review_patch.py
      - name: Byte compile
        run: python -m py_compile trader/us/runner/trade_tick_runner.py trader/kr/runner/trade_session_runner.py
      - name: Targeted regression tests
        run: pytest -q tests/us/test_us_pr127_residual_integrity.py tests/kr/test_kr_pr127_close_contract.py tests/test_kr_close_phase_forced.py
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trader/us/runner/trade_tick_runner.py trader/kr/runner/trade_session_runner.py tests/us/test_us_pr127_residual_integrity.py tests/kr/test_kr_pr127_close_contract.py
          git commit -m "fix: close PR127 final review findings"
          git push origin HEAD:fix/pr127-residual-runtime-integrity-20260912

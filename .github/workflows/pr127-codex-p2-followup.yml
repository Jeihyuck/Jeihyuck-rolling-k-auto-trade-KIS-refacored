name: PR127 Codex P2 Follow-up

on:
  push:
    branches:
      - fix/pr127-residual-runtime-integrity-20260912

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR127 branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr127-residual-runtime-integrity-20260912
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary

      - name: Apply Codex P2 follow-up
        run: |
          if [ ! -f scripts/pr127_codex_p2_followup.py ]; then
            echo "follow-up helper already removed; nothing to do"
            exit 0
          fi
          python scripts/pr127_codex_p2_followup.py

      - name: Byte compile changed module
        run: python -m py_compile trader/us/runner/trade_tick_runner.py

      - name: Targeted regression tests
        run: |
          python -m pytest -q \
            tests/us/test_us_pr127_residual_integrity.py \
            tests/us/test_us_exit_first_routing.py \
            tests/us/test_us_tick_io_budget_regression.py \
            tests/us/test_us_20260910_20260911_incident_fixes.py \
            tests/us/test_us_tqqq_open_buy_ttl_lifecycle.py

      - name: Commit validated P2 follow-up
        run: |
          if [ -f scripts/pr127_codex_p2_followup.py ]; then
            git rm -f scripts/pr127_codex_p2_followup.py
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No P2 follow-up changes to commit"
            exit 0
          fi
          git commit -m "fix: align routed SELL notional with broker truth"
          git push origin HEAD:fix/pr127-residual-runtime-integrity-20260912

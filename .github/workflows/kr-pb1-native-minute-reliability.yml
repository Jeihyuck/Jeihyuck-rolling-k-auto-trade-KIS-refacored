name: KR PB1 Native Minute Reliability
on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/kr/opening_bar_contract.py"
      - "trader/kr/entry_opportunity_v2.py"
      - "trader/kr/entry_opportunity_v3.py"
      - "trader/kr/entry_timing_price.py"
      - "trader/kr/executable_quote.py"
      - "tests/kr/test_kr_executable_quote_20261126.py"
      - "tests/kr/test_kr_354_repository_lifecycle.py"
      - "tests/kr/test_kr_20261113_pb1_native_volume_rescue.py"
      - "trader/kr/entry_priority_queue.py"
      - "trader/kr/kis_observer_budget.py"
      - "trader/kr/kis_shared_http_budget.py"
      - "trader/marketdata/kr_ws_shared.py"
      - "trader/marketdata/kr_rest_shared.py"
      - "tests/kr/test_kr_rest_shared_20261126.py"
      - "trader/marketdata/kis_ws_price.py"
      - "tests/kr/test_kr_ws_shared_20261126.py"
      - "tests/kr/test_kr_shared_http_budget_20261126.py"
      - "trader/kis_wrapper.py"
      - "trader/pb1_engine.py"
      - "trader/pb1_runner.py"
      - "trader/kr/broker_truth_hardening.py"
      - "trader/kr/infinite/runner.py"
      - "trader/kr/infinite/executor.py"
      - "trader/kr/infinite/repository.py"
      - "trader/kr_price_utils.py"
      - "tests/kr/infinite/test_20261118_etf_tick_contract.py"
      - "tests/kr/infinite/test_20261118_atomic_fill_journal.py"
      - "tests/kr/test_kr_20261118_sparse_native_intraday_entry.py"
      - "tests/test_kr_order_price_guardrails.py"
      - "tests/kr/infinite/test_runner_integration.py"
      - "trader/reconcile_kis.py"
      - "tests/kr/test_kr_pb1_current_only_original_balance_proof.py"
      - "tests/kr/test_kr_pb1_kis_http_audit.py"
      - "tests/kr/test_kr_session_metrics_accumulator.py"
      - "tests/kr/test_kr_20261013_start_aligned_cadence.py"
      - "scripts/kr_opening_observer.py"
      - "scripts/kr_historical_buy_native_evidence.py"
      - "scripts/wsl/check-nullim-day-health.sh"
      - "scripts/wsl/kr_mail_execution_evidence.py"
      - "tests/test_kr_mail_execution_evidence_20261111.py"
      - "tests/test_pr121_mail_degraded_delivery.py"
      - "scripts/wsl/kr-entry-timing-activation.sh"
      - "tests/kr/test_kr_pb1_minute_*.py"
      - "tests/kr/test_kr_prep_collection_20261127.py"
      - "tests/kr/test_kr_practice_readonly_auth.py"
      - "scripts/kr_assert_no_skips.py"
      - "tests/kr/test_kr_20261124_recurring_execution.py"
      - "tests/kr/test_kr_20261124_closed_cycle_claim_recovery.py"
      - "trader/kr/closed_cycle_claim_recovery.py"
      - "trader/execution_claims.py"
      - "trader/kr/runtime_integrity_20260928.py"
      - "tests/kr/test_kr_pb1_kis_observer_budget.py"
      - ".github/workflows/kr-pb1-native-minute-reliability.yml"
  workflow_dispatch:

jobs:
  minute-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kr_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d kr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATEGY_ENV: practice
      KIS_ENV: practice
      MARKET: KR
      REGION: KR
      PB1_MARKET_SCOPE: KRX
      ALLOW_REAL_ORDER: "0"
      DISABLE_LIVE_TRADING: "1"
      NO_TRADE: "1"
      PYTHONPATH: "."
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kr_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-mock psycopg2-binary
      - name: Compile and shell-validate modified runtime
        run: |
          python -m py_compile trader/kr/entry_priority_queue.py trader/kr/kis_observer_budget.py \
            trader/kr/opening_bar_contract.py trader/kis_wrapper.py trader/pb1_engine.py scripts/kr_opening_observer.py \
            trader/kr/broker_truth_hardening.py trader/reconcile_kis.py trader/pb1_runner.py trader/kr/infinite/runner.py trader/kr/infinite/executor.py trader/kr/infinite/repository.py
          bash -n scripts/wsl/kr-entry-timing-activation.sh scripts/wsl/run-kr-am.sh scripts/wsl/run-kr-afternoon.sh
      - name: Native minute offline incident & integration regressions
        run: |
          python -m pytest -q -rs --junitxml="$RUNNER_TEMP/kr-native-minute.xml" \
            tests/kr/test_kr_pb1_minute_priority_queue.py \
            tests/kr/test_kr_prep_collection_20261127.py \
            tests/kr/test_kr_opening_intelligence_20261127.py \
            tests/kr/test_kr_practice_readonly_auth.py \
            tests/kr/test_kr_assert_no_skips.py \
            tests/kr/test_kr_pb1_minute_native_conflicts.py \
            tests/kr/test_kr_pb1_kis_observer_budget.py \
            tests/kr/test_kr_ws_shared_20261126.py \
            tests/kr/test_kr_rest_shared_20261126.py \
            tests/kr/test_kr_shared_http_budget_20261126.py \
            tests/kr/test_kr_executable_quote_20261126.py \
            tests/kr/test_kr_354_repository_lifecycle.py \
            tests/kr/test_kr_pb1_minute_incident_replay.py \
            tests/kr/test_kr_pb1_minute_egw_final_retry.py \
            tests/kr/test_kr_pb1_current_only_original_balance_proof.py \
            tests/kr/test_kr_broker_truth_hardening.py \
            tests/kr/infinite/test_v3_contract.py \
            tests/kr/infinite/test_runner_integration.py \
            tests/kr/infinite/test_20261118_atomic_fill_journal.py \
            tests/kr/infinite/test_20261118_etf_tick_contract.py \
            tests/kr/test_kr_20261118_sparse_native_intraday_entry.py \
            tests/test_kr_order_price_guardrails.py \
            tests/kr/test_kr_pb1_kis_http_audit.py \
            tests/kr/test_kr_session_metrics_accumulator.py \
            tests/kr/test_kr_20261013_start_aligned_cadence.py \
            tests/kr/test_kr_balance_freshness_provenance_20261106.py \
            tests/kr/test_kr_20261116_integrated_recovery.py \
            tests/kr/test_kr_runtime_integrity_p0_20260922.py \
            tests/kr/test_kr_20261029_price_aware_opening.py \
            tests/kr/test_kr_20261110_timing_activation_cjenm.py \
            tests/kr/test_kr_20261124_recurring_execution.py \
            tests/kr/test_kr_20261124_closed_cycle_claim_recovery.py \
            tests/kr/test_kr_20261113_pb1_native_volume_rescue.py \
            tests/kr/test_kr_pb1_minute_20261125_adaptive_entry.py \
            tests/test_kr_mail_execution_evidence_20261111.py \
            tests/test_pr121_mail_degraded_delivery.py::test_health_distinguishes_degraded_delivery_from_mail_failure
          python scripts/kr_assert_no_skips.py "$RUNNER_TEMP/kr-native-minute.xml"

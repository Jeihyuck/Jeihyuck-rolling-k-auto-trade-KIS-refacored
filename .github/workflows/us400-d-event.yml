name: US400-D focused HOT event acceptance
on:
  pull_request:
    branches: [fix/us-20261126-hot-only-tp90-integrated]
    paths:
      - 'trader/us/entry_timing/**'
      - 'tests/us/test_us400_d_hot_event.py'
      - '.github/workflows/us400-d-event.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-hot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      DRY_RUN: '1'
      US_ORDER_ARMED: '0'
      KIS_HTTP_BLOCK: '1'
      PBCORE_DB_URL: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: |
          python -m pytest -q --junitxml=/tmp/us400-d.xml tests/us/test_us400_d_hot_event.py tests/us/test_us_20261120_minute_priority_conflict.py
          python -c 'import xml.etree.ElementTree as E; c=list(E.parse("/tmp/us400-d.xml").iter("testcase")); assert len(c)>=20 and all(x.find("skipped") is None for x in c)'

name: US400-D focused HOT event acceptance
on:
  pull_request:
    branches: [dual-agent, fix/us-20261126-hot-only-tp90-integrated, 'fix/us-rebuild-*']
    paths:
      - 'trader/us/entry_timing/**'
      - 'trader/us/market_state_overlay.py'
      - 'trader/us/pb1/us_entry_engine.py'
      - 'tests/us/test_us400_d_hot_event.py'
      - 'tests/us/test_us_opening_observer_store_20261029.py'
      - 'trader/us/execution/kis_us_client.py'
      - 'tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py'
      - '.github/workflows/us400-d-event.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused-hot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      DRY_RUN: '1'
      US_ORDER_ARMED: '0'
      KIS_HTTP_BLOCK: '1'
      PBCORE_DB_URL: ''
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: |
          python -m pytest -q --junitxml=/tmp/us400-d.xml tests/us/test_us400_d_hot_event.py tests/us/test_us_20261120_minute_priority_conflict.py tests/us/test_us_20261030_live_risk_ws_tp_prehttp.py::test_intraday_quote_can_expire_while_a_later_index_is_read tests/us/test_us_opening_observer_store_20261029.py::test_hot_page_admission_rechecks_deadline_after_scope_lookup tests/us/test_us_opening_observer_store_20261029.py::test_native_minute_page_inherits_shorter_stage_deadline_and_restores_it
          python -c 'import xml.etree.ElementTree as E; c=list(E.parse("/tmp/us400-d.xml").iter("testcase")); assert len(c)>=21 and all(x.find("skipped") is None for x in c)'

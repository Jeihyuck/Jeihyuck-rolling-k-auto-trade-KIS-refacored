name: US Four-Strategy Merge Gate

on:
  push:
    branches:
      - fix/us-20261010-independent-signal-eligibility
  pull_request:
    branches:
      - dual-agent
      - fix/us-20261010-vcp-broker-volume-trigger
    paths:
      - 'trader/us/**'
      - 'trader/strategies/pb1_minervini_v2.py'
      - 'tests/us/**'
      - '.github/workflows/us-four-strategy-merge-gate.yml'

jobs:
  invariant-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIS_ENV: practice
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      US_VCP_LIVE_REST_MAX_PER_TICK: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      # Each regression explicitly sets its own feature flags; this exercises
      # both legacy OFF and four-family ON, without global test contamination.
      - name: Four-family proof, idempotency, frozen-exit and VCP live gates
        run: |
          python -m pytest -q \
            tests/us/test_us_independent_signal_arbitration_20261010.py \
            tests/us/test_us_vcp_live_broker_trigger_20261010.py \
            tests/us/test_us_independent_live_proof_gate_20261010.py \
            tests/us/test_us_four_strategy_proof_provenance_roundtrip_20261010.py \
            tests/us/test_us_momentum_breakout_proof_20261010.py \
            tests/us/test_us_minervini_daily_proof_20261010.py \
            tests/us/test_us_verified_vcp_entry_selection_20261010.py \
            tests/us/test_us_vcp_prebreakout_policy_review_20261010.py

  full-us-offline-harness:
    name: Full US PostgreSQL and Offline Harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: us_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d us_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRADING_REGION: "US"
      KIS_ENV: practice
      US_PAPER_TRADING_ENABLED: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: "."
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/us_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary
      - name: Byte-compile broker submission, reconciliation and strategy paths
        run: |
          python -m py_compile trader/us/pb1/us_entry_engine.py \
            trader/us/watchlist_builder.py \
            trader/us/entry_exit_contract.py \
            trader/us/execution/order_router.py \
            trader/us/execution/order_journal.py \
            trader/us/execution/reconcile.py \
            trader/us/runner/trade_tick_runner.py
      - name: Run all US tests including real PostgreSQL recovery
        run: |
          # The runner's push event is not a trading dispatcher event. Tests
          # install their own explicit event fixtures, so do not inherit the
          # ambient Actions event or workflow name into dispatcher policy.
          env -u GITHUB_EVENT_NAME -u GITHUB_WORKFLOW python -m pytest -q tests/test_kis_ws_price.py tests/us
      - name: PR243 incident / full tick / performance three-gate acceptance
        env:
          US243_BENCH_REPORT_DIR: artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          env -u GITHUB_EVENT_NAME -u GITHUB_WORKFLOW python -m pytest -q -s \
            tests/us/test_us243_oct19_live_evidence_replay.py \
            tests/us/test_us243_oct19_permission_hash_regression.py \
            tests/us/test_us_20261007_sustained_real_buy_ack.py \
            tests/us/test_us_pr243_latency_fail_closed.py \
            | tee artifacts/pr243-three-gate-test.log
          python - <<'PY'
          import json
          from pathlib import Path
          lines=Path("artifacts/pr243-three-gate-test.log").read_text().splitlines()
          samples=[json.loads(x.split("US_PB1_BUY_ACK_20TICK_METRICS=",1)[1])
                   for x in lines if "US_PB1_BUY_ACK_20TICK_METRICS=" in x]
          assert len(samples)==2, "both full-tick PG acceptance variants required"
          for sample in samples:
              assert sample["ticks"]==20
              assert sample["buy_ack"] in (18,20)
              assert sample["protective_sell_ack"]==1
              assert sample["first_broker_submit"]=="SELL"
              assert sample["sql_read_total"]>0 and sample["sql_write_total"]>0
              assert sample["duplicate_replay_blocked"] is True
              assert sample["tick_wall_p95_sec"]<=60.0
              assert sample["entry_defer_count"]==0
              assert sample["measurement"]=="scaled_ci_nonproduction_latency"
          acceptance={
              "historical_oct19_original_86_pre_io_replay":"PASS",
              "historical_abort_hash_permission_mismatch":"PASS",
              "mock_kis_real_postgres_full_tick":"PASS",
              "full_tick_sample_count_each":20,
              "full_tick_p95_sec_each":[x["tick_wall_p95_sec"] for x in samples],
              "full_tick_broker_ack_each":[x["buy_ack"] for x in samples],
              "protective_sell_ack_each":[x["protective_sell_ack"] for x in samples],
              "durable_duplicates_blocked_each":[x["duplicate_replay_blocked"] for x in samples],
              "no_kis_order_posts":True,
              "production_wsl_p95_verification":"NOT_PERFORMED",
              "production_natural_buy_sell_and_real_fills":"NOT_PERFORMED",
              "test_provenance":"CI_SCALED_MOCK_KIS_REAL_POSTGRES",
          }
          out=Path("artifacts/pr243-three-gate-acceptance.json")
          out.write_text(json.dumps(acceptance,indent=2)+"\n")
          print("US243_THREE_GATE_ACCEPTANCE="+json.dumps(acceptance,sort_keys=True))
          PY
      - name: Preserve PR243 three-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us243-three-gate-offline-not-live-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
      - name: Run all broker-free offline scenario replays
        run: |
          python -m trader.us.harness.runner --scenario all --offline

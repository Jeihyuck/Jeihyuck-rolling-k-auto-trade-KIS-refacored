name: Trade Prep

"on":
  schedule:
    # Sun-Thu 23:00 UTC = Mon-Fri 08:00 KST
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice

concurrency:
  group: pb1-practice-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  STRATEGY_ENV: practice
  KIS_ENV: practice
  KIS_HTTP_ENABLED: "0"
  NO_TRADE: "1"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Verify KIS env contract
        run: |
          set -euo pipefail

          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          echo "[ENV_CHECK] KIS_REST_URL=${KIS_REST_URL:-}"

          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }

          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }

          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }

          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Run PREP
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m trader.prep_runner 2>&1 | tee artifacts/prep.log

      - name: Verify PREP log contract
        run: |
          set -euo pipefail
          export VERIFY_PREP_REQUIRE_CANONICAL=1
          python scripts/verify_prep_log.py artifacts/prep.log

      - name: Verify PREP quality contract
        run: |
          set -euo pipefail
          python scripts/verify_prep_quality.py | tee artifacts/prep-summary.txt
          latest_manifest="$(ls -1t runtime/prep/*/prep_manifest.json | head -n 1)"
          echo "final30_scored_snapshot_hint=runtime/prep/*/final30_locked.json" | tee -a artifacts/prep-summary.txt
          echo "prep_manifest_path=${latest_manifest}" | tee -a artifacts/prep-summary.txt

      - name: Verify PREP canonical verdict
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("runtime/prep").glob("*/prep_manifest.json"))
          if not manifests:
              raise SystemExit("[PREP][VERIFY][FAIL] canonical prep manifest missing")
          manifest_path = manifests[-1]
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          cq = payload.get("canonical_quality") or {}

          quality_ok = int(cq.get("quality_ok", payload.get("final30_quality_ok", 0)) or 0)
          status = str(cq.get("status", payload.get("build_status", "")) or "")
          trade_can_proceed = int(cq.get("trade_can_proceed", payload.get("trade_can_proceed", 0)) or 0)
          flow_failed_ratio = float(payload.get("flow_failed_ratio", 0.0) or 0.0)
          flow_reason_counts = payload.get("flow_fail_reason_counts") or {}
          has_final30_contract = int(payload.get("final30_count", 0) or 0) == 30

          print(f"[PREP][VERIFY][CANONICAL] manifest={manifest_path}")
          print(
              f"[PREP][VERIFY][CANONICAL] final30_contract_ok={int(has_final30_contract)} "
              f"quality_ok={quality_ok} status={status} flow_failed_ratio={flow_failed_ratio:.3f} "
              f"trade_can_proceed={trade_can_proceed} flow_fail_reason_counts={flow_reason_counts}"
          )

          if not has_final30_contract:
              raise SystemExit("[PREP][VERIFY][FAIL] final30_scored contract not met")
          if quality_ok != 1:
              raise SystemExit("[PREP][VERIFY][FAIL] quality_ok!=1")
          if status.upper() == "FAIL":
              raise SystemExit("[PREP][VERIFY][FAIL] status=FAIL")
          if flow_failed_ratio >= 1.0:
              raise SystemExit("[PREP][VERIFY][FAIL] flow_failed_ratio>=1.0")
          if trade_can_proceed != 1:
              raise SystemExit("[PREP][VERIFY][FAIL] trade_can_proceed!=1")
          PY

          latest_prep_dir="$(ls -1dt runtime/prep/* | head -n 1)"
          cp "${latest_prep_dir}/prep_manifest.json" artifacts/prep-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/prep-manifest.json").read_text(encoding="utf-8"))
          quality_summary = {
              "canonical_quality": manifest.get("canonical_quality"),
              "final30_quality": manifest.get("final30_quality"),
              "final30_quality_ok": manifest.get("final30_quality_ok"),
          }
          flow_summary = {
              "flow_total_symbols": manifest.get("flow_total_symbols"),
              "flow_success_symbols": manifest.get("flow_success_symbols"),
              "flow_failed_symbols": manifest.get("flow_failed_symbols"),
              "flow_failed_ratio": manifest.get("flow_failed_ratio"),
              "flow_provider_usage_kis": manifest.get("flow_provider_usage_kis"),
              "flow_provider_usage_pykrx": manifest.get("flow_provider_usage_pykrx"),
              "flow_provider_usage_none": manifest.get("flow_provider_usage_none"),
              "flow_fail_reason_counts": manifest.get("flow_fail_reason_counts"),
              "kis_disabled_reason": manifest.get("kis_disabled_reason"),
              "pykrx_disabled_reason": manifest.get("pykrx_disabled_reason"),
          }
          Path("artifacts/quality-summary.json").write_text(json.dumps(quality_summary, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("artifacts/flow-summary.json").write_text(json.dumps(flow_summary, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload prep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-prep-logs
          path: |
            repo/artifacts/
            repo/runtime/prep/*/prep_manifest.json
            repo/runtime/prep/*/final30_locked.json
          if-no-files-found: ignore

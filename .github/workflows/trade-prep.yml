name: Trade Prep

"on":
  schedule:
    # Sun-Thu 23:00 UTC = Mon-Fri 08:00 KST
    - cron: "0 23 * * 0-4"
  workflow_dispatch: {}

concurrency:
  group: pb1-practice-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  STRATEGY_ENV: practice
  KIS_ENV: practice
  KIS_HTTP_ENABLED: "0"
  NO_TRADE: "1"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Run PREP
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m trader.prep_runner 2>&1 | tee artifacts/prep.log

      - name: Verify PREP log contract
        run: |
          set -euo pipefail
          python scripts/verify_prep_log.py artifacts/prep.log

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload prep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-prep-logs
          path: repo/artifacts/
          if-no-files-found: ignore

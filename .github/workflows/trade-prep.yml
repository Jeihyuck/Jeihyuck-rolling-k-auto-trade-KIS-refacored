name: Trade Prep (KST 06:50)

"on":
  schedule:
    # KST Mon-Fri 06:50 = UTC Sun-Thu 21:50
    # Avoid top-of-hour GitHub Actions schedule congestion.
    - cron: "50 21 * * 0-4"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice

concurrency:
  group: trade-prep-practice-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EXPECTED_BRANCH: "dual-agent"
  STRATEGY_ENV: practice
  KIS_ENV: practice
  MODE: prep
  PB1_FORCE_TRADE_SESSION: "prep"
  PB1_SESSION_KIND: "prep"
  FORCE_PB1_PHASE: "prep"
  PB1_FORCE_TRADE_AM_LATE_START: "0"
  PB1_FORCE_TRADE_AM_AFTER_1030: "0"
  PB1_FORCE_TRADE_PM_LATE_START: "0"
  PB1_FORCE_TRADE_PM_AFTER_1340: "0"
  PB1_ENABLE_LATE_AM_RECOVERY: "0"
  PB1_AM_RECOVERY_ALLOW_UNTIL: "10:30"
  PB1_ENABLE_LATE_PM_RECOVERY: "0"
  PB1_PM_RECOVERY_ALLOW_UNTIL: "13:40"
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final_scored"
  STRATEGY_MODE: DIAG
  KIS_HTTP_ENABLED: "0"
  ALLOW_KIS_DATA_HTTP_IN_DIAG: "1"
  NO_TRADE: "1"
  PAPER_MAX_CAPITAL_KRW: "100000000"
  EXPECTED_PRACTICE_CAPITAL_KRW: "100000000"
  ACCOUNT_SANITY_CHECK: "1"
  ACCOUNT_SANITY_FAIL_IF_MISMATCH: "1"
  EXPECTED_INITIAL_HOLDINGS: "0"
  KIS_PRICE_MIN_INTERVAL_MS: "400"
  KIS_PRICE_CACHE_TTL_SEC: "15"
  KIS_RATE_LIMIT_COOLDOWN_SEC: "20"
  PB1_CAPITAL_MODE: "CASH"
  PB1_ENTRY_CAPITAL_KRW: "0"
  PB1_CASH_RESERVE_PCT: "0.10"
  DB_DISABLE_PREPARED_STATEMENTS: "1"
  # [2026-05-06] Stale open order cleanup
  PB1_EXPIRE_STALE_OPEN_ORDERS: "1"
  PB1_STALE_OPEN_ORDER_MAX_MINUTES: "30"
  PB1_STALE_OPEN_ORDER_REPAIR_PRACTICE: "1"
  PB1_RECONCILE_ONLY_GLOBAL_SKIP: "0"
  PB1_FORCE_RECONCILE_ONLY: "0"
  # [2026-05-13] KIS empty guard for Korean market
  KR_AUTHORITATIVE_KIS_BALANCE_FOR_EXIT: "1"
  KR_BLOCK_LEDGER_RECONSTRUCT_WHEN_KIS_EMPTY: "1"
  KR_ALLOW_LEDGER_RECONSTRUCT_WITHOUT_KIS: "0"
  # [2026-05-27] DB 타임아웃 및 레포 fail-open / PNL 공식값
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  DB_POOL_TIMEOUT: "10"
  PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"
  PB1_FAIL_OPEN_ON_POSITION_LOOKUP_TIMEOUT: "1"
  PB1_FAIL_OPEN_ON_FILL_LOOKUP_TIMEOUT: "1"
  PB1_FAIL_OPEN_ON_LEDGER_LOOKUP_TIMEOUT: "1"
  PNL_USE_KIS_OFFICIAL_TOTAL_EQUITY: "1"
  PNL_DISABLE_NXDY_DOUBLE_COUNT_EQUITY: "1"
  PNL_TODAY_TRADES_USE_ACTUAL_FILL_PRICE: "1"
  PNL_REQUIRE_TRADE_REASON: "1"
  PB1_ASSERT_DISTINGUISH_POSTPROCESS_FAILURE: "1"

defaults:
  run:
    shell: bash

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Branch guard
        run: |
          set -euo pipefail
          echo "[BRANCH_GUARD] event=${GITHUB_EVENT_NAME:-} actor=${GITHUB_ACTOR:-} ref=${GITHUB_REF:-} ref_name=${GITHUB_REF_NAME:-} sha=${GITHUB_SHA:-}"
          echo "[BRANCH_GUARD] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "::error::Wrong branch execution blocked. expected=${EXPECTED_BRANCH}, actual=${GITHUB_REF_NAME}"
            echo "[BRANCH_GUARD][FAIL] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "[BRANCH_GUARD][OK] branch=${GITHUB_REF_NAME} sha=${GITHUB_SHA:-}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          echo "[CHECKOUT][OK] repo path ready"

      - name: Initialize PREP trigger log
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          now_kst="$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S+09:00')"
          run_date="$(TZ=Asia/Seoul date '+%Y-%m-%d')"
          dow="$(TZ=Asia/Seoul date +%u)"

          # KRX 거래일 판단 (inline 목록)
          is_krx_trading_day=1
          krx_holiday_reason=""
          if [[ "$dow" -ge 6 ]]; then
            is_krx_trading_day=0
            krx_holiday_reason="weekend"
          fi
          KRX_HOLIDAYS_2025="2025-01-01 2025-01-27 2025-01-28 2025-01-29 2025-01-30 2025-03-03 2025-05-05 2025-05-06 2025-06-06 2025-08-15 2025-10-03 2025-10-06 2025-10-07 2025-10-08 2025-10-09 2025-12-25 2025-12-31"
          KRX_HOLIDAYS_2026="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-05 2026-05-25 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
          KRX_HOLIDAYS_2027="2027-01-01 2027-02-08 2027-02-09 2027-02-10 2027-03-01 2027-05-05 2027-05-13 2027-06-07 2027-08-16 2027-09-20 2027-09-21 2027-09-22 2027-10-04 2027-12-27 2027-12-31"
          if [[ "$is_krx_trading_day" == "1" ]]; then
            for h in ${KRX_HOLIDAYS_2025} ${KRX_HOLIDAYS_2026} ${KRX_HOLIDAYS_2027}; do
              if [[ "$run_date" == "$h" ]]; then
                is_krx_trading_day=0
                krx_holiday_reason="krx_holiday:${h}"
                break
              fi
            done
          fi

          {
            echo "[TRADE_PREP][CONTEXT] now_kst=${now_kst} run_date=${run_date} is_krx_trading_day=${is_krx_trading_day} actual_as_of=TBD AS_OF_OVERRIDE=${AS_OF_OVERRIDE:-} STRATEGY_ENV=${STRATEGY_ENV:-practice} github_event=${GITHUB_EVENT_NAME} github_workflow=${GITHUB_WORKFLOW} github_run_id=${GITHUB_RUN_ID} github_ref=${GITHUB_REF_NAME}"
            echo "[RESOLVE] event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} mode=${MODE:-prep} phase=prep"
            echo "[PREP][MODE] mode=${MODE:-prep} phase=prep session=prep"
            echo "[RESOLVE] force_trade_session=${PB1_FORCE_TRADE_SESSION:-auto}"
            echo "[RESOLVE] am_recovery=${PB1_ENABLE_LATE_AM_RECOVERY:-0} am_recovery_until=${PB1_AM_RECOVERY_ALLOW_UNTIL:-unset}"
            echo "[RESOLVE] pm_recovery=${PB1_ENABLE_LATE_PM_RECOVERY:-0} pm_recovery_until=${PB1_PM_RECOVERY_ALLOW_UNTIL:-unset}"
            echo "[RESOLVE] force_am_late=${PB1_FORCE_TRADE_AM_LATE_START:-0} force_am_after_1030=${PB1_FORCE_TRADE_AM_AFTER_1030:-0}"
            echo "[RESOLVE] force_pm_late=${PB1_FORCE_TRADE_PM_LATE_START:-0} force_pm_after_1340=${PB1_FORCE_TRADE_PM_AFTER_1340:-0}"
            echo "[PREP][TRIGGER] event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[PREP][START_META] now_kst=${now_kst} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
            if [[ "$is_krx_trading_day" == "0" ]]; then
              echo "[TIME][KRX][HOLIDAY] date=${run_date} reason=${krx_holiday_reason} source=workflow_inline"
            fi
          } | tee repo/artifacts/prep.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Check canonical PREP duplicate guard
        id: duplicate_guard
        working-directory: repo
        env:
          ALLOW_DUPLICATE_PREP: "0"
        run: |
          set -euo pipefail
          python scripts/check_prep_duplicate_guard.py 2>&1 | tee -a artifacts/prep.log

      - name: Verify KIS env contract
        working-directory: repo
        run: |
          set -euo pipefail

          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          echo "[ENV_CHECK] KIS_REST_URL=${KIS_REST_URL:-}"

          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }

          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }

          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }

          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Run PREP
        if: steps.duplicate_guard.outputs.should_skip != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.prep_runner 2>&1 | tee -a artifacts/prep.log

      - name: Verify exact scored final30 in DB
        if: steps.duplicate_guard.outputs.should_skip != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, is_krx_trading_day, resolve_prev_krx_trading_day

          env = os.getenv("STRATEGY_ENV", "practice")
          today = now_kst().date()
          as_of_override = (os.getenv("AS_OF_OVERRIDE") or "").strip()

          if as_of_override:
              from datetime import date
              actual_as_of = date.fromisoformat(as_of_override)
              if not is_krx_trading_day(actual_as_of):
                  raise SystemExit(
                      f"[TRADE_PREP][AS_OF_OVERRIDE_INVALID] "
                      f"date={actual_as_of.isoformat()} is NOT a KRX trading day. "
                      f"Do not override prep as_of to a holiday."
                  )
          else:
              actual_as_of = resolve_prev_krx_trading_day(today)

          actual_as_of_str = actual_as_of.isoformat()
          print(f"[PREP][ASOF_RESOLVED] actual_as_of={actual_as_of_str} source={'AS_OF_OVERRIDE' if as_of_override else 'KRX_CANONICAL'}")
          print(f"[PREP][FINAL30_SCORED_SAVE_START] as_of={actual_as_of_str} env={env}")

          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              as_of=actual_as_of_str,
              strategy=os.getenv("WATCHLIST_FINAL_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              require_exact_rows=30,
              fail_if_missing=True,
          )
          rows = len(df) if df is not None and not df.empty else 0
          if rows == 30:
              print(f"[PREP][FINAL30_SCORED_VERIFY_OK] as_of={actual_as_of_str} rows={rows}")
              print(f"[PREP][DB_VERIFY][OK] as_of={actual_as_of_str} rows={rows}")
          else:
              raise SystemExit(
                  f"[PREP][FINAL30_SCORED_VERIFY_FAIL] as_of={actual_as_of_str} rows={rows} (expected 30)"
              )
          PY

      - name: Verify PREP log contract
        working-directory: repo
        run: |
          set -euo pipefail
          export VERIFY_PREP_REQUIRE_CANONICAL=1
          python scripts/verify_prep_log.py artifacts/prep.log

      - name: Verify PREP quality contract
        if: steps.duplicate_guard.outputs.should_skip != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/verify_prep_quality.py | tee artifacts/prep-summary.txt
          latest_manifest="$(ls -1t runtime/prep/*/prep_manifest.json | head -n 1)"
          echo "final30_scored_snapshot_hint=runtime/prep/*/final30_locked.json" | tee -a artifacts/prep-summary.txt
          echo "prep_manifest_path=${latest_manifest}" | tee -a artifacts/prep-summary.txt

      - name: Verify PREP canonical verdict
        if: steps.duplicate_guard.outputs.should_skip != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("runtime/prep").glob("*/prep_manifest.json"))
          if not manifests:
              raise SystemExit("[PREP][VERIFY][FAIL] canonical prep manifest missing")
          manifest_path = manifests[-1]
          payload = json.loads(manifest_path.read_text(encoding="utf-8"))
          cq = payload.get("canonical_quality") or {}

          quality_ok = int(cq.get("quality_ok", payload.get("final30_quality_ok", 0)) or 0)
          status = str(cq.get("status", payload.get("build_status", "")) or "")
          trade_can_proceed = int(cq.get("trade_can_proceed", payload.get("trade_can_proceed", 0)) or 0)
          flow_failed_ratio = float(payload.get("flow_failed_ratio", 0.0) or 0.0)
          flow_reason_counts = payload.get("flow_fail_reason_counts") or {}
          has_final30_contract = int(payload.get("final30_count", 0) or 0) == 30

          print(f"[PREP][VERIFY][CANONICAL] manifest={manifest_path}")
          print(
              f"[PREP][VERIFY][CANONICAL] final30_contract_ok={int(has_final30_contract)} "
              f"quality_ok={quality_ok} status={status} flow_failed_ratio={flow_failed_ratio:.3f} "
              f"trade_can_proceed={trade_can_proceed} flow_fail_reason_counts={flow_reason_counts}"
          )

          if not has_final30_contract:
              raise SystemExit("[PREP][VERIFY][FAIL] final30_scored contract not met")
          if quality_ok != 1:
              raise SystemExit("[PREP][VERIFY][FAIL] quality_ok!=1")
          if status.upper() == "FAIL":
              raise SystemExit("[PREP][VERIFY][FAIL] status=FAIL")
          if flow_failed_ratio >= 1.0:
              raise SystemExit("[PREP][VERIFY][FAIL] flow_failed_ratio>=1.0")
          if trade_can_proceed != 1:
              raise SystemExit("[PREP][VERIFY][FAIL] trade_can_proceed!=1")
          PY

          latest_prep_dir="$(ls -1dt runtime/prep/* | head -n 1)"
          cp "${latest_prep_dir}/prep_manifest.json" artifacts/prep-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("artifacts/prep-manifest.json").read_text(encoding="utf-8"))
          quality_summary = {
              "canonical_quality": manifest.get("canonical_quality"),
              "final30_quality": manifest.get("final30_quality"),
              "final30_quality_ok": manifest.get("final30_quality_ok"),
          }
          flow_summary = {
              "flow_total_symbols": manifest.get("flow_total_symbols"),
              "flow_success_symbols": manifest.get("flow_success_symbols"),
              "flow_failed_symbols": manifest.get("flow_failed_symbols"),
              "flow_failed_ratio": manifest.get("flow_failed_ratio"),
              "flow_provider_usage_kis": manifest.get("flow_provider_usage_kis"),
              "flow_provider_usage_pykrx": manifest.get("flow_provider_usage_pykrx"),
              "flow_provider_usage_none": manifest.get("flow_provider_usage_none"),
              "flow_fail_reason_counts": manifest.get("flow_fail_reason_counts"),
              "kis_disabled_reason": manifest.get("kis_disabled_reason"),
              "pykrx_disabled_reason": manifest.get("pykrx_disabled_reason"),
          }
          Path("artifacts/quality-summary.json").write_text(json.dumps(quality_summary, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("artifacts/flow-summary.json").write_text(json.dumps(flow_summary, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Scan for SQLite artifacts
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload prep diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-diagnostics-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/runtime/prep/*/prep_manifest.json
            repo/runtime/prep/*/final30_locked.json
            repo/runtime/prep/*/quality-summary.json
            repo/runtime/prep/*/flow-summary.json
            repo/runtime/**
            repo/reports/**
            repo/logs/**
          if-no-files-found: ignore
          retention-days: 14

name: KR244 Offline Order Performance & Sell Reconcile

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "trader/pb1_engine.py"
      - "trader/pb1_runner.py"
      - "trader/db/repos.py"
      - "trader/reconcile_kis.py"
      - "trader/kr/unpriced_sell_audit.py"
      - "tests/kr/test_kr_20261020_bulk_dedupe_postsubmit_reconcile.py"
      - ".github/workflows/kr244-offline-order-reconcile-ci.yml"

permissions:
  contents: read

jobs:
  kr244-offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIS_ENV: practice
      STRATEGY_ENV: practice
      DRY_RUN: "1"
      LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile changed modules
        run: |
          python -m py_compile trader/db/repos.py trader/pb1_engine.py trader/pb1_runner.py trader/reconcile_kis.py trader/kr/unpriced_sell_audit.py
      - name: Run isolated SQLite and source-path regressions
        run: python -m pytest -q tests/kr/test_kr_20261020_bulk_dedupe_postsubmit_reconcile.py

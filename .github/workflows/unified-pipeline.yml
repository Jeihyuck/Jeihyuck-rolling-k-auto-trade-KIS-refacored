name: Unified Pipeline Manual Debug (Non-Scheduled)

on:
  # NOTE: This workflow is manual-debug only.
  # Production scheduling lives in trade-prep.yml, trade-am.yml, trade-pm.yml, and trade-close.yml.
  workflow_dispatch:
    inputs:
      mode:
        description: Manual debug mode
        required: true
        default: trade
        type: choice
        options:
          - prep
          - trade
          - close
      FORCE_RUN:
        description: Force full trade path for manual dry-run validation
        required: false
        default: "0"
        type: string
      WATCHLIST_MODE:
        description: Bypass universe and use WATCHLIST symbols directly
        required: false
        default: "0"
        type: string
      WATCHLIST:
        description: Comma-separated watchlist for manual validation
        required: false
        default: 005930,000660,035420
        type: string
      FORCE_MARKET_WINDOW:
        description: Override market window for manual validation
        required: false
        default: after
        type: choice
        options:
          - preopen
          - morning
          - day
          - close
          - after
      FORCE_PB1_PHASE:
        description: Override PB1 phase for manual validation
        required: false
        default: entry
        type: choice
        options:
          - entry
          - exit
          - manage
          - prep
          - verify
      PB1_DIAG_FULL_EXEC:
        description: Force DIAG manual route through full engine path
        required: false
        default: "0"
        type: string
      PB1_UNIVERSE_STRATEGY:
        description: Trade universe strategy source
        required: false
        default: pb1_watchlist_final_scored
        type: string
      TRADE_REQUIRE_PREP_FINAL30_SCORED:
        description: Require exact scored final30 lock before trade
        required: false
        default: "1"
        type: string
      ALLOW_DUPLICATE_PREP:
        description: Allow manual prep rerun even when canonical prep is already ready
        required: false
        default: "0"
        type: string
      ALLOW_KIS_DATA_HTTP_IN_DIAG:
        description: Allow token, balance, and quote HTTP in DIAG manual route
        required: false
        default: "1"
        type: string
      ENABLE_LATE_AM_RECOVERY:
        description: Allow late AM recovery run before cutoff
        required: false
        default: "1"
        type: string
      FORCE_TRADE_AM_LATE_START:
        description: "1=allow manual/schedule trade-am start even after normal cutoff"
        required: true
        default: "0"
        type: string
      FORCE_TRADE_AM_AFTER_1030:
        description: "1=allow manual trade-am start after 10:30 KST"
        required: true
        default: "0"
        type: string
      AM_RECOVERY_ALLOW_UNTIL:
        description: Late AM recovery deadline in KST (HH:MM)
        required: true
        default: "10:30"
        type: string
      ENABLE_LATE_PM_RECOVERY:
        description: Allow late PM recovery run before cutoff
        required: false
        default: "1"
        type: string
      PM_RECOVERY_ALLOW_UNTIL:
        description: Late PM recovery cutoff in KST
        required: false
        default: "13:40"
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'prep' && format('unified-manual-practice-prep-debug-{0}', github.ref_name) || format('unified-manual-practice-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  STRATEGY_ENV: practice
  KIS_ENV: practice
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final_scored"
  PAPER_MAX_CAPITAL_KRW: "100000000"
  PB1_CAPITAL_MODE: "CASH"
  PB1_ENTRY_CAPITAL_KRW: "0"
  PB1_CASH_RESERVE_PCT: "0.10"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      run_mode: ${{ steps.resolve.outputs.run_mode }}
      strategy_mode: ${{ steps.resolve.outputs.strategy_mode }}
      allow_live_gate: ${{ steps.resolve.outputs.allow_live_gate }}
      force_block_live: ${{ steps.resolve.outputs.force_block_live }}
      dryrun: ${{ steps.resolve.outputs.dryrun }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      disable_live_trading: ${{ steps.resolve.outputs.disable_live_trading }}
      live_trading_enabled: ${{ steps.resolve.outputs.live_trading_enabled }}
      kis_http_enabled: ${{ steps.resolve.outputs.kis_http_enabled }}
      no_trade: ${{ steps.resolve.outputs.no_trade }}
      allow_kis_data_http_in_diag: ${{ steps.resolve.outputs.allow_kis_data_http_in_diag }}
      allow_after_close_entry_dryrun: ${{ steps.resolve.outputs.allow_after_close_entry_dryrun }}
    steps:
      - name: Resolve manual route
        id: resolve
        shell: bash
        working-directory: .
        env:
          MODE_INPUT: ${{ inputs.mode }}
          FORCE_RUN_INPUT: ${{ inputs.FORCE_RUN || '0' }}
          WATCHLIST_MODE_INPUT: ${{ inputs.WATCHLIST_MODE || '0' }}
          PB1_DIAG_FULL_EXEC_INPUT: ${{ inputs.PB1_DIAG_FULL_EXEC || '0' }}
          FORCE_MARKET_WINDOW_INPUT: ${{ inputs.FORCE_MARKET_WINDOW || '' }}
          FORCE_PB1_PHASE_INPUT: ${{ inputs.FORCE_PB1_PHASE || '' }}
          ALLOW_KIS_DATA_HTTP_IN_DIAG_INPUT: ${{ inputs.ALLOW_KIS_DATA_HTTP_IN_DIAG || '1' }}
          ENABLE_LATE_AM_RECOVERY_INPUT: ${{ inputs.ENABLE_LATE_AM_RECOVERY || '1' }}
          FORCE_TRADE_AM_LATE_START_INPUT: ${{ inputs.FORCE_TRADE_AM_LATE_START || '0' }}
          FORCE_TRADE_AM_AFTER_1030_INPUT: ${{ inputs.FORCE_TRADE_AM_AFTER_1030 || '0' }}
          AM_RECOVERY_ALLOW_UNTIL_INPUT: ${{ inputs.AM_RECOVERY_ALLOW_UNTIL || '10:30' }}
          ENABLE_LATE_PM_RECOVERY_INPUT: ${{ inputs.ENABLE_LATE_PM_RECOVERY || '1' }}
          PM_RECOVERY_ALLOW_UNTIL_INPUT: ${{ inputs.PM_RECOVERY_ALLOW_UNTIL || '13:40' }}
        run: |
          set -euo pipefail
          run_mode="${MODE_INPUT}"
          strategy_mode="AUTO"
          allow_live_gate="1"
          force_block_live="0"
          dryrun="0"
          dry_run="0"
          disable_live_trading="0"
          live_trading_enabled="1"
          kis_http_enabled="1"
          no_trade="0"
          allow_kis_data_http_in_diag="${ALLOW_KIS_DATA_HTTP_IN_DIAG_INPUT}"
          allow_after_close_entry_dryrun="0"

          manual_trade_route=0
          if [[ "${MODE_INPUT}" == "trade" && ( "${FORCE_RUN_INPUT}" == "1" || "${PB1_DIAG_FULL_EXEC_INPUT}" == "1" || "${WATCHLIST_MODE_INPUT}" == "1" ) ]]; then
            manual_trade_route=1
          fi

          if [[ "${MODE_INPUT}" == "trade" && "${PB1_DIAG_FULL_EXEC_INPUT}" == "1" && "${FORCE_MARKET_WINDOW_INPUT}" == "day" && "${FORCE_PB1_PHASE_INPUT}" == "entry" ]]; then
            allow_after_close_entry_dryrun="1"
          fi

          if [[ "${MODE_INPUT}" == "prep" ]]; then
            strategy_mode="DIAG"
            allow_live_gate="0"
            force_block_live="1"
            dryrun="1"
            dry_run="1"
            disable_live_trading="1"
            live_trading_enabled="0"
            kis_http_enabled="0"
            no_trade="1"
          elif [[ "${MODE_INPUT}" == "close" ]]; then
            strategy_mode="AUTO"
          elif [[ "${manual_trade_route}" == "1" ]]; then
            strategy_mode="DIAG"
            allow_live_gate="0"
            force_block_live="1"
            dryrun="1"
            dry_run="1"
            disable_live_trading="1"
            live_trading_enabled="0"
            kis_http_enabled="1"
            no_trade="0"
            allow_kis_data_http_in_diag="1"
          fi

          {
            echo "run_mode=${run_mode}"
            echo "strategy_mode=${strategy_mode}"
            echo "allow_live_gate=${allow_live_gate}"
            echo "force_block_live=${force_block_live}"
            echo "dryrun=${dryrun}"
            echo "dry_run=${dry_run}"
            echo "disable_live_trading=${disable_live_trading}"
            echo "live_trading_enabled=${live_trading_enabled}"
            echo "kis_http_enabled=${kis_http_enabled}"
            echo "no_trade=${no_trade}"
            echo "allow_kis_data_http_in_diag=${allow_kis_data_http_in_diag}"
            echo "allow_after_close_entry_dryrun=${allow_after_close_entry_dryrun}"
          } >> "$GITHUB_OUTPUT"
          echo "[RESOLVE] event=${GITHUB_EVENT_NAME}"
          echo "[RESOLVE] actor=${GITHUB_ACTOR}"
          echo "[RESOLVE] mode=${run_mode}"
          echo "[RESOLVE] force_trade_am_late_start=${FORCE_TRADE_AM_LATE_START_INPUT}"
          echo "[RESOLVE] force_trade_am_after_1030=${FORCE_TRADE_AM_AFTER_1030_INPUT}"
          echo "[RESOLVE] am_recovery_allow_until=${AM_RECOVERY_ALLOW_UNTIL_INPUT}"
          echo "[RESOLVE] am_recovery=${ENABLE_LATE_AM_RECOVERY_INPUT} am_recovery_until=${AM_RECOVERY_ALLOW_UNTIL_INPUT}"
          echo "[RESOLVE] pm_recovery=${ENABLE_LATE_PM_RECOVERY_INPUT} pm_recovery_until=${PM_RECOVERY_ALLOW_UNTIL_INPUT}"

  manual_debug:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: repo

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      MODE: ${{ needs.resolve.outputs.run_mode }}
      MANUAL_MODE: ${{ inputs.mode }}
      STRATEGY_MODE: ${{ needs.resolve.outputs.strategy_mode }}
      ALLOW_LIVE_GATE: ${{ needs.resolve.outputs.allow_live_gate }}
      FORCE_BLOCK_LIVE: ${{ needs.resolve.outputs.force_block_live }}
      DRYRUN: ${{ needs.resolve.outputs.dryrun }}
      DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
      DISABLE_LIVE_TRADING: ${{ needs.resolve.outputs.disable_live_trading }}
      LIVE_TRADING_ENABLED: ${{ needs.resolve.outputs.live_trading_enabled }}
      KIS_HTTP_ENABLED: ${{ needs.resolve.outputs.kis_http_enabled }}
      NO_TRADE: ${{ needs.resolve.outputs.no_trade }}
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_RUN || '0' }}
      WATCHLIST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.WATCHLIST_MODE || '0' }}
      WATCHLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.WATCHLIST || '' }}
      FORCE_MARKET_WINDOW: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_MARKET_WINDOW || '' }}
      FORCE_PB1_PHASE: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_PB1_PHASE || '' }}
      PB1_DIAG_FULL_EXEC: ${{ github.event_name == 'workflow_dispatch' && inputs.PB1_DIAG_FULL_EXEC || '0' }}
      PB1_UNIVERSE_STRATEGY: ${{ github.event_name == 'workflow_dispatch' && inputs.PB1_UNIVERSE_STRATEGY || 'pb1_watchlist_final_scored' }}
      TRADE_REQUIRE_PREP_FINAL30_SCORED: ${{ github.event_name == 'workflow_dispatch' && inputs.TRADE_REQUIRE_PREP_FINAL30_SCORED || '1' }}
      ALLOW_KIS_DATA_HTTP_IN_DIAG: ${{ needs.resolve.outputs.allow_kis_data_http_in_diag }}
      PB1_ALLOW_AFTER_CLOSE_ENTRY_DRYRUN: ${{ needs.resolve.outputs.allow_after_close_entry_dryrun }}
      ALLOW_DUPLICATE_PREP: ${{ github.event_name == 'workflow_dispatch' && inputs.ALLOW_DUPLICATE_PREP || '0' }}
      PB1_ENABLE_LATE_AM_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.ENABLE_LATE_AM_RECOVERY || '1' }}
      PB1_FORCE_TRADE_AM_LATE_START: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_TRADE_AM_LATE_START || '0' }}
      PB1_FORCE_TRADE_AM_AFTER_1030: ${{ github.event_name == 'workflow_dispatch' && inputs.FORCE_TRADE_AM_AFTER_1030 || '0' }}
      PB1_AM_RECOVERY_ALLOW_UNTIL: ${{ github.event_name == 'workflow_dispatch' && inputs.AM_RECOVERY_ALLOW_UNTIL || '10:30' }}
      PB1_ENABLE_LATE_PM_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.ENABLE_LATE_PM_RECOVERY || '1' }}
      PB1_PM_RECOVERY_ALLOW_UNTIL: ${{ github.event_name == 'workflow_dispatch' && inputs.PM_RECOVERY_ALLOW_UNTIL || '13:40' }}
      PB1_AM_EXPECTED_START: "09:07"
      PB1_AM_EXPECTED_END: "09:15"
      PB1_AM_START_ALLOW_UNTIL: "09:30"
      PB1_AM_EXPECTED_START_FROM: "0907"
      PB1_AM_EXPECTED_START_TO: "0915"
      PB1_PM_EXPECTED_START_FROM: "1305"
      PB1_PM_EXPECTED_START_TO: "1315"
      PB1_PM_START_ALLOW_UNTIL: "1325"
      DB_LOCK_TIMEOUT_MS: "5000"
      DB_STATEMENT_TIMEOUT_MS: "15000"
      DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
      PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"
      PB1_BUYABLE_GATE_MAX_SEC: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify repo checkout path
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          pwd
          ls -la
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Initialize manual PREP trigger log
        if: ${{ inputs.mode == 'prep' }}
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          now_kst="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S %Z')"
          {
            echo "[PREP][TRIGGER] event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[PREP][START_META] now_kst=${now_kst} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/unified-manual.log

      - name: Check manual PREP duplicate guard
        if: ${{ inputs.mode == 'prep' }}
        id: prep_duplicate_guard
        run: |
          set -euo pipefail
          python scripts/check_prep_duplicate_guard.py 2>&1 | tee -a artifacts/unified-manual.log

      - name: Dump runtime env
        run: |
          set -euo pipefail
          echo "MODE=${MODE:-}"
          echo "STRATEGY_MODE=${STRATEGY_MODE:-}"
          echo "DRYRUN=${DRYRUN:-}"
          echo "DRY_RUN=${DRY_RUN:-}"
          echo "FORCE_RUN=${FORCE_RUN:-}"
          echo "WATCHLIST_MODE=${WATCHLIST_MODE:-}"
          echo "WATCHLIST=${WATCHLIST:-}"
          echo "FORCE_MARKET_WINDOW=${FORCE_MARKET_WINDOW:-}"
          echo "FORCE_PB1_PHASE=${FORCE_PB1_PHASE:-}"
          echo "PB1_DIAG_FULL_EXEC=${PB1_DIAG_FULL_EXEC:-}"
          echo "PB1_UNIVERSE_STRATEGY=${PB1_UNIVERSE_STRATEGY:-}"
          echo "TRADE_REQUIRE_PREP_FINAL30_SCORED=${TRADE_REQUIRE_PREP_FINAL30_SCORED:-}"
          echo "ALLOW_KIS_DATA_HTTP_IN_DIAG=${ALLOW_KIS_DATA_HTTP_IN_DIAG:-}"
          echo "PB1_ALLOW_AFTER_CLOSE_ENTRY_DRYRUN=${PB1_ALLOW_AFTER_CLOSE_ENTRY_DRYRUN:-}"
          echo "PB1_ENABLE_LATE_AM_RECOVERY=${PB1_ENABLE_LATE_AM_RECOVERY:-}"
          echo "PB1_AM_RECOVERY_ALLOW_UNTIL=${PB1_AM_RECOVERY_ALLOW_UNTIL:-}"
          echo "PB1_ENABLE_LATE_PM_RECOVERY=${PB1_ENABLE_LATE_PM_RECOVERY:-}"
          echo "PB1_PM_RECOVERY_ALLOW_UNTIL=${PB1_PM_RECOVERY_ALLOW_UNTIL:-}"

      - name: Verify exact scored final30 in DB for trade and close
        if: ${{ inputs.mode == 'trade' || inputs.mode == 'close' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              as_of=ctx["as_of"],
              strategy=os.getenv("WATCHLIST_FINAL_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[UNIFIED][PRECHECK][FINAL30][OK] as_of={ctx['as_of']} rows={len(df)}")
          PY

      - name: Run selected manual pipeline
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "$MANUAL_MODE" in
            prep)
              if [[ "${{ steps.prep_duplicate_guard.outputs.should_skip || '0' }}" != "1" ]]; then
                python -m trader.prep_runner 2>&1 | tee -a artifacts/unified-manual.log
              fi
              python scripts/verify_prep_log.py artifacts/unified-manual.log
              ;;
            trade)
              python -m trader.trade_tick 2>&1 | tee artifacts/unified-manual.log
              ;;
            close)
              export PB1_PHASE_DEFAULT=exit
              export PB1_ENTRY_ENABLED=0
              python -m trader.trade_tick 2>&1 | tee artifacts/unified-manual.log
              ;;
            *)
              echo "::error::Unsupported mode: $MANUAL_MODE"
              exit 1
              ;;
          esac

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload manual debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-unified-manual-logs
          path: repo/artifacts/
          if-no-files-found: ignore

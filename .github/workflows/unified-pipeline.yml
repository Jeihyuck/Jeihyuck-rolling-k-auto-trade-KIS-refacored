name: Unified Pipeline Manual Debug (Non-Scheduled)

on:
  # NOTE: This workflow is manual-debug only.
  # Production scheduling lives in trade-prep.yml, trade-am.yml, trade-pm.yml, and trade-close.yml.
  workflow_dispatch:
    inputs:
      mode:
        description: Manual debug mode
        required: true
        default: trade
        type: choice
        options:
          - prep
          - trade
          - close

concurrency:
  group: pb1-practice-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  STRATEGY_ENV: practice
  KIS_ENV: practice
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  manual_debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Run selected manual pipeline
        env:
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "$MANUAL_MODE" in
            prep)
              export KIS_HTTP_ENABLED=0
              export NO_TRADE=1
              python -m trader.prep_runner 2>&1 | tee artifacts/unified-manual.log
              python scripts/verify_prep_log.py artifacts/unified-manual.log
              ;;
            trade)
              export KIS_HTTP_ENABLED=1
              export NO_TRADE=0
              python -m trader.trade_tick 2>&1 | tee artifacts/unified-manual.log
              ;;
            close)
              export KIS_HTTP_ENABLED=1
              export NO_TRADE=0
              export PB1_PHASE_DEFAULT=exit
              export PB1_ENTRY_ENABLED=0
              python -m trader.trade_tick 2>&1 | tee artifacts/unified-manual.log
              ;;
            *)
              echo "::error::Unsupported mode: $MANUAL_MODE"
              exit 1
              ;;
          esac

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload manual debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-manual-logs
          path: repo/artifacts/
          if-no-files-found: ignore

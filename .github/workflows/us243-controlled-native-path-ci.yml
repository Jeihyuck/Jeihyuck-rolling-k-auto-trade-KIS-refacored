name: US243 Controlled Native Order Path and 20-Sample Gate

on:
  push:
    branches: [fix/us-broker-epoch-cycle-recovery-fence-20261104]
  pull_request:
    branches: [dual-agent]
    paths:
      - ".github/workflows/us243-controlled-native-path-ci.yml"
      - "tests/us/test_us_pr243_twenty_native_http_boundary.py"
      - "tests/us/test_us_pr243_latency_fail_closed.py"
      - "scripts/us_latency_compare.py"
      - "trader/us/execution/order_router.py"
      - "trader/us/execution/recovery_identity.py"
      - "tests/us/test_us_pr311_portfolio_cycle_recovery_scope.py"
      - "migrations/0062_us_portfolio_position_cycle_recovery_scope.sql"
      - "trader/us/runner/trade_tick_runner.py"
      - "trader/us/**"
      - "trader/marketdata/**"
      - "tests/us/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-kis-stubbed-boundary-only:
    # Path-filtered offline acceptance applies to every triggered US PR.
    # No PR-number/branch allowlist: no credentials, real DB or real orders.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      # NO KIS CREDENTIALS, NO LIVE DATABASE. All HTTP calls are mocked;
      # any stray KIS GET/POST is a test failure.
      PBCORE_DB_URL: ""
      DATABASE_URL: ""
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
      KIS_ENV: practice
      DRY_RUN: "1"
      US_KIS_ORDER_ALLOWED: "0"
      US_ORDER_ARMED: "0"
      ALLOW_REAL_ORDER: "0"
      US243_BENCH_REPORT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: 20 genuine route functions with stubbed native HTTP
        run: |
          set -euo pipefail
          python -m pytest -q -s \
            tests/us/test_us_pr243_twenty_native_http_boundary.py \
            tests/us/test_us_pr243_latency_fail_closed.py
          python - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path("artifacts/pr243-stubbed-native-boundary-20.json").read_text())
          assert report["eligible_protective_sell_attempts"]==20
          assert report["stubbed_http_post_count"]==20
          assert report["native_boundary_samples"]==20
          assert report["broker_real_orders"]==0
          assert report["broker_real_fills"]==0
          assert report["production_p95_60s_verified"] is False
          print("PR243 CONTROLLED STATUS: 20 mock POSTs; native HTTP boundary measured;"
                " real WSL latency and real KIS fill NOT CLAIMED")
          PY
      - name: PR311 scoped recovery regression tests (mock only)
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/us/test_us_pr311_portfolio_cycle_recovery_scope.py \
            tests/us/test_us_stage4_historical_reader_split_20261103.py \
            tests/us/test_us_stop_debt_replay_20261023.py \
            tests/us/test_us_protective_stop_recovery_worker_20261023.py \
            tests/us/test_us_20261008_entry_tp_recovery.py
      - name: Incident-specific market data, quote and lifecycle checks
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/us/test_us_20261125_market_data_recovery.py \
            tests/us/test_us_20261125_tp_freshness.py \
            tests/us/test_us_20261125_account_summary.py \
            tests/us/test_us_high_watermark_persistence.py \
            tests/us/test_us_legacy_nine_active_sell_20261111.py
      - name: Preserve mock-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us243-controlled-not-production-${{ github.run_id }}
          path: artifacts/pr243-stubbed-native-boundary-20.json
          retention-days: 7
          if-no-files-found: error

  pr311-postgres-safety:
    # Always run the isolated PostgreSQL regression on triggered US changes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: us_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d us_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      DRY_RUN: "1"
      US_KIS_ORDER_ALLOWED: "0"
      US_ORDER_ARMED: "0"
      ALLOW_REAL_ORDER: "0"
      PBCORE_DB_URL: ""
      DATABASE_URL: ""
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/us_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt psycopg2-binary pytest
      - name: PostgreSQL and stop recovery regression
        run: |
          python -m pytest -q tests/us/test_us_pr311_portfolio_cycle_recovery_scope.py tests/us/test_us_postgres_integration_real.py tests/us/test_us_20261007_sustained_real_buy_ack.py tests/us/test_us_protective_stop_recovery_worker_20261023.py tests/us/test_us_stop_debt_replay_20261023.py

  required-offline-execution-gate:
    # A skipped/cancelled job must not be treated as a passing execution gate.
    if: ${{ always() }}
    needs: [native-kis-stubbed-boundary-only, pr311-postgres-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both actual offline job successes
        env:
          NATIVE_BOUNDARY_RESULT: ${{ needs.native-kis-stubbed-boundary-only.result }}
          POSTGRES_SAFETY_RESULT: ${{ needs.pr311-postgres-safety.result }}
        run: |
          set -euo pipefail
          printf 'Stubbed native boundary: %s\nPostgreSQL safety: %s\n' "$NATIVE_BOUNDARY_RESULT" "$POSTGRES_SAFETY_RESULT"
          test "$NATIVE_BOUNDARY_RESULT" = success
          test "$POSTGRES_SAFETY_RESULT" = success
          echo "OFFLINE EXECUTION GATE PASS; actual KIS/WSL evidence remains separate."

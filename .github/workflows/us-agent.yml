name: US Agent Manual Wrapper

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "manual mode"
        required: true
        default: "prep"
        type: choice
        options:
          - prep
          - trade-am
          - trade-afternoon
          - trade-close
          - report
      dry_run:
        description: "DRY_RUN. true means no order submission."
        required: false
        default: true
        type: boolean
      offline:
        description: "offline mode. true blocks all KIS HTTP."
        required: false
        default: false
        type: boolean

concurrency:
  group: us-agent-manual-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TRADING_REGION: "US"
      US_AGENT_ENABLED: "1"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      US_LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"

      US_STRATEGY_ENGINE: "pb1"
      US_ENTRY_ENABLED: "1"
      US_EXIT_ENABLED: "1"

      US_PAPER_MAX_CAPITAL_KRW: "50000000"
      US_EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
      US_BUDGET_FX_KRW_PER_USD: "1450"
      US_MAX_CAPITAL_USD_AUTO: "1"

      US_REQUIRE_FILL_CONFIRM: "1"
      US_ORDER_ACCEPTED_IS_NOT_FILLED: "1"
      US_BLOCK_REBUY_AFTER_SELL_SAME_DAY: "1"
      US_ALLOW_INTRADAY_REENTRY_AFTER_STOP: "0"

      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DB migrate
        run: python -m trader.db.migrate

      - name: Run US dispatcher
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
          CANO: ${{ secrets.CANO }}
          ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
          PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
        run: |
          OFFLINE_FLAG=""
          if [ "${{ inputs.offline }}" = "true" ]; then
            OFFLINE_FLAG="--offline"
          fi

          python -m trader.us.runner.dispatcher \
            --mode "${{ inputs.mode }}" \
            --env practice \
            ${OFFLINE_FLAG}

name: start-new-practice-trading-epoch

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason recorded on the new logical trading epoch"
        required: true
        default: "KIS_PRACTICE_ACCOUNT_RESET"

permissions:
  contents: read

env:
  STRATEGY_ENV: "practice"
  KIS_ENV: "practice"
  KIS_HTTP_ENABLED: "1"
  START_NEW_PRACTICE_EPOCH: "1"
  EPOCH_RESET_CONFIRM: "YES"
  TRADING_EPOCH_REASON: ${{ inputs.reason }}

jobs:
  start-epoch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
    defaults:
      run:
        working-directory: repo
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start new KR/US practice trading epoch
        run: |
          set -euo pipefail
          python scripts/start_new_practice_trading_epoch.py

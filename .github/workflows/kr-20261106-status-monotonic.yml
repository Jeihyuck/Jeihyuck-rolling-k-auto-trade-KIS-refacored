name: KR Nov06 Cumulative Status Monotonic

on:
  pull_request:
    branches:
      - dual-agent
      - fix/kr-20261104-full-incident-scope-settlement-runtime
    paths:
      - "trader/reconcile_kis.py"
      - "trader/db/repos.py"
      - "tests/kr/test_kr_20261106_cumulative_buy_status_monotonic.py"
      - ".github/workflows/kr-20261106-status-monotonic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-status-monotonic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      NO_TRADE: "1"
      PBCORE_DB_URL: ""
      DATABASE_URL: ""
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline test dependencies
        run: |
          python -m pip install -r requirements.txt pytest
      - name: Compile and enforce source-status monotonicity
        run: |
          python -m compileall -q trader/reconcile_kis.py trader/db/repos.py
          python -m pytest tests/kr/test_kr_20261106_cumulative_buy_status_monotonic.py -q

  kr-status-postgres-race-and-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: .
      KIS_ENV: practice
      NO_TRADE: "1"
      DRY_RUN: "1"
      PBCORE_DB_URL: ""
      DATABASE_URL: ""
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kr_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline PostgreSQL dependencies
        run: python -m pip install -r requirements.txt pytest psycopg2-binary
      - name: Exact source, account, epoch and concurrent status regression
        run: |
          python -m pytest -q \
            tests/kr/test_kr_20261104_full_recovery_boundaries.py \
            tests/kr/test_kr_20261104_protective_claim_account_scope.py \
            tests/kr/test_kr_20261106_cumulative_buy_status_monotonic.py
      - name: All KR offline strategy and broker reconciliation regressions
        run: python -m pytest tests/kr -q

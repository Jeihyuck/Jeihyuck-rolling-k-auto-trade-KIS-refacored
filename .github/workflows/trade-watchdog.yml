name: Trade Watchdog

"on":
  schedule:
    - cron: "*/5 23 * * 0-4"
    - cron: "*/5 0-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: pb1-practice-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Check and dispatch missing phases
        uses: actions/github-script@v7
        env:
          WATCHDOG_REF: nullim
        with:
          script: |
            const timeZone = 'Asia/Seoul';
            const locale = 'en-CA';
            const workflows = {
              prep: {
                workflow_id: 'trade-prep.yml',
                workflow_name: 'Trade Prep',
                threshold: 810,
              },
              am: {
                workflow_id: 'trade-am.yml',
                workflow_name: 'Trade AM',
                threshold: 915,
              },
              pm: {
                workflow_id: 'trade-pm.yml',
                workflow_name: 'Trade PM',
                threshold: 1310,
              },
              close: {
                workflow_id: 'trade-close.yml',
                workflow_name: 'Trade Close',
                threshold: 1518,
              },
            };

            const now = new Date();
            const nowParts = new Intl.DateTimeFormat('en-GB', {
              timeZone,
              hour12: false,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
            }).formatToParts(now).reduce((acc, part) => {
              if (part.type !== 'literal') {
                acc[part.type] = part.value;
              }
              return acc;
            }, {});
            const nowKst = Number(`${nowParts.hour}${nowParts.minute}`);
            const todayKst = new Intl.DateTimeFormat(locale, {
              timeZone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).format(now);

            async function hasRunToday(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                branch: process.env.WATCHDOG_REF,
                per_page: 30,
              });

              return response.data.workflow_runs.some((run) => {
                if (!['queued', 'in_progress', 'completed'].includes(run.status)) {
                  return false;
                }

                const createdDateKst = new Intl.DateTimeFormat(locale, {
                  timeZone,
                  year: 'numeric',
                  month: '2-digit',
                  day: '2-digit',
                }).format(new Date(run.created_at));
                return createdDateKst === todayKst;
              });
            }

            for (const [phase, config] of Object.entries(workflows)) {
              if (nowKst < config.threshold) {
                core.info(`[WATCHDOG][SKIP] phase=${phase} reason=outside_window`);
                continue;
              }

              const found = await hasRunToday(config.workflow_id);
              core.info(`[WATCHDOG][CHECK] phase=${phase} found=${found ? 1 : 0}`);

              if (found) {
                core.info(`[WATCHDOG][SKIP] phase=${phase} reason=already_exists`);
                continue;
              }

              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: config.workflow_id,
                ref: process.env.WATCHDOG_REF,
                inputs: {
                  STRATEGY_ENV: 'practice',
                },
              });
              core.info(`[WATCHDOG][DISPATCH] phase=${phase} workflow=${config.workflow_name}`);
            }
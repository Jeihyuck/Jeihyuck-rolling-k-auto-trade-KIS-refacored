name: PB1 Trade Intraday (Continuous Loop)

on:
  workflow_dispatch:  # 수동 실행 (확인 후 schedule 추가)
  # schedule:
  #   - cron: "55 23 * * 0-4"  # KST 08:55 (UTC 23:55) 월~금 - 시동용

concurrency:
  group: trade_tick_live
  cancel-in-progress: true

jobs:
  trade-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6시간 (장중 연속 루프용)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run PB1 Auto Loop
        run: |
          set -euo pipefail
          python -m trader.pb1_runner
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          CANO: ${{ secrets.CANO }}
          ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          KIS_ENV: ${{ secrets.KIS_ENV }}
          PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
          ENV: ${{ secrets.KIS_ENV }}
          STRATEGY: best_k_meta
          
          # 자동 모드 결정 (장중=LIVE, 장외=DIAG)
          STRATEGY_MODE: AUTO
          
          # 루프 설정
          PB1_LOOP_ENABLED: "1"
          PB1_LOOP_INTERVAL_SEC: "30"        # 30초 간격 (나중에 조정 가능)
          PB1_LOOP_MODE: "UNTIL_CLOSE"       # 장마감까지 계속
          PB1_LOOP_GRACE_MIN: "3"            # 마감 직전 여유
          
          # DIAG 모드 설정
          KIS_BLOCK_ALL_ON_DIAG: "1"         # DIAG일 때 KIS 하드블록
          DIAG_SIM_MODE: "1"
          PB1_DIAG_RUN_FULL: "1"
          PB1_DIAG_WRITE_SIM_ORDERS: "1"
          DIAG_ALLOW_KIS_MARKETDATA: "0"
          
          # 매매 활성화
          LIVE_TRADING_ENABLED: "1"
          DISABLE_LIVE_TRADING: "0"
          
          # Watchlist 설정 (주간 로드)
          PB1_WATCHLIST_ENABLED: "1"
          PB1_WATCHLIST_STRICT: "0"  # ✅ 실패해도 절대 죽지 않음
          PB1_WATCHLIST_TOPK: "50"
          PB1_WATCHLIST_FINALN: "25"
          
          # Entry 설정
          PB1_ENTRY_ENABLED: "1"
          PB1_MAX_POSITIONS: "5"
          PB1_TARGET_NEW_POSITIONS: "2"
          PB1_MIN_SCORE_BASE: "65"
          PB1_REQUIRE_BOTH_CONTRACTIONS: "0"  # 초기엔 완화
          
          # 시간 제약 (내부에서 in_market으로 컷)
          PB1_ENTRY_WINDOW_END: "15:00"
          PB1_EXIT_WINDOW_END: "15:15"
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-intraday-logs-${{ github.run_number }}
          path: logs/
          retention-days: 3

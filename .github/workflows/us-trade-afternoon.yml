name: "US Trade Afternoon"
# session: afternoon | scheduled trigger: 13:03 ET | window: 13:00~15:50 ET
# workflow starts on schedule, checks prep, and executes the afternoon session before PnL

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = no order submission)"
        required: false
        default: true
        type: boolean
      offline:
        description: "offline mode (blocks all KIS HTTP)"
        required: false
        default: false
        type: boolean
      confirm:
        description: "Type RUN_US_AFTERNOON_MANUAL to run manually"
        required: false
        default: ""
      confirm_trade:
        description: "Required when dry_run=false. Type RUN_US_AFTERNOON_TRADE_MANUAL"
        required: false
        default: ""
      force_now:
        description: "DRY_RUN/OFFLINE smoke only. 실제 모의투자 주문에서는 반드시 비워둘 것. Example: 2026-05-11T13:00:00-04:00"
        required: false
        default: ""
      max_ticks:
        description: "Manual smoke max tick count. 0 means single tick when force_now is set."
        required: false
        default: "0"
      manual_max_minutes:
        description: "Manual max minutes override. Empty means default."
        required: false
        default: ""
      manual_interval_sec:
        description: "Manual interval seconds override. Empty means default."
        required: false
        default: ""
      manual_max_order_usd:
        description: "Manual dry-run only. Override US_MAX_ORDER_USD, e.g. 3500"
        required: false
        default: ""
      smoke_loop:
        description: "Quick smoke loop: force --offline, max_ticks=3, interval=1, max_minutes=10. Overrides other flags."
        required: false
        default: false
        type: boolean

concurrency:
  group: us-trade-afternoon-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trade_us_afternoon:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    env:
      DISABLE_LIVE_TRADING: "1"
      LIVE_TRADING_ENABLED: "0"
      STRATEGY_MODE: "INTENT_ONLY"
      FORCE_STRATEGY_MODE: "INTENT_ONLY"
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      TRADING_REGION: "US"
      US_AGENT_ENABLED: "1"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      US_LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"

      US_STRATEGY_ENGINE: "pb1"
      US_ENTRY_ENABLED: "1"
      US_EXIT_ENABLED: "1"

      # [Phase 17] entry book / exit routing / partial exit policy
      US_DEFAULT_ENTRY_BOOK: "SWING_BOOK"
      US_DEFAULT_ENTRY_HORIZON: "SWING_CARRY"
      US_DEFAULT_EXIT_POLICY: "US_SWING_DEFAULT"
      US_SWING_MIN_HOLD_MINUTES: "390"
      US_SWING_BLOCK_SAME_DAY_SOFT_EXIT: "1"
      US_SELL_PARTIAL_ALLOWED: "0"
      US_DAY_HARD_STOP_PCT: "0.03"
      US_DAY_PROFIT_TAKE_PCT: "0.025"
      US_DAY_TRAILING_STOP_PCT: "0.025"
      US_DAY_CLOSE_FLATTEN_AFTER_ET: "15:45"

      US_PAPER_MAX_CAPITAL_KRW: "50000000"
      US_EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
      US_BUDGET_FX_KRW_PER_USD: "1450"
      US_MAX_CAPITAL_USD_AUTO: "1"

      US_REQUIRE_FILL_CONFIRM: "1"
      US_ORDER_ACCEPTED_IS_NOT_FILLED: "1"
      US_BLOCK_REBUY_AFTER_SELL_SAME_DAY: "1"
      US_ALLOW_INTRADAY_REENTRY_AFTER_STOP: "0"
      US_BLOCK_NEW_ENTRY_AFTER_ET: "15:45"

      US_MAX_ORDER_USD: "2500"
      US_MAX_DAILY_NOTIONAL_USD: "10000"
      US_MAX_POSITIONS: "30"
      US_MAX_POSITION_WEIGHT: "0.10"
      US_MIN_CASH_BUFFER_USD: "200"

      US_SESSION_INTERVAL_SEC: "300"
      US_WATCHLIST_LOAD_TIMEOUT_SEC: "20"
      US_ENTRY_EVAL_TIMEOUT_SEC: "120"
      US_TICK_TIMEOUT_SEC: "150"

      DRY_RUN: "1"
      US_EVENT_NAME: ${{ github.event_name }}
      US_RUN_ID: ${{ github.run_id }}
      US_RUN_ATTEMPT: ${{ github.run_attempt }}
      US_ACTOR: ${{ github.actor }}
      US_SESSION: afternoon
      US_TRADE_STATUS: "INIT"
      US_TRADE_RUNNER_STARTED: "0"
      US_TRADE_RUNNER_BLOCK_REASON: "not_started"
      US_EXPECTED_TO_TRADE: "0"
      US_ORDER_ALLOWED: "0"
      US_KIS_ORDER_ALLOWED: "0"
      US_OFFLINE_MODE: ${{ (github.event_name == 'workflow_dispatch' && (inputs.offline && 'true' || 'false')) || 'false' }}
      US_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || ((vars.US_AGENT_SCHEDULE_DRY_RUN || '0') == '1' && 'true' || 'false') }}

      US_LOG_FILE: "us-trade-afternoon.log"
      US_ARTIFACT_NAME: "us-trade-afternoon"

    steps:
      - name: Resolve US Afternoon phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=America/New_York date +%H)"
          now_m="$(TZ=America/New_York date +%M)"
          now_s="$(TZ=America/New_York date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=America/New_York date +%H%M)"
          now_hhmmss="$(TZ=America/New_York date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          if [[ "$event_name" == "workflow_dispatch" && "${GITHUB_ACTOR:-}" == "github-actions[bot]" ]]; then
            echo "should_run=0" >> "$GITHUB_OUTPUT"
            echo "skip_reason=auto_dispatch_disabled" >> "$GITHUB_OUTPUT"
            echo "now_et=${now_hhmm}" >> "$GITHUB_OUTPUT"
            echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
            echo "wait_until_target=0" >> "$GITHUB_OUTPUT"
            echo "wait_seconds=0" >> "$GITHUB_OUTPUT"
            echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
            echo "run_window=auto_dispatch_blocked" >> "$GITHUB_OUTPUT"
            echo "recovery_run=0" >> "$GITHUB_OUTPUT"
            echo "route=auto_dispatch_blocked" >> "$GITHUB_OUTPUT"
            echo "delay_seconds=0" >> "$GITHUB_OUTPUT"

            echo "[US_TRADE_AFTERNOON][DISPATCH_GUARD][SKIP] reason=auto_dispatch_disabled actor=${GITHUB_ACTOR:-}"
            exit 0
          fi

          # 한국장 trade-afternoon 패턴: workflow가 11:30 ET에 떠서 prep check 후 12:30까지 wait
          prewarm_start_min=$((11 * 60 + 30))       # 11:30 ET - prewarm/prep check start
          target_min=$((13 * 60 + 0))               # 13:00 ET - afternoon target start
          afternoon_allow_until=$((13 * 60 + 30))   # 13:30 ET - normal afternoon end
          recovery_until=$((15 * 60 + 20))          # 15:20 ET - recovery window end
          no_new_entry_after=$((15 * 60 + 45))      # 15:45 ET - block new entry
          session_end=$((15 * 60 + 50))             # 15:50 ET - hard session end
          schedule_expected_min=$((13 * 60 + 3))
          max_wait_seconds=3600  # schedule jitter/recovery wait guard

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0
          run_window="normal"
          recovery_run=0
          route="normal_afternoon"
          delay_seconds=$(( (now_min - schedule_expected_min) * 60 + 10#$now_s ))

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -gt "$session_end" ]]; then
              # 15:50 이후는 skip (장 완전 종료)
              should_run=0
              skip_reason="skip_after_us_close"
              run_window="stale"
            elif [[ "$now_min" -gt "$recovery_until" ]]; then
              # 15:20~15:50: exit_only mode (한국장 패턴: 늦어도 close는 살린다)
              run_window="exit_only"
              route="exit_only"
              # 신규 매수는 막되 청산/정리는 실행
            elif [[ "$now_min" -gt "$afternoon_allow_until" ]]; then
              # 13:30~15:20: recovery window
              run_window="recovery"
              recovery_run=1
              route="recovery_afternoon"
            elif [[ "$now_min" -lt "$target_min" ]]; then
              # 13:00 이전: wait until target (prep check는 wait 전에 수행)
              wait_until_target=1
              wait_seconds=$(( (target_min - now_min) * 60 - 10#$now_s ))
              if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
              if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
                should_run=0
                skip_reason="skip_too_early_us_afternoon"
                run_window="too_early"
              else
                run_window="early_wait"
              fi
            else
              # 13:00~13:30: normal window
              run_window="normal"
              route="normal_afternoon"
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.confirm || '' }}"
            confirm_trade="${{ inputs.confirm_trade || '' }}"
            dry_run_input="${{ inputs.dry_run && 'true' || 'false' }}"

            if [[ "$dry_run_input" == "false" ]]; then
              if [[ "$confirm_trade" != "RUN_US_AFTERNOON_TRADE_MANUAL" ]]; then
                should_run=0
                skip_reason="manual_us_afternoon_trade_not_confirmed"
                run_window="manual_blocked"
              else
                run_window="manual_trade"
                route="manual"
              fi
            elif [[ "$confirm" != "RUN_US_AFTERNOON_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_us_afternoon_not_confirmed"
              run_window="manual_blocked"
            else
              run_window="manual"
              route="manual"
            fi

            # Manual fallback: schedule이 안 떴을 때 12:30 전 수동 실행도 wait 허용
            if [[ "$should_run" == "1" ]]; then
              force_now_input="${{ inputs.force_now || '' }}"
              # force_now는 smoke 전용이므로 실제 시간 wait 판단에서 제외
              if [[ -z "$force_now_input" && "$now_min" -lt "$target_min" ]]; then
                wait_until_target=1
                wait_seconds=$(( (target_min - now_min) * 60 - 10#$now_s ))
                if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
                if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
                  should_run=0
                  skip_reason="manual_us_afternoon_too_early"
                  run_window="manual_too_early"
                else
                  run_window="${run_window}_early_wait"
                fi
              fi
            fi
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_et=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "run_window=${run_window}" >> "$GITHUB_OUTPUT"
          echo "recovery_run=${recovery_run}" >> "$GITHUB_OUTPUT"
          echo "route=${route}" >> "$GITHUB_OUTPUT"
          echo "delay_seconds=${delay_seconds}" >> "$GITHUB_OUTPUT"

          echo "[US_TRADE_AFTERNOON][START_META] schedule_expected=1303 actual_start=${now_hhmmss} delay_seconds=${delay_seconds} event=${event_name}"
          echo "[US_TRADE_AFTERNOON][SCHEDULE_GUARD] event=${event_name} scheduled_trigger_et=1303 now_et=${now_hhmmss} session_window=1300-1550 should_run=${should_run}"
          echo "[US_TRADE_AFTERNOON][PHASE_GUARD] should_run=${should_run} run_window=${run_window} route=${route} recovery_run=${recovery_run} wait_seconds=${wait_seconds}"
          echo "[US_TRADE_AFTERNOON][RUN_PLAN] prep_check=true wait_until_1300=true trade_afternoon=true"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Resolve US Afternoon run mode
        id: run_mode
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/us_resolve_run_mode.py >> "$GITHUB_OUTPUT"

      - name: Verify checkout path and initialize log
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; exit 1; }

          # Clean stale reports and artifacts to prevent mixing with current run
          echo "[CLEANUP][START] removing stale reports and artifacts"
          rm -rf repo/reports/us_daily
          mkdir -p repo/artifacts repo/reports/us_daily
          rm -f repo/artifacts/us_last_stage.txt
          echo "[CLEANUP][DONE]"

          {
            echo "[US_TRADE_AFTERNOON][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[US_TRADE_AFTERNOON][START_META] schedule_expected=1303 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[US_TRADE_AFTERNOON][SCHEDULE_GUARD] event=${{ steps.phase_guard.outputs.event_name }} scheduled_trigger_et=1303 now_et=${{ steps.phase_guard.outputs.now_hhmmss }} session_window=1300-1550 should_run=${{ steps.phase_guard.outputs.should_run }}"
            echo "[US_TRADE_AFTERNOON][BOOT_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason }} now_et=${{ steps.phase_guard.outputs.now_hhmmss }} wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }} run_window=${{ steps.phase_guard.outputs.run_window }} route=${{ steps.phase_guard.outputs.route }} recovery_run=${{ steps.phase_guard.outputs.recovery_run }} session_window=1300-1550"
            echo "[US_TRADE_AFTERNOON][RUN_MODE] run_mode=${{ steps.run_mode.outputs.run_mode }} signal_only=${{ steps.run_mode.outputs.signal_only }} order_allowed=${{ steps.run_mode.outputs.order_allowed }} kis_order_allowed=${{ steps.run_mode.outputs.kis_order_allowed }}"
            echo "[US_TRADE_AFTERNOON][CONCURRENCY_META] group=us-trade-afternoon-${GITHUB_REF_NAME} cancel_in_progress=false schedule_mode=schedule_guard crons=1"
            echo "[US_TRADE_AFTERNOON][SCHEDULE_MODE] mode=scheduled_trade crons=1 timezone=America/New_York"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/${US_LOG_FILE}
          echo "[CHECKOUT][OK] repo path ready" | tee -a repo/artifacts/${US_LOG_FILE}

      - name: Persist Afternoon trigger metadata
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "US_SCHEDULE_EXPECTED_ET=1303"
            echo "US_ACTUAL_START_ET=${{ steps.phase_guard.outputs.now_hhmmss }}"
            echo "US_DELAY_SECONDS=${{ steps.phase_guard.outputs.delay_seconds }}"
            echo "US_RUN_WINDOW=${{ steps.phase_guard.outputs.run_window }}"
            echo "US_RECOVERY_RUN=${{ steps.phase_guard.outputs.recovery_run }}"
            echo "US_EVENT_NAME=${{ steps.phase_guard.outputs.event_name }}"
            echo "US_OFFLINE_MODE=${{ (github.event_name == 'workflow_dispatch' && (inputs.offline && 'true' || 'false')) || 'false' }}"
          } >> "$GITHUB_ENV"

      - name: Emit US Afternoon skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=SKIPPED" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=phase_guard_skip" >> "$GITHUB_ENV"
          trade_date=$(TZ=America/New_York date +%F)
          missed_window="false"
          if [[ "${{ steps.phase_guard.outputs.skip_reason }}" == "skip_after_us_close" ]]; then
            missed_window="true"
          fi
          {
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=us-afternoon missed_trade_window=${missed_window}"
            echo "[US_TRADE_AFTERNOON][EXIT] reason=phase_guard_skip"
          } | tee -a artifacts/${US_LOG_FILE}
          python scripts/us_write_phase_skip_report.py \
            --session afternoon \
            --trade-date "${trade_date}" \
            --reason "${{ steps.phase_guard.outputs.skip_reason }}" \
            --missed-trade-window "${missed_window}" \
            --kis-order-allowed "${{ steps.run_mode.outputs.kis_order_allowed || '0' }}"

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Checkout pinned US trade-day revision
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          revision=$(python scripts/us_checkout_pinned_revision.py | awk -F= '/^RUN_REVISION=/{print $2}')
          git fetch --depth=1 origin "${revision}"
          git checkout --detach "${revision}"
          echo "US_PINNED_RUN_REVISION=${revision}" >> "$GITHUB_ENV"

      - name: US Python syntax preflight
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_PREFLIGHT][START] py_compile"
            python -m py_compile trader/us/execution/kis_us_client.py
            python -m py_compile trader/us/execution/fills.py
            python -m py_compile trader/us/runner/trade_tick_runner.py
            python -m py_compile trader/us/runner/trade_session_runner.py
            python -m py_compile trader/us/pb1/us_entry_engine.py
            python -m py_compile trader/us/pb1/us_pb1_engine.py
            python -m compileall -q trader/us
            echo "[US_PREFLIGHT][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Wait until US Afternoon target start
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=1800  # 30분
          if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds}"
            exit 1
          fi
          echo "[US_WAIT_UNTIL_TARGET][START] session=afternoon wait_seconds=${wait_seconds}" | tee -a artifacts/${US_LOG_FILE}
          sleep "$wait_seconds"
          echo "[US_WAIT_UNTIL_TARGET][DONE] session=afternoon now_et=$(TZ=America/New_York date +%H%M%S)" | tee -a artifacts/${US_LOG_FILE}

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_DB_GUARD][START]"
            : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
            if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
              echo "::error::PBCORE_DB_URL must be postgres-only."
              exit 1
            fi
            echo "[US_DB_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Acquire Afternoon session lock
        if: steps.phase_guard.outputs.should_run == '1'
        id: session_lock
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
          INPUT_CONFIRM: ${{ inputs.confirm || '' }}
        run: |
          set -euo pipefail

          if [ -n "${FORCE_NOW_INPUT}" ]; then
            TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
          else
            TRADE_DATE=$(TZ=America/New_York date +%F)
          fi
          export TRADE_DATE

          {
            echo "[US_TRADE_SESSION_LOCK][START] trade_date=${TRADE_DATE} session=afternoon env=${KIS_ENV} event=${GITHUB_EVENT_NAME}"

            python scripts/us_claim_session_lock.py \
              --session afternoon \
              --trade-date "${TRADE_DATE}" \
              --env "${KIS_ENV}" \
              --github-run-id "${GITHUB_RUN_ID}" \
              --github-workflow "${GITHUB_WORKFLOW}" \
              --github-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --event-name "${GITHUB_EVENT_NAME}" \
              --manual-confirm-ok "$([ "${INPUT_CONFIRM}" = "RUN_US_AFTERNOON_MANUAL" ] && echo 1 || echo 0)" \
              --run-window "${US_RUN_WINDOW:-}" \
              --output us_session_lock_result.txt

            cat us_session_lock_result.txt

            CLAIMED=$(grep '^claimed=' us_session_lock_result.txt | cut -d= -f2 || true)
            EXISTING_STATUS=$(grep '^existing_status=' us_session_lock_result.txt | cut -d= -f2 || true)

            if [ "${EXISTING_STATUS}" = "session_lock_exception" ]; then
              echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=session_lock_exception" >> "$GITHUB_ENV"
              echo "::error::Afternoon session lock exception"
              exit 1
            fi

            if [ -z "${CLAIMED}" ]; then
              echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=session_lock_output_missing" >> "$GITHUB_ENV"
              echo "::error::Afternoon session lock output missing"
              exit 1
            fi

            echo "claimed=${CLAIMED}" >> "$GITHUB_OUTPUT"
            echo "existing_status=${EXISTING_STATUS}" >> "$GITHUB_OUTPUT"
            echo "trade_date=${TRADE_DATE}" >> "$GITHUB_OUTPUT"

            if [ "${CLAIMED}" = "1" ]; then
              echo "[US_TRADE_SESSION_LOCK][ACQUIRE] trade_date=${TRADE_DATE} session=afternoon env=${KIS_ENV} claimed=${CLAIMED}"
            else
              echo "[US_TRADE_SESSION_LOCK][SKIP] reason=session_already_running_or_completed trade_date=${TRADE_DATE} session=afternoon env=${KIS_ENV} claimed=${CLAIMED} existing_status=${EXISTING_STATUS}"
              echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
              echo "US_TRADE_STATUS=SKIPPED_DUPLICATE_SESSION" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=duplicate_session_lock" >> "$GITHUB_ENV"
            fi
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Resolve US Afternoon trade intent expectation
        if: steps.phase_guard.outputs.should_run == '1'
        id: trade_intent_expectation
        working-directory: repo
        run: |
          set -euo pipefail
          event_name="${{ steps.phase_guard.outputs.event_name }}"
          phase_should_run="${{ steps.phase_guard.outputs.should_run }}"
          run_mode="${{ steps.run_mode.outputs.run_mode || 'SKIP' }}"
          signal_only="${{ steps.run_mode.outputs.signal_only || '0' }}"
          order_allowed="${{ steps.run_mode.outputs.order_allowed || '0' }}"
          kis_order_allowed="${{ steps.run_mode.outputs.kis_order_allowed || '0' }}"
          dry_run_flag="${{ inputs.dry_run && 'true' || 'false' }}"
          offline_flag="${{ inputs.offline && 'true' || 'false' }}"
          smoke_loop_flag="${{ inputs.smoke_loop && 'true' || 'false' }}"
          force_now_value="$(echo "${{ inputs.force_now || '' }}" | xargs)"
          force_now_set=0
          if [ -n "${force_now_value}" ]; then
            force_now_set=1
          fi

          trade_intent_expected=0
          reason="trade_pipeline_gate_failed"
          if [ "${phase_should_run}" = "1" ] && [ "${run_mode}" = "TRADE" ] && [ "${signal_only}" = "0" ] && [ "${order_allowed}" = "1" ] && [ "${kis_order_allowed}" = "1" ] && [ "${dry_run_flag}" != "true" ] && [ "${offline_flag}" != "true" ] && [ "${smoke_loop_flag}" != "true" ] && [ "${force_now_set}" != "1" ]; then
            trade_intent_expected=1
            reason="trade_allowed"
          elif [ "${run_mode}" != "TRADE" ] || [ "${signal_only}" != "0" ]; then
            reason="signal_only"
            if [ "${order_allowed}" = "0" ] && [ "${kis_order_allowed}" = "0" ]; then
              reason="market_closed"
            fi
          elif [ "${dry_run_flag}" = "true" ]; then
            reason="dry_run"
          elif [ "${offline_flag}" = "true" ]; then
            reason="offline_mode"
          elif [ "${smoke_loop_flag}" = "true" ]; then
            reason="smoke_loop"
          elif [ "${force_now_set}" = "1" ]; then
            reason="force_now_smoke"
          fi

          echo "trade_intent_expected=${trade_intent_expected}" >> "$GITHUB_OUTPUT"
          echo "US_TRADE_INTENT_EXPECTED=${trade_intent_expected}" >> "$GITHUB_ENV"
          echo "[US_TRADE_AFTERNOON][INTENT_EXPECTATION] trade_intent_expected=${trade_intent_expected} event=${event_name} phase_should_run=${phase_should_run} run_mode=${run_mode} order_allowed=${order_allowed} kis_order_allowed=${kis_order_allowed} dry_run=${dry_run_flag} offline_mode=${offline_flag} signal_only=${signal_only} smoke_loop=${smoke_loop_flag} force_now_set=${force_now_set} reason=${reason}" | tee -a artifacts/${US_LOG_FILE}

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1'
        id: db_migrate
        continue-on-error: true
        working-directory: repo
        run: |
          set +e
          echo "[US_DB_MIGRATE][START]" | tee -a artifacts/${US_LOG_FILE}
          python -m trader.db.migrate 2>&1 | tee -a artifacts/${US_LOG_FILE}
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            echo "[US_TRADE_AFTERNOON][MIGRATION][OK]" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_DB_MIGRATE][DONE]" | tee -a artifacts/${US_LOG_FILE}
            echo "US_EXPECTED_TO_TRADE=${US_TRADE_INTENT_EXPECTED:-0}" >> "$GITHUB_ENV"
          else
            echo "[US_TRADE_AFTERNOON][MIGRATION][FAIL] reason=db_migration_failed" | tee -a artifacts/${US_LOG_FILE}
            echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_STARTED=0" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_BLOCK_REASON=db_migration_failed" >> "$GITHUB_ENV"
            echo "US_EXPECTED_TO_TRADE=${US_TRADE_INTENT_EXPECTED:-0}" >> "$GITHUB_ENV"
          fi
          exit ${status}

      - name: Emit Afternoon migration failure summary
        if: always() && steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1' && steps.db_migrate.outcome != 'success'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_TRADE_AFTERNOON][TRADE_RUNNER][SKIP] reason=db_migration_failed"
            echo "[US_TRADE_AFTERNOON][FINAL_STATUS] status=FAILED trade_runner_started=0 reason=db_migration_failed"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_ENV_CHECK] TRADING_REGION=${TRADING_REGION:-}"
            echo "[US_ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
            echo "[US_ENV_CHECK] DRY_RUN=${DRY_RUN:-}"
            echo "[US_ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
            test -n "${PBCORE_DB_URL:-}" || { echo "::error::PBCORE_DB_URL missing"; exit 1; }
            test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
            test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
            test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
            test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
            test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
            test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
            test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
            [[ "${TRADING_REGION}" == "US" ]] || { echo "::error::TRADING_REGION must be US"; exit 1; }
            [[ "${KIS_ENV}" == "practice" ]] || { echo "::error::KIS_ENV must be practice"; exit 1; }
            echo "[US_ENV_CHECK][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard manual force_now safety
        if: github.event_name == 'workflow_dispatch' && inputs.force_now != ''
        working-directory: repo
        run: |
          set -euo pipefail
          {
            # Trim force_now input (앞뒤 공백 제거)
            FORCE_NOW_TRIMMED=$(echo "${{ inputs.force_now }}" | xargs)
            echo "[US_FORCE_NOW_GUARD][START] force_now=${FORCE_NOW_TRIMMED} dry_run=${{ inputs.dry_run }} offline=${{ inputs.offline }}"
            if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.offline }}" != "true" ]; then
              echo "::error::force_now manual smoke requires dry_run=true or offline=true"
              exit 1
            fi
            # force_now + dry_run=true인 경우 offline 강제
            if [ "${{ inputs.dry_run }}" = "true" ] && [ "${{ inputs.offline }}" != "true" ]; then
              echo "[US_FORCE_NOW_GUARD][OFFLINE_FORCED] reason=force_now_dry_run_smoke"
              echo "FORCE_OFFLINE_FOR_SMOKE=1" >> "$GITHUB_ENV"
            fi
            echo "[US_FORCE_NOW_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard same-day US prep contract
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1' && steps.db_migrate.outcome == 'success'
        timeout-minutes: 2
        working-directory: repo
        env:
          SESSION: afternoon
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
          OFFLINE: ${{ inputs.offline || 'false' }}
          MAX_TICKS: ${{ inputs.max_ticks || '0' }}
        run: |
          set +e
          python scripts/guard_us_prep_contract.py 2>&1 | tee -a artifacts/${US_LOG_FILE}
          guard_status=${PIPESTATUS[0]}
          set -e

          if [ "${guard_status}" -ne 0 ]; then
            echo "[US_PREP_GUARD][REPORT_WRITE][START]" | tee -a artifacts/${US_LOG_FILE}
            python scripts/write_us_guard_failure_report.py \
              --session afternoon \
              --guard-result artifacts/us_prep_guard_result.json 2>&1 | tee -a artifacts/${US_LOG_FILE}
            echo "[US_PREP_GUARD][REPORT_WRITE][DONE]" | tee -a artifacts/${US_LOG_FILE}
            echo "[RUN_SUMMARY][RESULT] status=FAILED_PREP_GUARD reason=bad_prep_status session=us-afternoon" | tee -a artifacts/${US_LOG_FILE}
            exit "${guard_status}"
          fi
          locked_count=$(python scripts/us_extract_json_value.py \
            --file artifacts/us_prep_guard_result.json \
            --key locked_count \
            --fallback-key locked_watchlist_count \
            --default 0)
          echo "[US_TRADE_AFTERNOON][PREP_CONTRACT][OK] locked_count=${locked_count}" | tee -a artifacts/${US_LOG_FILE}
          echo "[US_TRADE_AFTERNOON][WATCHLIST][LOAD] rows=${locked_count}" | tee -a artifacts/${US_LOG_FILE}

      - name: Final Afternoon duplicate guard before trade
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1' && steps.db_migrate.outcome == 'success'
        id: final_duplicate_guard
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail
          echo "[US_TRADE_AFTERNOON][FINAL_DUPLICATE_GUARD][START]" | tee -a artifacts/${US_LOG_FILE}

          if [ -n "${FORCE_NOW_INPUT}" ]; then
            TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
          else
            TRADE_DATE=$(TZ=America/New_York date +%F)
          fi
          export TRADE_DATE

          python scripts/us_check_already_ran.py --session afternoon --trade-date "${TRADE_DATE}" --mode final-duplicate > final_afternoon_duplicate_guard_result.txt 2>&1

          cat final_afternoon_duplicate_guard_result.txt | tee -a artifacts/${US_LOG_FILE}
          ALREADY_RAN=$(grep "^already_ran=" final_afternoon_duplicate_guard_result.txt | cut -d= -f2 || echo "0")
          echo "already_ran=${ALREADY_RAN}" >> "$GITHUB_OUTPUT"

      - name: Resolve US Afternoon trade expectation
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1' && steps.db_migrate.outcome == 'success'
        id: expectation
        working-directory: repo
        run: |
          set -euo pipefail
          event_name="${{ steps.phase_guard.outputs.event_name }}"
          phase_should_run="${{ steps.phase_guard.outputs.should_run }}"
          run_mode="${{ steps.run_mode.outputs.run_mode || 'SKIP' }}"
          signal_only="${{ steps.run_mode.outputs.signal_only || '0' }}"
          order_allowed="${{ steps.run_mode.outputs.order_allowed || '0' }}"
          kis_order_allowed="${{ steps.run_mode.outputs.kis_order_allowed || '0' }}"
          already_ran="${{ steps.final_duplicate_guard.outputs.already_ran || '0' }}"
          claimed="${{ steps.session_lock.outputs.claimed || '' }}"
          dry_run_flag="${{ inputs.dry_run && 'true' || 'false' }}"
          offline_flag="${{ inputs.offline && 'true' || 'false' }}"
          smoke_loop_flag="${{ inputs.smoke_loop && 'true' || 'false' }}"
          force_now_value="$(echo "${{ inputs.force_now || '' }}" | xargs)"
          force_now_set=0
          if [ -n "${force_now_value}" ]; then
            force_now_set=1
          fi

          expected_to_trade=0
          reason="trade_pipeline_gate_failed"
          trade_status="SKIPPED"
          block_reason="trade_pipeline_gate_failed"

          if [ "${claimed}" != "1" ]; then
            reason="duplicate_session_lock"
            trade_status="SKIPPED_DUPLICATE_SESSION"
            block_reason="duplicate_session_lock"
          elif [ "${already_ran}" = "1" ]; then
            reason="already_ran_after_wait"
            trade_status="SKIPPED_DUPLICATE_SESSION"
            block_reason="already_ran_after_wait"
          elif [ "${run_mode}" != "TRADE" ] || [ "${signal_only}" != "0" ]; then
            reason="signal_only"
            if [ "${order_allowed}" = "0" ] && [ "${kis_order_allowed}" = "0" ]; then
              reason="market_closed"
            fi
            block_reason="${reason}"
          elif [ "${dry_run_flag}" = "true" ]; then
            reason="dry_run"
            block_reason="dry_run"
          elif [ "${offline_flag}" = "true" ]; then
            reason="offline_mode"
            block_reason="offline_mode"
          elif [ "${smoke_loop_flag}" = "true" ]; then
            reason="smoke_loop"
            block_reason="smoke_loop"
          elif [ "${force_now_set}" = "1" ]; then
            reason="force_now_smoke"
            block_reason="force_now_smoke"
          elif [ "${phase_should_run}" = "1" ] && [ "${run_mode}" = "TRADE" ] && [ "${signal_only}" = "0" ] && [ "${order_allowed}" = "1" ] && [ "${kis_order_allowed}" = "1" ]; then
            expected_to_trade=1
            reason="trade_allowed"
            trade_status="READY"
            block_reason=""
          fi

          echo "expected_to_trade=${expected_to_trade}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "US_EXPECTED_TO_TRADE=${expected_to_trade}" >> "$GITHUB_ENV"
          echo "US_ORDER_ALLOWED=${order_allowed}" >> "$GITHUB_ENV"
          echo "US_KIS_ORDER_ALLOWED=${kis_order_allowed}" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=${trade_status}" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=${block_reason}" >> "$GITHUB_ENV"
          echo "[US_TRADE_AFTERNOON][EXPECTATION] expected_to_trade=${expected_to_trade} event=${event_name} phase_should_run=${phase_should_run} run_mode=${run_mode} order_allowed=${order_allowed} kis_order_allowed=${kis_order_allowed} dry_run=${dry_run_flag} offline_mode=${offline_flag} signal_only=${signal_only} smoke_loop=${smoke_loop_flag} force_now_set=${force_now_set} reason=${reason}" | tee -a artifacts/${US_LOG_FILE}

      - name: Emit Afternoon final duplicate skip summary
        if: steps.phase_guard.outputs.should_run == '1' && steps.session_lock.outputs.claimed == '1' && steps.db_migrate.outcome == 'success' && steps.final_duplicate_guard.outputs.already_ran == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "US_EXPECTED_TO_TRADE=0" >> "$GITHUB_ENV"
          echo "US_TRADE_STATUS=SKIPPED_DUPLICATE_SESSION" >> "$GITHUB_ENV"
          echo "US_TRADE_RUNNER_BLOCK_REASON=already_ran_after_wait" >> "$GITHUB_ENV"
          trade_date=$(TZ=America/New_York date +%F)
          {
            echo "[US_TRADE_AFTERNOON][FINISH] status=OK reason=already_ran_after_wait trade_date=${trade_date}"
            echo "[RUN_SUMMARY][RESULT] status=OK reason=already_ran_after_wait session=us-afternoon trade_date=${trade_date}"
            echo "[US_TRADE_AFTERNOON][EXIT] reason=already_ran_after_wait"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Run US Afternoon trade session
        if: steps.expectation.outputs.expected_to_trade == '1'
        id: trade_session
        continue-on-error: true
        timeout-minutes: 210
        working-directory: repo
        env:
          US_RUN_MODE: ${{ steps.run_mode.outputs.run_mode || 'TRADE' }}
          US_SIGNAL_ONLY: ${{ steps.run_mode.outputs.signal_only || '0' }}
          US_ORDER_ALLOWED: ${{ steps.run_mode.outputs.order_allowed || '1' }}
          US_KIS_ORDER_ALLOWED: ${{ steps.run_mode.outputs.kis_order_allowed || '1' }}
          US_KIS_DATA_ALLOWED: ${{ steps.run_mode.outputs.kis_data_allowed || '1' }}
          US_NON_TRADING_DAY: ${{ steps.run_mode.outputs.non_trading_day || '0' }}
        run: |
          set -euo pipefail
          {
            OFFLINE_FLAG=""
            FORCE_NOW_FLAG=""
            MAX_TICKS_FLAG=""
            MAX_MINUTES="185"  # 한국장 패턴: timeout 210분에서 shutdown_buffer 20-25분 확보
            INTERVAL_SEC="${US_SESSION_INTERVAL_SEC:-300}"
            MANUAL_MAX_ORDER_USD=""
            ROUTE="${{ steps.phase_guard.outputs.route }}"

            # exit_only mode일 때는 신규 매수 차단
            if [[ "${ROUTE}" == "exit_only" ]]; then
              export US_BLOCK_NEW_ENTRY_AFTER_ET="00:00"  # 모든 신규 매수 차단
              echo "[US_TRADE_AFTERNOON][EXIT_ONLY] reason=late_start_after_entry_window new_entry_blocked=true"
            fi

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # smoke_loop は他のフラグより優先
              if [ "${{ inputs.smoke_loop || 'false' }}" = "true" ]; then
                OFFLINE_FLAG="--offline"
                MAX_TICKS_FLAG="--max-ticks 3"
                MAX_MINUTES="10"
                INTERVAL_SEC="1"
                echo "[US_TRADE_AFTERNOON][SMOKE_LOOP] mode activated: offline max_ticks=3 interval=1 max_minutes=10"
              else
                if [ "${{ inputs.offline || 'false' }}" = "true" ]; then
                  OFFLINE_FLAG="--offline"
                fi
                if [ -n "${{ inputs.force_now }}" ]; then
                  FORCE_NOW_FLAG="--force-now ${{ inputs.force_now }}"
                fi
                if [ -n "${{ inputs.max_ticks }}" ] && [ "${{ inputs.max_ticks }}" != "0" ]; then
                  MAX_TICKS_FLAG="--max-ticks ${{ inputs.max_ticks }}"
                fi
                if [ -n "${{ inputs.manual_max_minutes }}" ]; then
                  MAX_MINUTES="${{ inputs.manual_max_minutes }}"
                fi
                if [ -n "${{ inputs.manual_interval_sec }}" ]; then
                  INTERVAL_SEC="${{ inputs.manual_interval_sec }}"
                fi
                if [ -n "${{ inputs.manual_max_order_usd }}" ]; then
                  MANUAL_MAX_ORDER_USD="${{ inputs.manual_max_order_usd }}"
                fi
              fi
            fi

            # Apply manual_max_order_usd override only when dry_run=true
            if [ -n "${MANUAL_MAX_ORDER_USD}" ]; then
              if [ "${DRY_RUN}" = "1" ]; then
                if [[ "${MANUAL_MAX_ORDER_USD}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
                  export US_MAX_ORDER_USD="${MANUAL_MAX_ORDER_USD}"
                  echo "[US_RISK_CONFIG][MANUAL_OVERRIDE] key=US_MAX_ORDER_USD value=${US_MAX_ORDER_USD} scope=dry_run_only"
                else
                  echo "::error::manual_max_order_usd must be numeric: ${MANUAL_MAX_ORDER_USD}"
                  exit 1
                fi
              else
                echo "::error::manual_max_order_usd is allowed only when dry_run=true"
                exit 1
              fi
            fi

            echo "[US_RISK_CONFIG] US_MAX_ORDER_USD=${US_MAX_ORDER_USD} US_MAX_DAILY_NOTIONAL_USD=${US_MAX_DAILY_NOTIONAL_USD} US_MAX_POSITIONS=${US_MAX_POSITIONS} US_MAX_POSITION_WEIGHT=${US_MAX_POSITION_WEIGHT} US_MIN_CASH_BUFFER_USD=${US_MIN_CASH_BUFFER_USD}"
            echo "[US_TRADE_AFTERNOON][START]"
            echo "[US_TRADE_RUNNER][START] session=afternoon"
            echo "[US_TRADE_AFTERNOON][ENV] DRY_RUN=${DRY_RUN} OFFLINE_FLAG=${OFFLINE_FLAG}"
            echo "[US_TRADE_AFTERNOON][RUN_MODE] US_RUN_MODE=${US_RUN_MODE} US_SIGNAL_ONLY=${US_SIGNAL_ONLY} US_KIS_ORDER_ALLOWED=${US_KIS_ORDER_ALLOWED}"
            echo "[US_TRADE_AFTERNOON][MANUAL_FLAGS] FORCE_NOW_FLAG=${FORCE_NOW_FLAG} MAX_TICKS_FLAG=${MAX_TICKS_FLAG} MAX_MINUTES=${MAX_MINUTES} INTERVAL_SEC=${INTERVAL_SEC}"
            echo "US_TRADE_RUNNER_STARTED=1" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_BLOCK_REASON=none" >> "$GITHUB_ENV"
            echo "US_ORDER_ALLOWED=${US_ORDER_ALLOWED}" >> "$GITHUB_ENV"
            echo "US_KIS_ORDER_ALLOWED=${US_KIS_ORDER_ALLOWED}" >> "$GITHUB_ENV"
            echo "EXPECTED_TO_TRADE=${US_EXPECTED_TO_TRADE:-1}" >> "$GITHUB_ENV"
            echo "ORDER_ALLOWED=${US_ORDER_ALLOWED}" >> "$GITHUB_ENV"
            echo "KIS_ORDER_ALLOWED=${US_KIS_ORDER_ALLOWED}" >> "$GITHUB_ENV"
            echo "SIGNAL_ONLY=${US_SIGNAL_ONLY}" >> "$GITHUB_ENV"
            echo "RUN_MODE=${US_RUN_MODE}" >> "$GITHUB_ENV"
            echo "TRADE_SESSION=afternoon" >> "$GITHUB_ENV"
            export EXPECTED_TO_TRADE="${US_EXPECTED_TO_TRADE:-1}" ORDER_ALLOWED="${US_ORDER_ALLOWED}" KIS_ORDER_ALLOWED="${US_KIS_ORDER_ALLOWED}" SIGNAL_ONLY="${US_SIGNAL_ONLY}" RUN_MODE="${US_RUN_MODE}" TRADE_SESSION="afternoon"

            export US_SCHEDULE_EXPECTED_ET="1303"
            export US_ACTUAL_START_ET="${{ steps.phase_guard.outputs.now_hhmmss }}"
            export US_DELAY_SECONDS="${{ steps.phase_guard.outputs.delay_seconds }}"
            export US_RUN_WINDOW="${{ steps.phase_guard.outputs.run_window }}"
            export US_RECOVERY_RUN="${{ steps.phase_guard.outputs.recovery_run }}"
            export US_MISSED_TRADE_WINDOW="0"

            RUN_MODE_FLAG="--run-mode ${US_RUN_MODE}"
            SIGNAL_ONLY_FLAG=""
            if [ "${US_SIGNAL_ONLY}" = "1" ]; then
              SIGNAL_ONLY_FLAG="--signal-only"
            fi

            set +e
            python -m trader.us.runner.trade_session_runner \
              --session afternoon \
              --env practice \
              --max-minutes "${MAX_MINUTES}" \
              --interval-sec "${INTERVAL_SEC}" \
              ${RUN_MODE_FLAG} \
              ${SIGNAL_ONLY_FLAG} \
              ${FORCE_NOW_FLAG} \
              ${MAX_TICKS_FLAG} \
              ${OFFLINE_FLAG} 2>&1 | tee -a artifacts/${US_LOG_FILE}
            status=${PIPESTATUS[0]}
            set -e
            report_status="OK"
            if [ -f "reports/us_daily/latest_us_daily_report.json" ]; then
              report_status=$(python3 -c "import json; from pathlib import Path; path = Path('reports/us_daily/latest_us_daily_report.json'); payload = json.loads(path.read_text()) if path.exists() else {}; print(payload.get('final_status', 'OK'))")
            fi
            echo "[US_TRADE_AFTERNOON][PYTHON_EXIT] status=${status}" | tee -a artifacts/${US_LOG_FILE}
            if [ "${status}" -eq 0 ]; then
              echo "US_TRADE_STATUS=OK" >> "$GITHUB_ENV"
              echo "[US_TRADE_RUNNER][DONE] session=afternoon" | tee -a artifacts/${US_LOG_FILE}
              echo "[US_TRADE_AFTERNOON][DONE]" | tee -a artifacts/${US_LOG_FILE}
              echo "[US_TRADE_AFTERNOON][FINAL_STATUS] status=OK trade_runner_started=1" | tee -a artifacts/${US_LOG_FILE}
            else
              echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
              echo "US_TRADE_RUNNER_BLOCK_REASON=python_exit_${status}" >> "$GITHUB_ENV"
              echo "[US_TRADE_AFTERNOON][FAILED] python_exit=${status}" | tee -a artifacts/${US_LOG_FILE}
              echo "[US_TRADE_AFTERNOON][FINAL_STATUS] status=FAILED trade_runner_started=1 reason=python_exit_${status}" | tee -a artifacts/${US_LOG_FILE}
            fi
            exit ${status}
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Validate latest US Afternoon report contract
        if: always()
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail

          # Trim force_now input
          FORCE_NOW_TRIMMED=$(echo "${FORCE_NOW_INPUT}" | xargs)

          # Determine expected trade_date
          if [ -n "${FORCE_NOW_TRIMMED}" ]; then
            trade_date=$(python3 -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_TRIMMED}').strftime('%Y-%m-%d'))")
            echo "[US_REPORT_VALIDATE][EXPECTED_DATE] source=force_now trade_date=${trade_date}"
          else
            trade_date=$(python3 -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d'))")
            echo "[US_REPORT_VALIDATE][EXPECTED_DATE] source=now_ny trade_date=${trade_date}"
          fi

          # Ensure report file exists before calling validator
          if [ ! -f "reports/us_daily/latest_us_daily_report.json" ]; then
            if [ "${US_EXPECTED_TO_TRADE:-0}" = "1" ]; then
              echo "::error::missing latest US report json — trade runner did not write a report"
              echo "[US_TRADE_AFTERNOON][FATAL] trade_daily_report_missing trade_runner_not_started" | tee -a artifacts/${US_LOG_FILE}
              echo "[US_WORKFLOW][FINAL_STATUS] status=FAILED reason=trade_runner_not_started" | tee -a artifacts/${US_LOG_FILE}
              exit 2
            fi
            echo "[US_REPORT_VALIDATE][SKIP] session=afternoon reason=trade_not_expected"
            exit 0
          fi

          # Run standalone validator (exits 0 for warnings, 1 for fatal)
          python3 scripts/validate_us_daily_report.py \
            --report reports/us_daily/latest_us_daily_report.json \
            --expected-trade-date "${trade_date}" \
            --expected-run-id "${GITHUB_RUN_ID}" \
            --expected-dry-run "${DRY_RUN}" \
            --session afternoon 2>&1 | tee -a artifacts/${US_LOG_FILE}
          validator_exit=${PIPESTATUS[0]}

          # Write last_stage artifact (best effort)
          python3 -c "import json; from pathlib import Path; payload = json.loads(Path('reports/us_daily/latest_us_daily_report.json').read_text()); Path('artifacts/us_last_stage.txt').write_text(str(payload.get('last_stage', 'unknown')) + '\n')" 2>/dev/null || true

          exit "${validator_exit}"


      - name: Verify US Afternoon log contract
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          test -f artifacts/${US_LOG_FILE} || { echo "::warning::missing US log file"; exit 0; }

          if grep -E "\[US_WORKFLOW\]\[FINAL_STATUS\] status=FAILED_TRADE_NOT_STARTED" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AFTERNOON_VERIFY][FAIL] trade runner missing failure captured"
            exit 1
          fi

          # Success: phase guard intentionally skipped the afternoon run.
          if grep -E "\[RUN_SUMMARY\]\[RESULT\] status=SKIP_PHASE_WINDOW|\[US_TRADE_AFTERNOON\]\[EXIT\] reason=phase_guard_skip" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AFTERNOON_VERIFY][SKIP_OK] phase guard skipped afternoon intentionally"
            exit 0
          fi

          # Success: already_ran or already_ran_after_wait
          if grep -E "\[RUN_SUMMARY\]\[RESULT\] status=OK reason=(already_ran|already_ran_after_wait)|\[US_TRADE_AFTERNOON\]\[FINISH\].*status=OK.*reason=(already_ran|already_ran_after_wait)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AFTERNOON_VERIFY][OK] duplicate/already-ran marker accepted"
            exit 0
          fi

          # Success: prep guard failure was properly reported
          if grep -E "\[US_PREP_GUARD\]\[FAIL\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1 && \
             grep -E "\[US_PREP_GUARD\]\[REPORT_WRITE\]\[DONE\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1 && \
             grep -E "\[RUN_SUMMARY\]\[RESULT\] status=FAILED_PREP_GUARD" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AFTERNOON_VERIFY][GUARD_FAIL_REPORTED] prep guard failure reported clearly"
            exit 0
          fi

          # ── Schedule Practice Trade Contract (한국장 패턴 적용) ────────────────
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${KIS_ENV}" == "practice" ]]; then
            # 1. DRY_RUN=1 금지 (schedule practice는 실제 모의투자 주문을 보내야 함)
            if grep -E "\[US_ENV_CHECK\] DRY_RUN=1|\[US_TRADE_.*\]\[ENV\] DRY_RUN=1" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::Scheduled US practice trade ran with DRY_RUN=1"
              exit 1
            fi

            # 2. [US_ORDER][DRY_RUN] 금지
            if grep -E "\[US_ORDER\]\[DRY_RUN\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::Scheduled US practice trade produced dry-run orders"
              exit 1
            fi

            # 3. Watchlist score contract fail 금지
            if grep -E "locked_watchlist_score_contract_fail|score_alias_resolution_failed|watchlist_score_zero_mass" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::US watchlist score contract failed"
              exit 1
            fi

            # 4. Score=0 intent 생성 금지
            if grep -E "\[US_ENTRY\]\[INTENT\].*score=0\.000000" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "::error::US entry intent generated with zero score"
              exit 1
            fi
          fi

          # Fatal errors.
          if grep -E "Traceback|\[US_KIS\]\[HTTP_FAIL_FINAL\]|\[US_FILLS\]\[ERROR\]\[CONTRACT\]|\[US_SESSION\]\[TICK_LOOP\]\[ERROR\]|\[US_SESSION\]\[END\].*reason=fills_contract_error|\[US_TICK\]\[DONE\].*status=ERROR.*reason=locked_watchlist_score_contract_fail" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::Fatal afternoon trade error detected"
            grep -n -E "Traceback|\[US_KIS\]\[HTTP_FAIL_FINAL\]|\[US_FILLS\]\[ERROR\]\[CONTRACT\]|\[US_SESSION\]\[TICK_LOOP\]\[ERROR\]|\[US_SESSION\]\[END\].*reason=fills_contract_error|\[US_TICK\]\[DONE\].*status=ERROR" artifacts/${US_LOG_FILE} | head -20
            exit 1
          fi

          # Success session end.
          if grep -E "\[US_SESSION\]\[END\].*reason=(session_end|max_ticks|force_now_single_tick|market_skip)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AFTERNOON_VERIFY][OK] session ended acceptably"
            exit 0
          fi

          if grep -E "\[US_TRADE_AFTERNOON\]\[DONE\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_TRADE_AFTERNOON_VERIFY][OK] workflow done marker accepted"
            exit 0
          fi

          echo "::error::US Afternoon final success marker missing"
          exit 1

      - name: Assert US Afternoon trade runner started or explicitly skipped
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/us_assert_trade_runner_started.py \
            --session afternoon \
            --log "artifacts/${US_LOG_FILE}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --kis-env "${KIS_ENV}" \
            --phase-should-run "${{ steps.phase_guard.outputs.should_run || '0' }}" \
            --run-mode "${{ steps.run_mode.outputs.run_mode || '' }}" \
            --order-allowed "${{ steps.run_mode.outputs.order_allowed || '0' }}" \
            --kis-order-allowed "${{ steps.run_mode.outputs.kis_order_allowed || '0' }}" \
            --runner-started "${US_TRADE_RUNNER_STARTED:-0}"

      - name: Generate US PnL report
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[US_PNL][START] session=afternoon env=${KIS_ENV}" | tee -a artifacts/${US_LOG_FILE}

          # PnL report는 항상 생성 시도 (실패해도 FAILED_PNL_REPORT 상태로 파일 생성)
          python scripts/generate_us_portfolio_pnl_report.py \
            --session afternoon \
            --env "${KIS_ENV}" \
            --output-dir reports/us_pnl \
            --latest-daily-report reports/us_daily/latest_us_daily_report.json \
            2>&1 | tee -a artifacts/${US_LOG_FILE} || {
              echo "::warning::US PnL report generation failed, but continuing"
            }

          echo "[US_PNL][DONE]" | tee -a artifacts/${US_LOG_FILE}

      - name: Validate US PnL report
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[US_PNL_REPORT][VALIDATE][START] session=afternoon" | tee -a artifacts/${US_LOG_FILE}
          test -f reports/us_pnl/latest_us_pnl_report.json || {
            echo "::error::missing US PnL report JSON" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          test -f reports/us_pnl/latest_us_pnl_report.md || {
            echo "::error::missing US PnL report MD" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          test -f reports/us_pnl/latest_us_pnl_report.csv || {
            echo "::error::missing US PnL report CSV" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }
          test -s reports/us_pnl/latest_us_pnl_report.md || {
            echo "::error::empty US PnL report MD" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          }

          # status가 FAILED_PNL_REPORT여도 파일은 있어야 한다
          pnl_status=$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('reports/us_pnl/latest_us_pnl_report.json').read_text()).get('status', 'UNKNOWN'))")
          pnl_source=$(python3 -c "import json; from pathlib import Path; print(json.loads(Path('reports/us_pnl/latest_us_pnl_report.json').read_text()).get('pnl_position_source', 'unknown'))")
          echo "US_PNL_STATUS=${pnl_status}" >> "$GITHUB_ENV"
          echo "[US_PNL_REPORT][STATUS] ${pnl_status}" | tee -a artifacts/${US_LOG_FILE}
          echo "[US_PNL][FINAL_STATUS] status=${pnl_status} source=${pnl_source}" | tee -a artifacts/${US_LOG_FILE}

          if [[ "${pnl_status}" == "FAILED_PNL_REPORT" ]]; then
            echo "::warning::US PnL report status is FAILED_PNL_REPORT, but files exist" | tee -a artifacts/${US_LOG_FILE}
          elif [[ "${pnl_status}" == "PARTIAL" ]]; then
            echo "::warning::US PnL report status is PARTIAL (incomplete data)" | tee -a artifacts/${US_LOG_FILE}
          else
            echo "[US_PNL_REPORT][OK] status=${pnl_status}" | tee -a artifacts/${US_LOG_FILE}
          fi
          echo "[US_PNL_REPORT][VALIDATE][DONE] session=afternoon" | tee -a artifacts/${US_LOG_FILE}

      - name: Finalize Afternoon workflow status
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          trade_status="${US_TRADE_STATUS:-SKIPPED}"
          pnl_status="${US_PNL_STATUS:-UNKNOWN}"
          expected_to_trade="${US_EXPECTED_TO_TRADE:-0}"
          trade_runner_started="${US_TRADE_RUNNER_STARTED:-0}"
          block_reason="${US_TRADE_RUNNER_BLOCK_REASON:-trade_pipeline_gate_failed}"
          workflow_status="OK"
          accepted_skip=0
          if grep -E "\[RUN_SUMMARY\]\[RESULT\] status=SKIP_PHASE_WINDOW|\[US_TRADE_AFTERNOON\]\[EXIT\] reason=phase_guard_skip|\[US_TRADE_SESSION_LOCK\]\[SKIP\] reason=session_already_running_or_completed|\[RUN_SUMMARY\]\[RESULT\] status=OK reason=(already_ran|already_ran_after_wait)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            accepted_skip=1
          fi
          phase_should_run="${{ steps.phase_guard.outputs.should_run || '0' }}"
          run_mode="${{ steps.run_mode.outputs.run_mode || '' }}"
          order_allowed="${{ steps.run_mode.outputs.order_allowed || '0' }}"
          kis_order_allowed="${{ steps.run_mode.outputs.kis_order_allowed || '0' }}"

          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${KIS_ENV}" == "practice" && "${phase_should_run}" == "1" && "${run_mode}" == "TRADE" && "${order_allowed}" == "1" && "${kis_order_allowed}" == "1" && "${accepted_skip}" != "1" && "${trade_runner_started}" != "1" ]]; then
            workflow_status="FAILED_TRADE_NOT_STARTED"
            echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
            echo "US_EXPECTED_TO_TRADE=1" >> "$GITHUB_ENV"
            echo "US_TRADE_RUNNER_BLOCK_REASON=trade_runner_not_started_after_guards" >> "$GITHUB_ENV"
          elif [ "${expected_to_trade}" = "1" ] && [ "${trade_runner_started}" != "1" ]; then
            workflow_status="FAILED_TRADE_NOT_STARTED"
            echo "US_TRADE_STATUS=FAILED" >> "$GITHUB_ENV"
          elif [ "${trade_status}" = "FAILED" ] && [[ "${pnl_status}" == OK* ]]; then
            workflow_status="FAILED_AFTERNOON_TRADE_PNL_ONLY"
          elif [ "${trade_status}" = "FAILED" ]; then
            workflow_status="FAILED_FINAL"
          elif [ "${trade_status}" = "SKIPPED_DUPLICATE_SESSION" ]; then
            workflow_status="SKIPPED_DUPLICATE_SESSION"
          elif [ "${trade_status}" = "OK_ALREADY_RAN" ]; then
            workflow_status="OK_ALREADY_RAN"
          elif [ "${trade_status}" = "SKIPPED" ]; then
            workflow_status="SKIPPED"
          fi

          echo "[US_WORKFLOW][FINAL_STATUS] status=${workflow_status} trade_status=${trade_status} expected_to_trade=${expected_to_trade} trade_runner_started=${trade_runner_started} reason=${block_reason}" | tee -a artifacts/${US_LOG_FILE}

          if [ "${workflow_status}" = "FAILED_AFTERNOON_TRADE_PNL_ONLY" ] || [ "${workflow_status}" = "FAILED_FINAL" ] || [ "${workflow_status}" = "FAILED_TRADE_NOT_STARTED" ]; then
            exit 1
          fi

      - name: Finish Afternoon session lock
        if: always() && steps.session_lock.outputs.claimed == '1'
        working-directory: repo
        env:
          TRADE_DATE: ${{ steps.session_lock.outputs.trade_date }}
        run: |
          set -euo pipefail
          python scripts/us_finish_session_lock.py --session afternoon --trade-date "${TRADE_DATE}"

      - name: Print US PnL report to console and summary
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail

          PNL_MD="reports/us_pnl/latest_us_pnl_report.md"
          PNL_JSON="reports/us_pnl/latest_us_pnl_report.json"
          PNL_CSV="reports/us_pnl/latest_us_pnl_report.csv"

          {
            echo ""
            echo "============================================================"
            echo "[US_PNL_REPORT_MD][BEGIN]"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
            echo "file=${PNL_MD}"
            echo "============================================================"
          } | tee -a "artifacts/${US_LOG_FILE}"

          if [ -f "${PNL_MD}" ]; then
            cat reports/us_pnl/latest_us_pnl_report.md | tee -a "artifacts/${US_LOG_FILE}"
            {
              echo ""
              echo "## US PnL Report"
              echo ""
              echo "- workflow: ${GITHUB_WORKFLOW}"
              echo "- run_id: ${GITHUB_RUN_ID}"
              echo "- attempt: ${GITHUB_RUN_ATTEMPT}"
              echo ""
              cat "${PNL_MD}"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::US PnL markdown not found: ${PNL_MD}" | tee -a "artifacts/${US_LOG_FILE}"
            {
              echo ""
              echo "## US PnL Report"
              echo ""
              echo "PNL markdown missing: ${PNL_MD}"
              echo ""
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          {
            echo "============================================================"
            echo "[US_PNL_REPORT_MD][END]"
            echo "json_exists=$([ -f "${PNL_JSON}" ] && echo 1 || echo 0)"
            echo "csv_exists=$([ -f "${PNL_CSV}" ] && echo 1 || echo 0)"
            echo "============================================================"
            echo ""
          } | tee -a "artifacts/${US_LOG_FILE}"

      - name: Upload US artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.US_ARTIFACT_NAME }}-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/reports/us_daily/
            repo/reports/us_pnl/
          if-no-files-found: warn
          retention-days: 7

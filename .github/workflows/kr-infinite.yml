name: KR Infinite V1
on:
  workflow_dispatch:
concurrency:
  group: kr-infinite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  decision:
    runs-on: ubuntu-latest
    env:
      KR_INFINITE_ENABLED: ${{ vars.KR_INFINITE_ENABLED || '0' }}
      KR_INFINITE_LIVE: ${{ vars.KR_INFINITE_LIVE || '0' }}
      KR_INFINITE_USE_PREBUILT_REGIME: '1'
      KIS_ENV: ${{ vars.KIS_ENV || 'practice' }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Build current KOSPI regime snapshot
        run: python -m trader.kr.infinite.regime_source
      - run: python -m trader.kr.infinite.runner

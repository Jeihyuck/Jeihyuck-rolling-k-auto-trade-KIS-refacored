name: PR126 provenance review fix

on:
  push:
    branches:
      - fix/us-broker-truth-tqqq-tp-audit-20260912
    paths:
      - .github/workflows/pr126-review-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/us-broker-truth-tqqq-tp-audit-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve broker average provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('trader/us/execution/order_router.py')
          text = router.read_text(encoding='utf-8')
          old = '        "broker_avg_price_source": "kis_pchs_avg_pric",\n'
          new = '        "broker_avg_price_source": str(broker_position.get("broker_avg_price_source") or "kis_pchs_avg_pric"),\n'
          if old not in text:
              if new not in text:
                  raise SystemExit('PR126 provenance patch anchor missing')
          else:
              router.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/us/test_us_20260910_20260911_incident_fixes.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_name = 'test_take_profit_refresh_preserves_buy_amount_div_qty_provenance'
          if test_name not in test_text:
              test_text += '''\n\ndef test_take_profit_refresh_preserves_buy_amount_div_qty_provenance():\n    intent = {\n        "symbol": "AAPL", "side": "SELL", "qty": 2,\n        "limit_price": 104.0, "reason": "TAKE_PROFIT_TP1",\n        "position_lifecycle_id": "lc-aapl-derived",\n        "meta": {\n            "reason": "TAKE_PROFIT_TP1",\n            "tp_threshold_fraction": 0.03,\n            "position_lifecycle_id": "lc-aapl-derived",\n        },\n    }\n    broker = {\n        "symbol": "AAPL",\n        "qty": 10,\n        "orderable_qty": 10,\n        "broker_avg_price": 100.0,\n        "broker_avg_price_source": "kis_buy_amount_div_qty",\n        "broker_avg_price_currency": "USD",\n        "balance_source": "kis_balance_authoritative",\n        "authoritative_positions": True,\n    }\n    result = _validate_take_profit_with_fresh_broker_position(intent, broker, now=NOW)\n    assert result["ok"] is True\n    assert intent["meta"]["broker_avg_price_source"] == "kis_buy_amount_div_qty"\n'''
              test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Compile changed Python
        run: python -m py_compile trader/us/execution/order_router.py tests/us/test_us_20260910_20260911_incident_fixes.py
      - name: Commit review fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr126-review-fix.yml
          git add trader/us/execution/order_router.py tests/us/test_us_20260910_20260911_incident_fixes.py
          git commit -m "fix(us): preserve KIS average-price provenance"
          git push origin HEAD:fix/us-broker-truth-tqqq-tp-audit-20260912

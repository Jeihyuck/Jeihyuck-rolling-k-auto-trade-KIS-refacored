name: KR249 ORIGINAL KIS PRACTICE READONLY PROBE
on:
  push:
    branches:
      - fix/kr-20261021-22-integrated-p0-p1
    paths:
      - '.github/workflows/kr249-kis-original-probe-pr-ephemeral.yml'
permissions:
  contents: read
concurrency:
  group: kr249-original-practice-once
  cancel-in-progress: false
jobs:
  original-kis-evidence:
    if: github.repository == 'Jeihyuck/Jeihyuck-rolling-k-auto-trade-KIS-refacored'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIS_ENV: practice
      STRATEGY_ENV: practice
      STRATEGY_MODE: LIVE
      KIS_HTTP_ENABLED: '1'
      KIS_CCLD_FAIL_OPEN: '0'
      KIS_CCLD_RETRY_MAX: '2'
      DRY_RUN: '1'
      NO_TRADE: '1'
      DISABLE_REAL_TRADING: '1'
      LIVE_TRADING_ENABLED: '0'
      ALLOW_REAL_ORDER: '0'
      US_ORDER_ARMED: '0'
      KIS_ORDER_ALLOWED: '0'
      PB1_KIS_ORDER_ALLOWED: '0'
      PYTHONPATH: '.'
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm repo, branch and practice-only
        run: |
          test "$GITHUB_REF_NAME" = 'fix/kr-20261021-22-integrated-p0-p1'
          test "$KIS_ENV" = 'practice'
          test "$STRATEGY_ENV" = 'practice'
          test -n "$KIS_APP_KEY" && test -n "$KIS_APP_SECRET"
          test -n "$CANO" && test -n "$ACNT_PRDT_CD"
      - name: Install broker GET-only dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Assert probe has no order/cancel/database writes
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path("scripts/kr/pr249_original_kis_readonly.py").read_text()
          for disallowed in ("sell_stock_", "buy_stock_", "place_order(", "order_cash(", "cancel_order(", "apply_fill(", "mark_submitted(", "UPDATE public.", "DELETE FROM", "INSERT INTO"):
              assert disallowed not in s, disallowed
          assert 'run_practice_readonly()' in s
          assert '_daily_ccld_all_pages_for_date' in s
          PY
      - name: Execute historical 2026-10-21/22 KIS GET-only evidence
        run: python -m scripts.kr.pr249_original_kis_readonly

      - name: Read original-account current positions (no prices or account values printed)
        run: |
          python - <<'PY'
          import hashlib, json, logging
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from trader.kis_wrapper import KisAPI
          from trader.account_state import get_account_key
          from scripts.kr.pr249_original_kis_readonly import EXPECTED_ACCOUNT_DIGEST_PREFIX
          logging.disable(logging.CRITICAL)
          kis = KisAPI(kis_env="practice")
          assert kis.env == "practice"
          digest = hashlib.sha256(get_account_key(env="practice", kis=kis).encode()).hexdigest()
          assert digest.startswith(EXPECTED_ACCOUNT_DIGEST_PREFIX), "ACCOUNT_SCOPE_MISMATCH"
          result = kis.inquire_balance_all(max_pages=20)
          assert isinstance(result,dict) and not result.get("_diag_stub") and not result.get("_stub")
          assert isinstance(result.get("output1"),list) and result.get("output2") is not None
          wanted=("053800","251970","253590","086450","144960")
          holding={c:0 for c in wanted}
          for raw in result["output1"]:
              code=str(raw.get("pdno") or "").replace("A","").zfill(6)
              if code in holding:
                  qty=int(raw.get("hldg_qty") or 0)
                  assert qty >= 0
                  holding[code] += qty
          print(json.dumps({
              "source":"KIS_PRACTICE_AUTHENTICATED_HOLDINGS_GET",
              "verified_at_kst":datetime.now(ZoneInfo("Asia/Seoul")).isoformat(),
              "account_digest_prefix":digest[:12],
              "pages_complete":True,
              "holding_qty_by_code":holding,
          },ensure_ascii=False))
          PY

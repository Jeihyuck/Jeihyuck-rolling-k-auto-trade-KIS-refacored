name: KR US-Standard Profit Parity Shadow CI

on:
  pull_request:
    branches: [codex/kr-reconcile-performance-20261106, dual-agent]
    paths:
      - "trader/kr/us_standard_profit_parity.py"
      - "tests/kr/test_kr_us_standard_profit_parity_20261106.py"
      - ".github/workflows/kr-us-standard-profit-parity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-parity-shadow-no-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      STRATEGY_ENV: practice
      KIS_ENV: practice
      DRY_RUN: "1"
      LIVE_TRADING_ENABLED: "0"
      ALLOW_REAL_ORDER: "0"
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
      KR_SWING_US_PROFIT_MODE: LEGACY
      KR_SWING_US_PROFIT_DEPLOY_APPROVED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile policy modules
        run: |
          python -m py_compile trader/kr/us_standard_profit_parity.py trader/us/market_state_overlay.py trader/us/pb1/swing_runner_exit_v3.py
      - name: US/KR parity math, contract integrity and owner exclusion
        run: python -m pytest -q tests/kr/test_kr_us_standard_profit_parity_20261106.py

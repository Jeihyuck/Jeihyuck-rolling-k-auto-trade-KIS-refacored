name: KR US-Standard Profit Active Execution CI

on:
  pull_request:
    branches: [codex/kr-reconcile-performance-20261106, dual-agent]
    paths:
      - "trader/kr/us_standard_profit_parity.py"
      - "trader/kr/us_profit_stage_journal.py"
      - "trader/kr/us_profit_execution_router.py"
      - "trader/kr/us_profit_existing_amendment.py"
      - "trader/kr/us_v3_runner_active.py"
      - "trader/pb1_engine.py"
      - "trader/reconcile_kis.py"
      - "trader/db/repos.py"
      - "scripts/wsl/run-kr-am.sh"
      - "scripts/wsl/run-kr-afternoon.sh"
      - "scripts/wsl/run-kr-close.sh"
      - "scripts/wsl/diagnose-kr-no-runs-20261111.sh"
      - "scripts/wsl/send-market-log-mail.sh"
      - "scripts/wsl/kr_mail_execution_evidence.py"
      - "trader/kr/close_reporting_20261111.py"
      - "trader/kr/runner/trade_session_runner.py"
      - "tests/kr/test_kr_close_reporting_20261111.py"
      - "tests/test_kr_mail_execution_evidence_20261111.py"
      - "tests/test_market_log_mail_e2e.py"
      - "tests/kr/infinite/test_runner_integration.py"
      - "trader/kr/infinite/runner.py"
      - "tests/kr/test_kr_us_standard_profit_parity_20261106.py"
      - "tests/kr/test_kr_us_profit_stage_postgres_20261106.py"
      - "tests/kr/test_kr_us_profit_active_router_20261111.py"
      - "tests/kr/test_kr_samsung_ea_explicit_amendment_20261111.py"
      - "tests/kr/test_kr_us_v3_native_runner_20261111.py"
      - ".github/workflows/kr-us-standard-profit-parity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-parity-active-offline-no-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: "."
      STRATEGY_ENV: practice
      KIS_ENV: practice
      DRY_RUN: "1"
      LIVE_TRADING_ENABLED: "0"
      ALLOW_REAL_ORDER: "0"
      KIS_APP_KEY: ""
      KIS_APP_SECRET: ""
      KR_SWING_US_PROFIT_MODE: ACTIVE_PRACTICE
      KR_SWING_US_PROFIT_DEPLOY_APPROVED: "1"
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kr_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline Python dependencies
        run: python -m pip install -r requirements.txt pytest psycopg2-binary
      - name: Compile policy modules
        run: |
          python -m py_compile trader/kr/us_standard_profit_parity.py trader/kr/us_profit_stage_journal.py trader/kr/us_profit_execution_router.py trader/kr/us_profit_existing_amendment.py trader/kr/us_v3_runner_active.py trader/us/pb1/swing_runner_exit_v3.py trader/pb1_engine.py trader/reconcile_kis.py trader/kr/runner/trade_session_runner.py trader/kr/close_reporting_20261111.py scripts/wsl/kr_mail_execution_evidence.py
      - name: Practice ACTIVE route, Samsung amendment, US V3 runner and durable Postgres stage tests
        run: |
          python -m pytest -q \
            tests/kr/test_kr_us_standard_profit_parity_20261106.py \
            tests/kr/test_kr_us_profit_stage_postgres_20261106.py \
            tests/kr/test_kr_us_profit_active_router_20261111.py \
            tests/kr/test_kr_samsung_ea_explicit_amendment_20261111.py \
            tests/kr/test_kr_us_v3_native_runner_20261111.py \
            tests/kr/test_kr_close_reporting_20261111.py \
            tests/test_kr_mail_execution_evidence_20261111.py \
            tests/test_market_log_mail_e2e.py
      - name: KR operating runner script syntax
        run: bash -n scripts/wsl/run-kr-am.sh scripts/wsl/run-kr-afternoon.sh scripts/wsl/run-kr-close.sh scripts/wsl/diagnose-kr-no-runs-20261111.sh scripts/wsl/send-market-log-mail.sh

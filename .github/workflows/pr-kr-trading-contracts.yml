name: PR KR Trading Contracts

on:
  pull_request:
    branches:
      - dual-agent
      - main
      - master
  workflow_dispatch:

jobs:
  kr-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STRATEGY_ENV: practice
      KIS_ENV: practice
      MARKET: KR
      REGION: KR
      PB1_MARKET_SCOPE: KRX
      DRY_RUN: "1"
      STRATEGY_MODE: LIVE
      KR_PB1_VOL_MAX: "1.25"
      KR_PB1_VOLU_MAX: "1.25"
      KR_PB1_VOLU_MAX_INTRADAY: "1.25"
      DB_LOCK_TIMEOUT_MS: "5000"
      DB_STATEMENT_TIMEOUT_MS: "15000"
      DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
      PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"
      KR_PREP_AUX_WATCHLIST_TIMEOUT_SEC: "20"
      KR_PREP_AUX_REPORT_TIMEOUT_SEC: "30"
      KR_PREP_AUX_DEFAULT_TIMEOUT_SEC: "20"
      PBCORE_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/kr_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff psycopg2-binary

      - name: Byte compile
        run: python -m compileall trader

      - name: Check KR prep undefined names
        run: ruff check trader/prep_runner.py --select F821

      - name: KR contract tests
        run: |
          pytest tests/test_kr_final30_contract.py -q

      - name: Migration 0050 legacy schema hotfix tests
        run: |
          pytest tests/test_migration_0050_legacy_schema.py -q
          pytest tests/test_pm_completed_marker_retryable.py -q
          pytest tests/test_prep_core_marker.py -q
          pytest tests/test_prep_aux_timeout.py -q
          pytest tests/test_kr_session_result_file.py -q
          pytest tests/test_live_gate_refresh_order.py -q
          pytest tests/test_pb1_volume_config_unified.py -q

      - name: New KR regime tests
        run: |
          pytest tests/kr/test_kr_regime.py -q
          pytest tests/kr/test_kr_regime_runtime.py -q
          pytest tests/kr/test_kr_regime_production_path.py -q
          pytest tests/kr/test_kr_market_budget_allocation.py -q
          pytest tests/kr/test_kr_market_local_entry_and_trim.py -q
          pytest tests/kr/test_kr_final_order_invariants.py -q
          pytest tests/test_watchlist_scored_roundtrip.py -q
          pytest tests/test_kr_prep_market_benchmark_runtime.py -q
          pytest tests/kr -q

      - name: Check KR legacy regime removal
        run: bash scripts/check_kr_legacy_regime.sh

      - name: Existing entry and exit tests
        run: |
          pytest tests/test_entry_guard_final30.py tests/test_final30_load_required.py -q
          pytest tests/test_pb1_exit_signature.py -q
          pytest tests/test_reconcile_entry_exit_plan_restore.py tests/test_entry_horizon_classification.py tests/test_pb1_kr_kis_authoritative_empty.py tests/test_pb1_entry_plan_persistence.py tests/test_position_cycle_lifecycle.py -q

name: PR68 Direct Hardening Patch

on:
  push:
    branches:
      - codex/fix-all-us-dual-agent-execution-failures
    paths:
      - .github/workflows/pr68-direct-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    env:
      TRADING_REGION: US
      KIS_ENV: practice
      US_PAPER_TRADING_ENABLED: "1"
      DRY_RUN: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: .
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-all-us-dual-agent-execution-failures
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply deterministic patch
        run: python .github/scripts/pr68_direct_fix.py

      - name: Compile modified modules
        run: |
          python -m py_compile \
            trader/us/runner/trade_close_runner.py \
            trader/us/execution/reconcile.py \
            trader/us/execution/order_router.py

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/us/test_us_trade_date_and_cumulative_connection.py \
            tests/us/test_us_reconcile_contract_hardening.py

      - name: Remove temporary patch machinery
        run: |
          rm -f .github/scripts/pr68_direct_fix.py
          rm -f .github/workflows/pr68-direct-fix.yml

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden US trade-date and reconcile contracts"
          git push origin HEAD:codex/fix-all-us-dual-agent-execution-failures

name: PB1 Watchlist Build (Weekly)

on:
  schedule:
    # 매주 월요일 08:55 KST = 일요일 23:55 UTC
    - cron: "55 23 * * 0"
  workflow_dispatch:  # 수동 실행 허용

jobs:
  build-watchlist:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build watchlist
        run: |
          set -euo pipefail
          export PB1_JOB=BUILD_WATCHLIST
          export STRATEGY_MODE=DIAG
          python -m trader.pb1_runner
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          CANO: ${{ secrets.CANO }}
          ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          KIS_ENV: ${{ secrets.KIS_ENV }}
          PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
          ENV: ${{ secrets.KIS_ENV }}
          STRATEGY: best_k_meta
          
          # Watchlist 설정
          PB1_WATCHLIST_ENABLED: "1"
          PB1_WATCHLIST_TOPK: "50"
          PB1_WATCHLIST_FINALN: "25"
          PB1_WATCHLIST_MIN_PRICE: "2000"
          PB1_WATCHLIST_LIQ_DAYS: "20"
          PB1_WATCHLIST_MIN_ROWS: "30"
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchlist-build-logs
          path: logs/
          retention-days: 7

name: Candidate Pool Weekly Build

on:
  workflow_dispatch:
    inputs:
      FORCE_REBUILD:
        description: "Force rebuild (1=yes, 0=no)"
        required: false
        default: "1"
      ENV:
        description: "Environment (LIVE/PAPER)"
        required: false
        default: "PAPER"

  # Sat 00:30 KST = Fri 15:30 UTC
  schedule:
    - cron: "30 15 * * 5"

  # (선택) 후보군 로직 관련 파일 변경 시에만 push 트리거
  push:
    branches: [ "nullim" ]
    paths:
      - "trader/candidate_pool_builder.py"
      - "trader/candidate_pool/**"
      - ".github/workflows/candidate-pool.yml"

permissions:
  contents: read

concurrency:
  group: candidate-pool-build
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_pool:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      # DB
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}

      # 모드/환경
      STRATEGY_MODE: "DIAG"
      STRATEGY_ENV: ${{ github.event.inputs.ENV || 'PAPER' }}
      KIS_HTTP_ENABLED: "0"

      # Candidate Pool
      CANDIDATE_POOL_ENABLED: "1"
      CANDIDATE_POOL_FORCE_REBUILD: ${{ github.event.inputs.FORCE_REBUILD || '1' }}
      CANDIDATE_POOL_SIZE: "120"
      CANDIDATE_POOL_MIN_SIZE: "40"
      CANDIDATE_POOL_TTL_DAYS: "7"
      CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"

      # Strategy key base
      STRATEGY_KEY: "best_k_meta"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build candidate pool
        run: |
          echo "======================================"
          echo "Candidate Pool Weekly Build"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Mode: DIAG (no trading, pool build only)"
          echo "Env: ${STRATEGY_ENV}"
          echo "Force rebuild: ${CANDIDATE_POOL_FORCE_REBUILD}"
          echo "Pool size target: ${CANDIDATE_POOL_SIZE}"
          echo "Pool min size: ${CANDIDATE_POOL_MIN_SIZE}"
          echo "TTL(days): ${CANDIDATE_POOL_TTL_DAYS}"
          echo "======================================"

          python -m trader.candidate_pool_builder \
            --build pool \
            --env "${STRATEGY_ENV}"

      - name: Verify pool saved
        run: |
          python - <<'PY'
          import os, sys
          from trader.db.engine import get_engine
          from trader.db.repos import WatchlistRepo
          from trader.time_utils import prev_business_day, now_kst

          env = os.getenv("STRATEGY_ENV", "PAPER")
          strategy_key = os.getenv("STRATEGY_KEY", "best_k_meta")
          pool_strategy_key = f"{strategy_key}__pool"

          engine = get_engine()
          repo = WatchlistRepo(engine)

          # 가장 최신 후보군 날짜 조회
          latest = repo.get_latest_watchlist_date(env=env, strategy=pool_strategy_key)

          if not latest:
            print("[VERIFY][FAIL] No candidate pool found in DB")
            sys.exit(1)

          pool = repo.load_watchlist(env=env, strategy=pool_strategy_key, as_of=latest)
          if not pool:
            print(f"[VERIFY][FAIL] Candidate pool is empty (as_of={latest})")
            sys.exit(1)

          pool_size = len(pool)
          print(f"[VERIFY][SUCCESS] Candidate pool saved: as_of={latest} size={pool_size}")

          min_size = int(os.getenv("CANDIDATE_POOL_MIN_SIZE", "40"))
          if pool_size < min_size:
            print(f"[VERIFY][FAIL] Pool size {pool_size} is below minimum {min_size}")
            sys.exit(1)

          print(f"[VERIFY][OK] Pool size {pool_size} meets minimum requirement")
          print(f"[VERIFY][NOW] now_kst={now_kst().isoformat()} prev_business_day={prev_business_day(now_kst().date())}")
          PY

      - name: Summary
        if: always()
        run: |
          echo "======================================"
          echo "Candidate Pool Build Summary"
          echo "======================================"
          echo "Status: ${{ job.status }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "======================================"

name: Candidate Pool Weekly Build

# 토요일 KST 00:30 = UTC 금요일 15:30
# 주말에 후보군 생성하여 DB에 저장

on:
  workflow_dispatch:
    inputs:
      FORCE_REBUILD:
        description: "강제 재생성 (1=활성)"
        required: false
        default: "1"
      ENV:
        description: "환경 (LIVE/PAPER)"
        required: false
        default: "PAPER"

  schedule:
    # Fri 15:30 UTC = Sat 00:30 KST
    - cron: "30 15 * * 5"

permissions:
  contents: read

concurrency:
  group: candidate-pool-build
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  build_pool:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      # DB 연결
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}

      # 전략/환경 (schedule에는 inputs가 없으니 안전 분기)
      STRATEGY_MODE: "DIAG"
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ENV || 'PAPER' }}

      # KIS HTTP 비활성화 (DIAG 모드에서 KRX fallback 사용)
      KIS_HTTP_ENABLED: "0"

      # 후보군 설정
      CANDIDATE_POOL_ENABLED: "1"
      CANDIDATE_POOL_FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.FORCE_REBUILD || '1' }}
      CANDIDATE_POOL_SIZE: "120"
      CANDIDATE_POOL_MIN_SIZE: "40"
      CANDIDATE_POOL_TTL_DAYS: "7"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build candidate pool
        run: |
          echo "======================================"
          echo "Candidate Pool Weekly Build"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Mode: DIAG (no trading, pool build only)"
          echo "Env: ${STRATEGY_ENV}"
          echo "Force rebuild: ${CANDIDATE_POOL_FORCE_REBUILD}"
          echo "Pool size target: ${CANDIDATE_POOL_SIZE}"
          echo "Pool min size: ${CANDIDATE_POOL_MIN_SIZE}"
          echo "TTL(days): ${CANDIDATE_POOL_TTL_DAYS}"
          echo "======================================"

          python -m trader.candidate_pool_builder \
            --build pool \
            --env "${STRATEGY_ENV}"

      - name: Verify pool saved
        run: |
          echo "======================================"
          echo "Verifying candidate pool in DB..."
          echo "======================================"

          python - <<'PY'
          import os
          import sys

          # engine getter: 프로젝트에 맞는 위치로 조정 필요할 수 있음
          # 1순위: trader.db.engine.get_engine
          # 2순위: trader.db.migrate.get_engine
          get_engine = None
          try:
              from trader.db.engine import get_engine as _get_engine
              get_engine = _get_engine
          except Exception:
              try:
                  from trader.db.migrate import get_engine as _get_engine
                  get_engine = _get_engine
              except Exception as e:
                  print("[VERIFY][FAIL] get_engine import failed:", repr(e))
                  sys.exit(1)

          from trader.db.repos import WatchlistRepo
          from trader.config import CANDIDATE_POOL_STRATEGY_KEY

          env = os.getenv("STRATEGY_ENV", "PAPER")
          min_size = int(os.getenv("CANDIDATE_POOL_MIN_SIZE", "40"))

          engine = get_engine()
          repo = WatchlistRepo(engine)

          latest_date = repo.get_latest_watchlist_date(env=env, strategy=CANDIDATE_POOL_STRATEGY_KEY)
          if not latest_date:
              print("[VERIFY][FAIL] No candidate pool found in DB")
              sys.exit(1)

          pool = repo.load_watchlist(env=env, strategy=CANDIDATE_POOL_STRATEGY_KEY, as_of=latest_date)
          pool_size = len(pool or [])
          if pool_size == 0:
              print(f"[VERIFY][FAIL] Candidate pool is empty (as_of={latest_date})")
              sys.exit(1)

          print(f"[VERIFY][SUCCESS] Candidate pool saved: as_of={latest_date} size={pool_size}")

          if pool_size < min_size:
              print(f"[VERIFY][FAIL] Pool size {pool_size} is below minimum {min_size}")
              sys.exit(1)

          print(f"[VERIFY][OK] Pool size {pool_size} meets minimum requirement")
          PY

      - name: Summary
        if: always()
        run: |
          echo "======================================"
          echo "Candidate Pool Build Summary"
          echo "======================================"
          echo "Status: ${{ job.status }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "======================================"

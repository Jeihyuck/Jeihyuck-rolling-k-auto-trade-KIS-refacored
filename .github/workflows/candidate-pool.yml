name: "Candidate Pool Weekly Build"

# 토요일 KST 00:30 = UTC 금요일 15:30
# 주말에 후보군 생성하여 DB에 저장

on:
  workflow_dispatch:
    inputs:
      FORCE_REBUILD:
        description: "강제 재생성 (1=활성)"
        required: false
        default: "1"
      ENV:
        description: "환경 (LIVE/PAPER)"
        required: false
        default: "PAPER"
  
  schedule:
    # Fri 15:30 UTC = Sat 00:30 KST
    - cron: "30 15 * * 5"

permissions:
  contents: read

concurrency:
  group: candidate-pool-build
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  build_pool:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      
      # DB 연결
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      
      # 전략 설정
      STRATEGY_MODE: "DIAG"
      STRATEGY_ENV: ${{ github.event.inputs.ENV || 'PAPER' }}
      
      # KIS HTTP 비활성화 (DIAG 모드에서 KRX fallback 사용)
      KIS_HTTP_ENABLED: "0"
      
      # 후보군 설정
      CANDIDATE_POOL_ENABLED: "1"
      CANDIDATE_POOL_FORCE_REBUILD: ${{ github.event.inputs.FORCE_REBUILD || '1' }}
      CANDIDATE_POOL_SIZE: "120"
      CANDIDATE_POOL_MIN_SIZE: "40"
      CANDIDATE_POOL_TTL_DAYS: "7"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build candidate pool
        run: |
          echo "======================================"
          echo "Candidate Pool Weekly Build"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Mode: DIAG (no trading, pool build only)"
          echo "Env: ${STRATEGY_ENV}"
          echo "Force rebuild: ${CANDIDATE_POOL_FORCE_REBUILD}"
          echo "======================================"
          
          python -m trader.candidate_pool_builder \
            --build pool \
            --env "${STRATEGY_ENV}"
      
      - name: Verify pool saved
        run: |
          echo "======================================"
          echo "Verifying candidate pool in DB..."
          echo "======================================"
          
          python -c "
import os
import sys
from datetime import date
from trader.db.migrate import get_engine
from trader.db.repos import WatchlistRepo
from trader.config import CANDIDATE_POOL_STRATEGY_KEY
from trader.time_utils import now_kst, prev_business_day

engine = get_engine()
repo = WatchlistRepo(engine)
env = os.getenv('STRATEGY_ENV', 'PAPER')

# 최신 후보군 날짜 조회
latest_date = repo.get_latest_watchlist_date(env=env, strategy=CANDIDATE_POOL_STRATEGY_KEY)

if not latest_date:
    print('[VERIFY][FAIL] No candidate pool found in DB')
    sys.exit(1)

# 후보군 로드
pool = repo.load_watchlist(env=env, strategy=CANDIDATE_POOL_STRATEGY_KEY, as_of=latest_date)

if not pool:
    print(f'[VERIFY][FAIL] Candidate pool is empty (as_of={latest_date})')
    sys.exit(1)

pool_size = len(pool)
print(f'[VERIFY][SUCCESS] Candidate pool saved: as_of={latest_date} size={pool_size}')

# 최소 크기 검증
min_size = int(os.getenv('CANDIDATE_POOL_MIN_SIZE', '40'))
if pool_size < min_size:
    print(f'[VERIFY][WARN] Pool size {pool_size} is below minimum {min_size}')
    sys.exit(1)

print(f'[VERIFY][OK] Pool size {pool_size} meets minimum requirement')
          "
      
      - name: Summary
        if: always()
        run: |
          echo "======================================"
          echo "Candidate Pool Build Summary"
          echo "======================================"
          echo "Status: ${{ job.status }}"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "======================================"

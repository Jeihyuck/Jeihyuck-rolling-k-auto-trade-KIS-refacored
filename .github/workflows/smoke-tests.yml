name: Smoke Tests

on:
  push:
    branches: [nullim, main]
  workflow_dispatch: {}

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB connectivity check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from trader.db.health import assert_db_ready

          assert_db_ready()
          print("DB connectivity OK")
          PY

      - name: Import test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import trader.db.engine
          import trader.db.health
          import trader.config
          print("Imports OK")
          PY

      - name: DB smoke test (basic query)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from trader.db.engine import make_engine
          from trader.db.schema import schema_for_engine

          engine = make_engine()
          
          # Basic connectivity test
          with engine.connect() as conn:
            result = conn.execute(__import__('sqlalchemy').text("SELECT 1"))
            assert result.scalar() == 1
            print("SELECT 1 OK")
          
          # Verify schema exists
          schema = schema_for_engine(engine)
          print(f"Schema OK: {len(schema.tables)} tables found")
          
          print("DB smoke test completed")
          PY

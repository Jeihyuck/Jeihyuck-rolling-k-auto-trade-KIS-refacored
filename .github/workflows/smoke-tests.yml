name: "Smoke Tests"

on:
  push:
    branches: ["main", "nullim"]
  pull_request:
    branches: ["main", "nullim"]

jobs:
  smoke_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import smoke
        run: |
          set -euo pipefail
          python -c "import trader; import trader.db.engine; import trader.db.schema; print('Imports OK')"

      - name: DB connectivity and schema object smoke
        run: |
          set -euo pipefail
          python - <<'PY'
          import sqlalchemy as sa
          from trader.db.engine import make_engine
          from trader.db.schema import schema_for_engine

          engine = make_engine()

          # 1) connectivity
          with engine.connect() as conn:
            v = conn.execute(sa.text("SELECT 1")).scalar()
            assert v == 1
          print("SELECT 1 OK")

          # 2) schema objects
          schema = schema_for_engine(engine)

          # SchemaTables may not have .tables; count SQLAlchemy Table objects safely
          tables = []
          for k, v in getattr(schema, "__dict__", {}).items():
            if isinstance(v, sa.Table):
              tables.append(v)

          if not tables:
            # fallback: some implementations store tables in an attribute/dict
            for attr in ("tables", "all_tables", "table_map", "as_dict"):
              obj = getattr(schema, attr, None)
              if isinstance(obj, dict):
                tables = [t for t in obj.values() if isinstance(t, sa.Table)]
                break
              if isinstance(obj, (list, tuple)):
                tables = [t for t in obj if isinstance(t, sa.Table)]
                break

          assert len(tables) > 0, f"SchemaTables has no discoverable sa.Table objects. schema={type(schema)} attrs={dir(schema)}"
          print(f"Schema objects OK: {len(tables)} tables discovered")

          print("DB smoke test completed")
          PY

      - name: Optional health check safe call
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          from trader.db import health

          fn = getattr(health, "assert_db_ready", None)
          if fn is None:
            print("assert_db_ready not found - skipping")
          else:
            sig = inspect.signature(fn)
            if len(sig.parameters) == 0:
              fn()
              print("assert_db_ready() OK")
            else:
              print(f"assert_db_ready signature={sig} - skipping param call")
          PY

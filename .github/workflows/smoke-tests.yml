name: Smoke Tests

on:
  push:
    branches: [nullim, main]
  workflow_dispatch: {}

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: DB connectivity check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from trader.db.engine import make_engine
          from trader.db.health import assert_db_ready

          engine = make_engine()
          assert_db_ready(engine)
          print("DB connectivity OK")
          PY

      - name: Import test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import trader.pb1_engine
          import trader.pb1_runner
          import trader.db.repos
          print("Imports OK")
          PY

      - name: DB smoke test (runs FK guarantee)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from trader.db.engine import make_engine
          from trader.db.repos import RunsRepo, OrdersRepo, FillsRepo, LedgerEventsRepo
          from uuid import uuid4
          from datetime import datetime, timezone

          engine = make_engine()
          runs_repo = RunsRepo(engine)
          orders_repo = OrdersRepo(engine)
          fills_repo = FillsRepo(engine)
          ledger_repo = LedgerEventsRepo(engine)

          run_id = str(uuid4())
          env = "smoke"
          strategy = "smoke_test"

          # ✅ FK 무결성 때문에: runs row를 먼저 반드시 만들어야 함
          # upsert_run 시그니처가 다를 수 있어서 가장 흔한 형태로 먼저 시도하고,
          # 실패하면 명확히 에러를 터뜨려서 CI에서 바로 잡히게 함.
          now = datetime.now(timezone.utc)

          try:
            runs_repo.upsert_run(run_id=run_id, env=env, strategy=strategy, ts=now)
          except TypeError:
            # 다른 시그니처 대비 (run_id, env, strategy, ts)
            runs_repo.upsert_run(run_id, env, strategy, now)

          print("upsert_run OK:", run_id)

          # 아래 append_*는 repo 시그니처가 달라도 '실패하면 실패'가 smoke의 목적이라
          # try/except로 삼키지 말고 정확히 깨지게 하는 게 맞음.
          # (지금 CEO님이 원하는 건 '완전 뿌리뽑기'라서요)

          try:
            orders_repo.append_order(run_id, env, "005930", 1, 1000.0, "buy", "smoke")
            print("append_order OK")
          except TypeError:
            # (run_id=..., env=..., ...) 형태 가능
            orders_repo.append_order(run_id=run_id, env=env, code="005930", qty=1, price=1000.0, side="buy", stage="smoke")
            print("append_order OK (kw)")

          try:
            fills_repo.append_fill(run_id, env, "005930", 1, 1000.0, "buy", "smoke")
            print("append_fill OK")
          except TypeError:
            fills_repo.append_fill(run_id=run_id, env=env, code="005930", qty=1, price=1000.0, side="buy", stage="smoke")
            print("append_fill OK (kw)")

          try:
            ledger_repo.append_event(run_id, env, "RECONCILE", {"test": "data"})
            print("append_event OK")
          except TypeError:
            ledger_repo.append_event(run_id=run_id, env=env, event_type="RECONCILE", payload={"test": "data"})
            print("append_event OK (kw)")

          print("DB smoke test completed")
          PY

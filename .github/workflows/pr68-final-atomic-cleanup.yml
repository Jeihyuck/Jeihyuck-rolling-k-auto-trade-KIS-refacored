name: PR68 Final Atomic Cleanup

on:
  pull_request:
    branches: [dual-agent]
    paths:
      - "scripts/pr68_final_atomic_cleanup.py"
      - ".github/workflows/pr68-final-atomic-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: atomic-cleanup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pr68_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d pr68_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PYTHONPATH: "."
      TRADING_REGION: "US"
      KIS_ENV: "practice"
      DRY_RUN: "1"
      US_PAPER_TRADING_ENABLED: "1"
      ALLOW_REAL_ORDER: "0"
      PBCORE_TEST_POSTGRES_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/pr68_test"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary
      - name: Apply final atomic cleanup patch
        run: python scripts/pr68_final_atomic_cleanup.py
      - name: Compile critical modules
        run: |
          python -m py_compile \
            trader/us/db/repos.py \
            trader/us/runner/trade_tick_runner.py \
            trader/us/runner/trade_close_runner.py \
            trader/us/execution/reconcile.py \
            trader/us/execution/fills.py \
            scripts/repair_us_trade_integrity.py
      - name: Run focused atomic tests
        run: |
          set -o pipefail
          python -m pytest \
            tests/us/test_us_postgres_integration_real.py \
            tests/us/test_us_final_operational_hardening.py \
            tests/us/test_us_trade_date_and_cumulative_connection.py \
            -q 2>&1 | tee /tmp/focused-pytest.log
      - name: Run full US suite
        run: |
          set -o pipefail
          python -m pytest tests/us -q 2>&1 | tee /tmp/us-pytest.log
      - name: Run offline harness
        run: python -m trader.us.harness.runner --scenario all --offline
      - name: Restore reports after tests
        run: |
          git fetch origin dual-agent --depth=1
          git diff --name-only origin/dual-agent -- reports/us_daily reports/us_prep | while read rel; do
            if [ -z "$rel" ]; then continue; fi
            if git cat-file -e "origin/dual-agent:$rel" 2>/dev/null; then
              git checkout origin/dual-agent -- "$rel"
            else
              rm -f "$rel"
            fi
          done
          git clean -fd reports/us_daily reports/us_prep
      - name: Verify no report artifacts remain after cleanup
        run: |
          git diff --name-only origin/dual-agent -- reports/us_daily reports/us_prep | tee /tmp/report-diff.txt
          test ! -s /tmp/report-diff.txt
      - name: Commit verified cleanup
        run: |
          git config user.name "chatgpt-codex-connector"
          git config user.email "chatgpt-codex-connector@users.noreply.github.com"
          git add -A
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Make PR68 fill accounting atomic and clean reports"
            git push
          else
            echo "No cleanup changes to commit"
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr68-final-atomic-cleanup-${{ github.run_id }}
          path: |
            /tmp/*.log
            /tmp/report-diff.txt
          if-no-files-found: ignore
          retention-days: 3

name: "Trade AM"
# session: am | window: 09:00-12:55 KST | GitHub scheduled trigger removed | env: PB1_*

"on":
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice
      CONFIRM_MANUAL_AM:
        description: "Type RUN_AM_MANUAL to run AM manually"
        required: false
        default: ""

concurrency:
  group: trade-am-practice-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KR_FINAL30_SOURCE_OF_TRUTH: "db_roundtrip"
  KR_TRADE_FINAL30_DB_FALLBACK: "1"
  KR_BLOCK_EMPTY_FINAL30_ENGINE_BOOT: "1"
  MODE: trade
  EXPECTED_BRANCH: "dual-agent"
  TRADE_AM_WAIT_FOR_PREP: "1"
  TRADE_AM_PREP_WAIT_UNTIL: "09:15"
  TRADE_AM_PREP_POLL_INTERVAL_SEC: "30"
  TRADE_AM_PREP_REQUIRED_FINAL30_N: "30"
  TRADE_PREP_WAIT_MAX_SEC: "900"
  TRADE_REQUIRE_PREP_READY: "1"
  TRADE_FAIL_IF_PREP_NOT_READY: "1"
  TRADE_AM_PREP_NOT_READY_POLICY_PRACTICE: "FAIL_EXIT_1"
  TRADE_AM_PREP_NOT_READY_POLICY_LIVE: "FAIL_EXIT_1"
  PB1_SESSION_KIND: "am"
  PB1_FORCE_TRADE_SESSION: "am"

  FORCE_MARKET_WINDOW: "morning"
  FORCE_PB1_PHASE: "entry"
  PB1_PHASE_DEFAULT: "entry"

  PB1_MAX_POSITIONS: "30"
  PB1_TARGET_NEW_POSITIONS: "30"

  PB1_EXIT_PASS_TIMEOUT_SEC: "300"

  PB1_MARKET_SCOPE: "KRX"
  MARKET: "KR"
  EXCHANGE: "KRX"

  DB_CONNECT_TIMEOUT: "15"
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  DB_CONNECT_TIMEOUT_SEC: "5"
  PB1_CURRENT_PRICE_CACHE_TTL_SEC: "30"
  PB1_CURRENT_PRICE_MAX_AGE_SEC: "180"
  PB1_FETCH_CURRENT_PRICE_MAX_PER_TICK: "30"
  PB1_ENABLE_RELAX_BRIDGE: "1"
  PB1_RELAX_BRIDGE_MAX_CANDIDATES: "3"
  PB1_RELAX_BRIDGE_MIN_RS: "70"
  PB1_RELAX_BRIDGE_MIN_SCORE: "70"

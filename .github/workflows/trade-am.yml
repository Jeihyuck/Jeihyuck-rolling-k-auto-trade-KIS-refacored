name: "Trade AM"

"on":
  schedule:
    # Mon-Fri 10:05 KST = 01:05 UTC
    - cron: "5 1 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: pb1-practice-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  STRATEGY_ENV: practice
  KIS_ENV: practice
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"
  FAIL_IF_POOL_MISSING: "1"
  CANDIDATE_POOL_TTL_DAYS: "7"
  CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
  CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
  CANDIDATE_POOL_UNIVERSE_ENV: "practice"
  MINERVINI_USE_FEATURE_CACHE: "1"
  FEATURE_CACHE_WARMUP_ON_TICK: "0"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  trade_am:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Verify candidate pool exists in DB
        run: |
          set -euo pipefail
          python -m trader.verify_candidate_pool

      - name: Run AM trade tick
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m trader.trade_tick 2>&1 | tee artifacts/trade-am.log

      - name: Verify AM trade tick logs
        run: |
          set -euo pipefail
          grep -E "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" artifacts/trade-am.log >/dev/null
          grep -E "\[TRADE\]\[READY\]\[OK\]" artifacts/trade-am.log >/dev/null
          grep -E "\[RUN_SUMMARY\]\[RESULT\]" artifacts/trade-am.log >/dev/null

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload AM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-am-logs
          path: repo/artifacts/
          if-no-files-found: ignore

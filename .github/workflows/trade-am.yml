name: "Trade AM"
# session: am | window: 09:00-12:55 KST | schedule: Every day 00:00 UTC | env: PB1_*

"on":
  schedule:
    # Every day 08:15 KST = Every day 23:15 UTC previous day
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice
      CONFIRM_MANUAL_AM:
        description: "Type RUN_AM_MANUAL to run AM manually"
        required: false
        default: ""

concurrency:
  group: trade-am-practice-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MODE: trade
  PB1_SESSION_KIND: "am"
  PB1_FORCE_TRADE_SESSION: "am"

  FORCE_MARKET_WINDOW: "morning"
  FORCE_PB1_PHASE: "entry"
  PB1_PHASE_DEFAULT: "entry"

  PB1_MAX_POSITIONS: "30"
  PB1_TARGET_NEW_POSITIONS: "30"

  PB1_EXIT_PASS_TIMEOUT_SEC: "300"

  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  DB_POOL_TIMEOUT: "10"
  PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"
  PB1_MIN_TICK_BUDGET_SEC: "75"
  PB1_DB_RECOVERY_SLEEP_SEC: "2"
  PB1_DISPOSE_ENGINE_ON_TICK_TIMEOUT: "1"
  PB1_LEDGER_FAIL_SOFT: "1"
  PB1_DB_FAIL_OPEN_SCOPE: "orders,fills,positions,ledger"

  PB1_PREWARM_ENABLED: "1"
  PB1_EXIT_PREWARM_ENABLED: "1"
  PB1_TARGET_START_TIME: "09:00"
  PB1_START_ALLOW_UNTIL: "09:25"
  PB1_LOOP_ENABLED: "1"
  PB1_RUN_LOOP_MINUTES: "235"
  PB1_LOOP_INTERVAL_SEC: "60"
  PB1_AM_SESSION_END: "12:55"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  PB1_TICK_HARD_TIMEOUT_SEC: "90"

  STRATEGY_MODE: "LIVE"
  FORCE_STRATEGY_MODE: "LIVE"
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "0"
  LIVE_TRADING_ENABLED: "1"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  KIS_HTTP_ENABLED: "1"
  NO_TRADE: "0"

  STRATEGY_ENV: practice
  KIS_ENV: practice
  FINAL30_SOURCE_MODE: "db_only"
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"

  PB1_ENABLE_LATE_AM_RECOVERY: "0"
  PB1_FORCE_TRADE_AM_LATE_START: "0"
  PB1_FORCE_TRADE_AM_AFTER_1030: "0"

  # [2026-04-29] Paper cap 5천만원 / Effective exit policy
  PAPER_MAX_CAPITAL_KRW: "50000000"
  EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
  PB1_EXISTING_POSITION_EFFECTIVE_EXIT_ENABLED: "1"
  PB1_EFFECTIVE_STOP_CAP_ENABLED: "1"
  PB1_EFFECTIVE_STOP_CAP_KOSPI_PCT: "7.0"
  PB1_EFFECTIVE_STOP_CAP_KOSDAQ_PCT: "8.0"
  PB1_PROFIT_PROTECT_ENABLED: "1"
  PB1_PROFIT_PROTECT_PCT: "8.0"
  PB1_PROFIT_PROTECT_SELL_PCT: "0.33"
  PB1_ABS_TP1_ENABLED: "1"
  PB1_ABS_TP1_PROFIT_PCT: "10.0"
  PB1_ABS_TP1_SELL_PCT: "0.33"
  # [2026-05-13] KIS empty guard for Korean market
  KR_AUTHORITATIVE_KIS_BALANCE_FOR_EXIT: "1"
  KR_BLOCK_LEDGER_RECONSTRUCT_WHEN_KIS_EMPTY: "1"
  KR_ALLOW_LEDGER_RECONSTRUCT_WITHOUT_KIS: "0"
  # [2026-04-30] Giveback full-exit / same-day rebuy block / EGW002 fix / tick budget / PNL report
  PB1_PROFIT_PROTECT_FULL_EXIT: "1"
  PB1_GIVEBACK_EXIT_FULL_SELL: "1"
  PB1_SWING_GIVEBACK_SELL_PCT: "1.0"
  PB1_MOMENTUM_GIVEBACK_SELL_PCT: "1.0"
  PB1_REBUY_AFTER_SELL_COOLDOWN_MIN: "180"
  KIS_DATA_MIN_INTERVAL_SEC: "0.50"
  KIS_PRICE_MIN_INTERVAL_SEC: "0.70"
  KIS_ORDER_MIN_INTERVAL_SEC: "2.0"
  KIS_HASHKEY_ORDER_SLEEP_SEC: "0.5"
  KIS_EGW002_BACKOFF_BASE_SEC: "5.0"
  KIS_EGW002_BACKOFF_MAX_SEC: "20.0"
  PB1_PRICE_CACHE_SCOPE: "run"
  PB1_USE_BALANCE_PRPR_FIRST: "1"
  PB1_MAX_PRICE_FETCH_PER_TICK: "8"
  PB1_PNL_PRICE_FALLBACK_LIMIT: "3"
  PB1_NONCRITICAL_DB_UPDATE_TIMEOUT_SEC: "2"
  PB1_SKIP_NONCRITICAL_DB_UPDATE_WHEN_REMAINING_SEC_LT: "5"
  PB1_BLOCK_NEW_ORDER_WHEN_REMAINING_SEC_LT: "8"
  PB1_ALLOW_KIS_DAILY_FALLBACK_IN_TRADE: "0"
  PB1_ALLOW_KIS_DAILY_FALLBACK_IN_DIAG: "1"
  PB1_PNL_REPORT_ENABLED: "1"
  # [2026-04-29] Multi-Layer Exit Router
  PB1_EXIT_ROUTER_ENABLED: "1"
  PB1_PERCENT_EXIT_ENABLED: "1"
  PB1_EXIT_POLICY_MODE: "HYBRID_BY_ENTRY_STYLE"
  PB1_EXIT_POLICY_PATH: "trader/exit_policy/optimized_exit_router_policy.json"
  # [2026-05-06] Common AM/PM guard: code-level sold-today block / stale order cleanup
  PB1_BLOCK_REENTRY_AFTER_EXIT_SAME_DAY: "1"
  PB1_BLOCK_ENTRY_AFTER_EXIT: "0"
  PB1_RECONCILE_ONLY_AFTER_ORDER_SUBMIT: "0"
  PB1_RECONCILE_ONLY_GLOBAL_SKIP: "0"
  PB1_FORCE_RECONCILE_ONLY: "0"
  PB1_BLOCK_REBUY_AFTER_SELL_SAME_DAY: "1"
  PB1_ALLOW_SAME_DAY_REBUY_AFTER_SELL: "0"
  PB1_SOLD_TODAY_COOLDOWN: "1"
  PB1_EXPIRE_STALE_OPEN_ORDERS: "1"
  PB1_STALE_OPEN_ORDER_MAX_MINUTES: "30"
  PB1_STALE_OPEN_ORDER_REPAIR_PRACTICE: "1"
  PB1_KIS_HOLDINGS_AUTHORITATIVE: "1"
  PB1_REQUIRE_FILL_BEFORE_POSITION_UPDATE: "1"
  PB1_TIME_STOP_BASIS: "trading_days"
  PB1_BLOCK_INSUFFICIENT_OHLCV: "1"
  PB1_REQUIRE_EXPLICIT_TRIGGER_BYPASS: "1"
  PB1_KIS_RATE_LIMIT_SAFE: "1"
  PB1_EXIT_COOLDOWN_DAYS: "1"
  PB1_ALLOW_INTRADAY_REENTRY_AFTER_STOP: "0"
  PB1_REQUIRE_FILL_CONFIRM: "1"
  PB1_ORDER_ACCEPTED_IS_NOT_FILLED: "1"
  KIS_PRICE_CACHE_TTL_SEC: "60"
  KIS_INQUIRE_PRICE_MIN_INTERVAL_SEC: "0.70"
  KIS_RATE_LIMIT_DEGRADE_ON_EGW00201: "1"
  PB1_USE_BALANCE_PRICE_FOR_HOLDINGS: "1"

defaults:
  run:
    shell: bash

jobs:
  trade_am:
    runs-on: ubuntu-latest
    timeout-minutes: 295

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Resolve AM phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_s="$(TZ=Asia/Seoul date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          now_hhmmss="$(TZ=Asia/Seoul date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          prewarm_min=$((8 * 60 + 15))
          schedule_expected_min=$((8 * 60 + 15))
          target_start_min=$((9 * 60))
          allow_until_min=$((9 * 60 + 25))
          session_end_min=$((12 * 60 + 55))

          delay_seconds=$(( (now_min - schedule_expected_min) * 60 + 10#$now_s ))
          if [[ "$delay_seconds" -lt 0 ]]; then
            delay_seconds=0
          fi

          late_start=0
          if [[ "$now_min" -gt "$target_start_min" ]]; then
            late_start=1
          fi

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -gt "$allow_until_min" ]]; then
              should_run=0
              skip_reason="skip_stale_start_am"
            elif [[ "$now_min" -lt "$target_start_min" ]]; then
              wait_until_target=1
              wait_seconds=$(( (target_start_min - now_min) * 60 ))
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.CONFIRM_MANUAL_AM || '' }}"
            if [[ "$confirm" != "RUN_AM_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_am_not_confirmed"
            elif [[ "$now_min" -gt $((10 * 60 + 30)) ]]; then
              should_run=0
              skip_reason="manual_am_after_1030_blocked"
            fi
          fi

          echo "[TRADE_AM][START_META] schedule_expected=0815 actual_start=${now_hhmmss} delay_seconds=${delay_seconds}"
          echo "[TRADE_AM][PHASE_GUARD_DEBUG] now_min=${now_min} target_start_min=${target_start_min} allow_until_min=${allow_until_min} wait_seconds=${wait_seconds}"
          echo "[TRADE_AM][LATE_START] late_start=${late_start} mode=normal"

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "now_min=${now_min}" >> "$GITHUB_OUTPUT"
          echo "delay_seconds=${delay_seconds}" >> "$GITHUB_OUTPUT"
          echo "late_start=${late_start}" >> "$GITHUB_OUTPUT"
          echo "target_start_min=${target_start_min}" >> "$GITHUB_OUTPUT"
          echo "allow_until_min=${allow_until_min}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "valid_window=0900-1255" >> "$GITHUB_OUTPUT"
          echo "start_allow_window=0900-0925" >> "$GITHUB_OUTPUT"
          echo "session_end=1255" >> "$GITHUB_OUTPUT"

      - name: Emit AM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][START_META] schedule_expected=0815 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} prewarm_start=0815 target_start=0900 start_allow_until=0925 session_end=1255 wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=0 skip_reason=${{ steps.phase_guard.outputs.skip_reason }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=am"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-am.log

      - name: Resolve trading-day guard
        id: trading_day_guard
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          dow="$(TZ=Asia/Seoul date +%u)"  # 1=Mon ... 7=Sun
          is_trading_day=1
          reason=""

          if [[ "$dow" -ge 6 ]]; then
            is_trading_day=0
            reason="weekend"
          fi

          echo "is_trading_day=${is_trading_day}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

          echo "[TRADING_DAY_GUARD] is_trading_day=${is_trading_day} reason=${reason}"
          echo "[TRADING_DAY_GUARD][TODO] krx_holiday_detection_not_wired workflow_guard=weekend_only order_allowed=$([[ \"$is_trading_day\" == \"1\" ]] && echo 1 || echo 0) compute_only=$([[ \"$is_trading_day\" == \"1\" ]] && echo 0 || echo 1)"

      - name: Resolve order mode guard
        id: order_mode_guard
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          is_trading_day="${{ steps.trading_day_guard.outputs.is_trading_day }}"
          if [[ "$is_trading_day" == "1" ]]; then
            order_allowed=1
            reason=""
          else
            order_allowed=0
            reason="non_trading_day"
          fi
          echo "order_allowed=${order_allowed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "[TRADE_AM][ORDER_MODE] order_allowed=${order_allowed} reason=${reason}"

      - name: Wait until target start
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: .
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=3600

          if [[ "$wait_seconds" -lt 0 ]]; then
            wait_seconds=0
          fi

          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds} max_wait_seconds=${max_wait_seconds}"
            exit 1
          fi

          echo "[WAIT_UNTIL_TARGET][START] session=am wait_seconds=${wait_seconds} max_wait_seconds=${max_wait_seconds}"
          sleep "$wait_seconds"
          echo "[WAIT_UNTIL_TARGET][DONE] session=am now_kst=$(TZ=Asia/Seoul date +%H%M%S)"

      - name: Verify target time reached
        id: target_time_check
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          target_min="${{ steps.phase_guard.outputs.target_start_min }}"

          if [[ "$now_min" -lt "$target_min" ]]; then
            echo "::error::target start time not reached after wait now_min=${now_min} target_min=${target_min}"
            exit 1
          fi

          echo "[TARGET_TIME_CHECK][OK] session=am now_min=${now_min} target_min=${target_min}"

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; ls -la repo || true; exit 1; }
          echo "[CHECKOUT][OK] repo path ready"

      - name: Initialize AM trigger log
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][START_META] schedule_expected=0815 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} prewarm_start=0815 target_start=0900 start_allow_until=0925 session_end=1255 wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=1 skip_reason= event=${{ steps.phase_guard.outputs.event_name }} valid_window=0900-1255"
            echo "[TRADE_AM][TRADING_DAY_GUARD] is_trading_day=${{ steps.trading_day_guard.outputs.is_trading_day }} reason=${{ steps.trading_day_guard.outputs.reason }}"
            echo "[TRADE_AM][ORDER_MODE] order_allowed=${{ steps.order_mode_guard.outputs.order_allowed }} reason=${{ steps.order_mode_guard.outputs.reason }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/trade-am.log

      - name: Emit non trading day summary
        if: steps.phase_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day != '1'
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "[RUN_SUMMARY][RESULT] status=OK_COMPUTE_ONLY reason=NON_TRADING_DAY session=am"
            echo "[PB1][EXIT] reason=non_trading_day_compute_only"
          } | tee -a repo/artifacts/trade-am.log

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.db.migrate 2>&1 | tee -a artifacts/trade-am.log

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }
          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Verify exact scored final30 in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              as_of=ctx["as_of"],
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[TRADE][FINAL30][DB_EXACT_LOAD] rows={len(df)} as_of={ctx['as_of']} session=am")
          PY

      - name: Run AM trade loop
        if: steps.phase_guard.outputs.should_run == '1'
        timeout-minutes: 245
        working-directory: repo
        env:
          ORDER_ALLOWED: ${{ steps.order_mode_guard.outputs.order_allowed }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          PB1_ORDER_BLOCK_REASON: ${{ steps.order_mode_guard.outputs.reason }}
          NO_TRADE: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          DISABLE_LIVE_TRADING: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          LIVE_TRADING_ENABLED: ${{ steps.trading_day_guard.outputs.is_trading_day }}
          KIS_HTTP_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "[PHASE][START] phase=am session_window=0900-1255" | tee -a artifacts/trade-am.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-am.log
          echo "[PHASE][END] phase=am" | tee -a artifacts/trade-am.log

      - name: Generate Portfolio PNL report
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        env:
          PB1_PNL_REPORT_ENABLED: "1"
          PB1_PNL_REPORT_SESSION: "am"
          PB1_PNL_PRICE_FALLBACK_LIMIT: "3"
        run: |
          set -euo pipefail
          mkdir -p reports/portfolio_pnl
          python scripts/generate_portfolio_pnl_report.py 2>&1 | tee -a artifacts/trade-am.log || true
          if [ -f reports/portfolio_pnl/latest_portfolio_pnl.md ]; then
            cat reports/portfolio_pnl/latest_portfolio_pnl.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify AM log contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          missing=0
          
          # Required log patterns
          for pattern in \
            "\[TRADE_AM\]\[TRIGGER\]" \
            "\[TRADE_AM\]\[START_META\]" \
            "\[TRADE_AM\]\[PHASE_GUARD\]" \
            "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" \
            "\[TRADE\]\[READY\]\[OK\]" \
            "\[RUN_SUMMARY\]\[RESULT\]" \
            "\[ORDERS\]\[STALE_REPAIR\]\[DONE\]" \
            "\[PNL_REPORT\]\[DB_ORDERS\]\[OK\]" \
            "\[PNL_REPORT\]\[DB_FILLS\]\[OK\]" \
            "\[PNL_REPORT\]\[REALIZED\]\[SUMMARY\]"; do
            if ! grep -E "$pattern" artifacts/trade-am.log >/dev/null; then
              echo "::error::missing required log pattern: $pattern"
              missing=1
            fi
          done
          
          # Session end check
          if ! grep -E "\[PB1\]\[EXIT\] reason=session_end|\[PB1\]\[LOOP\] session end reached -> exit" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing clean session_end exit log"
            missing=1
          fi
          
          # Forbidden error patterns
          if grep -F "Traceback" artifacts/trade-am.log >/dev/null; then
            echo "::error::Traceback detected in AM log"
            missing=1
          fi
          if grep -F "FATAL_RUNTIME" artifacts/trade-am.log >/dev/null; then
            echo "::error::FATAL_RUNTIME detected in AM log"
            missing=1
          fi
          if grep -F "[ORDERS][STALE_REPAIR][FAIL]" artifacts/trade-am.log >/dev/null; then
            echo "::error::stale repair failure detected"
            missing=1
          fi
          if grep -F "Unconsumed column names: repair_reason" artifacts/trade-am.log >/dev/null; then
            echo "::error::repair_reason column error detected"
            missing=1
          fi
          if grep -F "got an unexpected keyword argument 'start_at'" artifacts/trade-am.log >/dev/null; then
            echo "::error::PNL report start_at argument error detected"
            missing=1
          fi
          if grep -F "got an unexpected keyword argument 'event_type_filter'" artifacts/trade-am.log >/dev/null; then
            echo "::error::PNL report event_type_filter argument error detected"
            missing=1
          fi
          if grep -E "tick_hard_timeout.*timeout_sec=90.*last_stage=entry.buyable_gate.finalize" artifacts/trade-am.log >/dev/null; then
            echo "::error::tick_hard_timeout at entry.buyable_gate.finalize detected"
            missing=1
          fi
          
          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected forbidden:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload debug AM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trade-am-logs
          path: |
            repo/artifacts/
            repo/reports/portfolio_pnl/
          if-no-files-found: ignore

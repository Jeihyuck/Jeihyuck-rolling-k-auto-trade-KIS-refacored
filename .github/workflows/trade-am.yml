defaults:
  run:
    shell: bash

jobs:
  trade_am:
    runs-on: ubuntu-latest
    timeout-minutes: 295

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Branch guard
        run: |
          set -euo pipefail
          echo "[BRANCH_GUARD] event=${GITHUB_EVENT_NAME:-} actor=${GITHUB_ACTOR:-} ref=${GITHUB_REF:-} ref_name=${GITHUB_REF_NAME:-} sha=${GITHUB_SHA:-}"
          echo "[BRANCH_GUARD] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]; then
            echo "::error::Wrong branch execution blocked. expected=${EXPECTED_BRANCH}, actual=${GITHUB_REF_NAME}"
            echo "[BRANCH_GUARD][FAIL] expected=${EXPECTED_BRANCH} actual=${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "[BRANCH_GUARD][OK] branch=${GITHUB_REF_NAME} sha=${GITHUB_SHA:-}"

      - name: Resolve AM phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_s="$(TZ=Asia/Seoul date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          now_hhmmss="$(TZ=Asia/Seoul date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          prewarm_min=$((8 * 60 + 15))
          schedule_expected_min=$((8 * 60 + 15))
          target_start_min=$((9 * 60))
          allow_until_min=$((9 * 60 + 25))
          session_end_min=$((12 * 60 + 55))

          delay_seconds=$(( (now_min - schedule_expected_min) * 60 + 10#$now_s ))
          if [[ "$delay_seconds" -lt 0 ]]; then
            delay_seconds=0
          fi

          late_start=0
          if [[ "$now_min" -gt "$target_start_min" ]]; then
            late_start=1
          fi

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -gt "$allow_until_min" ]]; then
              should_run=0
              skip_reason="skip_stale_start_am"
            elif [[ "$now_min" -lt "$target_start_min" ]]; then
              wait_until_target=1
              wait_seconds=$(( (target_start_min - now_min) * 60 ))
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.CONFIRM_MANUAL_AM || '' }}"
            if [[ "$confirm" != "RUN_AM_MANUAL" ]]; then
              should_run=0
              skip_reason="manual_am_not_confirmed"
            elif [[ "$now_min" -gt $((10 * 60 + 30)) ]]; then
              should_run=0
              skip_reason="manual_am_after_1030_blocked"
            fi
          fi

          echo "[TRADE_AM][START_META] schedule_expected=0815 actual_start=${now_hhmmss} delay_seconds=${delay_seconds}"
          echo "[TRADE_AM][PHASE_GUARD_DEBUG] now_min=${now_min} target_start_min=${target_start_min} allow_until_min=${allow_until_min} wait_seconds=${wait_seconds}"
          echo "[TRADE_AM][LATE_START] late_start=${late_start} mode=normal"

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "now_min=${now_min}" >> "$GITHUB_OUTPUT"
          echo "delay_seconds=${delay_seconds}" >> "$GITHUB_OUTPUT"
          echo "late_start=${late_start}" >> "$GITHUB_OUTPUT"
          echo "target_start_min=${target_start_min}" >> "$GITHUB_OUTPUT"
          echo "allow_until_min=${allow_until_min}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "valid_window=0900-1255" >> "$GITHUB_OUTPUT"
          echo "start_allow_window=0900-0925" >> "$GITHUB_OUTPUT"
          echo "session_end=1255" >> "$GITHUB_OUTPUT"

      - name: Emit AM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][START_META] schedule_expected=0815 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} prewarm_start=0815 target_start=0900 start_allow_until=0925 session_end=1255 wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=0 skip_reason=${{ steps.phase_guard.outputs.skip_reason }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=am"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-am.log

      - name: Resolve trading-day guard
        id: trading_day_guard
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          dow="$(TZ=Asia/Seoul date +%u)"  # 1=Mon ... 7=Sun
          today_kst="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          is_trading_day=1
          reason=""

          if [[ "$dow" -ge 6 ]]; then
            is_trading_day=0
            reason="weekend"
          fi

          # KRX 휴장일 체크 (config/krx_holidays.json 기반 inline 목록)
          # 이 목록은 checkout 이전에 실행되므로 bash inline으로 체크한다.
          # 보다 정확한 체크는 checkout 이후 verify_final30 Python 단계에서 수행한다.
          if [[ "$is_trading_day" == "1" ]]; then
            KRX_HOLIDAYS_2025="2025-01-01 2025-01-27 2025-01-28 2025-01-29 2025-01-30 2025-03-03 2025-05-05 2025-05-06 2025-06-06 2025-08-15 2025-10-03 2025-10-06 2025-10-07 2025-10-08 2025-10-09 2025-12-25 2025-12-31"
            KRX_HOLIDAYS_2026="2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-02 2026-05-05 2026-05-25 2026-08-17 2026-09-24 2026-09-25 2026-10-05 2026-10-09 2026-12-25 2026-12-31"
            KRX_HOLIDAYS_2027="2027-01-01 2027-02-08 2027-02-09 2027-02-10 2027-03-01 2027-05-05 2027-05-13 2027-06-07 2027-08-16 2027-09-20 2027-09-21 2027-09-22 2027-10-04 2027-12-27 2027-12-31"
            ALL_HOLIDAYS="${KRX_HOLIDAYS_2025} ${KRX_HOLIDAYS_2026} ${KRX_HOLIDAYS_2027}"
            for h in $ALL_HOLIDAYS; do
              if [[ "$today_kst" == "$h" ]]; then
                is_trading_day=0
                reason="krx_holiday"
                echo "[TIME][KRX][HOLIDAY] date=${today_kst} reason=KRX_HOLIDAY source=workflow_inline"
                break
              fi
            done
          fi

          echo "is_trading_day=${is_trading_day}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "today_kst=${today_kst}" >> "$GITHUB_OUTPUT"

          echo "[TRADING_DAY_GUARD] is_trading_day=${is_trading_day} reason=${reason} date=${today_kst}"

      - name: Resolve order mode guard
        id: order_mode_guard
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          is_trading_day="${{ steps.trading_day_guard.outputs.is_trading_day }}"
          if [[ "$is_trading_day" == "1" ]]; then
            order_allowed=1
            reason=""
          else
            order_allowed=0
            reason="non_trading_day"
          fi
          echo "order_allowed=${order_allowed}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "[TRADE_AM][ORDER_MODE] order_allowed=${order_allowed} reason=${reason}"

      - name: Wait until target start
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: .
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=3600

          if [[ "$wait_seconds" -lt 0 ]]; then
            wait_seconds=0
          fi

          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds} max_wait_seconds=${max_wait_seconds}"
            exit 1
          fi

          echo "[WAIT_UNTIL_TARGET][START] session=am wait_seconds=${wait_seconds} max_wait_seconds=${max_wait_seconds}"
          sleep "$wait_seconds"
          echo "[WAIT_UNTIL_TARGET][DONE] session=am now_kst=$(TZ=Asia/Seoul date +%H%M%S)"

      - name: Verify target time reached
        id: target_time_check
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=Asia/Seoul date +%H)"
          now_m="$(TZ=Asia/Seoul date +%M)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          target_min="${{ steps.phase_guard.outputs.target_start_min }}"

          if [[ "$now_min" -lt "$target_min" ]]; then
            echo "::error::target start time not reached after wait now_min=${now_min} target_min=${target_min}"
            exit 1
          fi

          echo "[TARGET_TIME_CHECK][OK] session=am now_min=${now_min} target_min=${target_min}"

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          ref: dual-agent
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; ls -la repo || true; exit 1; }
          echo "[CHECKOUT][OK] repo path ready"

      - name: Initialize AM trigger log
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][START_META] schedule_expected=0815 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} prewarm_start=0815 target_start=0900 start_allow_until=0925 session_end=1255 wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=1 skip_reason= event=${{ steps.phase_guard.outputs.event_name }} valid_window=0900-1255"
            echo "[TRADE_AM][TRADING_DAY_GUARD] is_trading_day=${{ steps.trading_day_guard.outputs.is_trading_day }} reason=${{ steps.trading_day_guard.outputs.reason }}"
            echo "[TRADE_AM][ORDER_MODE] order_allowed=${{ steps.order_mode_guard.outputs.order_allowed }} reason=${{ steps.order_mode_guard.outputs.reason }}"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/trade-am.log

      - name: Emit non trading day summary
        if: steps.phase_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day != '1'
        working-directory: .
        run: |
          set -euo pipefail
          {
            echo "[RUN_SUMMARY][RESULT] status=OK_COMPUTE_ONLY reason=NON_TRADING_DAY session=am"
            echo "[PB1][EXIT] reason=non_trading_day_compute_only"
          } | tee -a repo/artifacts/trade-am.log

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.db.migrate 2>&1 | tee -a artifacts/trade-am.log

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }
          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Wait for PREP readiness (poll until 09:25 KST)
        id: verify_final30
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set +e
          python - <<'PY' 2>&1 | tee -a artifacts/trade-am.log
          import os, sys, time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, is_krx_trading_day, resolve_prev_krx_trading_day

          KST = ZoneInfo("Asia/Seoul")
          env = os.getenv("STRATEGY_ENV", "practice")
          expected_branch = os.getenv("EXPECTED_BRANCH", "dual-agent")
          poll_sec = int(os.getenv("TRADE_AM_PREP_POLL_INTERVAL_SEC", "30"))
          wait_until_hhmm = os.getenv("TRADE_AM_PREP_WAIT_UNTIL", "09:25")
          wait_until_h, wait_until_m = map(int, wait_until_hhmm.split(":"))
          deadline_min = wait_until_h * 60 + wait_until_m

          today = now_kst().date()
          as_of_override = (os.getenv("AS_OF_OVERRIDE") or "").strip()

          if as_of_override:
              from datetime import date
              expected_as_of = date.fromisoformat(as_of_override)
          else:
              expected_as_of = resolve_prev_krx_trading_day(today)

          expected_as_of_str = expected_as_of.isoformat()
          output_path = os.getenv("GITHUB_OUTPUT", "")
          run_date_str = today.isoformat()

          print(f"[TRADE_AM][DATE_POLICY] run_date={run_date_str} expected_as_of={expected_as_of_str}")

          def _write_output(name, value):
              if output_path:
                  with open(output_path, "a") as f:
                      f.write(f"{name}={value}\n")

          if not is_krx_trading_day(today):
              print(f"[TRADE_AM][PREP_VERIFY][NON_TRADING] today={today} is_krx_trading_day=0")
              _write_output("prep_ready", "0")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", "0")
              _write_output("skip_reason", "NON_TRADING_DAY")
              sys.exit(0)

          now_dt = datetime.now(KST)
          now_min = now_dt.hour * 60 + now_dt.minute
          print(f"[TRADE_AM][PREP_WAIT][START] expected_as_of={expected_as_of_str} deadline={wait_until_hhmm} poll_sec={poll_sec}")

          attempt = 0
          start_ts = time.monotonic()
          ready = False
          last_rows = 0
          last_prep_done = 0
          last_provenance_ok = 0
          last_reason = "NOT_CHECKED"

          while True:
              attempt += 1
              now_dt = datetime.now(KST)
              now_min = now_dt.hour * 60 + now_dt.minute

              try:
                  from trader.db.engine import get_engine
                  from trader.db.repos import load_final30_scored_db_only, LedgerEventsRepo

                  df = load_final30_scored_db_only(
                      get_engine(),
                      env=env,
                      strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
                      as_of=expected_as_of_str,
                      require_exact_rows=30,
                      fail_if_missing=False,
                  )
                  rows = len(df) if df is not None and not df.empty else 0
              except Exception as exc:
                  rows = 0
                  print(f"[TRADE_AM][PREP_WAIT][DB_ERROR] attempt={attempt} err={exc}")

              # Check PREP_DONE
              prep_done = 0
              prep_branch = ""
              try:
                  from trader.db.engine import get_engine as ge2
                  from trader.db.repos import LedgerEventsRepo
                  repo = LedgerEventsRepo(ge2())
                  ev = repo.get_prep_done_event(env=env, as_of=expected_as_of_str)
                  if ev:
                      prep_done = 1
                      prep_branch = str((ev.get("payload_json") or {}).get("producer_branch", ""))
              except Exception as exc:
                  prep_done = 0
                  prep_branch = ""

              # Provenance check
              provenance_ok = 0
              if rows == 30 and prep_done == 1:
                  if prep_branch == expected_branch or prep_branch == "":
                      # If no producer_branch stored yet, allow (legacy compat)
                      provenance_ok = 1 if prep_branch == "" else (1 if prep_branch == expected_branch else 0)
                  else:
                      provenance_ok = 0

              if rows == 30:
                  if prep_done == 1 and provenance_ok == 1:
                      reason = "READY"
                      ready = True
                  elif prep_done == 1 and provenance_ok == 0:
                      reason = f"PROVENANCE_MISMATCH:expected={expected_branch},actual={prep_branch}"
                  elif prep_done == 0:
                      reason = "PREP_DONE_MISSING"
                  else:
                      reason = "NOT_READY"
              else:
                  reason = f"NO_FINAL30:rows={rows}"

              last_rows = rows
              last_prep_done = prep_done
              last_provenance_ok = provenance_ok
              last_reason = reason

              waited_sec = int(time.monotonic() - start_ts)
              print(f"[TRADE_AM][PREP_WAIT][CHECK] attempt={attempt} rows={rows} prep_done={prep_done} provenance_ok={provenance_ok} ready={int(ready)} reason={reason} now={now_dt.strftime('%H:%M')} waited_sec={waited_sec}")

              if ready:
                  break

              # Check if provenance mismatch (wrong branch) - fail immediately
              if rows == 30 and prep_done == 1 and provenance_ok == 0:
                  print(f"[TRADE_AM][PREP_PROVENANCE][FAIL] reason=PREP_PROVENANCE_MISMATCH expected={expected_branch} actual={prep_branch}")
                  break

              max_wait_sec = int(os.getenv("TRADE_PREP_WAIT_MAX_SEC", "900"))
              if waited_sec >= max_wait_sec:
                  print(f"[TRADE_AM][PREP_WAIT][TIMEOUT_SEC] waited_sec={waited_sec} max_wait_sec={max_wait_sec} rows={rows} prep_done={prep_done}")
                  break

              if now_min >= deadline_min:
                  print(f"[TRADE_AM][PREP_WAIT][TIMEOUT] expected_as_of={expected_as_of_str} rows={rows} prep_done={prep_done} provenance_ok={provenance_ok} deadline={wait_until_hhmm}")
                  break

              print(f"[TRADE_AM][PREP_WAIT][SLEEP] poll_sec={poll_sec}")
              time.sleep(poll_sec)

          waited_sec = int(time.monotonic() - start_ts)
          print(f"[TRADE_AM][PREP_WAIT][DONE] ready={int(ready)} waited_sec={waited_sec}")

          if ready:
              print(f"[TRADE_AM][ORDER_MODE] order_allowed=1 rows={last_rows} prep_done={last_prep_done}")
              _write_output("prep_ready", "1")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", str(last_rows))
              _write_output("skip_reason", "OK")
          else:
              not_ready_policy = os.getenv("TRADE_AM_PREP_NOT_READY_POLICY_PRACTICE", "PNL_ONLY_EXIT_0") if env == "practice" else os.getenv("TRADE_AM_PREP_NOT_READY_POLICY_LIVE", "FAIL_EXIT_1")
              print(f"[TRADE_AM][PREP_NOT_READY][POLICY] env={env} action={not_ready_policy}")
              print(f"[TRADE_AM][ORDER_BLOCKED] reason=PREP_NOT_READY rows={last_rows} provenance_ok={last_provenance_ok}")
              _write_output("prep_ready", "0")
              _write_output("expected_as_of", expected_as_of_str)
              _write_output("final30_rows", str(last_rows))
              _write_output("skip_reason", f"PREP_NOT_READY:{last_reason}")
              if env != "practice":
                  sys.exit(1)
          PY

      - name: Run AM trade loop
        id: am_engine
        if: ${{ always() && steps.phase_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1' && steps.verify_final30.outputs.prep_ready == '1' }}
        timeout-minutes: 245
        working-directory: repo
        env:
          ORDER_ALLOWED: ${{ steps.order_mode_guard.outputs.order_allowed }}
          PB1_COMPUTE_ONLY: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          PB1_ORDER_BLOCK_REASON: ${{ steps.order_mode_guard.outputs.reason }}
          NO_TRADE: ${{ steps.trading_day_guard.outputs.is_trading_day != '1' && '1' || '0' }}
          DISABLE_LIVE_TRADING: "1"
          LIVE_TRADING_ENABLED: "0"
          KIS_HTTP_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          echo "[TRADE_AM][ENGINE_START] cmd=python -m trader.trade_tick as_of=${{ steps.verify_final30.outputs.expected_as_of }} prep_ready=${{ steps.verify_final30.outputs.prep_ready }}" | tee -a artifacts/trade-am.log
          echo "[PHASE][START] phase=am session_window=0900-1255" | tee -a artifacts/trade-am.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-am.log
          echo "[PHASE][END] phase=am" | tee -a artifacts/trade-am.log
          echo "[TRADE_AM][ENGINE_DONE] exit_code=0" | tee -a artifacts/trade-am.log

      - name: Generate Portfolio PNL report
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        env:
          PB1_PNL_REPORT_ENABLED: "1"
          PB1_PNL_REPORT_SESSION: "am"
          PB1_PNL_PRICE_FALLBACK_LIMIT: "3"
        run: |
          set -euo pipefail
          mkdir -p reports/portfolio_pnl
          engine_outcome="${{ steps.am_engine.outcome }}"
          prep_ready="${{ steps.verify_final30.outputs.prep_ready }}"
          skip_reason="${{ steps.verify_final30.outputs.skip_reason }}"
          expected_as_of="${{ steps.verify_final30.outputs.expected_as_of }}"
          final30_rows="${{ steps.verify_final30.outputs.final30_rows }}"
          echo "[TRADE_AM][PNL_ONLY_CHECK] engine_outcome=${engine_outcome} prep_ready=${prep_ready} skip_reason=${skip_reason} expected_as_of=${expected_as_of} final30_rows=${final30_rows}" | tee -a artifacts/trade-am.log
          python scripts/generate_portfolio_pnl_report.py 2>&1 | tee -a artifacts/trade-am.log || true
          if [ -f reports/portfolio_pnl/latest_portfolio_pnl.md ]; then
            cat reports/portfolio_pnl/latest_portfolio_pnl.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assert AM engine execution
        if: always() && steps.phase_guard.outputs.should_run == '1' && steps.trading_day_guard.outputs.is_trading_day == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          prep_ready="${{ steps.verify_final30.outputs.prep_ready }}"
          engine_outcome="${{ steps.am_engine.outcome }}"
          expected_as_of="${{ steps.verify_final30.outputs.expected_as_of }}"
          final30_rows="${{ steps.verify_final30.outputs.final30_rows }}"
          skip_reason="${{ steps.verify_final30.outputs.skip_reason }}"

          echo "[TRADE_AM][ASSERT] is_trading_day=1 prep_ready=${prep_ready} engine_outcome=${engine_outcome} expected_as_of=${expected_as_of} final30_rows=${final30_rows} skip_reason=${skip_reason}" | tee -a artifacts/trade-am.log

          if [[ "${prep_ready}" != "1" ]]; then
            echo "[TRADE_AM][ASSERT_FAIL] reason=PREP_NOT_READY prep_ready=${prep_ready} skip_reason=${skip_reason} expected_as_of=${expected_as_of} final30_rows=${final30_rows}" | tee -a artifacts/trade-am.log
            echo "::error::TRADE_AM ASSERT FAIL: KRX trading day but prep_ready=${prep_ready}. skip_reason=${skip_reason}. final30 rows=${final30_rows} for as_of=${expected_as_of}. AM engine was NOT executed."
            exit 1
          fi

          if [[ "${engine_outcome}" != "success" ]]; then
            echo "[TRADE_AM][ASSERT_FAIL] reason=ENGINE_NOT_RUN engine_outcome=${engine_outcome} prep_ready=${prep_ready} expected_as_of=${expected_as_of}" | tee -a artifacts/trade-am.log
            echo "::error::TRADE_AM ASSERT FAIL: prep_ready=1 but AM engine outcome=${engine_outcome} (not success). PNL-only execution is NOT acceptable."
            exit 1
          fi

          echo "[TRADE_AM][ASSERT_OK] engine_ran=1 engine_outcome=${engine_outcome} prep_ready=${prep_ready} expected_as_of=${expected_as_of}" | tee -a artifacts/trade-am.log

      - name: Verify AM log contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          missing=0
          
          # Required log patterns
          for pattern in \
            "\[TRADE_AM\]\[TRIGGER\]" \
            "\[TRADE_AM\]\[START_META\]" \
            "\[TRADE_AM\]\[PHASE_GUARD\]" \
            "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" \
            "\[TRADE\]\[READY\]\[OK\]" \
            "\[RUN_SUMMARY\]\[RESULT\]" \
            "\[ORDERS\]\[STALE_REPAIR\]\[DONE\]" \
            "\[PNL_REPORT\]\[DB_ORDERS\]\[OK\]" \
            "\[PNL_REPORT\]\[DB_FILLS\]\[OK\]" \
            "\[PNL_REPORT\]\[REALIZED\]\[SUMMARY\]"; do
            if ! grep -E "$pattern" artifacts/trade-am.log >/dev/null; then
              echo "::error::missing required log pattern: $pattern"
              missing=1
            fi
          done
          
          # Session end check
          if ! grep -E "\[PB1\]\[EXIT\] reason=session_end|\[PB1\]\[LOOP\] session end reached -> exit" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing clean session_end exit log"
            missing=1
          fi
          
          # Forbidden error patterns
          if grep -F "Traceback" artifacts/trade-am.log >/dev/null; then
            echo "::error::Traceback detected in AM log"
            missing=1
          fi
          if grep -F "FATAL_RUNTIME" artifacts/trade-am.log >/dev/null; then
            echo "::error::FATAL_RUNTIME detected in AM log"
            missing=1
          fi
          if grep -F "[ORDERS][STALE_REPAIR][FAIL]" artifacts/trade-am.log >/dev/null; then
            echo "::error::stale repair failure detected"
            missing=1
          fi
          if grep -F "Unconsumed column names: repair_reason" artifacts/trade-am.log >/dev/null; then
            echo "::error::repair_reason column error detected"
            missing=1
          fi
          if grep -F "got an unexpected keyword argument 'start_at'" artifacts/trade-am.log >/dev/null; then
            echo "::error::PNL report start_at argument error detected"
            missing=1
          fi
          if grep -F "got an unexpected keyword argument 'event_type_filter'" artifacts/trade-am.log >/dev/null; then
            echo "::error::PNL report event_type_filter argument error detected"
            missing=1
          fi
          if grep -E "tick_hard_timeout.*timeout_sec=90.*last_stage=entry.buyable_gate.finalize" artifacts/trade-am.log >/dev/null; then
            echo "::error::tick_hard_timeout at entry.buyable_gate.finalize detected"
            missing=1
          fi
          if grep -F "[PNL_REPORT][DB_ORDERS_FAIL]" artifacts/trade-am.log >/dev/null; then
            echo "::error::PNL report DB orders failed"
            missing=1
          fi
          if grep -F "No module named 'trader.utils.time_utils'" artifacts/trade-am.log >/dev/null; then
            echo "::error::removed time_utils import path detected"
            missing=1
          fi

          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected forbidden:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload trade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-diagnostics-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/reports/**
            repo/runtime/**
            repo/logs/**
          if-no-files-found: ignore
          retention-days: 14

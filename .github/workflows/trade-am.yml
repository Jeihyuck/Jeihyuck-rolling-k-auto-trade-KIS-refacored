name: "Trade AM"

"on":
  schedule:
    # Mon-Fri 09:07/09:12/09:17/09:22/09:27 KST recovery schedule
    - cron: "7 0 * * 1-5"
    - cron: "12 0 * * 1-5"
    - cron: "17 0 * * 1-5"
    - cron: "22 0 * * 1-5"
    - cron: "27 0 * * 1-5"
  workflow_dispatch:
    inputs:
      STRATEGY_ENV:
        description: Strategy environment
        required: false
        default: practice
        type: choice
        options:
          - practice

concurrency:
  group: pb1-practice-am-serial
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODE: trade
  PB1_SESSION_KIND: "am"
  PB1_AM_START_ALLOW_UNTIL: "0930"
  PB1_AM_EXPECTED_START_FROM: "0907"
  PB1_AM_EXPECTED_START_TO: "0915"
  PB1_AM_SESSION_END: "13:00"
  PB1_TICK_HARD_TIMEOUT_SEC: "90"
  PB1_POSTPROCESS_TIMEOUT_SEC: "45"
  PB1_POST_CAPITAL_TIMEOUT_SEC: "45"
  PB1_EXIT_PASS_TIMEOUT_SEC: "90"
  PB1_SESSION_EXIT_GRACE_SEC: "15"
  STRATEGY_MODE: "LIVE"
  STRATEGY_ENV: practice
  KIS_ENV: practice
  WATCHLIST_FINAL_STRATEGY_KEY: "pb1_watchlist_final"
  WATCHLIST_FINAL_SCORED_STRATEGY_KEY: "pb1_watchlist_final_scored"
  FINAL30_SOURCE_MODE: "db_only"
  PB1_REQUIRE_SCORED_FINAL30: "1"
  PB1_DISABLE_RAW_FINAL30_FALLBACK: "1"
  TRADE_REQUIRE_PREP_FINAL30_SCORED: "1"
  PB1_LOOP_ENABLED: "1"
  PB1_RUN_LOOP_MINUTES: "233"
  PB1_LOOP_INTERVAL_SEC: "60"
  PB1_SESSION_GUARD_STALE_SEC: "600"
  PB1_MANUAL_SESSION_GUARD_STALE_SEC: "60"
  PB1_ALLOW_MANUAL_SESSION_TAKEOVER: "1"
  PB1_ALLOW_WAIT: "0"
  FORCE_RUN: "1"
  FORCE_MARKET_WINDOW: "morning"
  FORCE_PB1_PHASE: "entry"
  FORCE_STRATEGY_MODE: "LIVE"
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "0"
  LIVE_TRADING_ENABLED: "1"
  FORCE_BLOCK_LIVE: "0"
  ALLOW_LIVE_GATE: "1"
  KIS_HTTP_ENABLED: "1"
  PAPER_MAX_CAPITAL_KRW: "100000000"
  EXPECTED_PRACTICE_CAPITAL_KRW: "100000000"
  ACCOUNT_SANITY_CHECK: "1"
  ACCOUNT_SANITY_FAIL_IF_MISMATCH: "0"
  ACCOUNT_SANITY_RECONCILE_FROM_KIS: "1"
  ACCOUNT_SANITY_WARN_IF_MISMATCH: "1"
  EXPECTED_INITIAL_HOLDINGS: "0"
  KIS_PRICE_MIN_INTERVAL_MS: "400"
  KIS_PRICE_CACHE_TTL_SEC: "15"
  KIS_RATE_LIMIT_COOLDOWN_SEC: "20"
  NO_TRADE: "0"
  FAIL_IF_POOL_MISSING: "1"
  CANDIDATE_POOL_TTL_DAYS: "7"
  CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
  CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
  CANDIDATE_POOL_UNIVERSE_ENV: "practice"
  MINERVINI_USE_FEATURE_CACHE: "1"
  FEATURE_CACHE_WARMUP_ON_TICK: "0"
  DB_DISABLE_PREPARED_STATEMENTS: "1"
  DB_LOCK_TIMEOUT_MS: "5000"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_IDLE_IN_TX_SESSION_TIMEOUT_MS: "15000"
  PB1_FAIL_OPEN_ON_ORDER_LOOKUP_TIMEOUT: "1"
  PRICE_TTL_SEC: "15"
  PRICE_JITTER_MAX_SEC: "0.12"

defaults:
  run:
    shell: bash

jobs:
  trade_am:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.STRATEGY_ENV || 'practice' }}

    steps:
      - name: Guard AM phase window (all triggers)
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_hhmm="$(TZ=Asia/Seoul date +%H%M)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"
          run_attempt="${GITHUB_RUN_ATTEMPT:-1}"

          hh="${now_hhmm:0:2}"
          mm="${now_hhmm:2:2}"
          now_min=$((10#$hh * 60 + 10#$mm))

          min_0900=$((9 * 60 + 0))
          min_0907=$((9 * 60 + 7))
          min_0915=$((9 * 60 + 15))
          min_0920=$((9 * 60 + 20))
          min_0930=$((9 * 60 + 30))
          min_0940=$((9 * 60 + 40))
          min_1255=$((12 * 60 + 55))

          valid_window="0900-1255"
          expected_start_window="0907-0915"
          new_start_allow_window="0907-0930"
          should_run=1
          skip_reason="none"
          late_level="NONE"
          degraded_session=0
          start_classification="STARTED_ON_TIME"
          trigger_classification="schedule"

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            trigger_classification="workflow_dispatch"
          elif [[ "$run_attempt" -gt 1 ]]; then
            trigger_classification="rerun_attempt"
          else
            trigger_classification="schedule"
          fi

          if [[ "$event_name" != "workflow_dispatch" ]]; then
            if (( now_min < min_0900 )); then
              should_run=0
              skip_reason="early_start"
            elif (( now_min > min_0930 )); then
              should_run=0
              skip_reason="late_schedule_start_after_0930"
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            if (( now_min > min_0930 )) && [[ "${FORCE_ALLOW_LATE_MANUAL:-0}" != "1" ]]; then
              should_run=0
              skip_reason="late_manual_start_after_0930_requires_force"
            fi
          fi

          if (( now_min > min_0920 )); then
            late_level="WARN"
            degraded_session=1
            start_classification="STARTED_LATE_WARN"
          fi

          if (( now_min > min_0940 )); then
            late_level="ERROR"
            degraded_session=1
            start_classification="STARTED_LATE_ERROR"
          fi

          if [[ "$should_run" != "1" ]]; then
            start_classification="SKIP_PHASE_WINDOW"
          fi
          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_kst=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "trigger_classification=${trigger_classification}" >> "$GITHUB_OUTPUT"
          echo "valid_window=${valid_window}" >> "$GITHUB_OUTPUT"
          echo "expected_start_window=${expected_start_window}" >> "$GITHUB_OUTPUT"
          echo "new_start_allow_window=${new_start_allow_window}" >> "$GITHUB_OUTPUT"
          echo "late_level=${late_level}" >> "$GITHUB_OUTPUT"
          echo "degraded_session=${degraded_session}" >> "$GITHUB_OUTPUT"
          echo "start_classification=${start_classification}" >> "$GITHUB_OUTPUT"

      - name: Write AM trigger metadata
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          precheck_epoch="$(date +%s)"
          manual_restart=0
          if [[ "${{ steps.phase_guard.outputs.event_name }}" == "workflow_dispatch" || "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]]; then
            manual_restart=1
          fi
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} trigger_classification=${{ steps.phase_guard.outputs.trigger_classification }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][RESTART_HINT] workflow_run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} manual_restart=${manual_restart}"
            echo "[TRADE_AM][QUEUE_VISIBLE] expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }} now_kst=${{ steps.phase_guard.outputs.now_kst }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[TRADE_AM][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=${{ steps.phase_guard.outputs.valid_window }} expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason || 'none' }} event=${{ steps.phase_guard.outputs.event_name }} valid_window=${{ steps.phase_guard.outputs.valid_window }}"
            echo "[TRADE_AM][START_CLASSIFICATION] value=${{ steps.phase_guard.outputs.start_classification }} late_level=${{ steps.phase_guard.outputs.late_level }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }}"
            echo "[TRADE_AM][PRECHECK][START]"
            if [[ -n "${{ steps.phase_guard.outputs.late_level }}" ]]; then
              echo "[TRADE_AM][LATE_START][WARN] now_kst=${{ steps.phase_guard.outputs.now_kst }} expected=${{ steps.phase_guard.outputs.expected_start_window }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }}"
            fi
            if [[ "${{ steps.phase_guard.outputs.late_level }}" == "ERROR" ]]; then
              echo "[TRADE_AM][LATE_START][ERROR] now_kst=${{ steps.phase_guard.outputs.now_kst }} expected=${{ steps.phase_guard.outputs.expected_start_window }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }}"
            fi
          } | tee -a repo/artifacts/trade-am.log
          {
            echo "PRECHECK_EPOCH=${precheck_epoch}"
            echo "LAST_STEP_EPOCH=${precheck_epoch}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Verify checkout path
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: .
        run: |
          set -euo pipefail
          now_epoch="$(date +%s)"
          dur_sec="$((now_epoch - ${LAST_STEP_EPOCH:-$now_epoch}))"
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; ls -la repo || true; exit 1; }
          mkdir -p repo/artifacts
          manual_restart=0
          if [[ "${{ steps.phase_guard.outputs.event_name }}" == "workflow_dispatch" || "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]]; then
            manual_restart=1
          fi
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} trigger_classification=${{ steps.phase_guard.outputs.trigger_classification }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][RESTART_HINT] workflow_run_id=${GITHUB_RUN_ID} sha=${GITHUB_SHA} manual_restart=${manual_restart}"
            echo "[TRADE_AM][QUEUE_VISIBLE] expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }} now_kst=${{ steps.phase_guard.outputs.now_kst }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[TRADE_AM][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=${{ steps.phase_guard.outputs.valid_window }} expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason || 'none' }} event=${{ steps.phase_guard.outputs.event_name }} valid_window=${{ steps.phase_guard.outputs.valid_window }}"
            echo "[TRADE_AM][START_CLASSIFICATION] value=${{ steps.phase_guard.outputs.start_classification }} late_level=${{ steps.phase_guard.outputs.late_level }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }}"
            echo "[TRADE_AM][PRECHECK][START]"
          } | tee repo/artifacts/trade-am.log >/dev/null
          echo "[CHECKOUT][OK] repo path ready"
          echo "[TRADE_AM][STEP][checkout] dur_sec=${dur_sec}" | tee -a repo/artifacts/trade-am.log
          echo "LAST_STEP_EPOCH=${now_epoch}" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          now_epoch="$(date +%s)"
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          done_epoch="$(date +%s)"
          echo "[TRADE_AM][STEP][deps] dur_sec=$((done_epoch - ${LAST_STEP_EPOCH:-$now_epoch}))" | tee -a artifacts/trade-am.log
          echo "LAST_STEP_EPOCH=${done_epoch}" >> "$GITHUB_ENV"

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          now_epoch="$(date +%s)"
          python -m trader.db.migrate
          done_epoch="$(date +%s)"
          echo "[TRADE_AM][STEP][db_migrate] dur_sec=$((done_epoch - ${LAST_STEP_EPOCH:-$now_epoch}))" | tee -a artifacts/trade-am.log
          echo "LAST_STEP_EPOCH=${done_epoch}" >> "$GITHUB_ENV"

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail

          echo "[ENV_CHECK] STRATEGY_ENV=${STRATEGY_ENV:-}"
          echo "[ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
          echo "[ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
          echo "[ENV_CHECK] KIS_REST_URL=${KIS_REST_URL:-}"

          test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
          test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
          test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
          test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }

          test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
          test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
          test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }

          [[ "${API_BASE_URL}" == *"openapi"* ]] || { echo "::error::API_BASE_URL invalid"; exit 1; }

          echo "[ENV_CHECK][OK] KIS env contract satisfied"

      - name: Verify candidate pool exists in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          now_epoch="$(date +%s)"
          echo "[TRADE_AM][PRECHECK][CANDIDATE_POOL][START]"
          if python -m trader.verify_candidate_pool; then
            echo "[TRADE_AM][PRECHECK][CANDIDATE_POOL][OK]"
          else
            echo "[TRADE_AM][PRECHECK][CANDIDATE_POOL][FAIL] reason=verify_candidate_pool_failed"
            exit 1
          fi
          done_epoch="$(date +%s)"
          echo "[TRADE_AM][STEP][candidate_pool_verify] dur_sec=$((done_epoch - ${LAST_STEP_EPOCH:-$now_epoch}))" | tee -a artifacts/trade-am.log
          echo "LAST_STEP_EPOCH=${done_epoch}" >> "$GITHUB_ENV"

      - name: Verify final30 readiness in DB
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          now_epoch="$(date +%s)"
          echo "[TRADE_AM][PRECHECK][FINAL30][START]"
          if python - <<'PY'
          import os
          from trader.db.engine import get_engine
          from trader.db.repos import load_final30_scored_db_only
          from trader.time_utils import now_kst, resolve_trade_context

          env = os.getenv("STRATEGY_ENV", "practice")
          ctx = resolve_trade_context(now=now_kst(), env=env)
          df = load_final30_scored_db_only(
              get_engine(),
              env=env,
              strategy=os.getenv("WATCHLIST_FINAL_SCORED_STRATEGY_KEY", "pb1_watchlist_final_scored"),
              as_of=ctx["as_of"],
              require_exact_rows=30,
              fail_if_missing=True,
          )
          print(f"[TRADE_AM][PRECHECK][FINAL30][OK] rows={len(df)} as_of={ctx['as_of']}")
          PY
          then
            :
          else
            echo "[TRADE_AM][PRECHECK][FINAL30][FAIL] reason=missing_db_exact_scored_final30"
            exit 1
          fi
          done_epoch="$(date +%s)"
          echo "[TRADE_AM][STEP][final30_verify] dur_sec=$((done_epoch - ${LAST_STEP_EPOCH:-$now_epoch}))" | tee -a artifacts/trade-am.log
          echo "LAST_STEP_EPOCH=${done_epoch}" >> "$GITHUB_ENV"

      - name: Mark AM precheck done
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[TRADE_AM][PRECHECK][DONE]" | tee -a artifacts/trade-am.log

      - name: Emit AM skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p repo/artifacts
          {
            echo "[TRADE_AM][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} trigger_classification=${{ steps.phase_guard.outputs.trigger_classification }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[TRADE_AM][QUEUE_VISIBLE] expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }} now_kst=${{ steps.phase_guard.outputs.now_kst }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[TRADE_AM][START_META] now_kst=${{ steps.phase_guard.outputs.now_kst }} valid_window=${{ steps.phase_guard.outputs.valid_window }} expected_start_window=${{ steps.phase_guard.outputs.expected_start_window }} new_start_allow_window=${{ steps.phase_guard.outputs.new_start_allow_window }}"
            echo "[TRADE_AM][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason || 'none' }} event=${{ steps.phase_guard.outputs.event_name }} valid_window=${{ steps.phase_guard.outputs.valid_window }}"
            echo "[TRADE_AM][START_CLASSIFICATION] value=${{ steps.phase_guard.outputs.start_classification }} late_level=${{ steps.phase_guard.outputs.late_level }} degraded_session=${{ steps.phase_guard.outputs.degraded_session }}"
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=am event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[PB1][EXIT] reason=phase_guard_skip"
          } | tee repo/artifacts/trade-am.log

      - name: Run AM trade tick
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export TRADE_AM_LATE_START=$([[ -n "${{ steps.phase_guard.outputs.late_level }}" ]] && echo 1 || echo 0)
          export TRADE_AM_DEGRADED_SESSION=${{ steps.phase_guard.outputs.degraded_session }}
          echo "[TRADE_AM][WINDOW] target=09:07-13:00 KST loop_minutes=${PB1_RUN_LOOP_MINUTES} interval_sec=${PB1_LOOP_INTERVAL_SEC}"
          echo "[CONFIG][FINAL30_SOURCE_MODE] ${FINAL30_SOURCE_MODE}"
          echo "[CONFIG][PB1_REQUIRE_SCORED_FINAL30] ${PB1_REQUIRE_SCORED_FINAL30}"
          echo "[CONFIG][PB1_DISABLE_RAW_FINAL30_FALLBACK] ${PB1_DISABLE_RAW_FINAL30_FALLBACK}"
          echo "[TRADE_AM][CONFIG] MODE=trade STRATEGY_ENV=${STRATEGY_ENV} KIS_ENV=${KIS_ENV} FAIL_IF_POOL_MISSING=${FAIL_IF_POOL_MISSING} CANDIDATE_POOL_STRATEGY_KEY=${CANDIDATE_POOL_STRATEGY_KEY} PB1_PHASE_DEFAULT=${PB1_PHASE_DEFAULT:-}"
          echo "[PHASE][START] phase=am" | tee -a artifacts/trade-am.log
          python -m trader.trade_tick 2>&1 | tee -a artifacts/trade-am.log
          echo "[PHASE][END] phase=am" | tee -a artifacts/trade-am.log

      - name: Verify AM trade tick logs
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          missing=0
          for pattern in "\[TRADE_AM\]\[TRIGGER\]" "\[TRADE_AM\]\[QUEUE_VISIBLE\]" "\[TRADE_AM\]\[START_META\]" "\[TRADE_AM\]\[PHASE_GUARD\]" "\[TRADE_AM\]\[START_CLASSIFICATION\]" "\[TRADE_AM\]\[PRECHECK\]\[START\]" "\[TRADE_AM\]\[PRECHECK\]\[DONE\]"; do
            if ! grep -E "$pattern" artifacts/trade-am.log >/dev/null; then
              echo "::error::missing metadata pattern: $pattern"
              missing=1
            fi
          done
          if ! grep -E "\[RUN_SUMMARY\]\[RESULT\]" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing [RUN_SUMMARY][RESULT]"
            grep -E "\[RUN_SUMMARY\]\[(FAIL|GENERATE_FAIL)\]|\[TRADE\]\[BOOT\]\[START\]" artifacts/trade-am.log || true
            exit 1
          fi
          result_status="$(grep -Eo '\[RUN_SUMMARY\]\[RESULT\] status=[A-Z_]+' artifacts/trade-am.log | tail -n 1 | sed 's/.*status=//')"
          if [[ "$result_status" == "SKIP_PHASE_WINDOW" ]]; then
            echo "::notice::AM phase window skip recorded"
            exit 0
          fi
          if grep -F "operator does not exist: text >= timestamp with time zone" artifacts/trade-am.log >/dev/null; then
            echo "::error::runs.started_at text/timestamptz schema mismatch still present"
            exit 1
          fi
          if [[ "$result_status" == "FATAL_RUNTIME" ]]; then
            echo "::error::AM fatal runtime recorded"
            grep -E "\[RUN_SUMMARY\]\[RESULT\] status=FATAL_RUNTIME|\[PB1\]\[EXIT\] reason=fatal_runtime|\[PB1\]\[FATAL_GUARD\]" artifacts/trade-am.log || true
            exit 1
          fi
          fatal_count="$(grep -Ec '\[RUN_SUMMARY\]\[RESULT\] status=(FATAL_RUNTIME|FATAL_POSTPROCESS)' artifacts/trade-am.log || true)"
          timeout_count="$(grep -Ec 'TickTimeoutError|tick_hard_timeout' artifacts/trade-am.log || true)"
          db_autocommit_count="$(grep -Ec "can't change 'autocommit' now|connection in transaction status ACTIVE" artifacts/trade-am.log || true)"
          degraded_count="$(grep -Ec 'DEGRADED_POSTPROCESS|\[PB1\]\[POSTPROCESS\]\[DEGRADED\]' artifacts/trade-am.log || true)"
          echo "[TRADE_AM][VERIFY][COUNTS] fatal_count=${fatal_count} timeout_count=${timeout_count} db_autocommit_count=${db_autocommit_count} degraded_count=${degraded_count}"
          if [[ "$db_autocommit_count" -gt 0 ]]; then
            echo "::error::DB autocommit transaction ACTIVE error detected"
            exit 1
          fi
          if [[ "$fatal_count" -gt 0 ]]; then
            echo "::error::AM internal fatal result detected"
            exit 1
          fi
          if ! grep -E "\[PB1\]\[LOOP\]\[SESSION\] kind=am" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing [PB1][LOOP][SESSION] kind=am"
            missing=1
          fi
          if ! grep -E "\[TRADE\]\[FINAL30\]\[DB_EXACT_LOAD\]" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing [TRADE][FINAL30][DB_EXACT_LOAD]"
            grep -E "\[TRADE\]\[FINAL30\]\[(DB_FALLBACK_LOAD|FAIL|LOAD_FAIL)\]" artifacts/trade-am.log || true
            missing=1
          fi
          if ! grep -E "\[TRADE\]\[READY\]\[OK\]" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing [TRADE][READY][OK]"
            grep -E "\[TRADE\]\[READY\]\[FAIL\]|\[TRADE\]\[PRECHECK\]\[(CANDIDATE_POOL|FINAL30|BALANCE)\]" artifacts/trade-am.log || true
            missing=1
          fi
          if ! grep -E "\[PB1\]\[LOOP\]\[SESSION_END_RELEASE\]|\[PB1\]\[LOOP\] session end reached -> exit|\[PB1\]\[EXIT\] reason=session_end" artifacts/trade-am.log >/dev/null; then
            echo "::error::missing clean AM session release log"
            missing=1
          fi
          test "$missing" -eq 0

      - name: Scan for SQLite artifacts
        if: always() && steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

      - name: Upload debug AM logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-trade-am-logs
          path: repo/artifacts/
          if-no-files-found: ignore

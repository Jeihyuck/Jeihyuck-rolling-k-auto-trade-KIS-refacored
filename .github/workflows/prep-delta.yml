name: Prep Delta (Universe + OHLCV + Derived + Watchlist)

on:
  schedule:
    # Mon-Fri 08:40 KST = Sun-Thu 23:40 UTC
    - cron: "40 23 * * 0-4"
  workflow_dispatch: {}

concurrency:
  group: prep-delta
  cancel-in-progress: false

env:
  MODE: prep
  STRATEGY_ENV: practice
  KIS_ENV: practice
  PREFETCH_DAYS: "1"
  OHLCV_DELTA_DAYS: "1"
  FORCE_CANDIDATE: "0"
  DRYRUN: "0"
  FORCE_BLOCK_LIVE: "1"
  ALLOW_LIVE_GATE: "0"
  ANALYSIS_ONLY: "0"
  ATR_MAX_PCT: "0.10"
  PB1_RUN_IN_MINERVINI_TEST: "0"
  FORCE_COMPUTE_ON_CUTOFF: "1"
  BYPASS_ENTRY_CUTOFF_COMPUTE_ONLY: "1"

  # Backward-compatible aliases
  DRY_RUN: "0"
  DISABLE_LIVE_TRADING: "1"
  LIVE_TRADING_ENABLED: "0"
  MINERVINI_ONLY: "0"
  MINERVINI_TEST_WITH_PB1: "0"
  FORCE_COMPUTE_WHEN_CUTOFF: "1"
  BYPASS_ENTRY_CUTOFF_FOR_COMPUTE: "1"

  CANDIDATE_POOL_FORCE_REBUILD: "0"
  CANDIDATE_POOL_PREFETCH_DAYS: "1"
  CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
  CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  prep_delta:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
          ref: "nullim"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Guard postgres-only
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Run prep delta
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Prep Delta"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "MODE: ${MODE}"
          echo "======================================"
          python -m trader.prep_runner

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

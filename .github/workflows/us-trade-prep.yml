name: "US Trade Prep"
# prep: universe scoring + locked watchlist | primary window: 06:00 ET
# This workflow is the primary US prep workflow.
# US Trade AM consumes this completed prep result and must not run prep itself.
# Multi-prewarm crons (UTC) cover EDT=10:00 UTC and EST=11:00 UTC.

"on":
  schedule:
    # UTC multi-prewarm: EDT 05:50-06:20 ET (09:50-10:20 UTC)
    - cron: "50 9 * * 1-5"    # EDT 05:50 ET prewarm
    - cron: "0 10 * * 1-5"    # EDT 06:00 ET primary
    - cron: "10 10 * * 1-5"   # EDT 06:10 ET recovery
    - cron: "20 10 * * 1-5"   # EDT 06:20 ET recovery
    # UTC multi-prewarm: EST 05:50-06:20 ET (10:50-11:20 UTC)
    - cron: "50 10 * * 1-5"   # EST 05:50 ET prewarm
    - cron: "0 11 * * 1-5"    # EST 06:00 ET primary
    - cron: "10 11 * * 1-5"   # EST 06:10 ET recovery
    - cron: "20 11 * * 1-5"   # EST 06:20 ET recovery
    # [US_SCHEDULE][CONFIG] schedule_mode=utc_multi_cron crons=8 primary_et=0600
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN (true = no order submission)"
        required: false
        default: true
        type: boolean
      offline:
        description: "offline mode (blocks all KIS HTTP)"
        required: false
        default: false
        type: boolean
      confirm:
        description: "Type RUN_US_PREP_MANUAL to run manually"
        required: false
        default: ""
      force_now:
        description: "Manual smoke only. Forced NY datetime for prep context, e.g. 2026-05-01T08:50:00-04:00"
        required: false
        default: ""
      manual_skip_phase_guard:
        description: "Manual only. true allows prep to run outside prep time window."
        required: false
        default: false
        type: boolean
      force_rebuild_prep:
        description: "Manual only. true = ignore existing US prep and rebuild dynamic universe/candidate/final30"
        required: false
        default: false
        type: boolean

concurrency:
  group: us-trade-prep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trade_us_prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: America/New_York
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      TRADING_REGION: "US"
      US_AGENT_ENABLED: "1"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      US_LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"

      US_STRATEGY_ENGINE: "pb1"
      US_ENTRY_ENABLED: "1"
      US_EXIT_ENABLED: "1"

      US_PAPER_MAX_CAPITAL_KRW: "50000000"
      US_EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
      US_BUDGET_FX_KRW_PER_USD: "1450"
      US_MAX_CAPITAL_USD_AUTO: "1"

      US_REQUIRE_FILL_CONFIRM: "1"
      US_ORDER_ACCEPTED_IS_NOT_FILLED: "1"
      US_BLOCK_REBUY_AFTER_SELL_SAME_DAY: "1"
      US_ALLOW_INTRADAY_REENTRY_AFTER_STOP: "0"
      US_BLOCK_NEW_ENTRY_AFTER_ET: "15:45"

      US_MAX_ORDER_USD: "2500"
      US_MAX_DAILY_NOTIONAL_USD: "10000"
      US_MAX_POSITION_WEIGHT: "0.10"
      US_MIN_CASH_BUFFER_USD: "200"

      US_SESSION_INTERVAL_SEC: "300"

      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || vars.US_AGENT_SCHEDULE_DRY_RUN || '1' }}

      US_LOG_FILE: "us-trade-prep.log"
      US_ARTIFACT_NAME: "us-trade-prep"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Resolve US Prep phase guard
        id: phase_guard
        working-directory: .
        run: |
          set -euo pipefail
          now_h="$(TZ=America/New_York date +%H)"
          now_m="$(TZ=America/New_York date +%M)"
          now_s="$(TZ=America/New_York date +%S)"
          now_min=$((10#$now_h * 60 + 10#$now_m))
          now_hhmm="$(TZ=America/New_York date +%H%M)"
          now_hhmmss="$(TZ=America/New_York date +%H%M%S)"
          event_name="${GITHUB_EVENT_NAME:-unknown}"

          # US prep primary schedule
          prewarm_earliest_min=$((5 * 60 + 50))  # 05:50 ET
          target_min=$((6 * 60 + 0))             # 06:00 ET
          normal_until_min=$((8 * 60 + 10))      # 08:10 ET
          recovery_until_min=$((9 * 60 + 25))    # 09:25 ET
          schedule_expected_min=$((6 * 60 + 0))
          max_wait_seconds=5400

          should_run=1
          skip_reason=""
          wait_until_target=0
          wait_seconds=0
          run_window="normal"
          recovery_run=0
          delay_seconds=$(( (now_min - schedule_expected_min) * 60 + 10#$now_s ))

          if [[ "$event_name" == "schedule" ]]; then
            if [[ "$now_min" -lt "$prewarm_earliest_min" ]]; then
              # 05:50 이전: DST duplicate 너무 이름 — skip
              should_run=0
              skip_reason="skip_dst_duplicate_too_early_us_prep"
              run_window="too_early_duplicate"
            elif [[ "$now_min" -lt "$target_min" ]]; then
              # 05:50~06:00: wait until target
              wait_until_target=1
              wait_seconds=$(( (target_min - now_min) * 60 - 10#$now_s ))
              if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
              run_window="early_wait"
            elif [[ "$now_min" -le "$normal_until_min" ]]; then
              # 06:00~08:10: normal window
              run_window="normal"
            elif [[ "$now_min" -le "$recovery_until_min" ]]; then
              # 08:10~09:25: recovery window
              run_window="recovery"
              recovery_run=1
            else
              # 09:25 이후: stale — 하지만 바로 skip하지 않고 already_prepared 확인 후 판단
              run_window="stale_verify"
              recovery_run=1
              should_run=1
            fi
          fi

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            confirm="${{ inputs.confirm || '' }}"
            skip_phase="${{ inputs.manual_skip_phase_guard || 'false' }}"
            if [[ "$skip_phase" == "true" ]]; then
              should_run=1
              skip_reason=""
              run_window="manual_skip_guard"
            elif [[ "$confirm" == "RUN_US_PREP_MANUAL" ]]; then
              should_run=1
              skip_reason=""
              run_window="manual"
            else
              should_run=0
              skip_reason="manual_us_prep_not_confirmed"
              run_window="manual_blocked"
            fi
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "now_et=${now_hhmm}" >> "$GITHUB_OUTPUT"
          echo "now_hhmmss=${now_hhmmss}" >> "$GITHUB_OUTPUT"
          echo "wait_until_target=${wait_until_target}" >> "$GITHUB_OUTPUT"
          echo "wait_seconds=${wait_seconds}" >> "$GITHUB_OUTPUT"
          echo "event_name=${event_name}" >> "$GITHUB_OUTPUT"
          echo "run_window=${run_window}" >> "$GITHUB_OUTPUT"
          echo "recovery_run=${recovery_run}" >> "$GITHUB_OUTPUT"
          echo "delay_seconds=${delay_seconds}" >> "$GITHUB_OUTPUT"
          
          echo "[US_PREP][START_META] schedule_expected=0600 actual_start=${now_hhmmss} delay_seconds=${delay_seconds} event=${event_name}"
          echo "[US_PREP][PHASE_GUARD] should_run=${should_run} run_window=${run_window} recovery_run=${recovery_run} wait_seconds=${wait_seconds}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dual-agent
          path: repo
          fetch-depth: 1

      - name: Verify checkout path and initialize log
        working-directory: .
        run: |
          set -euo pipefail
          test -d repo || { echo "::error::repo directory missing after checkout"; exit 1; }
          test -f repo/requirements.txt || { echo "::error::repo/requirements.txt missing"; exit 1; }
          test -d repo/trader || { echo "::error::repo/trader missing"; exit 1; }
          
          # Clean stale reports and artifacts to prevent mixing with current run
          echo "[CLEANUP][START] removing stale reports and artifacts"
          rm -rf repo/reports/us_daily
          mkdir -p repo/artifacts repo/reports/us_daily
          rm -f repo/artifacts/us_last_stage.txt
          echo "[CLEANUP][DONE]"
          
          {
            echo "[US_PREP][TRIGGER] event=${{ steps.phase_guard.outputs.event_name }} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
            echo "[US_PREP][START_META] schedule_expected=0600 actual_start=${{ steps.phase_guard.outputs.now_hhmmss }} delay_seconds=${{ steps.phase_guard.outputs.delay_seconds }} event=${{ steps.phase_guard.outputs.event_name }}"
            echo "[US_PREP][PHASE_GUARD] should_run=${{ steps.phase_guard.outputs.should_run }} skip_reason=${{ steps.phase_guard.outputs.skip_reason }} now_et=${{ steps.phase_guard.outputs.now_hhmmss }} wait_seconds=${{ steps.phase_guard.outputs.wait_seconds }} run_window=${{ steps.phase_guard.outputs.run_window }} recovery_run=${{ steps.phase_guard.outputs.recovery_run }} phase_window=0600-0810"
            echo "[TRIGGER_META] workflow=${GITHUB_WORKFLOW} event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          } | tee repo/artifacts/${US_LOG_FILE}
          echo "[CHECKOUT][OK] repo path ready" | tee -a repo/artifacts/${US_LOG_FILE}

      - name: Emit US Prep skip summary
        if: steps.phase_guard.outputs.should_run != '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[RUN_SUMMARY][RESULT] status=SKIP_PHASE_WINDOW reason=${{ steps.phase_guard.outputs.skip_reason }} session=us-prep"
            echo "[US_PREP][EXIT] reason=phase_guard_skip"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Set up Python
        if: steps.phase_guard.outputs.should_run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: US Python syntax preflight
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_PREFLIGHT][START] py_compile"
            python -m py_compile trader/us/db/repos.py
            python -m py_compile trader/us/runner/prep_runner.py
            python -m py_compile trader/us/runner/dispatcher.py
            python -m compileall -q trader/us
            echo "[US_PREFLIGHT][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Wait until US Prep target start
        if: steps.phase_guard.outputs.should_run == '1' && steps.phase_guard.outputs.wait_until_target == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          wait_seconds="${{ steps.phase_guard.outputs.wait_seconds }}"
          max_wait_seconds=900
          if [[ "$wait_seconds" -lt 0 ]]; then wait_seconds=0; fi
          if [[ "$wait_seconds" -gt "$max_wait_seconds" ]]; then
            echo "::error::wait_seconds too large: ${wait_seconds}"
            exit 1
          fi
          echo "[US_WAIT_UNTIL_TARGET][START] session=prep wait_seconds=${wait_seconds}" | tee -a artifacts/${US_LOG_FILE}
          sleep "$wait_seconds"
          echo "[US_WAIT_UNTIL_TARGET][DONE] session=prep now_et=$(TZ=America/New_York date +%H%M%S)" | tee -a artifacts/${US_LOG_FILE}

      - name: Guard postgres-only
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_DB_GUARD][START]"
            : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
            if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
              echo "::error::PBCORE_DB_URL must be postgres-only."
              exit 1
            fi
            echo "[US_DB_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: DB migrate
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_DB_MIGRATE][START]"
            python -m trader.db.migrate
            echo "[US_DB_MIGRATE][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Verify KIS env contract
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_ENV_CHECK] TRADING_REGION=${TRADING_REGION:-}"
            echo "[US_ENV_CHECK] KIS_ENV=${KIS_ENV:-}"
            echo "[US_ENV_CHECK] DRY_RUN=${DRY_RUN:-}"
            echo "[US_ENV_CHECK] API_BASE_URL=${API_BASE_URL:-}"
            test -n "${PBCORE_DB_URL:-}" || { echo "::error::PBCORE_DB_URL missing"; exit 1; }
            test -n "${KIS_APP_KEY:-}" || { echo "::error::KIS_APP_KEY missing"; exit 1; }
            test -n "${KIS_APP_SECRET:-}" || { echo "::error::KIS_APP_SECRET missing"; exit 1; }
            test -n "${CANO:-}" || { echo "::error::CANO missing"; exit 1; }
            test -n "${ACNT_PRDT_CD:-}" || { echo "::error::ACNT_PRDT_CD missing"; exit 1; }
            test -n "${APP_KEY:-}" || { echo "::error::APP_KEY alias missing"; exit 1; }
            test -n "${APP_SECRET:-}" || { echo "::error::APP_SECRET alias missing"; exit 1; }
            test -n "${API_BASE_URL:-}" || { echo "::error::API_BASE_URL alias missing"; exit 1; }
            [[ "${TRADING_REGION}" == "US" ]] || { echo "::error::TRADING_REGION must be US"; exit 1; }
            [[ "${KIS_ENV}" == "practice" ]] || { echo "::error::KIS_ENV must be practice"; exit 1; }
            echo "[US_ENV_CHECK][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Guard manual force_now safety
        if: github.event_name == 'workflow_dispatch' && inputs.force_now != ''
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_FORCE_NOW_GUARD][START] force_now=${{ inputs.force_now }} dry_run=${{ inputs.dry_run }} offline=${{ inputs.offline }}"
            if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.offline }}" != "true" ]; then
              echo "::error::force_now manual smoke requires dry_run=true or offline=true"
              exit 1
            fi
            echo "[US_FORCE_NOW_GUARD][OK]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Resolve US prep force rebuild flag
        if: steps.phase_guard.outputs.should_run == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          confirm="${{ inputs.confirm || '' }}"
          force_rebuild="${{ inputs.force_rebuild_prep && 'true' || 'false' }}"

          if [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && "$force_rebuild" == "true" && "$confirm" == "RUN_US_PREP_MANUAL" ]]; then
            echo "US_FORCE_REBUILD_PREP=1" >> "$GITHUB_ENV"
            echo "[US_PREP][FORCE_REBUILD][REQUESTED] enabled=1 trigger=workflow_dispatch confirm=OK" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_PREP][MANUAL_FLAGS] FORCE_REBUILD_PREP=1" | tee -a artifacts/${US_LOG_FILE}
          elif [[ "$force_rebuild" == "true" && "$confirm" != "RUN_US_PREP_MANUAL" ]]; then
            echo "US_FORCE_REBUILD_PREP=0" >> "$GITHUB_ENV"
            echo "[US_PREP][FORCE_REBUILD][BLOCK] reason=manual_confirm_missing" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_PREP][MANUAL_FLAGS] FORCE_REBUILD_PREP=0" | tee -a artifacts/${US_LOG_FILE}
          else
            echo "US_FORCE_REBUILD_PREP=0" >> "$GITHUB_ENV"
            echo "[US_PREP][FORCE_REBUILD][REQUESTED] enabled=0" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_PREP][MANUAL_FLAGS] FORCE_REBUILD_PREP=0" | tee -a artifacts/${US_LOG_FILE}
          fi

      - name: Check if prep already completed
        if: steps.phase_guard.outputs.should_run == '1'
        id: prep_check
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail
          {
            force_rebuild_flag="${US_FORCE_REBUILD_PREP:-0}"
            echo "[US_PREP][CHECK_ALREADY_PREPARED][START] force_rebuild=${force_rebuild_flag}"
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          sys.path.insert(0, ".")
          from trader.us.db.repos import load_latest_us_prep_status, load_locked_us_watchlist

          force_now = os.getenv("FORCE_NOW_INPUT", "").strip()
          if force_now:
              trade_date = datetime.fromisoformat(force_now).date().isoformat()
          else:
              trade_date = datetime.now(ZoneInfo("America/New_York")).date().isoformat()

          # force_rebuild_prep=1 이면 already_prepared 체크를 우회한다
          force_rebuild = os.getenv("US_FORCE_REBUILD_PREP", "0").strip() in ("1", "true", "yes", "on")
          if force_rebuild:
              print(f"already_prepared=0")
              print(f"prep_status=UNKNOWN")
              print(f"locked_count=0")
              print(
                  f"[US_PREP][CHECK_ALREADY_PREPARED][BYPASS] reason=force_rebuild_prep trade_date={trade_date}",
                  file=sys.stderr,
              )
              sys.exit(0)

          # Check prep status
          try:
              prep = load_latest_us_prep_status(trade_date, timeout_sec=10)
              if prep and prep["status"] in ("OK", "OK_WITH_WARNINGS"):
                  # Check locked watchlist count
                  try:
                      locked = load_locked_us_watchlist(trade_date, timeout_sec=10)
                      locked_count = len(locked) if locked else 0
                      if locked_count >= 10:
                          print(f"already_prepared=1")
                          print(f"prep_status={prep['status']}")
                          print(f"locked_count={locked_count}")
                          print(f"[US_PREP][ALREADY_PREPARED] trade_date={trade_date} prep_status={prep['status']} locked_count={locked_count}", file=sys.stderr)
                          sys.exit(0)
                  except Exception as e:
                      print(f"[US_PREP][CHECK_WATCHLIST_ERROR] {e}", file=sys.stderr)
              print(f"already_prepared=0")
              print(f"prep_status={prep.get('status', 'UNKNOWN') if prep else 'UNKNOWN'}")
              print(f"locked_count=0")
          except Exception as e:
              print(f"[US_PREP][CHECK_PREP_ERROR] {e}", file=sys.stderr)
              print(f"already_prepared=0")
              print(f"prep_status=UNKNOWN")
              print(f"locked_count=0")
          PY
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Emit already prepared skip summary
        if: steps.phase_guard.outputs.should_run == '1' && steps.prep_check.outputs.already_prepared == '1'
        working-directory: repo
        run: |
          set -euo pipefail
          {
            echo "[US_PREP][FINISH] status=OK reason=already_prepared prep_status=${{ steps.prep_check.outputs.prep_status }} locked_count=${{ steps.prep_check.outputs.locked_count }}"
            echo "[RUN_SUMMARY][RESULT] status=OK reason=already_prepared session=us-prep prep_status=${{ steps.prep_check.outputs.prep_status }} locked_count=${{ steps.prep_check.outputs.locked_count }}"
            echo "[US_PREP][EXIT] reason=already_prepared"
          } | tee -a artifacts/${US_LOG_FILE}

      - name: Run US prep
        if: steps.phase_guard.outputs.should_run == '1' && steps.prep_check.outputs.already_prepared != '1'
        timeout-minutes: 30
        working-directory: repo
        run: |
          set -euo pipefail
          {
            OFFLINE_FLAG=""
            FORCE_NOW_FLAG=""

            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if [ "${{ inputs.offline || 'false' }}" = "true" ]; then
                OFFLINE_FLAG="--offline"
              fi
              if [ -n "${{ inputs.force_now }}" ]; then
                FORCE_NOW_FLAG="--force-now ${{ inputs.force_now }}"
              fi
            fi

            echo "[US_PREP][START]"
            echo "[US_PREP][ENV] DRY_RUN=${DRY_RUN} OFFLINE_FLAG=${OFFLINE_FLAG}"
            echo "[US_PREP][MANUAL_FLAGS] FORCE_NOW_FLAG=${FORCE_NOW_FLAG} FORCE_REBUILD_PREP=${US_FORCE_REBUILD_PREP:-0}"

            python -m trader.us.runner.dispatcher \
              --mode prep \
              --env practice \
              ${FORCE_NOW_FLAG} \
              ${OFFLINE_FLAG}

            echo "[US_PREP][DONE]"
          } 2>&1 | tee -a artifacts/${US_LOG_FILE}

      - name: Verify US prep contract
        if: steps.phase_guard.outputs.should_run == '1' && steps.prep_check.outputs.already_prepared != '1'
        id: prep_contract
        timeout-minutes: 3
        working-directory: repo
        env:
          FORCE_NOW_INPUT: ${{ inputs.force_now || '' }}
        run: |
          set -euo pipefail

          if [ -n "${FORCE_NOW_INPUT}" ]; then
            TRADE_DATE=$(python -c "from datetime import datetime; print(datetime.fromisoformat('${FORCE_NOW_INPUT}').date().isoformat())")
          else
            TRADE_DATE=$(TZ=America/New_York date +%F)
          fi
          export TRADE_DATE

          echo "[US_PREP][CONTRACT][VERIFY] trade_date=${TRADE_DATE}" | tee -a artifacts/${US_LOG_FILE}

          TRADE_DATE="${TRADE_DATE}" python - <<'PY' > prep_contract_result.txt 2>&1
          import os
          import sys
          sys.path.insert(0, ".")
          from trader.us.db.repos import load_latest_us_prep_status, load_locked_us_watchlist

          trade_date = os.getenv("TRADE_DATE")
          if not trade_date:
              raise RuntimeError("[US_PREP][BUG] TRADE_DATE env missing")

          print(f"[US_PREP][CONTRACT][QUERY] table=us_agent_runs trade_date={trade_date} agent_names=us_prep,us_prep_dual_agent mode=prep", file=sys.stderr)
          prep = load_latest_us_prep_status(trade_date, timeout_sec=10)
          prep_status = prep.get("status", "UNKNOWN") if prep else "UNKNOWN"
          prep_run_id = prep.get("run_id", "") if prep else ""
          print(f"[US_PREP][CONTRACT][QUERY_RESULT] prep_found={'yes' if prep else 'no'} prep_status={prep_status} prep_run_id={prep_run_id}", file=sys.stderr)

          try:
              locked = load_locked_us_watchlist(trade_date, min_count=10, allow_degraded=False, timeout_sec=10)
              locked_count = len(locked) if locked else 0
          except Exception as e:
              print(f"[US_PREP][CONTRACT][WATCHLIST_ERROR] {e}", file=sys.stderr)
              locked_count = 0

          try:
              score_nonzero = sum(1 for w in (locked or []) if float(w.get("score", 0) or 0) > 0)
          except Exception:
              score_nonzero = locked_count  # fallback

          print(f"[US_PREP][CONTRACT][WATCHLIST] locked_count={locked_count} score_nonzero_count={score_nonzero}", file=sys.stderr)

          can_proceed = prep_status in ("OK", "OK_WITH_WARNINGS") and locked_count >= 10 and score_nonzero > 0

          # fallback: agent_name 불일치 등으로 UNKNOWN 반환됐지만 watchlist 데이터가 유효하면 진행
          if not can_proceed and prep_status == "UNKNOWN" and locked_count >= 10 and score_nonzero > 0:
              print("[US_PREP][CONTRACT][FALLBACK_OK] prep_status=UNKNOWN but watchlist valid — proceeding", file=sys.stderr)
              can_proceed = True

          print(f"prep_status={prep_status}")
          print(f"prep_run_id={prep_run_id}")
          print(f"locked_count={locked_count}")
          print(f"score_nonzero_count={score_nonzero}")
          print(f"trade_can_proceed={'1' if can_proceed else '0'}")

          if can_proceed:
              print(
                  f"[US_PREP][CONTRACT][OK] trade_date={trade_date} "
                  f"prep_status={prep_status} locked_count={locked_count} score_nonzero={score_nonzero} fallback={'yes' if prep_status == 'UNKNOWN' else 'no'}",
                  file=sys.stderr,
              )
          else:
              print(
                  f"[US_PREP][CONTRACT][FAIL] trade_date={trade_date} "
                  f"prep_status={prep_status} locked_count={locked_count} score_nonzero={score_nonzero}",
                  file=sys.stderr,
              )
          PY

          cat prep_contract_result.txt | tee -a artifacts/${US_LOG_FILE}

          PREP_STATUS=$(grep "^prep_status=" prep_contract_result.txt | cut -d= -f2 || echo "UNKNOWN")
          LOCKED_COUNT=$(grep "^locked_count=" prep_contract_result.txt | cut -d= -f2 || echo "0")
          SCORE_NONZERO=$(grep "^score_nonzero_count=" prep_contract_result.txt | cut -d= -f2 || echo "0")
          CAN_PROCEED=$(grep "^trade_can_proceed=" prep_contract_result.txt | cut -d= -f2 || echo "0")
          PREP_RUN_ID=$(grep "^prep_run_id=" prep_contract_result.txt | cut -d= -f2 || echo "")

          echo "prep_status=${PREP_STATUS}" >> "$GITHUB_OUTPUT"
          echo "locked_count=${LOCKED_COUNT}" >> "$GITHUB_OUTPUT"
          echo "score_nonzero_count=${SCORE_NONZERO}" >> "$GITHUB_OUTPUT"
          echo "trade_can_proceed=${CAN_PROCEED}" >> "$GITHUB_OUTPUT"
          echo "prep_run_id=${PREP_RUN_ID}" >> "$GITHUB_OUTPUT"

          if [ "${CAN_PROCEED}" != "1" ]; then
            echo "[US_PREP][CONTRACT][FAIL] reason=contract_failed prep_status=${PREP_STATUS} locked_count=${LOCKED_COUNT}" | tee -a artifacts/${US_LOG_FILE}
            echo "[US_PREP][FINISH] status=ERROR reason=contract_failed prep_status=${PREP_STATUS} locked_count=${LOCKED_COUNT} score_nonzero=${SCORE_NONZERO}" | tee -a artifacts/${US_LOG_FILE}
            echo "[RUN_SUMMARY][RESULT] status=FAILED_PREP_CONTRACT reason=contract_failed session=us-prep" | tee -a artifacts/${US_LOG_FILE}
            exit 1
          fi

          echo "[US_PREP][CONTRACT][OK] trade_date=${TRADE_DATE} prep_status=${PREP_STATUS} locked_count=${LOCKED_COUNT} score_nonzero=${SCORE_NONZERO}" | tee -a artifacts/${US_LOG_FILE}
          echo "[US_PREP][FINISH] status=${PREP_STATUS} reason=prep_completed locked_count=${LOCKED_COUNT} score_nonzero=${SCORE_NONZERO} prep_run_id=${PREP_RUN_ID}" | tee -a artifacts/${US_LOG_FILE}
          echo "[RUN_SUMMARY][RESULT] status=OK reason=prep_completed session=us-prep" | tee -a artifacts/${US_LOG_FILE}

      - name: Verify US Prep log contract
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          test -f artifacts/${US_LOG_FILE} || { echo "::warning::missing US log file"; exit 0; }

          # Success: already_prepared — 이미 당일 prep 완료, CI도 성공 처리
          if grep -E "\\[RUN_SUMMARY\\]\\[RESULT\\] status=OK reason=already_prepared|\\[US_PREP\\]\\[FINISH\\].*status=OK.*reason=already_prepared|\\[US_PREP\\]\\[ALREADY_PREPARED\\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_PREP_VERIFY][OK] already prepared"
            grep -n -E "\\[US_PREP\\]\\[ALREADY_PREPARED\\]|\\[US_PREP\\]\\[FINISH\\]|\\[RUN_SUMMARY\\]\\[RESULT\\]|\\[US_PREP\\]\\[EXIT\\]" artifacts/${US_LOG_FILE} | tail -10
            exit 0
          fi

          # Success: phase guard intentionally skipped (DST duplicate too_early, manual unconfirmed)
          if grep -E "\\[RUN_SUMMARY\\]\\[RESULT\\] status=SKIP_PHASE_WINDOW|\\[US_PREP\\]\\[EXIT\\] reason=phase_guard_skip" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            # skip_dst_duplicate_too_early_us_prep는 정상 skip
            if grep -E "reason=skip_dst_duplicate_too_early_us_prep" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
              echo "[US_PREP_VERIFY][SKIP_OK] DST duplicate too_early skip"
              exit 0
            fi
            # 나머지 SKIP_PHASE_WINDOW (manual_blocked 등)도 OK
            echo "[US_PREP_VERIFY][SKIP_OK] phase guard skipped prep intentionally"
            grep -n -E "\\[RUN_SUMMARY\\]\\[RESULT\\]|\\[US_PREP\\]\\[EXIT\\]" artifacts/${US_LOG_FILE} | tail -5
            exit 0
          fi

          # Fatal: stale start(stale_verify)이고 prep이 없는 경우
          # skip_stale_start_us_prep는 더 이상 정상 skip이 아님 — hard fail
          if grep -E "reason=skip_stale_start_us_prep" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::US prep skipped due to stale start; same-day watchlist may be missing"
            grep -n -E "\\[RUN_SUMMARY\\]\\[RESULT\\]|\\[US_PREP\\]\\[EXIT\\]" artifacts/${US_LOG_FILE} | tail -10
            exit 1
          fi

          # Fatal runtime errors.
          if grep -E "Traceback|\\[US_KIS\\]\\[HTTP_FAIL_FINAL\\]" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::Fatal runtime error detected"
            grep -n -E "Traceback|\\[US_KIS\\]\\[HTTP_FAIL_FINAL\\]" artifacts/${US_LOG_FILE} | head -10
            exit 1
          fi

          # Success: final status is OK or OK_WITH_WARNINGS.
          if grep -E "\\[US_PREP\\]\\[FINISH\\].*status=(OK|OK_WITH_WARNINGS)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "[US_PREP_VERIFY][OK] final status accepted"
            exit 0
          fi

          # Failure: final status is DEGRADED or ERROR.
          if grep -E "\\[US_PREP\\]\\[FINISH\\].*status=(DEGRADED|ERROR)" artifacts/${US_LOG_FILE} >/dev/null 2>&1; then
            echo "::error::US prep final status failed"
            grep -n -E "\\[US_PREP\\]\\[FINISH\\]" artifacts/${US_LOG_FILE} | tail -5
            exit 1
          fi

          echo "::error::US prep final status marker missing"
          exit 1

      - name: Mark stale US latest report in artifacts
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          latest_json="reports/us_daily/latest_us_daily_report.json"
          latest_md="reports/us_daily/latest_us_daily_report.md"
          stale_marker="artifacts/us-report-stale.txt"

          if [ -n "${{ inputs.force_now || '' }}" ]; then
            trade_date=$(python - <<'PYEOF'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          raw = "${{ inputs.force_now || '' }}"
          dt = datetime.fromisoformat(raw).astimezone(ZoneInfo("America/New_York"))
          print(dt.strftime("%Y-%m-%d"))
          PYEOF
          )
          else
            trade_date=$(TZ=America/New_York date +%F)
          fi

          if [ -f "$latest_json" ]; then
            report_date=$(python - <<'PYEOF'
          import json
          from pathlib import Path
          path = Path("reports/us_daily/latest_us_daily_report.json")
          try:
              payload = json.loads(path.read_text())
          except Exception:
              payload = {}
          print(payload.get("trade_date", ""))
          PYEOF
          )
          elif [ -f "$latest_md" ]; then
            report_date=$(python - <<'PYEOF'
          from pathlib import Path
          import re
          text = Path("reports/us_daily/latest_us_daily_report.md").read_text()
          match = re.search(r"US Daily Report — (\d{4}-\d{2}-\d{2})", text)
          print(match.group(1) if match else "")
          PYEOF
          )
          else
            report_date=""
          fi

          if [ -n "$report_date" ] && [ "$report_date" != "$trade_date" ]; then
            echo "[US_REPORT][STALE] report_date=${report_date} trade_date=${trade_date}" | tee -a artifacts/${US_LOG_FILE} "$stale_marker"
          fi

      - name: Upload US artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.US_ARTIFACT_NAME }}-${{ github.run_id }}
          path: |
            repo/artifacts/
            repo/reports/us_daily/
          if-no-files-found: warn
          retention-days: 7

name: US Trade Prep

on:
  schedule:
    # 08:50 ET (EDT=UTC-4): 12:50 UTC / (EST=UTC-5): 13:50 UTC
    - cron: "50 12 * * 1-5"
    - cron: "50 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN. true means no order submission."
        required: false
        default: true
        type: boolean
      offline:
        description: "offline mode. true blocks all KIS HTTP."
        required: false
        default: false
        type: boolean

concurrency:
  group: us-trade-prep-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TRADING_REGION: "US"
      US_AGENT_ENABLED: "1"
      KIS_ENV: "practice"
      US_PAPER_TRADING_ENABLED: "1"
      US_LIVE_TRADING_ENABLED: "0"
      DISABLE_REAL_TRADING: "1"
      ALLOW_REAL_ORDER: "0"

      US_STRATEGY_ENGINE: "pb1"

      US_PAPER_MAX_CAPITAL_KRW: "50000000"
      US_EXPECTED_PRACTICE_CAPITAL_KRW: "50000000"
      US_BUDGET_FX_KRW_PER_USD: "1450"
      US_MAX_CAPITAL_USD_AUTO: "1"

      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '1' || '0') || vars.US_AGENT_SCHEDULE_DRY_RUN || '1' }}
      PYTHONPATH: "."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DB migrate
        run: python -m trader.db.migrate

      - name: Phase guard (08:30~09:15 ET)
        id: phase_guard
        run: |
          python - <<'EOF'
          import sys
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          NY_TZ = ZoneInfo("America/New_York")
          now = datetime.now(tz=NY_TZ)
          t = now.time()

          start = time(8, 30)
          end   = time(9, 15)

          if start <= t <= end:
              print(f"[US_PREP_GUARD] PASS time={t} window={start}~{end}")
          else:
              print(f"[US_PREP_GUARD] SKIP time={t} window={start}~{end}")
              sys.exit(78)  # neutral exit code
          EOF
        continue-on-error: true

      - name: Check guard result
        if: steps.phase_guard.outcome == 'failure'
        run: |
          echo "[US_PREP] phase guard skipped — outside 08:30~09:15 ET"
          exit 0

      - name: Run US prep dispatcher
        if: steps.phase_guard.outcome == 'success'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
          CANO: ${{ secrets.CANO }}
          ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
          PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
        run: |
          OFFLINE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.offline }}" = "true" ]; then
            OFFLINE_FLAG="--offline"
          fi

          python -m trader.us.runner.dispatcher \
            --mode prep \
            --env practice \
            ${OFFLINE_FLAG}

      - name: Upload prep artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-trade-prep-${{ github.run_id }}
          path: |
            /tmp/*.log
          if-no-files-found: ignore
          retention-days: 3

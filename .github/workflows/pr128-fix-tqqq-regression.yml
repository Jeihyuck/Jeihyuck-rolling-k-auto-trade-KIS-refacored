name: PR128 TQQQ Regression Fix

on:
  push:
    branches:
      - fix/pr128-post127-integrity
    paths:
      - .github/workflows/pr128-fix-tqqq-regression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr128-post127-integrity
          fetch-depth: 0
      - name: Apply narrow TQQQ regression fix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('trader/us/infinite/strategy.py')
          s = p.read_text()
          old = '''    # This flag describes ownership, not data presence. PB1 intraday fields are
    # always present in production (often as "NORMAL"), so truthiness must never
    # determine TQQQ structural risk or sizing.
    pb1_overlay_bypass = infinite_overlay_bypass
'''
          new = '''    # PB1 intraday labels are intentionally not strategy conditions here.
    # TQQQ keeps its own structural regime, runway and capital-preservation
    # policy; presence/absence of PB1 intraday keys must not change decisions.
'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    if (fast_dip_add_eligible and position.qty > 0 and not pending_buy and
            (pb1_overlay_bypass or overlay.get("force_entry_block") is True or
             overlay.get("allow_new_buy") is False)):
'''
          new = '''    if (fast_dip_add_eligible and position.qty > 0 and not pending_buy and
            (overlay.get("force_entry_block") is True or
             overlay.get("allow_new_buy") is False)):
'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    if overlay.get("force_entry_block") is True and not fast_dip_add_eligible and not pb1_overlay_bypass:
        return Decision(Action.BLOCK, "overlay_force_entry_block")
    if position.qty <= 0 and overlay.get("allow_new_buy") is False and not pb1_overlay_bypass:
        return Decision(Action.BLOCK, "overlay_new_buy_block")
'''
          new = '''    if overlay.get("force_entry_block") is True and not fast_dip_add_eligible:
        return Decision(Action.BLOCK, "overlay_force_entry_block")
    if position.qty <= 0 and overlay.get("allow_new_buy") is False:
        return Decision(Action.BLOCK, "overlay_new_buy_block")
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/us/test_tqqq_overlay_bypass.py')
          s = p.read_text()
          old = '''    decision = evaluate(
        config=InfiniteConfig(), state=InfiniteState(),
        position=PositionSnapshot(price=80.0), trading_date=date(2026, 8, 19),
        overlay=_overlay(), entry_allowed=True, buy_multiplier=0.5,
        effective_regime_name="NEUTRAL",
    )
'''
          new = '''    strategy_overlay = _overlay()
    strategy_overlay["allow_new_buy"] = True
    strategy_overlay["force_entry_block"] = False
    decision = evaluate(
        config=InfiniteConfig(), state=InfiniteState(),
        position=PositionSnapshot(price=80.0), trading_date=date(2026, 8, 19),
        overlay=strategy_overlay, entry_allowed=True, buy_multiplier=0.5,
        effective_regime_name="NEUTRAL",
    )
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m py_compile trader/us/infinite/strategy.py
          git diff --check
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trader/us/infinite/strategy.py tests/us/test_tqqq_overlay_bypass.py
          git commit -m "fix: preserve TQQQ structural gate precedence" || exit 0
          git push origin HEAD:fix/pr128-post127-integrity

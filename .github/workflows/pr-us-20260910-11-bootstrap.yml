name: Bootstrap US incident fixes

on:
  push:
    branches:
      - fix/us-broker-truth-tqqq-tp-audit-20260912
    paths:
      - .github/workflows/pr-us-20260910-11-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/us-broker-truth-tqqq-tp-audit-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare incident patcher
        run: python scripts/dev/prepatch_us_incident_20260912.py
      - name: Apply incident patches
        run: python scripts/dev/apply_us_incident_fix_20260912.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            trader/us/infinite/integration.py \
            trader/us/infinite/repository.py \
            trader/us/runner/trade_tick_runner.py \
            trader/us/execution/order_router.py \
            tests/us/test_us_20260910_20260911_incident_fixes.py
      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(us): repair TQQQ stale pending and TP broker truth"
          git push origin HEAD:fix/us-broker-truth-tqqq-tp-audit-20260912

name: "Trade Runner (AUTO: LIVE in market, DIAG otherwise) [5m tick]"

permissions:
  contents: write

concurrency:
  group: trade-bot-state
  cancel-in-progress: false

on:
  # ✅ push로도 즉시 돌고
  push:
    branches: [ "nullim", "main" ]

  # ✅ 수동 실행도 되고
  workflow_dispatch:

  # ✅ 5분 tick (스케줄 안정성을 위해 main에도 이 파일 존재 권장)
  schedule:
    - cron: "50-59/5 23 * * 0-4"
    - cron: "*/5 0-5 * * 1-5"
    - cron: "0-30/5 6 * * 1-5"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      FORCE_STRATEGY_MODE: ""
      FORCE_PB1_PHASE: ""
      STATE_PATH: "bot_state/runtime/state.json"
      LOT_STATE_PATH: "bot_state/runtime/lot_state.json"
      PBCORE_DB_PATH: "bot_state/db/pbcore.sqlite3"
      UNIVERSE_LKG_DIR: "bot_state/universe_lkg"
      TRADER_CACHE_ROOT: "bot_state/runtime"
      BOTSTATE_WORKTREE_DIR: "_botstate"

      # ====== ✅ repo에 이미 존재하는 secrets 이름 그대로 사용 ======
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      KIS_ACCESS_TOKEN: ${{ secrets.KIS_ACCESS_TOKEN }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}

      # ====== ✅ 코드가 기대하는 이름으로 "매핑" (바꾸지 말고 추가만) ======
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      # ====== ✅ 5분 tick 설계: 4분만 실행하고 빠지기 ======
      RUN_LOOP_MINUTES: "4"

      # ====== ✅ BOTSTATE LOCK: 5분 틱에 맞게 ======
      BOTSTATE_LOCK_TTL_SEC: "240"
      BOTSTATE_LOCK_RETRY_TOTAL_SEC: "55"
      BOTSTATE_LOCK_RETRY_SLEEP_SEC: "5"

      ACTIVE_STRATEGIES: "1"
      DAILY_CAPITAL: "250000000"

    steps:
      - name: Checkout code (always run nullim code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "nullim"
          path: repo

      - name: Checkout bot-state branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "bot-state"
          path: botstate

      - name: Restore bot_state into workspace
        run: |
          set -euo pipefail
          mkdir -p bot_state
          if [ -d ../botstate/bot_state ]; then
            rsync -a --delete --exclude='.gitkeep' ../botstate/bot_state/ bot_state/
          fi
          echo "[RESTORE] repo/bot_state restored"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Precheck env (fail fast)
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[PRECHECK] KIS_ENV=${KIS_ENV:-}"
          for k in APP_KEY APP_SECRET API_BASE_URL CANO ACNT_PRDT_CD KIS_ENV; do
            if [ -z "${!k:-}" ]; then
              echo "::error::Missing required secret/env: $k"
              exit 1
            fi
          done
          python -c "import importlib; importlib.import_module('trader.pb1_runner'); print('[PRECHECK] pb1_runner import ok')"

      - name: Resolve market-aware runtime mode
        run: |
          set -euo pipefail
          python - << 'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os

          KST = ZoneInfo("Asia/Seoul")
          now = datetime.now(KST)

          force_mode = (os.getenv("FORCE_STRATEGY_MODE") or "").strip().upper()
          force_phase = (os.getenv("FORCE_PB1_PHASE") or "").strip().lower()

          is_weekday = now.weekday() < 5
          in_market = is_weekday and (time(8,50) <= now.time() <= time(15,30))
          mode = "LIVE" if in_market else "DIAG"
          if force_mode in {"LIVE", "DIAG", "INTENT_ONLY", "INTENT"}:
              mode = "LIVE" if force_mode == "LIVE" else "DIAG"

          if not is_weekday:
              window = "after"
          else:
              now_t = now.time()
              if time(8, 50) <= now_t < time(9, 5):
                  window = "preopen"
              elif time(9, 5) <= now_t < time(10, 0):
                  window = "morning"
              elif time(10, 0) <= now_t < time(15, 15):
                  window = "day"
              elif time(15, 15) <= now_t <= time(15, 30):
                  window = "close"
              else:
                  window = "after"

          if force_phase in {"entry", "exit", "verify"}:
              pb1_phase = force_phase
          else:
              pb1_phase = "entry" if window in {"preopen", "morning", "day"} else "exit"

          print(
              f"[AUTO] now={now.isoformat()} trading_day={is_weekday} window={window} "
              f"in_market={in_market} -> STRATEGY_MODE={mode} PB1_PHASE_DEFAULT={pb1_phase}"
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"EFFECTIVE_STRATEGY_MODE={mode}\n")
              f.write(f"TRADING_DAY={'true' if is_weekday else 'false'}\n")
              f.write(f"MARKET_WINDOW={window}\n")
              f.write(f"PB1_PHASE_DEFAULT={pb1_phase}\n")
          PY

      - name: Build universe (best_k_meta) - allow fallback
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.universe.build --env "${KIS_ENV}" --strategy "best_k_meta" --date "$(date +%F)" || echo "[WARN] universe build failed (continue)"

      - name: Compile check
        working-directory: repo
        run: |
          set -euo pipefail
          python -m compileall trader

      - name: Configure git identity for botstate commits
        working-directory: repo
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"

      - name: Run PB1 (auto window) - should exit within 4 minutes
        working-directory: repo
        run: |
          set -euo pipefail
          echo "[RUN] STRATEGY_MODE=$EFFECTIVE_STRATEGY_MODE MARKET_WINDOW=$MARKET_WINDOW PB1_PHASE_DEFAULT=$PB1_PHASE_DEFAULT"
          python -m trader.run --window auto --phase auto
        env:
          STRATEGY_MODE: ${{ env.EFFECTIVE_STRATEGY_MODE }}
          LIVE_TRADING_ENABLED: "1"

      - name: Debug bot_state contents (after run)
        run: |
          set -euo pipefail
          echo "=== bot_state tree ==="
          find bot_state -maxdepth 3 -type f -print || true
          echo "=== git status (bot-state worktree if exists) ==="
          git status --porcelain || true

      - name: Debug paths (where am I?)
        run: |
          set -euo pipefail
          echo "PWD=$(pwd)"
          ls -al
          echo "---- find bot_state anywhere ----"
          find . -maxdepth 4 -type d -name "bot_state" -o -name "_botstate" -o -name "repo" -o -name "botstate" || true
          echo "---- find pbcore.sqlite3 anywhere ----"
          find . -maxdepth 6 -type f -name "pbcore.sqlite3" -print || true
          echo "---- git root? ----"
          git rev-parse --show-toplevel || true 

      - name: Persist bot_state atomically (lock + fetch_reset + push_retry)
        if: always()
        working-directory: repo
        run: |
          set -euo pipefail
          python -m trader.botstate_persist --message "botstate: persist $GITHUB_RUN_ID $(date -Iseconds)" --soft-fail
        env:
          BOTSTATE_WORKTREE_DIR: _botstate

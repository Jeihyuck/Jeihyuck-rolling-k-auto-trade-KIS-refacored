name: "Trade Runner (Unified: Candidate Pool + Trade Tick)"

permissions:
  contents: write

concurrency:
  group: trade-runner
  cancel-in-progress: true

env:
  NO_TRADE: "0"
  DB_DISABLE_PREPARED_STATEMENTS: "1"

on:
  workflow_dispatch:
    inputs:
      MODE:
        description: "candidate | trade | both"
        required: true
        default: "candidate"
      ENV:
        description: "LIVE | PAPER"
        required: false
        default: "PAPER"
      FORCE_REBUILD:
        description: "candidate 강제 재생성 (1=on)"
        required: false
        default: "1"
      LIVE_TRADING_ENABLED:
        description: "실거래 허용 (1=실거래, 0=DRY_RUN)"
        required: false
        default: "0"
      DRY_RUN:
        description: "시뮬레이션 모드 (1=시뮬, 0=실거래)"
        required: false
        default: "1"

  schedule:
    # 토요일 00:30 KST = 금요일 15:30 UTC : 후보군 생성
    - cron: "30 15 * * 5"
    # 월~금 08:55 KST = 23:55 UTC (일~목) : trade tick
    - cron: "55 23 * * 0-4"

  push:
    branches: ["nullim"]
    paths:
      - ".github/workflows/**"
      - "repo/**"
      - "trader/**"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  universe_build:
    name: Universe Build (FDR → Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 실행 조건: MODE=candidate/both만 실행 (trade는 스킵)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.MODE == 'candidate' || github.event.inputs.MODE == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '30 15 * * 5')

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      # ✅ Postgres ONLY (sqlite 완전 제거)
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      DB_DISABLE_PREPARED_STATEMENTS: "1"
      SQLITE_DISABLED: "1"
      BOTSTATE_DISABLED: "1"

      # Universe 환경 설정
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ENV || 'PAPER' }}
      
      # KIS API (FDR는 필요 없지만 환경 통일을 위해 유지)
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
          ref: "nullim"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Detect FDR universe builder entrypoint
        run: |
          set -euo pipefail
          echo "[DEBUG] FDR universe builder: trader.universe.build"
          echo "[DEBUG] Entry: python -m trader.universe.build"

      - name: Universe build (FDR → Postgres)
        run: |
          set -euo pipefail
          
          UENV="${KIS_ENV}"
          USTRAT="best_k_meta"
          
          echo "======================================"
          echo "Universe Build (FDR → Postgres)"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${UENV}"
          echo "Strategy: ${USTRAT}"
          echo "DB: PBCORE_DB_URL (Postgres)"
          echo "======================================"
          
          # FDR universe build 실행
          python -m trader.universe.build \
            --env "${UENV}" \
            --strategy "${USTRAT}" \
            --provider "fdr_kospi100_kosdaq100"

      - name: Verify universe saved
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from trader.db.engine import get_engine
          from trader.db.repos import UniverseRepo

          uenv = os.getenv("KIS_ENV")
          ustrat = "best_k_meta"

          engine = get_engine()
          repo = UniverseRepo(engine)
          members = repo.get_current_universe_members(env=uenv, strategy=ustrat) or []
          
          print(f"[UNIVERSE][VERIFY] env={uenv} strategy={ustrat} members={len(members)}")
          
          if len(members) == 0:
              print("[UNIVERSE][FAIL] no members found after build")
              sys.exit(1)
          
          if len(members) < 50:
              print(f"[UNIVERSE][WARN] only {len(members)} members (expected ~200)")
          
          print("[UNIVERSE][OK] universe ready")
          PY

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

  candidate_pool_prefetch:
    name: Candidate Pool OHLCV Prefetch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    # ✅ universe_build 완료 후 실행
    needs: [universe_build]

    # 실행 조건: MODE=candidate/both만 실행 (trade는 스킵)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.MODE == 'candidate' || github.event.inputs.MODE == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '30 15 * * 5')

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      # 후보군은 무조건 DIAG로 (매매 금지)
      STRATEGY_MODE: "DIAG"
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ENV || 'PAPER' }}

      # 후보군 계산은 HTTP 막고(시장시간/토큰 의존 최소화) pykrx/DB fallback 사용
      KIS_HTTP_ENABLED: "0"

      CANDIDATE_POOL_ENABLED: "1"
      CANDIDATE_POOL_FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.FORCE_REBUILD || '0' }}
      CANDIDATE_POOL_SIZE: "120"
      CANDIDATE_POOL_MIN_SIZE: "40"
      CANDIDATE_POOL_TTL_DAYS: "7"
      CANDIDATE_POOL_PREFETCH_DAYS: "180"
      CANDIDATE_POOL_PREFETCH_CHUNK: "25"
      
      # 병렬화/timeout/retry 설정
      OHLCV_PREFETCH_WORKERS: "6"
      OHLCV_FETCH_TIMEOUT_SEC: "25"
      OHLCV_FETCH_RETRIES: "1"
      OHLCV_PREFETCH_VERBOSE: "0"

      # 유니버스는 KIS_ENV(practice/real) 기준으로 저장/조회
      CANDIDATE_POOL_UNIVERSE_ENV: ${{ secrets.KIS_ENV }}

      # Candidate가 참조할 Universe 전략키 (DB에 저장된 universe 사용)
      CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
      CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"

      DB_DISABLE_PREPARED_STATEMENTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
          ref: "nullim"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Heartbeat (keep logs alive)
        run: |
          set -euo pipefail
          ( while true; do echo "[HEARTBEAT] $(date '+%F %T %Z') still running..."; sleep 60; done ) &
          echo "HEARTBEAT_PID=$!" >> $GITHUB_ENV

      - name: OHLCV Prefetch
        run: |
          set -euo pipefail
          echo "======================================"
          echo "OHLCV Prefetch (Incremental + Parallel)"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "Force rebuild: ${CANDIDATE_POOL_FORCE_REBUILD}"
          echo "Workers: ${OHLCV_PREFETCH_WORKERS}"
          echo "Timeout: ${OHLCV_FETCH_TIMEOUT_SEC}s"
          echo "Retries: ${OHLCV_FETCH_RETRIES}"
          echo "======================================"
          python -m trader.candidate_pool_builder --prefetch-only --env "${STRATEGY_ENV}"

      - name: Stop Heartbeat
        if: always()
        run: |
          set +e
          if [ -n "${HEARTBEAT_PID:-}" ]; then kill "${HEARTBEAT_PID}" || true; fi

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

  candidate_pool:
    name: Candidate Pool Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    # ✅ prefetch 완료 후 실행
    needs: [candidate_pool_prefetch]

    # 실행 조건: MODE=candidate/both만 실행 (trade는 스킵)
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.MODE == 'candidate' || github.event.inputs.MODE == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '30 15 * * 5')

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      # 후보군은 무조건 DIAG로 (매매 금지)
      STRATEGY_MODE: "DIAG"
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ENV || 'PAPER' }}

      # 후보군 계산은 HTTP 막고(시장시간/토큰 의존 최소화) pykrx/DB fallback 사용
      KIS_HTTP_ENABLED: "0"

      CANDIDATE_POOL_ENABLED: "1"
      CANDIDATE_POOL_FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.FORCE_REBUILD || '0' }}
      CANDIDATE_POOL_SIZE: "120"
      CANDIDATE_POOL_MIN_SIZE: "40"
      CANDIDATE_POOL_TTL_DAYS: "7"

      # 유니버스는 KIS_ENV(practice/real) 기준으로 저장/조회
      CANDIDATE_POOL_UNIVERSE_ENV: ${{ secrets.KIS_ENV }}

      # Candidate가 참조할 Universe 전략키 (DB에 저장된 universe 사용)
      CANDIDATE_POOL_UNIVERSE_STRATEGY: "best_k_meta"
      CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"

      DB_DISABLE_PREPARED_STATEMENTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1
          ref: "nullim"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Candidate pool build (build-only)
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Candidate Pool Build (build-only mode)"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "Pool size target: ${CANDIDATE_POOL_SIZE}"
          echo "Pool min size: ${CANDIDATE_POOL_MIN_SIZE}"
          echo "TTL(days): ${CANDIDATE_POOL_TTL_DAYS}"
          echo "======================================"
          python -m trader.candidate_pool_builder --build-only --build pool --env "${STRATEGY_ENV}"

      - name: Verify pool saved
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys
          from trader.db.engine import get_engine
          from trader.db.repos import WatchlistRepo

          env = os.getenv("STRATEGY_ENV", "PAPER")
          strategy_key = os.getenv("CANDIDATE_POOL_STRATEGY_KEY", "pb1_candidate_pool")

          engine = get_engine()
          repo = WatchlistRepo(engine)

          latest = repo.get_latest_watchlist_date(env=env, strategy=strategy_key)
          if not latest:
              print(f"[VERIFY][FAIL] no candidate pool in DB for {env}/{strategy_key}")
              sys.exit(1)

          pool = repo.load_watchlist(env=env, strategy=strategy_key, as_of=latest) or []
          print(f"[VERIFY] as_of={latest} size={len(pool)}")

          min_size = int(os.getenv("CANDIDATE_POOL_MIN_SIZE", "40"))
          if len(pool) < min_size:
              print(f"[VERIFY][FAIL] pool size {len(pool)} < min {min_size}")
              sys.exit(1)

          print("[VERIFY][OK] candidate pool ready")
          PY

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

  trade_tick:
    name: Trade Tick (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # ✅ needs 제거: MODE=trade일 때 즉시 실행 (DB의 기존 candidate pool 사용)

    # ✅ trade-tick 실행 조건: MODE=trade/both 또는 schedule
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '55 23 * * 0-4') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.MODE == 'trade' || github.event.inputs.MODE == 'both'))

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      KIS_ACCESS_TOKEN: ${{ secrets.KIS_ACCESS_TOKEN }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}

      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      # ✅ KIS_ENV/STRATEGY_ENV 동기화 (중복 정의 제거, mismatch 방지)
      KIS_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ENV || 'PAPER' }}
      STRATEGY_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ENV || 'PAPER' }}

      # ✅ 후보군: DB 로드 전용 (재빌드 절대 금지)
      CANDIDATE_POOL_ENABLED: "1"
      CANDIDATE_POOL_TTL_DAYS: "7"
      CANDIDATE_POOL_MIN_SIZE: "40"
      CANDIDATE_POOL_STRATEGY_KEY: "pb1_candidate_pool"
      CANDIDATE_POOL_FORCE_REBUILD: "0"

      DB_ONLY: "0"
      NONTRADING_SMOKE: "0"
      # ✅ 주문 절대 금지 (DIAG/PAPER 전용)
      DRY_RUN: "1"
      LIVE_TRADING_ENABLED: "0"
      DISABLE_LIVE_TRADING: "1"
      SIMULATION_MODE: "1"
      STRATEGY_MODE: "PAPER"

      # ✅ KIS HTTP 호출 최소화 (DIAG에서 토큰/호가 에러 방지)
      KIS_HTTP_ENABLED: "0"

      PB1_RUN_LOOP_MINUTES: "15"
      PB1_MAX_MINUTES: "15"
      PB1_MAX_SECONDS: "900"
      PB1_PRICE_PROBE: "1"

      # ✅ E-2: Universe/Candidate rebuild 금지
      UNIVERSE_FORCE_REBUILD: "0"
      UNIVERSE_SOURCE: "DB_ONLY"
      BOTSTATE_DISABLED: "1"
      SQLITE_DISABLED: "1"

      # ✅ Watchlist 설정 (재빌드 금지)
      PB1_WATCHLIST_ENABLED: "1"
      PB1_WATCHLIST_AUTOBUILD: "0"
      PB1_WATCHLIST_FORCE_REBUILD: "0"
      PB1_WATCHLIST_TOPK: "20"
      PB1_WATCHLIST_FINALN: "10"
      PB1_WATCHLIST_MIN_PRICE: "2000"
      PB1_WATCHLIST_LIQ_DAYS: "20"
      PB1_WATCHLIST_MIN_ROWS: "30"
      PB1_WATCHLIST_STRICT: "0"
      PB1_MIN_CANDIDATES: "1"
      PB1_TARGET_NEW_POSITIONS: "2"

      DB_DISABLE_PREPARED_STATEMENTS: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "nullim"
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Init runtime dir (logs only)
        run: |
          set -euo pipefail
          echo "TRADER_RUNTIME_DIR=${RUNNER_TEMP}/trader_runtime" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/trader_runtime/runtime/diagnostics"

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: Resolve market-aware runtime mode
        id: market_mode
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from trader.time_utils import calc_market_window_kst, is_trading_weekday, now_kst

          now = now_kst()
          is_weekday = is_trading_weekday(now)
          window = calc_market_window_kst(now)
          in_market = is_weekday and window in {"preopen", "morning", "day", "close"}

          mode = "LIVE" if in_market else "DIAG"
          pb1_phase = "entry" if window in {"preopen", "morning", "day"} else "exit"

          # DIAG에서도 매수/필터 검증하려고 entry로 고정
          if mode == "DIAG":
              pb1_phase = "entry"

          live_ok = "true" if in_market else "false"
          kis_http = "1" if in_market else "0"

          print(f"[AUTO] now={now.isoformat()} trading_day={is_weekday} window={window} in_market={in_market} -> STRATEGY_MODE={mode} PB1_PHASE_DEFAULT={pb1_phase} KIS_HTTP_ENABLED={kis_http} live_ok={live_ok}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"EFFECTIVE_STRATEGY_MODE={mode}\n")
              f.write(f"MARKET_WINDOW={window}\n")
              f.write(f"PB1_PHASE_DEFAULT={pb1_phase}\n")
              f.write(f"KIS_HTTP_ENABLED={kis_http}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"live_ok={live_ok}\n")
          PY

      - name: "Guard: LIVE env precheck"
        if: steps.market_mode.outputs.live_ok == 'true'
        run: |
          set -euo pipefail
          violations=()
          [ "${DB_ONLY:-}" = "1" ] && violations+=("DB_ONLY=1")
          [ "${NONTRADING_SMOKE:-}" = "1" ] && violations+=("NONTRADING_SMOKE=1")
          [ "${DRY_RUN:-}" = "1" ] && violations+=("DRY_RUN=1")
          [ "${LIVE_TRADING_ENABLED:-}" != "1" ] && violations+=("LIVE_TRADING_ENABLED != '1'")
          [ "${DISABLE_LIVE_TRADING:-}" = "1" ] && violations+=("DISABLE_LIVE_TRADING=1")
          if [ ${#violations[@]} -gt 0 ]; then
            echo "::error::LIVE env violations: ${violations[*]}"
            exit 1
          fi
          echo "[PRECHECK] LIVE env ok"

      - name: Precheck import (fail fast)
        run: |
          set -euo pipefail
          python -c "import importlib; importlib.import_module('trader.pb1_runner'); print('[PRECHECK] pb1_runner import ok')"

      - name: DB migrate
        run: |
          set -euo pipefail
          python -m trader.db.migrate

      - name: Normalize ENV (force uppercase)
        run: |
          set -euo pipefail
          echo "KIS_ENV=${KIS_ENV^^}" >> "$GITHUB_ENV"
          echo "STRATEGY_ENV=${STRATEGY_ENV^^}" >> "$GITHUB_ENV"
          echo "[ENV][NORMALIZE] KIS_ENV=${KIS_ENV^^} STRATEGY_ENV=${STRATEGY_ENV^^}"

      - name: DB universe precheck
        run: |
          set -euo pipefail
          if [ "${EFFECTIVE_STRATEGY_MODE}" = "DIAG" ]; then
            echo "[UNIVERSE][PRECHECK] DIAG mode -> do not fail hard if missing"
            python -m trader.universe.db_check --env "${KIS_ENV}" --strategy best_k_meta --mode "${EFFECTIVE_STRATEGY_MODE}" || true
          else
            python -m trader.universe.db_check --env "${KIS_ENV}" --strategy best_k_meta --mode "${EFFECTIVE_STRATEGY_MODE}"
          fi

      - name: Candidate pool DB precheck (Weekend-built pool required)
        continue-on-error: true
        run: |
          set -euo pipefail
          
          # ✅ 전용 검증 스크립트 사용 (더 자세한 에러 메시지 제공)
          python scripts/verify_candidate_pool.py
          
          echo ""
          echo "[POOL][PRECHECK] ✅ Candidate pool verification passed"
          echo "[POOL][PRECHECK] trade-tick will load from DB (no rebuild)"

      - name: Run PB1 (AUTO -> LIVE in-market, DIAG after-hours)
        env:
          # EFFECTIVE_STRATEGY_MODE, PB1_PHASE_DEFAULT, KIS_HTTP_ENABLED는
          # market_mode 스텝에서 GITHUB_ENV로 설정되므로 자동으로 사용됨
          PB1_DIAG_FULL_EXEC: "1"
          PB1_WINDOW_OVERRIDE: "day"
          PB1_ALLOW_OUTSIDE_WINDOWS: "1"
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Trade Tick"
          echo "======================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Env: ${STRATEGY_ENV}"
          echo "Mode: ${STRATEGY_MODE:-AUTO}"
          echo "PB1_PHASE_DEFAULT: ${PB1_PHASE_DEFAULT:-entry}"
          echo "KIS_HTTP_ENABLED: ${KIS_HTTP_ENABLED:-AUTO}"
          echo "======================================"
          python -m trader.pb1_runner

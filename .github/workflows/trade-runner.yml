name: Trade Runner

permissions:
  contents: write

concurrency:
  group: trade-bot-state
  cancel-in-progress: true

on:
  push:
    branches: [ "nullim" ]
    paths-ignore:
      - "bot_state/**"
      - "**/*.md"

  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"

      # --- REQUIRED SECRETS ---
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      KIS_ENV: ${{ secrets.KIS_ENV }}

      # --- 5-min tick design ---
      RUN_LOOP_MINUTES: "4"
      BOTSTATE_LOCK_TTL_SEC: "240"
      BOTSTATE_LOCK_RETRY_TOTAL_SEC: "60"

      # Optional: strategy switches if your code reads them
      ACTIVE_STRATEGIES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Precheck env
        run: |
          set -euo pipefail
          echo "[PRECHECK] KIS_ENV=${KIS_ENV:-}"
          for k in APP_KEY APP_SECRET API_BASE_URL CANO ACNT_PRDT_CD KIS_ENV; do
            if [ -z "${!k:-}" ]; then
              echo "::error::Missing required secret/env: $k"
              exit 1
            fi
          done
          python -c "import importlib; importlib.import_module('trader.pb1_runner'); print('[PRECHECK] pb1_runner import ok')"

      - name: Build universe (best_k_meta) - allow fallback
        run: |
          set -euo pipefail
          python -m trader.universe.build --env "${KIS_ENV}" --strategy "best_k_meta" --date "$(date +%F)" || true

      - name: Compile check
        run: |
          set -euo pipefail
          python -m compileall trader

      - name: Run PB1 (auto window) - exit within RUN_LOOP_MINUTES
        run: |
          set -euo pipefail
          python -m trader.pb1_runner --window auto --phase auto

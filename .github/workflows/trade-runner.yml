name: PB1 Trade Runner

permissions:
  contents: write

concurrency:
  group: trade-bot-state
  cancel-in-progress: false

on:
  push:
    branches: [ main, nullim]
    paths-ignore:
      - "bot_state/**"
  workflow_dispatch:
  schedule:
    # =========================
    # Weekdays (KST Mon-Fri) : run only during market hours (08:50~15:30 KST), every 5 min
    # KST 08:50~08:55  => UTC 23:50~23:55 (previous UTC day)  [Sun~Thu UTC]
    - cron: "50-59/5 23 * * 0-4"
    # KST 09:00~14:55  => UTC 00:00~05:55 (same UTC day)      [Mon~Fri UTC]
    - cron: "*/5 0-5 * * 1-5"
    # KST 15:00~15:30  => UTC 06:00~06:30 (same UTC day)      [Mon~Fri UTC]
    - cron: "0-30/5 6 * * 1-5"

    # =========================
    # Weekend (KST Sat-Sun) : DIAG every 5 min for the entire weekend day (00:00~23:55 KST)
    # KST Sat 00:00~08:55 => UTC Fri 15:00~23:55
    - cron: "*/5 15-23 * * 5"
    # KST Sat 09:00~Sun 08:55 => UTC Sat 00:00~23:55 (covers full UTC Saturday)
    - cron: "*/5 * * * 6"
    # KST Sun 09:00~23:55 => UTC Sun 00:00~14:55
    - cron: "*/5 0-14 * * 0"

jobs:
  run-trade:
    if: github.ref != 'refs/heads/bot-state' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pbcore
          POSTGRES_PASSWORD: pbcore
          POSTGRES_DB: pbcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pbcore -d pbcore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    # Note: cancel-in-progress=false relies on lock file; timeout increased to allow pre-open waits.
    timeout-minutes: 360
    env:
      STRATEGY_MODE: "LIVE"
      LIVE_TRADING_ENABLED: "1"
      DISABLE_LIVE_TRADING: "0"
      DRY_RUN: "0"
      EXPECT_LIVE_TRADING: "1"
      EXPECT_KIS_ENV: "practice"
      PB1_ENTRY_ENABLED: "1"
      KIS_ENV: "practice"
      API_BASE_URL: "https://openapivts.koreainvestment.com:29443"
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_KEY || secrets.APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET != '' && secrets.KIS_APP_SECRET || secrets.APP_SECRET }}
      APP_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_KEY || secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET != '' && secrets.KIS_APP_SECRET || secrets.APP_SECRET }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      STATE_RECONCILE_APPLY: "1"
      MORNING_WINDOW_START: "08:50"
      MORNING_WINDOW_END: "11:00"
      MORNING_EXIT_START: "09:00"
      MORNING_EXIT_END: "09:20"
      AFTERNOON_WINDOW_START: "14:00"
      AFTERNOON_WINDOW_END: "15:30"
      CLOSE_AUCTION_START: "15:20"
      CLOSE_AUCTION_END: "15:30"
      MARKET_OPEN_HHMM: "08:50"
      MARKET_CLOSE_HHMM: "15:30"
      PB1_WAIT_FOR_WINDOW: "1"
      PB1_MAX_WAIT_FOR_WINDOW_MIN: "240"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set git identity
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve DATABASE_URL
        env:
          DB_URL_SECRET: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DB_URL_SECRET" ]; then
            echo "DATABASE_URL=$DB_URL_SECRET" >> $GITHUB_ENV
            echo "USING_EXTERNAL_DB=1" >> $GITHUB_ENV
            echo "Using external DATABASE_URL (secret present)"
          else
            echo "DATABASE_URL=postgresql+psycopg://pbcore:pbcore@localhost:5432/pbcore" >> $GITHUB_ENV
            echo "USING_EXTERNAL_DB=0" >> $GITHUB_ENV
            echo "Using workflow local Postgres service (no secret)"
          fi

      - name: Wait for Postgres (local service)
        run: |
          for i in $(seq 1 30); do
            python - <<'PY'
import socket
s=socket.socket()
try:
  s.settimeout(1)
  s.connect(("127.0.0.1", 5432))
  print("local postgres port open")
  raise SystemExit(0)
except Exception:
  raise SystemExit(1)
PY
            if [ $? -eq 0 ]; then exit 0; fi
            sleep 2
          done
          echo "local postgres not reachable"
          exit 1

      - name: Verify DB dependencies
        run: |
          python -c "import sqlalchemy; import psycopg; print('deps ok')"

      - name: Run DB migrations
        run: |
          python -m trader.db.migrate

      - name: Build Universe (best-effort)
        run: |
          python -m trader.universe.build --env "${KIS_ENV}" --strategy "best_k_meta" --date "$(date +%F)" || true

      - name: Compile modules
        run: |
          python -m compileall trader

      - name: Assert PB-Core v2 runtime is clean
        run: |
          python - <<'PY'
import pathlib, sys
needles = ["botstate_sync", "_botstate", "trader_ledger", "run_rebalance(", "pykrx"]
targets = ["trader/pb1_runner.py", "trader/pb1_engine.py"]
bad=[]
for t in targets:
    txt = pathlib.Path(t).read_text(encoding="utf-8")
    for n in needles:
        if n in txt:
            bad.append((t,n))
if bad:
    print("PB-Core v2 NOT wired. Found:", bad)
    sys.exit(1)
print("OK: PB-Core v2 runtime clean")
PY

      - name: Run PB1 only
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m trader.pb1_runner --window auto --phase auto

          

          

name: "Trade Runner (DB-Only SSOT) [5m tick]"

permissions:
  contents: write

concurrency:
  group: trade-runner
  cancel-in-progress: true

on:
  push:
    branches: [ "nullim", "main" ]

  workflow_dispatch:
    inputs:
      EMERGENCY_UNIVERSE_BUILD:
        description: "Set to 1 to allow one-time emergency universe build when today's DB universe is missing (DIAG only)."
        required: false
        default: "0"
      DIAG_FULL_REHEARSAL:
        description: "비매매일에도 실전 파이프라인처럼 1회 실행(주문전송 금지)"
        required: false
        default: "0"
      DIAG_REHEARSAL_KIS_CALLS:
        description: "KIS 잔고/시세 조회를 실제로 호출할지(주문은 절대 안함)"
        required: false
        default: "1"
      NONTRADING_UNIVERSE_SMOKE:
        description: "Set to 1 to run non-trading-day universe smoke (DIAG only)."
        required: false
        default: "0"

  schedule:
    # KST 08:45 universe build => UTC 23:45 (Sun~Thu UTC)
    - cron: "45 23 * * 0-4"
    # KST 09:00~14:55  => UTC 00:00~05:55 (Mon~Fri UTC)
    - cron: "*/5 0-5 * * 1-5"
    # KST 15:00~15:30  => UTC 06:00~06:30 (Mon~Fri UTC)
    - cron: "0-30/5 6 * * 1-5"
    # KST 15:29 close-cancel => UTC 06:29 (Mon~Fri UTC)
    - cron: "29 6 * * 1-5"

defaults:
  run:
    shell: bash
    working-directory: repo

jobs:
  universe_build:
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.event.schedule == '45 23 * * 0-4') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      EMERGENCY_UNIVERSE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.EMERGENCY_UNIVERSE_BUILD || '0' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "nullim"
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('repo/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: Build universe to DB (best_k_meta)
        run: |
          set -euo pipefail
          as_of="$(TZ=Asia/Seoul date +%F)"
          python -m trader.universe.build --env "${KIS_ENV}" --strategy best_k_meta --date "${as_of}"

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

  trade_tick:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '45 23 * * 0-4'
    timeout-minutes: 25

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      KIS_ACCESS_TOKEN: ${{ secrets.KIS_ACCESS_TOKEN }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}

      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      EMERGENCY_UNIVERSE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.EMERGENCY_UNIVERSE_BUILD || '0' }}

      DIAG_FULL_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.DIAG_FULL_REHEARSAL || '0' }}
      DIAG_REHEARSAL_KIS_CALLS: ${{ github.event_name == 'workflow_dispatch' && inputs.DIAG_REHEARSAL_KIS_CALLS || '1' }}
      NONTRADING_UNIVERSE_SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.NONTRADING_UNIVERSE_SMOKE || '0' }}

      # [5] GitHub Actions / 실행 env도 LIVE로 고정
      DB_ONLY: "0"
      NONTRADING_SMOKE: "0"
      DRY_RUN: "0"
      LIVE_TRADING_ENABLED: "1"
      DISABLE_LIVE_TRADING: "0"
      STRATEGY_MODE: "LIVE"

      PB1_RUN_LOOP_MINUTES: "15"
      PB1_MAX_MINUTES: "15"
      PB1_MAX_SECONDS: "900"

      UNIVERSE_SOURCE: "DB_ONLY"
      BOTSTATE_DISABLED: "1"
      SQLITE_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "nullim"
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('repo/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Init runtime dir (logs only)
        run: |
          set -euo pipefail
          echo "TRADER_RUNTIME_DIR=${RUNNER_TEMP}/trader_runtime" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/trader_runtime/runtime/diagnostics"

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: "Guard: LIVE env precheck"
        run: |
          set -euo pipefail
          violations=()
          [ "${DB_ONLY:-}" = "1" ] && violations+=("DB_ONLY=1")
          [ "${NONTRADING_SMOKE:-}" = "1" ] && violations+=("NONTRADING_SMOKE=1")
          [ "${DRY_RUN:-}" = "1" ] && violations+=("DRY_RUN=1")
          [ "${LIVE_TRADING_ENABLED:-}" != "1" ] && violations+=("LIVE_TRADING_ENABLED != '1'")
          [ "${DISABLE_LIVE_TRADING:-}" = "1" ] && violations+=("DISABLE_LIVE_TRADING=1")
          [ "${STRATEGY_MODE:-}" != "LIVE" ] && violations+=("STRATEGY_MODE != 'LIVE'")
          if [ ${#violations[@]} -gt 0 ]; then
            echo "::error::LIVE env violations: ${violations[*]}"
            exit 1
          fi
          echo "[PRECHECK] LIVE env ok"

      - name: Precheck import (fail fast)
        run: |
          set -euo pipefail
          python -c "import importlib; importlib.import_module('trader.pb1_runner'); print('[PRECHECK] pb1_runner import ok')"

      - name: Resolve market-aware runtime mode
        run: |
          set -euo pipefail
          python - << 'PY'
          import os
          from trader.time_utils import calc_market_window_kst, is_trading_weekday, now_kst
          now = now_kst()
          is_weekday = is_trading_weekday(now)
          window = calc_market_window_kst(now)
          in_market = is_weekday and window in {"preopen", "morning", "day", "close"}
          mode = "LIVE" if in_market else "DIAG"
          pb1_phase = "entry" if window in {"preopen", "morning", "day"} else "exit"
          print(f"[AUTO] now={now.isoformat()} trading_day={is_weekday} window={window} in_market={in_market} -> STRATEGY_MODE={mode} PB1_PHASE_DEFAULT={pb1_phase}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"EFFECTIVE_STRATEGY_MODE={mode}\n")
              f.write(f"MARKET_WINDOW={window}\n")
              f.write(f"PB1_PHASE_DEFAULT={pb1_phase}\n")
          PY

      - name: Decide LIVE or NO_TRADE (KST)
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          from datetime import datetime, time
          import zoneinfo, sys

          kst = zoneinfo.ZoneInfo("Asia/Seoul")
          now = datetime.now(kst)

          # 1) weekday check (Mon=0..Sun=6)
          is_weekday = now.weekday() < 5

          # 2) session window (KOSPI/KOSDAQ 09:00~15:30)
          start = time(9, 0)
          end   = time(15, 30)
          in_session = (start <= now.time() <= end)

          live_ok = is_weekday and in_session

          print(f"[GATE] now_kst={now.isoformat()} is_weekday={is_weekday} in_session={in_session} live_ok={live_ok}")

          # GitHub output
          with open("${GITHUB_OUTPUT}", "a", encoding="utf-8") as f:
            f.write(f"live_ok={'true' if live_ok else 'false'}\n")
          PY

      - name: DB universe precheck
        run: |
          set -euo pipefail
          python -m trader.universe.db_check --env "${KIS_ENV}" --strategy best_k_meta --mode "${EFFECTIVE_STRATEGY_MODE}"

      - name: Run LIVE (trade loop)
        if: ${{ steps.gate.outputs.live_ok == 'true' }}
        env:
          STRATEGY_MODE: LIVE
          DRY_RUN: "0"
          LIVE_TRADING_ENABLED: "1"
          DISABLE_LIVE_TRADING: "0"
          DB_ONLY: "0"
        run: |
          set -euo pipefail
          echo "[RUN] LIVE allowed by gate"
          python -m trader.run --window auto --phase auto

      - name: NO_TRADE (outside session)
        if: ${{ steps.gate.outputs.live_ok != 'true' }}
        run: |
          set -euo pipefail
          echo "[NO_TRADE] Outside trading session (KST). Skip running live trading."

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

  close_cancel:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '29 6 * * 1-5'
    timeout-minutes: 15

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo

      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      KIS_ENV: ${{ secrets.KIS_ENV }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

      UNIVERSE_SOURCE: "DB_ONLY"
      BOTSTATE_DISABLED: "1"
      SQLITE_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: "nullim"
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: "Guard: postgres-only"
        run: |
          set -euo pipefail
          : "${PBCORE_DB_URL:?Missing PBCORE_DB_URL}"
          if [[ ! "${PBCORE_DB_URL}" =~ ^postgres(ql)?(\+[^:]+)?:// ]]; then
            echo "::error::PBCORE_DB_URL must be postgres-only."
            exit 1
          fi

      - name: Run close-cancel
        run: |
          set -euo pipefail
          python -m trader.pb1_runner --window auto --phase auto

      - name: Scan for SQLite artifacts
        if: always()
        run: |
          set -euo pipefail
          hits="$(find "$GITHUB_WORKSPACE" -type f \( -name "*.sqlite3*" -o -name "*.db" \) 2>/dev/null | head -n 50 || true)"
          if [ -n "$hits" ]; then
            echo "::error::SQLite artifacts detected (forbidden):"
            echo "$hits"
            exit 1
          fi
          echo "OK: no sqlite artifacts."

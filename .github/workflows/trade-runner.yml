name: PB1 Trade Runner

permissions:
  contents: write

concurrency:
  group: pb1-trade-runner
  cancel-in-progress: false

on:
  push:
    branches: [ main, nullim ]
    paths-ignore:
      - "bot_state/**"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (loop=LIVE loop, smoke=precheck only)"
        default: "loop"
        type: choice
        options: [loop, smoke]
        required: false
      phase:
        description: "Runner phase (auto/entry/exit/verify)"
        default: "auto"
        type: choice
        options: [auto, entry, exit, verify]
        required: false

  schedule:
    # KST Mon-Fri 08:50 = UTC Sun-Thu 23:50
    - cron: "50 23 * * 0-4"

jobs:
  run-trade-smoke:
    name: PB1 Smoke (manual only)
    if: >
      github.ref != 'refs/heads/bot-state' &&
      github.ref != 'refs/heads/bot_state' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STRATEGY_MODE: "LIVE"
      LIVE_TRADING_ENABLED: "1"
      DISABLE_LIVE_TRADING: "0"
      DRY_RUN: "0"
      EXPECT_LIVE_TRADING: "1"
      EXPECT_KIS_ENV: "practice"

      PB1_ENTRY_ENABLED: "1"
      PB1_SMOKE_RUN: "1"
      PB1_RUN_LOOP: "0"
      PB1_ALLOW_WAIT: "0"

      KIS_ENV: "practice"
      API_BASE_URL: "https://openapivts.koreainvestment.com:29443"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_KEY || secrets.APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET != '' && secrets.KIS_APP_SECRET || secrets.APP_SECRET }}
      APP_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_KEY || secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET != '' && secrets.KIS_APP_SECRET || secrets.APP_SECRET }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

      STATE_RECONCILE_APPLY: "1"

      MORNING_WINDOW_START: "08:50"
      MORNING_WINDOW_END: "11:00"
      MORNING_EXIT_START: "09:00"
      MORNING_EXIT_END: "09:20"
      AFTERNOON_WINDOW_START: "14:00"
      AFTERNOON_WINDOW_END: "15:30"
      CLOSE_AUCTION_START: "15:20"
      CLOSE_AUCTION_END: "15:30"
      MARKET_OPEN_HHMM: "08:50"
      MARKET_CLOSE_HHMM: "15:30"

      PB1_WAIT_FOR_WINDOW: "1"
      PB1_MAX_WAIT_FOR_WINDOW_MIN: "240"

      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set git identity
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure run mode
        run: |
          echo "RUN_PHASE=${{ inputs.phase || 'auto' }}" >> $GITHUB_ENV
          echo "UNIVERSE_SQLITE_PATH=${{ github.workspace }}/trader/state/pbcore.sqlite3" >> $GITHUB_ENV

      - name: Run DB migrations
        run: |
          python -m trader.db.migrate

      - name: Build Universe (best-effort)
        run: |
          python -m trader.universe.build --env "${KIS_ENV}" --strategy "best_k_meta" --date "$(date +%F)" || true

      - name: Compile modules
        run: |
          python -m compileall trader

      - name: Run PB1 (smoke)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m trader.pb1_runner --window auto --phase "${RUN_PHASE}"


  run-trade-loop:
    name: PB1 Live Loop
    if: >
      github.ref != 'refs/heads/bot-state' &&
      github.ref != 'refs/heads/bot_state' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'loop')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      STRATEGY_MODE: "LIVE"
      LIVE_TRADING_ENABLED: "1"
      DISABLE_LIVE_TRADING: "0"
      DRY_RUN: "0"
      EXPECT_LIVE_TRADING: "1"
      EXPECT_KIS_ENV: "practice"

      PB1_ENTRY_ENABLED: "1"
      PB1_SMOKE_RUN: "0"
      PB1_RUN_LOOP: "1"
      PB1_ALLOW_WAIT: "1"
      PB1_LOOP_INTERVAL_SEC: "60"
      PB1_PERSIST_INTERVAL_SEC: "300"
      BOTSTATE_LOCK_TTL_SEC: "21600"

      KIS_ENV: "practice"
      API_BASE_URL: "https://openapivts.koreainvestment.com:29443"

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_KEY || secrets.APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET != '' && secrets.KIS_APP_SECRET || secrets.APP_SECRET }}
      APP_KEY: ${{ secrets.KIS_APP_KEY != '' && secrets.KIS_APP_KEY || secrets.APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET != '' && secrets.KIS_APP_SECRET || secrets.APP_SECRET }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

      STATE_RECONCILE_APPLY: "1"

      MORNING_WINDOW_START: "08:50"
      MORNING_WINDOW_END: "11:00"
      MORNING_EXIT_START: "09:00"
      MORNING_EXIT_END: "09:20"
      AFTERNOON_WINDOW_START: "14:00"
      AFTERNOON_WINDOW_END: "15:30"
      CLOSE_AUCTION_START: "15:20"
      CLOSE_AUCTION_END: "15:30"
      MARKET_OPEN_HHMM: "08:50"
      MARKET_CLOSE_HHMM: "15:30"

      PB1_WAIT_FOR_WINDOW: "1"
      PB1_MAX_WAIT_FOR_WINDOW_MIN: "240"

      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set git identity
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure run mode
        run: |
          # push/schedule -> auto, workflow_dispatch -> inputs.phase
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_PHASE="${{ inputs.phase }}"
          else
            RUN_PHASE="auto"
          fi
          echo "RUN_PHASE=$RUN_PHASE" >> $GITHUB_ENV
          echo "UNIVERSE_SQLITE_PATH=${{ github.workspace }}/trader/state/pbcore.sqlite3" >> $GITHUB_ENV

      - name: Run DB migrations
        run: |
          python -m trader.db.migrate

      - name: Build Universe (best-effort)
        run: |
          python -m trader.universe.build --env "${KIS_ENV}" --strategy "best_k_meta" --date "$(date +%F)" || true

      - name: Compile modules
        run: |
          python -m compileall trader

      - name: Run PB1 (live loop)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m trader.pb1_runner --window auto --phase "${RUN_PHASE}"

          
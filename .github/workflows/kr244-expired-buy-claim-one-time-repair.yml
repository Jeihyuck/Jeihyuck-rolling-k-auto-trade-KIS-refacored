name: KR244 Oct19 Exact Expired Practice Claim Broker-Proven Repair
"on":
  pull_request:
    types: [synchronize]
    branches: [dual-agent]
    paths:
      - "ops/kr244-192820-expired-apply-once.trigger"
permissions:
  contents: read
concurrency:
  group: kr244-practice-kis-token-probe
  cancel-in-progress: false
jobs:
  zero-broker-order-verified-practice-repair:
    if: ${{ github.event.pull_request.number == 244 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/kr-20261020-submit-latency-sell-reconcile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIS_ENV: practice
      STRATEGY_ENV: practice
      STRATEGY_MODE: LIVE
      KIS_HTTP_ENABLED: "1"
      KIS_CCLD_FAIL_OPEN: "0"
      KIS_CCLD_RETRY_MAX: "3"
      KIS_CCLD_READ_TIMEOUT_SEC: "7"
      DISABLE_REAL_TRADING: "1"
      LIVE_TRADING_ENABLED: "0"
      DRY_RUN: "1"
      NO_TRADE: "1"
      ALLOW_REAL_ORDER: "0"
      PYTHONPATH: "."
      DATABASE_URL: ${{ secrets.PBCORE_DB_URL }}
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated proof runtime
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pytest
      - name: Run exact historical practice broker-zero safety regressions
        run: |
          python -m py_compile scripts/kr244_oct19_expired_claim_kis_zero_repair.py
          python -m pytest -q tests/kr/test_kr_20261019_prebroker_claim_recovery.py
      - name: Requery original Oct19 KIS full day and clear ONLY proven 192820 old fence
        run: python -m scripts.kr244_oct19_expired_claim_kis_zero_repair

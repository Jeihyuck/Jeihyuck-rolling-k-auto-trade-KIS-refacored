name: reset-practice-account
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  STRATEGY_MODE: "INTENT_ONLY"
  FORCE_STRATEGY_MODE: "INTENT_ONLY"
  STRATEGY_ENV: "practice"
  KIS_ENV: "practice"
  KIS_HTTP_ENABLED: "1"
  ALLOW_LIVE_GATE: "1"
  DRY_RUN: "1"
  DISABLE_LIVE_TRADING: "1"
  LIVE_TRADING_ENABLED: "0"
  RESET_PRACTICE_ACCOUNT: "1"
  RESET_CONFIRM: "YES"
  ACCOUNT_RESET_MODE: "1"
  EXPECTED_PRACTICE_CAPITAL_KRW: "100000000"
  EXPECTED_INITIAL_HOLDINGS: "0"
  ACCOUNT_SANITY_TOLERANCE_PCT: "0.05"
  ACCOUNT_SANITY_CAPITAL_TOLERANCE_KRW: "5000000"
  RESET_ALLOW_KIS_HOLDINGS: "0"
  PAPER_MAX_CAPITAL_KRW: "100000000"

defaults:
  run:
    shell: bash

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repo

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}
      APP_KEY: ${{ secrets.KIS_APP_KEY }}
      APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      API_BASE_URL: ${{ secrets.KIS_REST_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reset practice account state
        run: |
          set -euo pipefail
          python scripts/reset_practice_account_state.py
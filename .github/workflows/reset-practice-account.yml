name: reset-practice-account
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KIS_ENV: practice
  STRATEGY_ENV: practice
  RESET_PRACTICE_ACCOUNT: "1"
  ACCOUNT_RESET_MODE: "1"
  EXPECTED_PRACTICE_CAPITAL_KRW: "100000000"
  EXPECTED_INITIAL_HOLDINGS: "0"
  PAPER_MAX_CAPITAL_KRW: "100000000"
  PB1_CAPITAL_MODE: "CASH"
  PB1_ENTRY_CAPITAL_KRW: "0"
  PB1_CASH_RESERVE_PCT: "0.10"

defaults:
  run:
    shell: bash

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repo

    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/repo
      PBCORE_DB_URL: ${{ secrets.PBCORE_DB_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_REST_URL: ${{ secrets.KIS_REST_URL }}
      CANO: ${{ secrets.CANO }}
      ACNT_PRDT_CD: ${{ secrets.ACNT_PRDT_CD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: repo/requirements.txt

      - name: Install deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reset practice account state
        run: |
          set -euo pipefail
          python -m scripts.reset_practice_account_state